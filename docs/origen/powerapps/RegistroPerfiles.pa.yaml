Unico: (ThisItem.NombreVacuna = \"TETANOS\" Or ThisItem.NombreVacuna = \"DIFTERIA Y TETANOS\") And ThisItem.TipoVacuna = \"1 DOSIS\"\r\n    };\r\n\r\n    // 3. Condición principal: Valida la fecha, excluye las de 1 dosis fija (Fiebre Amarilla / Tifoidea) Y las que sean EsRefuerzoUnico\r\n    If(\r\n        !IsBlank(Self.SelectedDate) And Not(ThisItem.NombreVacuna in [\"FIEBRE AMARILLA\"; \"TIFOIDEA\"]) And Not(EsRefuerzoUnico);\r\n        \r\n        If(\r\n            IsEmpty(Filter(colDosisVacunas; VacunaID = ThisItem.ID And (NumeroDosis = \"Dosis 2\" Or NumeroDosis = \"Refuerzo 1\")));\r\n            With(\r\n                {\r\n                    // ⚙️ MOTOR DE REGLAS: ¿Cuántos meses para la Dosis 2?\r\n                    MesesParaDosis2: Switch(\r\n                        ThisItem.NombreVacuna;\r\n                        \"HEPATITIS A\"; 1;\r\n                        \"HEPATITIS B\"; 1;\r\n                        \"HEPATITIS A Y B (COMBINADA)\"; 1;\r\n                        \"DIFTERIA Y TETANOS\"; 1;\r\n                        1\r\n                    )\r\n                };\r\n                Collect(\r\n                    colDosisVacunas;\r\n                    {\r\n                        ID: If(IsEmpty(colDosisVacunas); 1; Max(colDosisVacunas; ID) + 1);\r\n                        VacunaID: ThisItem.ID;\r\n                        NumeroDosis: \"Dosis 2\";\r\n                        FechaTentativa: DateAdd(Self.SelectedDate; MesesParaDosis2; TimeUnit.Months);\r\n                        FechaReal: Blank();\r\n                        Observacion: \"\";\r\n                        MarcaCovid: \"\"\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    )\r\n)\r\n*/\r\n\r\n\r\n\r\n// 1. Guardar la fecha de la primera dosis en el padre\r\nPatch(colVacunas, LookUp(colVacunas, ID = ThisItem.ID), {FechaPrimeraDosis: Self.SelectedDate});\r\n\r\n// 2. Evaluamos las reglas previas\r\nWith(\r\n    {\r\n        // Regla A: ¿Es de una sola dosis?\r\n        EsRefuerzoUnico: (ThisItem.NombreVacuna = \"TETANOS\" Or ThisItem.NombreVacuna = \"DIFTERIA Y TETANOS\") And ThisItem.TipoVacuna = \"1 DOSIS\",\r\n        \r\n        // Regla B: ⚙️ MOTOR DE REGLAS: ¿Cuántos meses para la Dosis 2?\r\n        MesesParaDosis2: Switch(\r\n            ThisItem.NombreVacuna,\r\n            \"HEPATITIS A\", 1,\r\n            \"HEPATITIS B\", 1,\r\n            \"HEPATITIS A Y B (COMBINADA)\", 1,\r\n            \"DIFTERIA Y TETANOS\", 1,\r\n            \"TETANOS\", 1,\r\n            \"SARAMPION-RUBEOLA\", 6,\r\n            1 // Valor por defecto\r\n        )\r\n    },\r\n\r\n    // 3. Condición principal: Valida la fecha y excluye casos de dosis única\r\n    If(\r\n        !IsBlank(Self.SelectedDate) And Not(ThisItem.NombreVacuna in [\"FIEBRE AMARILLA\", \"TIFOIDEA\"]) And Not(EsRefuerzoUnico),\r\n        \r\n        If(\r\n            // ¿La Dosis 2 NO existe?\r\n            IsEmpty(Filter(colDosisVacunas, VacunaID = ThisItem.ID And (NumeroDosis = \"Dosis 2\" Or NumeroDosis = \"Refuerzo 1\"))),\r\n            \r\n            // \U0001F7E2 VERDADERO: NO EXISTE -> CREAMOS LA DOSIS 2\r\n            Collect(\r\n                colDosisVacunas,\r\n                {\r\n                    ID: If(IsEmpty(colDosisVacunas), 1, Max(colDosisVacunas, ID) + 1),\r\n                    VacunaID: ThisItem.ID,\r\n                    NumeroDosis: \"Dosis 2\",\r\n                    FechaTentativa: DateAdd(Self.SelectedDate, MesesParaDosis2, TimeUnit.Months),\r\n                    FechaReal: Blank(),\r\n                    Observacion: \"\",\r\n                    MarcaCovid: \"\",\r\n                    Lote: \"\",\r\n                    ResponsableVacuna: \"\",\r\n                    Establecimiento: \"\"\r\n                }\r\n            ),\r\n\r\n            // \U0001F7E0 FALSO: YA EXISTE -> ACTUALIZAMOS LA FECHA TENTATIVA\r\n            Patch(\r\n                colDosisVacunas,\r\n                LookUp(colDosisVacunas, VacunaID = ThisItem.ID And (NumeroDosis = \"Dosis 2\" Or NumeroDosis = \"Refuerzo 1\")),\r\n                { FechaTentativa: DateAdd(Self.SelectedDate, MesesParaDosis2, TimeUnit.Months) }\r\n            )\r\n        )\r\n    )\r\n)"
