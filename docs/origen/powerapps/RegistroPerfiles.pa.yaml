                                              Children:
                                                - NumeroDosis:
                                                    Control: ModernCombobox@1.1.2
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =Appearance.FilledLighter
                                                      BorderStyle: =BorderStyle.Solid
                                                      BorderThickness: =4
                                                      DefaultSelectedItems: |+
                                                        =If(IsBlank(ThisItem.NumeroDosis), Blank(), [ThisItem.NumeroDosis])
                                                      DisplayMode: |-
                                                        =If(
                                                            LookUp(colVacunas, ID = ThisItem.VacunaID).NombreVacuna = "COVID",
                                                            DisplayMode.Edit,
                                                            DisplayMode.View
                                                        )
                                                      FillPortions: =0.5
                                                      Font: =Font.'Open Sans Condensed'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =Parent.Height
                                                      ItemDisplayText: =ThisItem.Value
                                                      Items: |+
                                                        =If(
                                                            LookUp(colVacunas, ID = ThisItem.VacunaID).NombreVacuna = "COVID",
                                                            ["Dosis 1","Dosis 2","Dosis 3","Dosis 4","Dosis 5","Refuerzo 1","Refuerzo 2","Refuerzo 3","Refuerzo 4","Refuerzo 5"],
                                                            [ThisItem.NumeroDosis]
                                                        )

                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =0
                                                      OnChange: |-
                                                        =Patch(
                                                            colDosisVacunas, 
                                                            LookUp(colDosisVacunas, ID = ThisItem.ID), 
                                                            {NumeroDosis: Self.Selected.Value}
                                                        )
                                                      RadiusBottomLeft: =20
                                                      RadiusBottomRight: =20
