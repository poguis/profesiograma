Screens:
  RegistroPerfiles:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: "=//UpdateContext({locPasoActual: 1});;\n\nWith(\n    {\n        _esRestringido: Lower(User().Email) in \n        [\n            \"dispensario.medico2@sedemi.com\", //Balbina\n            \"sig9@sedemi.com\",\n            \"dispensario.medico6@sedemi.com\",\n            \"salud_ocupacional@sedemi.com\",\n            \"paramedico22@sedemi.com\",\n            \"paramedico3@sedemi.com\",\n            \"\"\n        ]\n    },\n    UpdateContext(\n        {\n            locEsGrupoRestringido: _esRestringido,\n            locPasoActual: If(_esRestringido, 6, 1)\n        }\n    )\n);\n\n\nSet(\n    generandoPDF,\n    true\n);\n// 1. Estandarización de nombres y búsqueda en Office 365\n// Usamos directamente 'ctxPersonaSeleccionada' en lugar de hacer un LookUp\nSet(\n    nombreRestriccionNormalizado,\n    Upper(\n        Trim(\n            Concat(\n                Split(\n                    ctxPersonaSeleccionada.'Nombre Apellido',\n                    \" \"\n                ),\n                Concatenate(\n                    Value,\n                    \" \"\n                )\n            )\n        )\n    )\n);\nSet(\n    primerApellido,\n    First(\n        Split(\n            nombreRestriccionNormalizado,\n            \" \"\n        )\n    ).Value\n);\nSet(\n    resultadosBusqueda,\n    UsuariosdeOffice365.SearchUserV2({searchTerm: primerApellido}).value\n);\nSet(\n    usuarioCoincidente,\n    LookUp(\n        resultadosBusqueda,\n        Upper(\n            Concatenate(\n                Surname,\n                \" \",\n                GivenName\n            )\n        ) = Upper(nombreRestriccionNormalizado)\n    )\n);\n// --- INICIO DE LA BÚSQUEDA DE RESTRICCIONES ---\n// 2. Buscar el registro de restricción más reciente que esté ACTIVO (\"RESTRINGIDO\")\n// para la cédula que viene en la variable ctxPersonaSeleccionada\nSet(\n    locUltimaRestriccion,\n    First(\n        Sort(\n            Filter(\n                R_FOR_SO_02_RESTRICCIONES_TRABAJO,\n                CEDULA = ctxPersonaSeleccionada.Cédula && ESTADO.Value = \"RESTRINGIDO\"\n            ),\n            FECHA_REGISTRO,\n            SortOrder.Descending\n        )\n    )\n);\n// 3. Preparar las variables para los campos de restricción\nIf(\n    // Si IsBlank es VERDADERO (el empleado no tiene restricción activa)\n    IsBlank(locUltimaRestriccion),\n    // ...establece los valores por defecto para \"NO\"\n    UpdateContext(\n        {\n            locTextoRestriccion: \"NO APLICA\",\n            locTieneRecomendacion: \"NO\"// Variable para el dropdown\n        }\n    ),\n    // ...si SÍ se encontró una restricción...\n    UpdateContext(\n        {\n            // Concatena los tres campos solicitados\n            locTextoRestriccion: \"MOTIVO: \" & locUltimaRestriccion.MOTIVO_RESTRICCION & Char(10) & \"TIPO: \" & locUltimaRestriccion.TIPO_RESTRICCION & Char(10) & \"RECOMENDACIONES: \" & locUltimaRestriccion.RECOMENDACION_MEDICA,\n            // Establece el valor para el dropdown en \"SI\"\n            locTieneRecomendacion: \"SI\"\n        }\n    )\n);\n// --- FIN DE LA BÚSQUEDA ---\n// 1. Buscamos de forma inteligente si ya existe un registro en SharePoint para este Ekon\nUpdateContext(\n    {\n        ctxPerfilBuscado: LookUp(\n            PERFIL_USUARIO,\n            EKON = Text(ctxPersonaSeleccionada.'Código Ekon')\n        )\n    }\n);\nIf(\n    // ==========================================\n// 2. CONDICIÓN PRINCIPAL\n// ==========================================\n    !IsBlank(ctxPerfilBuscado.EKON),\n    // ==========================================\n// \U0001F7E2 MODO EDICIÓN: ENCONTRÓ REGISTRO\n// ==========================================\n    // Cargar Datos Generales (Solo el CIUO)\n    UpdateContext({ctxDatosGenerales: ParseJSON(ctxPerfilBuscado.DatosGenerales)});\n    UpdateContext({ctxDatosExamenMedicos: ParseJSON(ctxPerfilBuscado.EXAMENES_MEDICOS)});\n    // 1. OBTENER ENLACES DESDE POWER AUTOMATE\n    UpdateContext(\n        {\n            ctxJSONArchivosNuevos: ArchivosPerfilUsuario.Run(\n                Text(ctxPersonaSeleccionada.'Código Ekon'),\n                \"NA\",\n                \"0\",\n                {\n                    name: \"dummy.txt\",\n                    contentBytes: \"x\"\n                },\n                \"OBTENER\"\n            ).respuestajson\n        }\n    );\n    ClearCollect(\n        colEnlacesServidor,\n        ForAll(\n            Table(ParseJSON(ctxJSONArchivosNuevos)),\n            {\n                NombreArchivo: Text(Value.Nombre),\n                EnlaceArchivo: Text(Value.Enlace)\n            }\n        )\n    );\n    // 0. Reconstruir Exámenes Médicos Seleccionados (Sin errores de tipo)\n    ClearCollect(\n        colExamenesSeleccionados,\n        ForAll(\n            Filter(\n                Table(ctxDatosExamenMedicos.ListaExamenes),\n                !IsBlank(Value.Nombre) && Text(Value.Nombre) <> \"\"\n            ) As JsonExamen,\n            {\n                Categoria: Text(JsonExamen.Value.Categoria),\n                Nombre: Text(JsonExamen.Value.Nombre),\n                Precio: Value(Text(JsonExamen.Value.Precio)),\n                Padre: Text(JsonExamen.Value.Padre)\n            }\n        )\n    );\n    // ================================================================\n    // \U0001F4A1 NUEVO: CARGAR DISPONIBLES Y PESTAÑA POR DEFECTO\n    // ================================================================\n    // 1. Inicializar la pestaña para que la galería sepa qué mostrar\n    UpdateContext({varPestañaActiva: \"LABORATORIO (SANGRE)\"});\n    // 2. Si hay un proveedor guardado, cargamos sus exámenes disponibles\n    If(\n        !IsBlank(ctxDatosExamenMedicos.Lugar) And ctxDatosExamenMedicos.Lugar <> \"N/A\",\n        UpdateContext(\n            {\n                ctxProveedorSeleccionado: LookUp(\n                    colTarifarioExamenes,\n                    Text(Value.datosGenerales.proveedor) = Text(ctxDatosExamenMedicos.Lugar) And Text(Value.datosGenerales.areaDeTrabajo) = Text(ctxDatosExamenMedicos.Zona)\n                ).Value\n            }\n        );\n        ClearCollect(\n            colExamenesDisponibles,\n            ForAll(\n                Table(ctxProveedorSeleccionado.examenes),\n                {\n                    ID: Text(Value.Categoria) & \"|\" & Text(Value.Nombre),\n                    Categoria: Text(Value.Categoria),\n                    Nombre: Text(Value.Nombre),\n                    Precio: If(\n                        IsBlank(Value.Precio),\n                        0,\n                        Value(Text(Value.Precio))\n                    ),\n                    Padre: If(\n                        IsBlank(Value.Padre),\n                        Blank(),\n                        Text(Value.Padre)\n                    )\n                }\n            )\n        )\n    );\n    // Limpiamos los posibles registros en blanco generados por el Blank() condicional\n    //RemoveIf(colExamenesSeleccionados; IsBlank(Nombre) Or Nombre = \"\");;\n    // 2. Reconstruir Educación\n    ClearCollect(\n        colEducacion,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.EducacionJSON)) As JsonEdu,\n            {\n                ID: Value(Text(JsonEdu.Value.ID)),\n                NivelEstudio: Text(JsonEdu.Value.NivelEstudio),\n                TituloObtenido: Text(JsonEdu.Value.TituloObtenido),\n                Institucion: Text(JsonEdu.Value.Institucion),\n                FechaInicio: If(\n                    IsBlank(Text(JsonEdu.Value.FechaInicio)),\n                    Blank(),\n                    DateValue(Text(JsonEdu.Value.FechaInicio))\n                ),\n                FechaFin: If(\n                    IsBlank(Text(JsonEdu.Value.FechaFin)),\n                    Blank(),\n                    DateValue(Text(JsonEdu.Value.FechaFin))\n                ),\n                Estado: Text(JsonEdu.Value.Estado),\n                Observacion: Text(JsonEdu.Value.Observacion),\n                Evidencia: Filter(\n                    CargaEvidenciaEducacion.Attachments,\n                    false\n                ),\n                EsNuevo: false,\n                ArchivosHistoricos: Filter(\n                    colEnlacesServidor,\n                    StartsWith(\n                        NombreArchivo,\n                        Text(JsonEdu.Value.ID) & \"_Educacion_\"\n                    )\n                )\n            }\n        )\n    );\n    // 3. Reconstruir Certificados\n    ClearCollect(\n        colCertificado,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.CertificadosJSON)) As JsonCert,\n            {\n                ID: Value(Text(JsonCert.Value.ID)),\n                NombreCertificado: Text(JsonCert.Value.NombreCertificado),\n                tipoCertificado: Text(JsonCert.Value.tipoCertificado),\n                areaImparte: Text(JsonCert.Value.areaImparte),\n                AutoraEmisora: Text(JsonCert.Value.AutoraEmisora),\n                FechaEmision: If(\n                    IsBlank(Text(JsonCert.Value.FechaEmision)),\n                    Blank(),\n                    DateValue(Text(JsonCert.Value.FechaEmision))\n                ),\n                FechaVencimiento: If(\n                    IsBlank(Text(JsonCert.Value.FechaVencimiento)),\n                    Blank(),\n                    DateValue(Text(JsonCert.Value.FechaVencimiento))\n                ),\n                Evidencia: Filter(\n                    CargaEvidenciaCertificado.Attachments,\n                    false\n                ),\n                EsNuevo: false,\n                ArchivosHistoricos: Filter(\n                    colEnlacesServidor,\n                    StartsWith(\n                        NombreArchivo,\n                        Text(JsonCert.Value.ID) & \"_Certificados_\"\n                    )\n                )\n            }\n        )\n    );\n    // 3. Reconstruir Calificación de forma segura contra nulos\n    ClearCollect(\n        colCalificacion,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.CalificacionJSON)) As JsonCalif,\n            {\n                ID: Value(Text(JsonCalif.Value.ID)),\n                NombreCalificacion: Text(JsonCalif.Value.NombreCalificacion),\n                AutoraEmisoraCali: Text(JsonCalif.Value.AutoraEmisoraCali),\n                // \U0001F6E1️ Validación anti-nulos para el TipoProceso múltiple\n                TipoProceso: If(\n                    IsBlank(JsonCalif.Value.TipoProceso) Or IsError(Table(JsonCalif.Value.TipoProceso)),\n                    Table(),\n                    // \U0001F4A1 CORRECCIÓN AQUÍ: Usamos Value.Value para extraer el string del objeto JSON\n                    ForAll(\n                        Table(JsonCalif.Value.TipoProceso),\n                        {Value: Text(Value.Value)}\n                    )\n                ),\n                NumeroEstampe: Text(JsonCalif.Value.NumeroEstampe),\n                FechaEmision: If(\n                    IsBlank(Text(JsonCalif.Value.FechaEmision)),\n                    Blank(),\n                    DateValue(Text(JsonCalif.Value.FechaEmision))\n                ),\n                FechaVencimiento: If(\n                    IsBlank(Text(JsonCalif.Value.FechaVencimiento)),\n                    Blank(),\n                    DateValue(Text(JsonCalif.Value.FechaVencimiento))\n                ),\n                Evidencia: Filter(\n                    CargaEvidenciaCalificacion.Attachments,\n                    false\n                ),\n                EsNuevo: false,\n                // \U0001F4A1 Opcional: recuperamos si era nuevo o no del JSON\nArchivosHistoricos: Filter(\n                    colEnlacesServidor,\n                    StartsWith(\n                        NombreArchivo,\n                        Text(JsonCalif.Value.ID) & \"_Calificacion_\"\n                    )\n                )\n            }\n        )\n    );\n    // 4. Reconstruir Experiencia (Padre)\n    ClearCollect(\n        colExperiencia,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.ExperienciaJSON)) As JsonExp,\n            {\n                ID: Value(Text(JsonExp.Value.ExpID)),\n                NombreEmpresa: Text(JsonExp.Value.NombreEmpresa),\n                Contratista: Text(JsonExp.Value.Contratista),\n                Monto: Text(JsonExp.Value.Monto),\n                Cargo: Text(JsonExp.Value.Cargo),\n                FechaInicioExp: If(\n                    IsBlank(Text(JsonExp.Value.FechaInicioExp)),\n                    Blank(),\n                    DateValue(Text(JsonExp.Value.FechaInicioExp))\n                ),\n                FechaFinExp: If(\n                    IsBlank(Text(JsonExp.Value.FechaFinExp)),\n                    Blank(),\n                    DateValue(Text(JsonExp.Value.FechaFinExp))\n                ),\n                Estado: Text(JsonExp.Value.Estado),\n                Proyecto: Text(JsonExp.Value.Proyecto),\n                Evidencia: Filter(\n                    CargaEvidenciaExp.Attachments,\n                    false\n                ),\n                EsNuevo: false,\n                ArchivosHistoricos: Filter(\n                    colEnlacesServidor,\n                    StartsWith(\n                        NombreArchivo,\n                        Text(JsonExp.Value.ExpID) & \"_Experiencia_\"\n                    )\n                )\n            }\n        )\n    );\n    // 5. Reconstruir Actividades (Hija)\n    ClearCollect(\n        colActividades,\n        {\n            ID: 1,\n            ExperienciaID: 1,\n            Actividad: \"\"\n        }\n    );\n    Clear(colActividades);\n    ForAll(\n        Table(ParseJSON(ctxPerfilBuscado.ExperienciaJSON)) As Exp,\n        ForAll(\n            Table(Exp.Value.ListaActividades) As Act,\n            Collect(\n                colActividades,\n                {\n                    ID: Value(Text(Act.Value.ID)),\n                    ExperienciaID: Value(Text(Act.Value.ExperienciaID)),\n                    Actividad: Text(Act.Value.Actividad)\n                }\n            )\n        )\n    );\n    // 6. Reconstruir Vacunas (Padre)\n    ClearCollect(\n        colVacunas,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.VacunasJSON)) As JsonVac,\n            {\n                ID: Value(Text(JsonVac.Value.VacID)),\n                NombreVacuna: Text(JsonVac.Value.NombreVacuna),\n                FechaPrimeraDosis: If(\n                    IsBlank(Text(JsonVac.Value.FechaPrimeraDosis)),\n                    Blank(),\n                    DateValue(Text(JsonVac.Value.FechaPrimeraDosis))\n                ),\n                TipoVacuna: Text(JsonVac.Value.TipoVacuna),\n                Evidencia: Filter(\n                    CargaEvidenciaVacunas.Attachments,\n                    false\n                ),\n                EsNuevo: false,\n                lote1: Text(JsonVac.Value.lote1),\n                Responsable1: Text(JsonVac.Value.Responsable1),\n                Establecimiento1: Text(JsonVac.Value.Establecimiento1),\n                Observacion1: Text(JsonVac.Value.Observacion1),\n                ArchivosHistoricos: Filter(\n                    colEnlacesServidor,\n                    StartsWith(\n                        NombreArchivo,\n                        Text(JsonVac.Value.VacID) & \"_Vacuna_\"\n                    )\n                )\n            }\n        )\n    );\n    // 7. Reconstruir Dosis / Refuerzos (Hija)\n    ClearCollect(\n        colDosisVacunas,\n        {\n            ID: 1,\n            VacunaID: 1,\n            NumeroDosis: \"\",\n            FechaTentativa: Blank(),\n            FechaReal: Blank(),\n            Observacion: \"\",\n            MarcaCovid: \"\",\n            Lote: \"\",\n            ResponsableVacuna: \"\",\n            Establecimiento: \"\"\n        }\n    );\n    Clear(colDosisVacunas);\n    ForAll(\n        Table(ParseJSON(ctxPerfilBuscado.VacunasJSON)) As Vac,\n        ForAll(\n            Table(Vac.Value.ListaActividades) As Dos,\n            Collect(\n                colDosisVacunas,\n                {\n                    ID: Value(Text(Dos.Value.ID)),\n                    VacunaID: Value(Text(Dos.Value.VacunaID)),\n                    NumeroDosis: Text(Dos.Value.NumeroDosis),\n                    FechaTentativa: If(\n                        IsBlank(Text(Dos.Value.FechaTentativa)),\n                        Blank(),\n                        DateValue(Text(Dos.Value.FechaTentativa))\n                    ),\n                    FechaReal: If(\n                        IsBlank(Text(Dos.Value.FechaReal)),\n                        Blank(),\n                        DateValue(Text(Dos.Value.FechaReal))\n                    ),\n                    Observacion: Text(Dos.Value.Observacion),\n                    MarcaCovid: Text(Dos.Value.MarcaCovid),\n                    Lote: Text(Dos.Value.Lote),\n                    ResponsableVacuna: Text(Dos.Value.ResponsableVacuna),\n                    Establecimiento: Text(Dos.Value.Establecimiento)\n                }\n            )\n        )\n    );\n    // 7. Reconstruir Empleado del mes\n    ClearCollect(\n        colEmpleadoMes,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.EmpleadoMes)) As JsonEmpleado,\n            {\n                ID: Value(Text(JsonEmpleado.Value.ID)),\n                Mes: Text(JsonEmpleado.Value.Mes),\n                Anio: Text(JsonEmpleado.Value.Anio),\n                FechaEmision: If(\n                    IsBlank(Text(JsonEmpleado.Value.FechaEmision)),\n                    Blank(),\n                    DateValue(Text(JsonEmpleado.Value.FechaEmision))\n                ),\n                Actividad: Text(JsonEmpleado.Value.Actividad),\n                EsNuevo: false\n            }\n        )\n    );\n    // 7. Reconstruir Empleado del mes\n    ClearCollect(\n        colBuenasPracticas,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.BuenasPracticas)) As JsonPracticas,\n            {\n                ID: Value(Text(JsonPracticas.Value.ID)),\n                Mes: Text(JsonPracticas.Value.Mes),\n                Anio: Text(JsonPracticas.Value.Anio),\n                FechaEmision: If(\n                    IsBlank(Text(JsonPracticas.Value.FechaEmision)),\n                    Blank(),\n                    DateValue(Text(JsonPracticas.Value.FechaEmision))\n                ),\n                Actividad: Text(JsonPracticas.Value.Actividad),\n                EsNuevo: false\n            }\n        )\n    );\n    // 8. Reconstruir Certificados\n    ClearCollect(\n        colEquipoTecnologicos,\n        ForAll(\n            Table(ParseJSON(ctxPerfilBuscado.EquiposTecnologicosJSON)) As JsonEquipos,\n            {\n                ID: Value(Text(JsonEquipos.Value.ID)),\n                TpoEquipoTecnologico: Text(JsonEquipos.Value.TpoEquipoTecnologico),\n                EquipoTecnologico: Text(JsonEquipos.Value.EquipoTecnologico),\n                Nivel: Text(JsonEquipos.Value.Nivel),\n                Precio: Text(JsonEquipos.Value.Precio),\n                Cantidad: If(\n                    IsBlank(JsonEquipos.Value.Cantidad),\n                    \"\",\n                    Text(JsonEquipos.Value.Cantidad)\n                ),\n                FechaEmision: If(\n                    IsBlank(Text(JsonEquipos.Value.FechaEmision)),\n                    Blank(),\n                    DateValue(Text(JsonEquipos.Value.FechaEmision))\n                ),\n                EsNuevo: false\n            }\n        )\n    ),// <-- LÍMITE DEL BLOQUE VERDADERO (Uso de un solo ';' obligatorio)\n    // ==========================================\n// \U0001F535 MODO NUEVO: NO TIENE REGISTRO\n// ==========================================\n    UpdateContext({ctxDatosGenerales: Blank()});\n    UpdateContext({ctxDatosExamenMedicos: Blank()});\n    // \U0001F4A1 AÑADIR ESTO AQUÍ: Limpiar el carrito solo si es un perfil nuevo\n    ClearCollect(\n        colExamenesSeleccionados,\n        {\n            Categoria: \"\",\n            Nombre: \"\",\n            Precio: 0,\n            Padre: \"\"\n        }\n    );\n    Clear(colExamenesSeleccionados);\n    // 3. LIMPIEZA DE COLECCIONES HIJAS (Dosis y Actividades) - ¡Esto arregla tu error!\n    ClearCollect(\n        colDosisVacunas,\n        {\n            ID: 1,\n            VacunaID: 1,\n            NumeroDosis: \"\",\n            FechaTentativa: Blank(),\n            FechaReal: Blank(),\n            Observacion: \"\",\n            MarcaCovid: \"\",\n            Lote: \"\",\n            ResponsableVacuna: \"\",\n            Establecimiento: \"\"\n        }\n    );\n    Clear(colDosisVacunas);\n    ClearCollect(\n        colActividades,\n        {\n            ID: 1,\n            ExperienciaID: 1,\n            Actividad: \"\"\n        }\n    );\n    Clear(colActividades);\n    ClearCollect(\n        colEducacion,\n        {\n            ID: 1,\n            NivelEstudio: \"\",\n            TituloObtenido: \"\",\n            Institucion: \"\",\n            FechaInicio: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            FechaFin: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            Estado: \"\",\n            Observacion: \"\",\n            Evidencia: Filter(\n                CargaEvidenciaEducacion.Attachments,\n                false\n            ),\n            ArchivosHistoricos: Filter(\n                colEnlacesServidor,\n                false\n            )\n        }\n    );\n    ClearCollect(\n        colCertificado,\n        {\n            ID: 1,\n            NombreCertificado: \"\",\n            AutoraEmisora: \"\",\n            FechaEmision: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            FechaVencimiento: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            Evidencia: Filter(\n                CargaEvidenciaCertificado.Attachments,\n                false\n            ),\n            ArchivosHistoricos: Filter(\n                colEnlacesServidor,\n                false\n            )\n        }\n    );\n    ClearCollect(\n        colCalificacion,\n        {\n            ID: 1,\n            NombreCalificacion: \"\",\n            AutoraEmisoraCali: \"\",\n            TipoProceso: Table({Value: \"\"}),\n            NumeroEstampe: \"\",\n            FechaEmision: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            FechaVencimiento: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            Evidencia: Filter(\n                CargaEvidenciaCalificacion.Attachments,\n                false\n            ),\n            ArchivosHistoricos: Filter(\n                colEnlacesServidor,\n                false\n            )\n        }\n    );\n    ClearCollect(\n        colExperiencia,\n        {\n            ID: 1,\n            NombreEmpresa: \"\",\n            Contratista: \"\",\n            Monto: \"\",\n            Cargo: \"\",\n            FechaInicioExp: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            FechaFinExp: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            Proyecto: \"\",\n            Estado: \"\",\n            Evidencia: Filter(\n                CargaEvidenciaExp.Attachments,\n                false\n            ),\n            ArchivosHistoricos: Filter(\n                colEnlacesServidor,\n                false\n            )\n        }\n    );\n    // 5. Colección Padre: Vacunas\n    ClearCollect(\n        colVacunas,\n        {\n            ID: 1,\n            NombreVacuna: \"\",\n            FechaPrimeraDosis: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            TipoVacuna: \"\",\n            Evidencia: Filter(\n                CargaEvidenciaVacunas.Attachments,\n                false\n            ),\n            ArchivosHistoricos: Filter(\n                colEnlacesServidor,\n                false\n            ),\n            lote1: \"\",\n            Responsable1: \"\",\n            Establecimiento1: \"\",\n            Observacion1: \"\",\n            EsNuevo: true\n        }\n    );\n    // 6. Empleado mes\n    ClearCollect(\n        colEmpleadoMes,\n        {\n            ID: 1,\n            Mes: \"\",\n            Anio: \"\",\n            FechaEmision: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            Actividad: \"\"\n        }\n    );\n    // 6. Empleado mes\n    ClearCollect(\n        colBuenasPracticas,\n        {\n            ID: 1,\n            Mes: \"\",\n            Anio: \"\",\n            FechaEmision: If(\n                false,\n                Today(),\n                Blank()\n            ),\n            Actividad: \"\"\n        }\n    );\n    // 7. Equipos Tecnologicos (NUEVO)\n    ClearCollect(\n        colEquipoTecnologicos,\n        {\n            ID: 1,\n            TpoEquipoTecnologico: \"\",\n            EquipoTecnologico: \"\",\n            Nivel: \"\",\n            Precio: \"\",\n            Cantidad: \"\",\n            FechaEmision: Blank(),\n            EsNuevo: true\n        }\n    )\n);\n// 1. Buscamos el registro único y guardamos el texto del JSON\nUpdateContext(\n    {\n        varJsonTexto: LookUp(\n            PERFIL_USUARIO,\n            EKON = \"DATOS\"\n        ).DATOS_EXAMENES_MEDICOS\n    }\n);\n// 2. Parseamos el texto JSON y lo convertimos en la colección cruda\nClearCollect(\n    colTarifarioExamenes,\n    Table(ParseJSON(varJsonTexto))\n);\n\n\n// 1. Buscamos el registro maestro de Equipos Tecnológicos\nUpdateContext({\n    varJsonEquiposTexto: LookUp(\n        PERFIL_USUARIO, \n        EKON = \"DATOS\"\n    ).DATOS_EQUIPOS_TECNOLOGICOS\n});\n\n// 2. Aplanamos el JSON anidado de 3 niveles\nClear(colMatrizEquipos);\n\nIf(\n    !IsBlank(varJsonEquiposTexto),\n    \n    // Entramos al Nivel 1: Categorias\n    ForAll(\n        Table(ParseJSON(varJsonEquiposTexto).Categorias) As JsonCat,\n        \n        // Entramos al Nivel 2: Equipos\n        ForAll(\n            Table(JsonCat.Value.Equipos) As JsonEq,\n            \n            // Entramos al Nivel 3: OpcionesNivel (Aquí están los precios)\n            ForAll(\n                Table(JsonEq.Value.OpcionesNivel) As JsonOpcion,\n                \n                // Guardamos cada combinación como una fila plana en nuestra colección\n                Collect(\n                    colMatrizEquipos,\n                    {\n                        TipoEquipo: Text(JsonCat.Value.Categoria),\n                        Equipo: Text(JsonEq.Value.Equipo),\n                        Nivel: Text(JsonOpcion.Value.Nivel),\n                        Precio: Text(JsonOpcion.Value.Costo),\n                        Descripcion: Text(JsonOpcion.Value.Descripcion),\n                        \n                        // Creamos un campo especial para que se vea bonito en el ComboBox\n                        NombreMostrar: Text(JsonEq.Value.Equipo) & \" - \" & Text(JsonOpcion.Value.Nivel)\n                    }\n                )\n            )\n        )\n    )\n);\n\nClearCollect(\n    colInstitucionesFiscales,\n    {Institucion: \"SEDEMI SCC\", RUC: \"1791734920001\", CIIU: \"C25110201\"},\n    {Institucion: \"FENIX\", RUC: \"1792098548001\", CIIU: \"C28160109\"},\n    {Institucion: \"SEDEMI CONSTRUCCIONES\", RUC: \"1792011736001\", CIIU: \"D35100201\"},\n    {Institucion: \"BLIZZ\", RUC: \"1793218414001\", CIIU: \"L68100101\"},\n    {Institucion: \"FARMS\", RUC: \"1793124011001\", CIIU: \"A01280301\"}\n);\n\n\nClearCollect(\n    colCertificadosPersistentes,\n    ShowColumns(Catálogo_Certificados, NombreCertificado)\n);\n\nSet(generandoPDF, false );\n"
