                                                        =[
                                                            "ASTRAZENECA", 
                                                            "BHARAT", 
                                                            "CANSINO 1", 
                                                            "JANSSEN 1", 
                                                            "MODERNA", 
                                                            "NOVAVAX", 
                                                            "PFIZER",
                                                            "SINOPHARM",
                                                            "SINOVAC",
                                                            "SPIKEVAX"
                                                        ]
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnChange: |-
                                                        =Patch(
                                                            colDosisVacunas, 
                                                            LookUp(colDosisVacunas, ID = ThisItem.ID), 
                                                            {MarcaCovid: Self.Selected.Value}
                                                        )
                                                      SelectMultiple: =false
