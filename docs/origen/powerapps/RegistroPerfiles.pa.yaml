                                          LayoutMinWidth: =16
                                        Children:
                                          - Text4_36:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Align: =Align.Center
                                                FillPortions: =1
                                                Font: =Font.'Open Sans Condensed'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =Parent.Height * 0.8
                                                LayoutMinWidth: =0
                                                OnSelect: =
                                                PaddingBottom: =0
                                                PaddingLeft: =10
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Text: |-
                                                  =If(
                                                      ThisItem.NombreVacuna = "COVID",
                                                      "➕ AGREGAR DOSIS/REFUERZO",
                                                      "➕ AGREGAR REFUERZO "
                                                  )
                                                Width: =Parent.Width
                                                X: =40
                                                Y: =40
                                          - Button8_1:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                DisplayMode: "=/*\r\nWith(\r\n    {\r\n        TotalHijas: CountRows(Filter(colDosisVacunas; VacunaID = ThisItem.ID));\r\n        UltimaHija: Last(Sort(Filter(colDosisVacunas; VacunaID = ThisItem.ID); ID; SortOrder.Ascending))\r\n    };\r\n    If(\r\n        \r\n        IsBlank(ThisItem.FechaPrimeraDosis) && ThisItem.NombreVacuna <> \"COVID\";\r\n        DisplayMode.Disabled;\r\n       \r\n        \r\n\r\n        // Bloquea el botón si la última dosis agregada aún no tiene una 'Fecha Real' ingresada\r\n        TotalHijas > 0 And IsBlank(UltimaHija.FechaReal);\r\n        DisplayMode.Disabled;\r\n\r\n        Switch(\r\n            ThisItem.NombreVacuna;\r\n            \"HEPATITIS A\"; If(TotalHijas >= 2; DisplayMode.Edit; DisplayMode.Disabled);\r\n            \"HEPATITIS B\"; If(TotalHijas >= 2; DisplayMode.Edit; DisplayMode.Disabled);\r\n            \"HEPATITIS A Y B (COMBINADA)\"; If(TotalHijas >= 2; DisplayMode.Edit; DisplayMode.Disabled);\r\n            \"TIFOIDEA\"; DisplayMode.Edit; // Habilitado directo desde la dosis 1\r\n            \"DIFTERIA Y TETANOS\"; Switch(\r\n                ThisItem.TipoVacuna;\r\n                \"1 DOSIS\"; DisplayMode.Edit;\r\n                \"5 DOSIS\"; If(TotalHijas >= 4; DisplayMode.Edit; DisplayMode.Disabled);\r\n                DisplayMode.Disabled\r\n            );\r\n            \"TETANOS\"; Switch(\r\n                ThisItem.TipoVacuna;\r\n                \"1 DOSIS\"; DisplayMode.Edit;\r\n                \"5 DOSIS\"; If(TotalHijas >= 4; DisplayMode.Edit; DisplayMode.Disabled);\r\n                DisplayMode.Disabled\r\n            );\r\n            \"COVID\"; DisplayMode.Edit; // Tope de 5 tuplas para COVID\r\n            DisplayMode.Disabled\r\n        )\r\n    )\r\n)\r\n*/\r\n\r\nWith(\r\n    {\r\n        TotalHijas: CountRows(Filter(colDosisVacunas, VacunaID = ThisItem.ID)),\r\n        UltimaHija: Last(Sort(Filter(colDosisVacunas, VacunaID = ThisItem.ID), ID, SortOrder.Ascending))\r\n    },\r\n    If(\r\n        IsBlank(ThisItem.FechaPrimeraDosis) And ThisItem.NombreVacuna <> \"COVID\" And ThisItem.NombreVacuna <> \"INFLUENZA\",\r\n        DisplayMode.Disabled,\r\n\r\n        // Bloquea si la última dosis creada aún no tiene Fecha Real (esto se mantiene igual para INFLUENZA)\r\n        TotalHijas > 0 And IsBlank(UltimaHija.FechaReal),\r\n        DisplayMode.Disabled,\r\n\r\n        Switch(\r\n            ThisItem.NombreVacuna,\r\n            \"HEPATITIS A\", If(TotalHijas >= 2, DisplayMode.Edit, DisplayMode.Disabled),\r\n            \"HEPATITIS B\", If(TotalHijas >= 2, DisplayMode.Edit, DisplayMode.Disabled),\r\n            \"HEPATITIS A Y B (COMBINADA)\", If(TotalHijas >= 2, DisplayMode.Edit, DisplayMode.Disabled),\r\n            \"TIFOIDEA\", DisplayMode.Edit,\r\n            \"DIFTERIA Y TETANOS\", Switch(\r\n                ThisItem.TipoVacuna,\r\n                \"1 DOSIS\", DisplayMode.Edit,\r\n                \"5 DOSIS\", If(TotalHijas >= 4, DisplayMode.Edit, DisplayMode.Disabled),\r\n                DisplayMode.Disabled\r\n            ),\r\n            \"TETANOS\", Switch(\r\n                ThisItem.TipoVacuna,\r\n                \"1 DOSIS\", DisplayMode.Edit,\r\n                \"5 DOSIS\", If(TotalHijas >= 4, DisplayMode.Edit, DisplayMode.Disabled),\r\n                DisplayMode.Disabled\r\n            ),\r\n            \"COVID\", DisplayMode.Edit,\r\n            \"INFLUENZA\", DisplayMode.Edit,\r\n            DisplayMode.Disabled\r\n        )\r\n    )\r\n)"
                                                FillPortions: =0.8
                                                Icon: ="SaveCopy"
                                                IconStyle: =IconStyle.Filled
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnSelect: |-
                                                  =/*
                                                  With(
                                                      {
                                                          UltimaFecha: If(
                                                              CountRows(Filter(colDosisVacunas; VacunaID = ThisItem.ID)) > 0; 
                                                              Last(Sort(Filter(colDosisVacunas; VacunaID = ThisItem.ID); ID; SortOrder.Ascending)).FechaReal; 
                                                              ThisItem.FechaPrimeraDosis
                                                          );
                                                          NumRefuerzosAct: CountRows(Filter(colDosisVacunas; VacunaID = ThisItem.ID And StartsWith(NumeroDosis; "Refuerzo")))
                                                      };
                                                      Collect(
                                                          colDosisVacunas;
                                                          {
                                                              ID: If(IsEmpty(colDosisVacunas); 1; Max(colDosisVacunas; ID) + 1);
                                                              VacunaID: ThisItem.ID;
                                                              NumeroDosis: If(ThisItem.NombreVacuna = "COVID"; ""; "Refuerzo " & (NumRefuerzosAct + 1));

                                                              // ⚙️ El cálculo a futuro según la vacuna
                                                              FechaTentativa: Switch(
                                                                  ThisItem.NombreVacuna;
                                                                  "TIFOIDEA"; DateAdd(UltimaFecha; 3; TimeUnit.Years);
                                                                  "COVID"; Blank();
                                                                  DateAdd(UltimaFecha; 10; TimeUnit.Years) // Por descarte: Hepatitis y Difteria son 10 años
                                                              );
                                                              FechaReal: Blank();
                                                              Observacion: "";
                                                              MarcaCovid: ""
                                                          }
                                                      )
                                                  )
                                                  */

                                                  With(
                                                      {
                                                          UltimaFecha: If(
                                                              CountRows(Filter(colDosisVacunas, VacunaID = ThisItem.ID)) > 0,
                                                              Last(Sort(Filter(colDosisVacunas, VacunaID = ThisItem.ID), ID, SortOrder.Ascending)).FechaReal,
                                                              ThisItem.FechaPrimeraDosis
                                                          ),
                                                          NumRefuerzosAct: CountRows(Filter(colDosisVacunas, VacunaID = ThisItem.ID And StartsWith(NumeroDosis, "Refuerzo"))),
                                                          TotalDosisInfluenza: CountRows(Filter(colDosisVacunas, VacunaID = ThisItem.ID))
                                                      },
                                                      Collect(
                                                          colDosisVacunas,
                                                          {
                                                              ID: If(IsEmpty(colDosisVacunas), 1, Max(colDosisVacunas, ID) + 1),
                                                              VacunaID: ThisItem.ID,
                                                              NumeroDosis: Switch(
                                                                  ThisItem.NombreVacuna,
                                                                  "COVID", "",
                                                                  "INFLUENZA", "Dosis " & (TotalDosisInfluenza + 1),
                                                                  "Refuerzo " & (NumRefuerzosAct + 1)
                                                              ),
                                                              FechaTentativa: Switch(
                                                                  ThisItem.NombreVacuna,
                                                                  "TIFOIDEA", DateAdd(UltimaFecha, 3, TimeUnit.Years),
                                                                  "COVID", Blank(),
                                                                  "INFLUENZA", Blank(),
                                                                  DateAdd(UltimaFecha, 10, TimeUnit.Years)
                                                              ),
                                                              FechaReal: Blank(),
                                                              Observacion: "",
                                                              MarcaCovid: ""
                                                          }
                                                      )
                                                  )
                                                RadiusBottomLeft: =20
                                                RadiusBottomRight: =20
                                                RadiusTopLeft: =20
                                                RadiusTopRight: =20
                                                Text: =
                                                Visible: =ThisItem.NombreVacuna <> "FIEBRE AMARILLA" && ThisItem.NombreVacuna <> "SARAMPION-RUBEOLA"
                                                Width: =Parent.Width * 0.7
                                                X: =40
                                                Y: =40
                                    - Gallery4_1:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
