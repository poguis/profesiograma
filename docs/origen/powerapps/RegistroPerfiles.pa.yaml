                                                Text: |-
                                                  =//"$ " & ThisItem.Precio

                                                  With(
                                                      { locExamenGuardado: LookUp(colExamenesSeleccionados, Nombre = ThisItem.Nombre) },
                                                      "$ " & If(
                                                          !IsBlank(locExamenGuardado.Nombre),
