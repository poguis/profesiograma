                                                      Default: =ThisItem.ResponsableVacuna
                                                      FillPortions: =1
                                                      Font: =Font.'Open Sans Condensed'
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnChange: |-
                                                        =Patch(
                                                            colDosisVacunas, 
                                                            LookUp(colDosisVacunas, ID = ThisItem.ID), 
