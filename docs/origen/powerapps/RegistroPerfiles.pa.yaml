                                                  Establecimiento: Establecimiento,
                                                  Observacion: Observacion,
                                                  MarcaCovid: MarcaCovid
                                              }
                                          )
                                      }
                                  )
                              }
                          );

                          Set(
                              varResultadoVacunas,
                              ArchivosPerfilUsuario.Run(
                                  Text(ctxPersonaSeleccionada.'Código Ekon'),
                                  JSON(varPayloadVacunas, JSONFormat.IgnoreBinaryData),
                                  "0",
