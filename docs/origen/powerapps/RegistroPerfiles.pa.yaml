                              - cedulaMedico:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =ctxDatosExamenMedicos.CedulaMedico
                                    FillPortions: =1
                                    Font: =Font.'Open Sans Condensed'
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: "=With(\r\n    {\r\n        // Reemplaza 'cedulaMedico' por el nombre real de tu TextInput\r\n        locCedula: cedulaMedico.Text \r\n    },\r\n    If(\r\n        // \U0001F4A1 CORRECCIÓN AQUÍ: Usamos \"^[0-9]+$\" en lugar de Match.Digits\r\n        Len(locCedula) = 10 And IsMatch(locCedula, \"^[0-9]+$\"),\r\n        \r\n        With(\r\n            {\r\n                provincia: Value(Left(locCedula, 2)),\r\n                tercerDigito: Value(Mid(locCedula, 3, 1)),\r\n                d1: Value(Mid(locCedula, 1, 1)),\r\n                d2: Value(Mid(locCedula, 2, 1)),\r\n                d3: Value(Mid(locCedula, 3, 1)),\r\n                d4: Value(Mid(locCedula, 4, 1)),\r\n                d5: Value(Mid(locCedula, 5, 1)),\r\n                d6: Value(Mid(locCedula, 6, 1)),\r\n                d7: Value(Mid(locCedula, 7, 1)),\r\n                d8: Value(Mid(locCedula, 8, 1)),\r\n                d9: Value(Mid(locCedula, 9, 1)),\r\n                d10: Value(Mid(locCedula, 10, 1))\r\n            },\r\n            With(\r\n                {\r\n                    // Algoritmo Módulo 10\r\n                    suma: \r\n                        If(d1 * 2 >= 10, d1 * 2 - 9, d1 * 2) + d2 +\r\n                        If(d3 * 2 >= 10, d3 * 2 - 9, d3 * 2) + d4 +\r\n                        If(d5 * 2 >= 10, d5 * 2 - 9, d5 * 2) + d6 +\r\n                        If(d7 * 2 >= 10, d7 * 2 - 9, d7 * 2) + d8 +\r\n                        If(d9 * 2 >= 10, d9 * 2 - 9, d9 * 2)\r\n                },\r\n                If(\r\n                    // 2. Validar reglas de Ecuador (Provincia 1-24 o 30, 3er dígito < 6 y Modulo 10)\r\n                    ((provincia >= 1 And provincia <= 24) Or provincia = 30) And\r\n                    tercerDigito < 6 And\r\n                    Mod(10 - Mod(suma, 10), 10) = d10,\r\n                    \r\n                    // ==========================================\r\n                    // \U0001F7E2 CÉDULA VÁLIDA\r\n                    // ==========================================\r\n                    Notify(\"Cédula válida.\", NotificationType.Success),\r\n                    \r\n                    // ==========================================\r\n                    // \U0001F534 CÉDULA INVÁLIDA (Fallo matemático)\r\n                    // ==========================================\r\n                    Notify(\"La cédula ingresada no es válida en Ecuador.\", NotificationType.Error);\r\n                    \r\n                    // \U0001F9F9 RESTABLECER TODO (Código de limpieza)\r\n                    Reset(cedulaMedico); \r\n                )\r\n            )\r\n        ),\r\n        \r\n        // ==========================================\r\n        // \U0001F534 CÉDULA INVÁLIDA (Fallo de formato: letras o < 10 dígitos)\r\n        // ==========================================\r\n        If(\r\n            !IsBlank(locCedula),\r\n            Notify(\"La cédula debe contener exactamente 10 números.\", NotificationType.Error);\r\n            \r\n            // \U0001F9F9 RESTABLECER TODO (Código de limpieza)\r\n            Reset(cedulaMedico);\r\n        )\r\n    )\r\n)"
                                    Size: =15
