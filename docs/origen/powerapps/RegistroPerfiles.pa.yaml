            - BOTONES:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0.07
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                Children:
                  - PdfExamenMedico:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(141, 229, 250, 1)
                        Font: =Font.'Open Sans Condensed'
                        FontWeight: =FontWeight.Normal
                        Height: =Parent.Height * 0.8
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =// ===================================================
                          // PARTÍCULAS (se pegan a la palabra siguiente, nunca a la anterior)
                          // ===================================================
                          Set(varParticulas, ["DE","DEL","LA","LAS","LOS","Y","SAN","SANTA","MC","VON","VAN"]);

                          // ===================================================
                          // TOKENIZAR APELLIDOS
                          // ===================================================
                          Set(varPalabrasApe, Split(Upper(Trim(ctxPersonaSeleccionada.apellidos)), " "));
                          Set(varTotalPalabrasApe, CountRows(varPalabrasApe));

                          ClearCollect(
                              colPalabrasApe,
                              ForAll(
                                  Sequence(varTotalPalabrasApe) As N,
                                  With(
                                      { W: Trim(Index(varPalabrasApe, N.Value).Value) },
                                      {
                                          Indice: N.Value,
                                          Palabra: W,
                                          EsParticula: W in varParticulas
                                      }
                                  )
                              )
                          );

                          ClearCollect(
                              colIniciosApe,
                              Filter(
                                  colPalabrasApe As P,
                                  P.Indice = 1 Or !Index(colPalabrasApe, P.Indice - 1).EsParticula
                              )
                          );

                          ClearCollect(
                              colTokensApePos,
                              AddColumns(
                                  colIniciosApe,
                                  FinToken,
                                  With(
                                      { SiguienteInicio: Min(Filter(colIniciosApe As CI, CI.Indice > Indice), Indice) },
                                      If(
                                          IsBlank(SiguienteInicio) Or SiguienteInicio = 0,
                                          varTotalPalabrasApe,
                                          SiguienteInicio - 1
                                      )
                                  )
                              )
                          );

                          ClearCollect(
                              colTokensApellidos,
                              ForAll(
                                  colTokensApePos As pos,
                                  {
                                      Token: Trim(
                                          Concat(
                                              Filter(colPalabrasApe, Indice >= pos.Indice && Indice <= pos.FinToken),
                                              Palabra & " "
                                          )
                                      )
                                  }
                              )
                          );

                          Set(varTotalTokensApe, CountRows(colTokensApellidos));

                          // ===================================================
                          // TOKENIZAR NOMBRES (misma lógica exacta que apellidos)
                          // ===================================================
                          Set(varPalabrasNom, Split(Upper(Trim(ctxPersonaSeleccionada.nombres)), " "));
                          Set(varTotalPalabrasNom, CountRows(varPalabrasNom));

                          ClearCollect(
                              colPalabrasNom,
                              ForAll(
                                  Sequence(varTotalPalabrasNom) As N,
                                  With(
                                      { W: Trim(Index(varPalabrasNom, N.Value).Value) },
                                      {
                                          Indice: N.Value,
                                          Palabra: W,
                                          EsParticula: W in varParticulas
                                      }
                                  )
                              )
                          );

                          ClearCollect(
                              colIniciosNom,
                              Filter(
                                  colPalabrasNom As P,
                                  P.Indice = 1 Or !Index(colPalabrasNom, P.Indice - 1).EsParticula
                              )
                          );

                          ClearCollect(
                              colTokensNomPos,
                              AddColumns(
                                  colIniciosNom,
                                  FinToken,
                                  With(
                                      { SiguienteInicio: Min(Filter(colIniciosNom As CI, CI.Indice > Indice), Indice) },
                                      If(
                                          IsBlank(SiguienteInicio) Or SiguienteInicio = 0,
                                          varTotalPalabrasNom,
                                          SiguienteInicio - 1
                                      )
                                  )
                              )
                          );

                          ClearCollect(
                              colTokensNombres,
                              ForAll(
                                  colTokensNomPos As pos,
                                  {
                                      Token: Trim(
                                          Concat(
                                              Filter(colPalabrasNom, Indice >= pos.Indice && Indice <= pos.FinToken),
                                              Palabra & " "
                                          )
                                      )
                                  }
                              )
                          );

                          Set(varTotalTokensNom, CountRows(colTokensNombres));

                          // ===================================================
                          // ARMAR locSeccionA
                          // PrimerX = bloque 1. SegundoX = bloque 2 en adelante, unidos
                          // (así nunca se pierde info si por algún caso salen >2 bloques)
                          // ===================================================
                          UpdateContext(
                              {
                                  locSeccionA: {
                                      Institucion: "",
                                      RUC: "",
                                      CIIU: "",
                                      EstablecimientoSalud: "SERVICIO MEDICO DE SEDEMI",
                                      NumHistoriaClinica: Text(ctxPersonaSeleccionada.Cédula),
                                      NumArchivo: Text(ctxPersonaSeleccionada.'Código Ekon'),
                                      PrimerApellido: If(varTotalTokensApe >= 1, Index(colTokensApellidos, 1).Token, ""),
                                      SegundoApellido: If(
                                          varTotalTokensApe >= 2,
                                          TrimEnds(Concat(Sequence(varTotalTokensApe - 1, 2), Index(colTokensApellidos, Value).Token & " ")),
                                          ""
                                      ),
                                      PrimerNombre: If(varTotalTokensNom >= 1, Index(colTokensNombres, 1).Token, ""),
                                      SegundoNombre: If(
                                          varTotalTokensNom >= 2,
                                          TrimEnds(Concat(Sequence(varTotalTokensNom - 1, 2), Index(colTokensNombres, Value).Token & " ")),
                                          ""
                                      ),
                                      Sexo: If(Upper(ctxPersonaSeleccionada.Sexo) = "HOMBRE", "H", If(Upper(ctxPersonaSeleccionada.Sexo) = "MUJER", "M", "")),
                                      Cargo: ctxPersonaSeleccionada.Cargo
                                  },
                                  locMostrarPopupSeccionA: true
                              }
                          );
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =15
                        Text: ="PDF"
                        Visible: =locPasoActual = 6
                        Width: =120
                  - Atras:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        Font: =Font.'Open Sans Condensed'
                        Height: =Parent.Height * 0.8
                        Icon: ="ArrowCircleLeft"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =UpdateContext(
                              {
                                  locPasoActual: If(
                                      locEsGrupoRestringido,
                                      Max(
                                          6,
                                          locPasoActual - 1
                                      ),
                                      locPasoActual - 1
                                  )
                              }
                          )
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Text: ="ATRÁS"
                        Visible: =If(locEsGrupoRestringido, locPasoActual > 6, locPasoActual > 1)
                  - Siguiente:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        Font: =Font.'Open Sans Condensed'
                        Height: =Parent.Height * 0.8
                        Icon: ="ArrowCircleRight"
                        IconStyle: =IconStyle.Filled
                        Layout: =ButtonLayout.IconAfter
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: "=//UpdateContext({locPasoActual: locPasoActual + 1})\r\nUpdateContext(\n    {\n        locPasoActual: If(\n            locEsGrupoRestringido,\n            Min(\n                7,\n                locPasoActual + 1\n            ),\n            locPasoActual + 1\n        )\n    }\n)\n/*\r\nIf(\r\n    // 1. Verificamos si estamos en el paso 4 Y si hay algún registro incompleto\r\n    locPasoActual = 4 And CountRows(Filter(colCalificacion; IsBlank(NumeroEstampe) Or IsEmpty(TipoProceso))) > 0;\r\n    \r\n    // 2. Si hay datos faltantes, lanzamos la advertencia y NO avanzamos\r\n    Notify(\"No puedes avanzar. Debes ingresar el 'Tipo de Proceso' y el 'Número de Estampe' en todas las calificaciones agregadas.\"; NotificationType.Warning);\r\n    \r\n    // 3. Si todo está correcto (o estamos en otro paso), avanzamos normalmente\r\n    UpdateContext({locPasoActual: locPasoActual + 1})\r\n)\r\n*/"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =14
                        Text: ="SIGUIENTE"
                        Visible: |-
                          =//locPasoActual < 9

                          If(locEsGrupoRestringido, locPasoActual < 7, locPasoActual < 9)
                        Width: =120
                  - Guardar:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        Font: =Font.'Open Sans Condensed'
                        FontWeight: =FontWeight.Normal
                        Height: =Parent.Height * 0.8
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: "=Patch(\r\n    PERFIL_USUARIO,\r\n    // Buscamos si ya existe el registro. Si existe, lo actualiza. Si no, crea uno nuevo (Defaults).\r\n    If(\r\n        IsBlank(LookUp(PERFIL_USUARIO, EKON = Ekon.Text)),\r\n        Defaults(PERFIL_USUARIO),\r\n        LookUp(PERFIL_USUARIO, EKON = Ekon.Text)\r\n    ),\r\n    {\r\n        EKON: Ekon.Text, \r\n\r\n        DatosGenerales: JSON(\r\n            {\r\n                NombreCompleto: NombreCompleto.Text,\r\n                Departamento: Departamento.Text,\r\n                Cedula: CedulaPersona.Text,\r\n                Area: Area.Text,\r\n                Seccion: Seccion.Text,\r\n                Cargo: Cargo.Text,\r\n                NivelOcupacional: Cargo_1.Text,\r\n                CIUO: Text(ciuo.Selected.Value.perNombre),\r\n\r\n                TieneLicencia: toggleLIC.Checked,\r\n                Compania: ctxPersonaSeleccionada.Empresa,\r\n                Nacionalidad: cmbNacionalidad.Selected.Value,\r\n                FechaNacimiento: ctxPersonaSeleccionada.'Fecha Nacimiento',\r\n                DireccionDomi: direccionDomi.Text,\r\n                NumeroCelular: ctxPersonaSeleccionada.Telefono,\r\n                Ekon: Ekon.Text,\r\n                Licencia: If(toggleLIC.Checked, Concat(cmbLicencias.SelectedItems, Value, \"; \"), \"N/A\"),\r\n                FechaCadLic: If(toggleLIC.Checked, fechaCaducidadLic.SelectedDate, Blank()),\r\n                FechaEmisionLic: If(toggleLIC.Checked, fechaEmisionLic.SelectedDate, Blank()),\r\n                FechaRenoLic: If(toggleLIC.Checked, fechaRenoLic.SelectedDate, Blank()),\r\n                \r\n                Contacto: nombreContacto.Text,\r\n                Parentesco: cmbParentesco.Selected.Value,\r\n                NumeroContacto: numeroContacto.Text,\r\n                \r\n                Contacto2: nombreContacto_1.Text,\r\n                Parentesco2: cmbParentesco_1.Selected.Value,\r\n                NumeroContacto2: numeroContacto_1.Text,\r\n                \r\n                \r\n                Enfermedades: enfermedades.Text,\r\n                Medicamentos: medicamentos.Text,\r\n                Alergias: Alergias.Text,\r\n                \r\n                Seguro: toggleSeguro.Checked,\r\n                GrupoPoliza: cmbGrupoPoliza.Selected.Value,\r\n                SeguroPrivado: SeguroPrivado.Text \r\n            },\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        EXAMENES_MEDICOS: JSON(\r\n            {\r\n                FechaExa: fechaExamenMed.SelectedDate,\r\n                Lugar: cmbProveedor.Selected.Value,\r\n                //NombreMedico: cmbMedicos.Selected.'Nombre Apellido';\r\n                NombreMedico: nombreMedico.Text,\r\n                CedulaMedico: cedulaMedico.Text,\r\n                Sangre: cmbTipoSangre.Selected.Value,\r\n                Alergias: Alergias.Text,\r\n                //Aptitud: actitudMedica.Text;\r\n                Aptitud: cmbActitudMedica.Selected.Value,\r\n                Restricciones: restriccion.Text,\r\n                FechaExaCad: fechaExamCad.SelectedDate,\r\n                Zona: cmbZona.Selected.Value,\r\n                \r\n                // \U0001F525 AQUÍ GUARDAMOS EL CARRITO DE EXÁMENES SELECCIONADOS\r\n                ListaExamenes: colExamenesSeleccionados\r\n            },\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n\r\n        ),\r\n\r\n        EducacionJSON: JSON(\r\n            DropColumns(colEducacion, Evidencia, ArchivosHistoricos),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        CertificadosJSON: JSON(\r\n            DropColumns(colCertificado, Evidencia, ArchivosHistoricos),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        CalificacionJSON: JSON(\r\n            DropColumns(colCalificacion, Evidencia, ArchivosHistoricos),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        ExperienciaJSON: JSON(\r\n            AddColumns(\r\n                RenameColumns(\r\n                    DropColumns(colExperiencia, Evidencia, ArchivosHistoricos),\r\n                    ID,\r\n                    ExpID\r\n                ),\r\n                ListaActividades, \r\n                Filter(colActividades, ExperienciaID = ExpID) \r\n            ),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        VacunasJSON: JSON(\r\n            AddColumns(\r\n                RenameColumns(\r\n                    DropColumns(colVacunas, Evidencia, ArchivosHistoricos),\r\n                    ID,\r\n                    VacID\r\n                ),\r\n                ListaActividades, \r\n                Filter(colDosisVacunas, VacunaID = VacID) \r\n            ),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        EmpleadoMes: JSON(\r\n            colEmpleadoMes,\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        BuenasPracticas: JSON(\r\n            colBuenasPracticas,\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        )\r\n        ,\r\n\r\n        EquiposTecnologicosJSON: JSON(\r\n            colEquipoTecnologicos,\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        )\r\n    }\r\n);\r\n\r\n// ==========================================\r\n// \U0001F680 1. GUARDAR ARCHIVOS DE EDUCACIÓN\r\n// ==========================================\r\nForAll(\r\n    // Filtramos solo las filas que tengan algún archivo adjunto (que no estén vacías)\r\n    Filter(colEducacion, CountRows(Evidencia) > 0) As FilaEdu,\r\n    \r\n    // Como el control puede tener MÁS DE UN archivo, hacemos un segundo ForAll interno\r\n    ForAll(\r\n        FilaEdu.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text,             // El EKON para la carpeta\r\n            \"Educacion\",           // La Sección\r\n            Text(FilaEdu.ID),      // El ID de la fila para identificar a qué tupla pertenece\r\n            {\r\n                // Nombre único: Educacion_FilaID_.extension\r\n                name: FilaEdu.ID & \"_\" & \"Educacion_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    )\r\n);\r\n\r\n// ==========================================\r\n// \U0001F680 2. GUARDAR ARCHIVOS DE CERTIFICADOS\r\n// ==========================================\r\nForAll(\r\n    Filter(colCertificado, CountRows(Evidencia) > 0) As FilaCert,\r\n    ForAll(\r\n        FilaCert.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Certificados\", \r\n            Text(FilaCert.ID),\r\n            {\r\n                // Nombre único: Educacion_FilaID_.extension\r\n                name: FilaCert.ID & \"_\" & \"Certificados_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    )\r\n);\r\n\r\n// ==========================================\r\n// \U0001F680 2. GUARDAR ARCHIVOS DE CERTIFICADOS\r\n// ==========================================\r\nForAll(\r\n    Filter(colCalificacion, CountRows(Evidencia) > 0) As FilaCali,\r\n    ForAll(\r\n        FilaCali.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Calificacion\", \r\n            Text(FilaCali.ID),\r\n            {\r\n                // Nombre único: Educacion_FilaID_.extension\r\n                name: FilaCali.ID & \"_\" & \"Calificacion_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    )\r\n);\r\n\r\n// ==========================================\r\n// \U0001F680 3. GUARDAR ARCHIVOS DE EXPERIENCIA\r\n// ==========================================\r\nForAll(\r\n    Filter(colExperiencia, CountRows(Evidencia) > 0) As FilaExp,\r\n    ForAll(\r\n        FilaExp.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Experiencia\", \r\n            Text(FilaExp.ID),\r\n            {\r\n                // Nombre único: Educacion_FilaID_.extension\r\n                name: FilaExp.ID & \"_\" & \"Experiencia_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    ) \r\n);\r\n\r\n// ==========================================\r\n// \U0001F680 4. GUARDAR ARCHIVOS DE VACUNA\r\n// ==========================================\r\nForAll(\r\n    Filter(colVacunas, CountRows(Evidencia) > 0) As FilaVac,\r\n    ForAll(\r\n        FilaVac.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Vacuna\", \r\n            Text(FilaVac.ID),\r\n            {\r\n                // Nombre único: Educacion_FilaID_.extension\r\n                name: FilaVac.ID & \"_\" & \"Vacuna_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    ) \r\n);\r\n\r\n// ==========================================\r\n// \U0001F680 5. GUARDAR NUEVOS CERTIFICADOS EN EL CATÁLOGO\r\n// ==========================================\r\nForAll(\r\n    Filter(colCertificado, !IsBlank(Trim(NombreCertificado))) As CertItem,\r\n    With(\r\n        {\r\n            nombreLimpio: Upper(Trim(CertItem.NombreCertificado))\r\n        },\r\n        If(\r\n            IsBlank(LookUp(Catálogo_Certificados, NombreCertificado = nombreLimpio)),\r\n            Patch(\r\n                Catálogo_Certificados,\r\n                Defaults(Catálogo_Certificados),\r\n                {\r\n                    Title: nombreLimpio,\r\n                    NombreCertificado: nombreLimpio\r\n                }\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n// Recargar colección persistente para reflejar los cambios\r\nClearCollect(\r\n    colCertificadosPersistentes,\r\n    ShowColumns(Catálogo_Certificados, NombreCertificado)\r\n);\r\n\r\nNotify(\"¡Perfil guardado con éxito!\", NotificationType.Success);\r\nNavigate(ControlPerfiles);"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =15
                        Text: ="GUARDAR"
                        Visible: |-
                          =//locPasoActual = 9
                          true
                        Width: =120
                  - Pdf:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        Font: =Font.'Open Sans Condensed'
                        FontWeight: =FontWeight.Normal
                        Height: =Parent.Height * 0.8
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: "=Set(generandoPDF, true);\r\n\r\n// ====================================================================\r\n// \U0001F680 1. GUARDAR DATOS EN LA BASE DE DATOS (PATCH)\r\n// ====================================================================\r\nPatch(\r\n    PERFIL_USUARIO,\r\n    If(\r\n        IsBlank(LookUp(PERFIL_USUARIO, EKON = Ekon.Text)),\r\n        Defaults(PERFIL_USUARIO),\r\n        LookUp(PERFIL_USUARIO, EKON = Ekon.Text)\r\n    ),\r\n    {\r\n        EKON: Ekon.Text, \r\n        DatosGenerales: JSON(\r\n            {\r\n                NombreCompleto: NombreCompleto.Text,\r\n                Departamento: Departamento.Text,\r\n                Cedula: CedulaPersona.Text,\r\n                Area: Area.Text,\r\n                Seccion: Seccion.Text,\r\n                Cargo: Cargo.Text,\r\n                NivelOcupacional: Cargo_1.Text,\r\n                CIUO: Text(ciuo.Selected.Value.perNombre),\r\n\r\n                TieneLicencia: toggleLIC.Checked,\r\n                Compania: ctxPersonaSeleccionada.Empresa,\r\n                Nacionalidad: cmbNacionalidad.Selected.Value,\r\n                FechaNacimiento: ctxPersonaSeleccionada.'Fecha Nacimiento',\r\n                DireccionDomi: direccionDomi.Text,\r\n                NumeroCelular: ctxPersonaSeleccionada.Telefono,\r\n                Ekon: Ekon.Text,\r\n                \r\n                Licencia: If(toggleLIC.Checked, Concat(cmbLicencias.SelectedItems, Value, \"; \"), \"N/A\"),\r\n                FechaCadLic: If(toggleLIC.Checked, fechaCaducidadLic.SelectedDate, Blank()),\r\n                FechaEmisionLic: If(toggleLIC.Checked, fechaEmisionLic.SelectedDate, Blank()),\r\n                FechaRenoLic: If(toggleLIC.Checked, fechaRenoLic.SelectedDate, Blank()),\r\n                \r\n                Contacto: nombreContacto.Text,\r\n                Parentesco: cmbParentesco.Selected.Value,\r\n                NumeroContacto: numeroContacto.Text,\r\n                \r\n                Contacto2: nombreContacto_1.Text,\r\n                Parentesco2: cmbParentesco_1.Selected.Value,\r\n                NumeroContacto2: numeroContacto_1.Text,\r\n                \r\n                Enfermedades: enfermedades.Text,\r\n                Medicamentos: medicamentos.Text,\r\n                Alergias: Alergias.Text,\r\n                \r\n                Seguro: toggleSeguro.Checked,\r\n                GrupoPoliza: cmbGrupoPoliza.Selected.Value,\r\n                SeguroPrivado: SeguroPrivado.Text\r\n            },\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        EXAMENES_MEDICOS: JSON(\r\n            {\r\n                FechaExa: fechaExamenMed.SelectedDate,\r\n                Lugar: cmbProveedor.Selected.Value,\r\n                //NombreMedico: cmbMedicos.Selected.'Nombre Apellido';\r\n                NombreMedico: nombreMedico.Text,\r\n                CedulaMedico: cedulaMedico.Text,\r\n                Sangre: cmbTipoSangre.Selected.Value,\r\n                Alergias: Alergias.Text,\r\n                //Aptitud: actitudMedica.Text;\r\n                Aptitud: cmbActitudMedica.Selected.Value,\r\n                Restricciones: restriccion.Text,\r\n                FechaExaCad: fechaExamCad.SelectedDate,\r\n                Zona: cmbZona.Selected.Value,                \r\n                \r\n                // \U0001F525 AQUÍ GUARDAMOS EL CARRITO DE EXÁMENES SELECCIONADOS\r\n                ListaExamenes: colExamenesSeleccionados\r\n            },\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n\r\n        ),\r\n\r\n\r\n        EducacionJSON: JSON(\r\n            DropColumns(colEducacion, Evidencia, ArchivosHistoricos),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n        CertificadosJSON: JSON(\r\n            DropColumns(colCertificado, Evidencia, ArchivosHistoricos),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        CalificacionJSON: JSON(\r\n            DropColumns(colCalificacion, Evidencia, ArchivosHistoricos),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        ExperienciaJSON: JSON(\r\n            AddColumns(\r\n                RenameColumns(\r\n                    DropColumns(colExperiencia, Evidencia, ArchivosHistoricos),\r\n                    ID,\r\n                    ExpID\r\n                ),\r\n                ListaActividades, \r\n                Filter(colActividades, ExperienciaID = ExpID) \r\n            ),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n        VacunasJSON: JSON(\r\n            AddColumns(\r\n                RenameColumns(\r\n                    DropColumns(colVacunas, Evidencia, ArchivosHistoricos),\r\n                    ID,\r\n                    VacID\r\n                ),\r\n                ListaActividades, \r\n                Filter(colDosisVacunas, VacunaID = VacID) \r\n            ),\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        EmpleadoMes: JSON(\r\n            colEmpleadoMes,\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        ),\r\n\r\n        BuenasPracticas: JSON(\r\n            colBuenasPracticas,\r\n            JSONFormat.IgnoreUnsupportedTypes\r\n        )\r\n    }\r\n);\r\n\r\n// ====================================================================\r\n// \U0001F680 2. GUARDAR ARCHIVOS ADJUNTOS EN LA NUBE\r\n// ====================================================================\r\n// A. Educación\r\nForAll(\r\n    Filter(colEducacion, CountRows(Evidencia) > 0) As FilaEdu,\r\n    ForAll(\r\n        FilaEdu.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Educacion\", \r\n            Text(FilaEdu.ID), \r\n            {\r\n                name: FilaEdu.ID & \"_\" & \"Educacion_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    )\r\n);\r\n\r\n// B. Certificados\r\nForAll(\r\n    Filter(colCertificado, CountRows(Evidencia) > 0) As FilaCert,\r\n    ForAll(\r\n        FilaCert.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Certificados\", \r\n            Text(FilaCert.ID),\r\n            {\r\n                name: FilaCert.ID & \"_\" & \"Certificados_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    )\r\n);\r\n\r\n// C. Experiencia\r\nForAll(\r\n    Filter(colExperiencia, CountRows(Evidencia) > 0) As FilaExp,\r\n    ForAll(\r\n        FilaExp.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Experiencia\", \r\n            Text(FilaExp.ID),\r\n            {\r\n                name: FilaExp.ID & \"_\" & \"Experiencia_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    ) \r\n);\r\n\r\n// ==========================================\r\n// \U0001F680 2. GUARDAR ARCHIVOS DE CERTIFICADOS\r\n// ==========================================\r\nForAll(\r\n    Filter(colCalificacion, CountRows(Evidencia) > 0) As FilaCali,\r\n    ForAll(\r\n        FilaCali.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Calificacion\", \r\n            Text(FilaCali.ID),\r\n            {\r\n                // Nombre único: Educacion_FilaID_.extension\r\n                name: FilaCali.ID & \"_\" & \"Calificacion_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    )\r\n);\r\n\r\n// D. Vacunas\r\nForAll(\r\n    Filter(colVacunas, CountRows(Evidencia) > 0) As FilaVac,\r\n    ForAll(\r\n        FilaVac.Evidencia As Archivo,\r\n        ArchivosPerfilUsuario.Run(\r\n            Ekon.Text, \r\n            \"Vacuna\", \r\n            Text(FilaVac.ID),\r\n            {\r\n                name: FilaVac.ID & \"_\" & \"Vacuna_\" & NombreCompleto.Text & \".\" & Last(Split(Archivo.Name, \".\")).Value,\r\n                contentBytes: Archivo.Value \r\n            },\r\n            \"\"\r\n        )\r\n    ) \r\n);\r\n\r\n// ====================================================================\r\n// \U0001F680 3. PREPARACIÓN DE DATOS PARA EL PDF\r\n// ====================================================================\r\nUpdateContext({\r\n    varFotoBase64: Substitute(JSON(Image2.Image, JSONFormat.IncludeBinaryData), \"\"\"\", \"\")\r\n});\r\n\r\nClearCollect(\r\n    colEducacionLimpia,\r\n    DropColumns(colEducacion, Evidencia, ArchivosHistoricos)\r\n);\r\n\r\nClearCollect(\r\n    colCertificadosLimpios,\r\n    DropColumns(colCertificado, Evidencia, ArchivosHistoricos)\r\n);\r\n\r\nClearCollect(\r\n    colExperienciaLimpia,\r\n    AddColumns(\r\n        RenameColumns(\r\n            DropColumns(colExperiencia, Evidencia, ArchivosHistoricos),\r\n            ID,\r\n            ExpID\r\n        ),\r\n        ListaActividades, \r\n        Filter(colActividades, ExperienciaID = ExpID) \r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colVacunasLimpias,\r\n    AddColumns(\r\n        RenameColumns(\r\n            DropColumns(colVacunas, Evidencia, ArchivosHistoricos),\r\n            ID,\r\n            VacID\r\n        ),\r\n        ListaDosis, \r\n        Filter(colDosisVacunas, VacunaID = VacID) \r\n    )\r\n);\r\n\r\n// ====================================================================\r\n// \U0001F680 4. ARMANDO EL JSON FINAL PARA EL SERVIDOR PYTHON\r\n// ====================================================================\r\nUpdateContext({\r\n    jsonParaServidorPDF: JSON(\r\n        {\r\n            template_name: \"PASAPORTE_SEGURIDAD_V4_AJUSTADO_V9_BP_LOOP_PIE_ABAJO_CENTRADO\", \r\n            data: {\r\n                NombreArchivoPDF: \"Perfil_\" & Ekon.Text & \"_\" & Substitute(NombreCompleto.Text, \" \", \"_\") & \".pdf\",\r\n                DT: {\r\n                    FotoPerfil: varFotoBase64,\r\n                    Compania: ctxPersonaSeleccionada.Empresa,\r\n                    NombreCompleto: NombreCompleto.Text,\r\n                    Cedula: CedulaPersona.Text,\r\n                    Nacionalidad: cmbNacionalidad.Selected.Value,\r\n                    FechaNacimiento: ctxPersonaSeleccionada.'Fecha Nacimiento',\r\n                    DireccionDomi: direccionDomi.Text,\r\n                    NumeroCelular: ctxPersonaSeleccionada.Telefono,\r\n                    Ekon: Ekon.Text,\r\n                    Cargo: Cargo.Text,\r\n                    Area: ctxPersonaSeleccionada.'Area Gestión',\r\n                    Licencia: If(toggleLIC.Checked, Concat(cmbLicencias.SelectedItems, Value, \"; \"), \"N/A\"),\r\n\r\n                    FechaCadLic: If(toggleLIC.Checked, fechaCaducidadLic.SelectedDate, Blank()),\r\n                    FechaEmisionLic: If(toggleLIC.Checked, fechaEmisionLic.SelectedDate, Blank()),\r\n                    FechaRenLic: If(toggleLIC.Checked, fechaRenoLic.SelectedDate, Blank()),\r\n\r\n                    Contacto: nombreContacto.Text,\r\n                    Parentesco: cmbParentesco.Selected.Value,\r\n                    NumeroContacto: numeroContacto.Text,\r\n                    \r\n                    Contacto2: nombreContacto_1.Text,\r\n                    Parentesco2: cmbParentesco_1.Selected.Value,\r\n                    NumeroContacto2: numeroContacto_1.Text,\r\n                    \r\n                    \r\n                    Enfermedades: enfermedades.Text,\r\n                    Medicamentos: medicamentos.Text,\r\n                    Alergias: Alergias.Text,\r\n                    SeguroPrivado: SeguroPrivado.Text,\r\n\r\n                    FechaExa: fechaExamenMed.SelectedDate,\r\n                    Lugar: cmbProveedor.Selected.Value,\r\n                    //NombreMedico: cmbMedicos.Selected.'Nombre Apellido';\r\n                    NombreMedico: nombreMedico.Text,\r\n                    CedulaMedico: cedulaMedico.Text,\r\n                    Sangre: cmbTipoSangre.Selected.Value,\r\n                    //Alergias: Alergias.Text;\r\n                    //Aptitud: actitudMedica.Text;\r\n                    Aptitud: cmbActitudMedica.Selected.Value,\r\n                    Restricciones: restriccion.Text,\r\n                    FechaExaCad: fechaExamCad.SelectedDate\r\n                },\r\n                /*VA: With(\r\n                    {\r\n                        // 1. Buscamos la fila entera de cada vacuna en la colección\r\n                        vHepA: LookUp(colVacunasLimpias; NombreVacuna = \"HEPATITIS A\");\r\n                        vHepB: LookUp(colVacunasLimpias; NombreVacuna = \"HEPATITIS B\");\r\n                        vTetanos: LookUp(colVacunasLimpias; NombreVacuna = \"TETANOS\");\r\n                        vFiebre: LookUp(colVacunasLimpias; NombreVacuna = \"FIEBRE AMARILLA\");\r\n                        vTifoidea: LookUp(colVacunasLimpias; NombreVacuna = \"TIFOIDEA\");\r\n                        vCovid: LookUp(colVacunasLimpias; NombreVacuna = \"COVID\")\r\n                    };\r\n                    {\r\n                        // 2. Extraemos las fechas exactas para el Word\r\n                        // HEPATITIS A\r\n                        HA1: vHepA.FechaPrimeraDosis;\r\n                        HA2: LookUp(vHepA.ListaDosis; NumeroDosis = \"Dosis 2\").FechaReal;\r\n                        HA3: LookUp(vHepA.ListaDosis; NumeroDosis = \"Dosis 3\").FechaReal;\r\n                        HA4: LookUp(vHepA.ListaDosis; NumeroDosis = \"Refuerzo 1\").FechaReal;\r\n                        HA5: LookUp(vHepA.ListaDosis; NumeroDosis = \"Refuerzo 2\").FechaReal;\r\n\r\n                        // HEPATITIS B\r\n                        HB1: vHepB.FechaPrimeraDosis;\r\n                        HB2: LookUp(vHepB.ListaDosis; NumeroDosis = \"Dosis 2\").FechaReal;\r\n                        HB3: LookUp(vHepB.ListaDosis; NumeroDosis = \"Dosis 3\").FechaReal;\r\n                        HB4: LookUp(vHepB.ListaDosis; NumeroDosis = \"Refuerzo 1\").FechaReal;\r\n                        HB5: LookUp(vHepB.ListaDosis; NumeroDosis = \"Refuerzo 2\").FechaReal;\r\n\r\n                        // TÉTANOS\r\n                        T1: vTetanos.FechaPrimeraDosis;\r\n                        T2: LookUp(vTetanos.ListaDosis; NumeroDosis = \"Dosis 2\").FechaReal;\r\n                        T3: LookUp(vTetanos.ListaDosis; NumeroDosis = \"Dosis 3\").FechaReal;\r\n                        T4: LookUp(vTetanos.ListaDosis; NumeroDosis = \"Dosis 4\").FechaReal;\r\n                        T5: LookUp(vTetanos.ListaDosis; NumeroDosis = \"Dosis 5\").FechaReal;\r\n\r\n                        // FIEBRE AMARILLA\r\n                        F1: vFiebre.FechaPrimeraDosis;\r\n                        //F2: LookUp(vFiebre.ListaDosis; NumeroDosis = \"Dosis 2\").FechaReal;\r\n                        //F3: LookUp(vFiebre.ListaDosis; NumeroDosis = \"Dosis 3\").FechaReal;\r\n                        //F4: LookUp(vFiebre.ListaDosis; NumeroDosis = \"Dosis 4\").FechaReal;\r\n                        //F5: LookUp(vFiebre.ListaDosis; NumeroDosis = \"Dosis 5\").FechaReal;\r\n\r\n                        // TIFOIDEA\r\n                        TF1: vTifoidea.FechaPrimeraDosis;\r\n                        TF2: LookUp(vTifoidea.ListaDosis; NumeroDosis = \"Refuerzo 1\").FechaReal;\r\n                        TF3: LookUp(vTifoidea.ListaDosis; NumeroDosis = \"Refuerzo 2\").FechaReal;\r\n                        TF4: LookUp(vTifoidea.ListaDosis; NumeroDosis = \"Refuerzo 3\").FechaReal;\r\n                        TF5: LookUp(vTifoidea.ListaDosis; NumeroDosis = \"Refuerzo 4\").FechaReal;\r\n\r\n                        // COVID-19 (Ojo: En tu JSON vi que a veces la Dosis 1 no está en FechaPrimeraDosis sino en la lista)\r\n                        C1: Coalesce(vCovid.FechaPrimeraDosis; LookUp(vCovid.ListaDosis; NumeroDosis = \"Dosis 1\").FechaReal);\r\n                        C2: LookUp(vCovid.ListaDosis; NumeroDosis = \"Dosis 2\").FechaReal;\r\n                        C3: LookUp(vCovid.ListaDosis; NumeroDosis = \"Dosis 3\").FechaReal;\r\n                        C4: LookUp(vCovid.ListaDosis; NumeroDosis = \"Dosis 4\").FechaReal;\r\n                        C5: LookUp(vCovid.ListaDosis; NumeroDosis = \"Dosis 5\").FechaReal\r\n                    }\r\n                );\r\n                */\r\n\r\n                VA: With(\r\n                    {\r\n                        // 1. Buscamos la fila entera de cada vacuna en la colección\r\n                        vFiebre: LookUp(colVacunasLimpias, NombreVacuna = \"FIEBRE AMARILLA\"),\r\n                        vHepA: LookUp(colVacunasLimpias, NombreVacuna = \"HEPATITIS A\"),\r\n                        vHepB: LookUp(colVacunasLimpias, NombreVacuna = \"HEPATITIS B\"),\r\n                        vHepAB: LookUp(colVacunasLimpias, NombreVacuna = \"HEPATITIS A Y B (COMBINADA)\"),\r\n                        vTifoidea: LookUp(colVacunasLimpias, NombreVacuna = \"TIFOIDEA\"),\r\n                        vDT: LookUp(colVacunasLimpias, NombreVacuna = \"DIFTERIA Y TETANOS\"),\r\n                        vTetanos: LookUp(colVacunasLimpias, NombreVacuna = \"TETANOS\"),\r\n                        vCovid: LookUp(colVacunasLimpias, NombreVacuna = \"COVID\"),\r\n                        vInfluenza: LookUp(colVacunasLimpias, NombreVacuna = \"INFLUENZA\"),\r\n                        vSR: LookUp(colVacunasLimpias, NombreVacuna = \"SARAMPION-RUBEOLA\")\r\n                    },\r\n                    {\r\n                        // FIEBRE AMARILLA — 1 sola dosis\r\n                        F1: vFiebre.FechaPrimeraDosis,\r\n\r\n                        // HEPATITIS A\r\n                        HA1: vHepA.FechaPrimeraDosis,\r\n                        HA2: LookUp(vHepA.ListaDosis, NumeroDosis = \"Dosis 2\").FechaReal,\r\n                        HA3: LookUp(vHepA.ListaDosis, NumeroDosis = \"Dosis 3\").FechaReal,\r\n                        HA4: LookUp(vHepA.ListaDosis, NumeroDosis = \"Refuerzo 1\").FechaReal,\r\n                        HA5: LookUp(vHepA.ListaDosis, NumeroDosis = \"Refuerzo 2\").FechaReal,\r\n\r\n                        // HEPATITIS B\r\n                        HB1: vHepB.FechaPrimeraDosis,\r\n                        HB2: LookUp(vHepB.ListaDosis, NumeroDosis = \"Dosis 2\").FechaReal,\r\n                        HB3: LookUp(vHepB.ListaDosis, NumeroDosis = \"Dosis 3\").FechaReal,\r\n                        HB4: LookUp(vHepB.ListaDosis, NumeroDosis = \"Refuerzo 1\").FechaReal,\r\n                        HB5: LookUp(vHepB.ListaDosis, NumeroDosis = \"Refuerzo 2\").FechaReal,\r\n\r\n                        // HEPATITIS A Y B (COMBINADA) — nueva\r\n                        HAB1: vHepAB.FechaPrimeraDosis,\r\n                        HAB2: LookUp(vHepAB.ListaDosis, NumeroDosis = \"Dosis 2\").FechaReal,\r\n                        HAB3: LookUp(vHepAB.ListaDosis, NumeroDosis = \"Dosis 3\").FechaReal,\r\n                        HAB4: LookUp(vHepAB.ListaDosis, NumeroDosis = \"Dosis 4\").FechaReal,\r\n                        HAB5: LookUp(vHepAB.ListaDosis, NumeroDosis = \"Dosis 5\").FechaReal,\r\n\r\n                        // TIFOIDEA\r\n                        TF1: vTifoidea.FechaPrimeraDosis,\r\n                        TF2: LookUp(vTifoidea.ListaDosis, NumeroDosis = \"Refuerzo 1\").FechaReal,\r\n                        TF3: LookUp(vTifoidea.ListaDosis, NumeroDosis = \"Refuerzo 2\").FechaReal,\r\n                        TF4: LookUp(vTifoidea.ListaDosis, NumeroDosis = \"Refuerzo 3\").FechaReal,\r\n                        TF5: LookUp(vTifoidea.ListaDosis, NumeroDosis = \"Refuerzo 4\").FechaReal,\r\n\r\n                        // DIFTERIA Y TETANOS — nueva\r\n                        DT1: vDT.FechaPrimeraDosis,\r\n                        DT2: LookUp(vDT.ListaDosis, NumeroDosis = \"Dosis 2\").FechaReal,\r\n                        DT3: LookUp(vDT.ListaDosis, NumeroDosis = \"Dosis 3\").FechaReal,\r\n                        DT4: LookUp(vDT.ListaDosis, NumeroDosis = \"Dosis 4\").FechaReal,\r\n                        DT5: LookUp(vDT.ListaDosis, NumeroDosis = \"Dosis 5\").FechaReal,\r\n\r\n                        // TÉTANOS\r\n                        T1: vTetanos.FechaPrimeraDosis,\r\n                        T2: LookUp(vTetanos.ListaDosis, NumeroDosis = \"Dosis 2\").FechaReal,\r\n                        T3: LookUp(vTetanos.ListaDosis, NumeroDosis = \"Dosis 3\").FechaReal,\r\n                        T4: LookUp(vTetanos.ListaDosis, NumeroDosis = \"Dosis 4\").FechaReal,\r\n                        T5: LookUp(vTetanos.ListaDosis, NumeroDosis = \"Dosis 5\").FechaReal,\r\n\r\n                        // COVID-19 (a veces la Dosis 1 no está en FechaPrimeraDosis sino en la lista)\r\n                        C1: Coalesce(vCovid.FechaPrimeraDosis, LookUp(vCovid.ListaDosis, NumeroDosis = \"Dosis 1\").FechaReal),\r\n                        C2: LookUp(vCovid.ListaDosis, NumeroDosis = \"Dosis 2\").FechaReal,\r\n                        C3: LookUp(vCovid.ListaDosis, NumeroDosis = \"Dosis 3\").FechaReal,\r\n                        C4: LookUp(vCovid.ListaDosis, NumeroDosis = \"Dosis 4\").FechaReal,\r\n                        C5: LookUp(vCovid.ListaDosis, NumeroDosis = \"Dosis 5\").FechaReal,\r\n\r\n                        // INFLUENZA — estacional, 1 sola dosis: se manda la del año en curso.\r\n                        // Revisa primero si FechaPrimeraDosis ya es del año actual; si no,\r\n                        // busca en ListaDosis una fecha cuyo año coincida con el actual.\r\n                        INF1: Coalesce(\r\n                            If(Year(vInfluenza.FechaPrimeraDosis) = Year(Today()), vInfluenza.FechaPrimeraDosis),\r\n                            LookUp(vInfluenza.ListaDosis, Year(FechaReal) = Year(Today())).FechaReal\r\n                        ),\r\n\r\n                        // SARAMPIÓN-RUBÉOLA — solo 2 dosis\r\n                        SR1: vSR.FechaPrimeraDosis,\r\n                        SR2: LookUp(vSR.ListaDosis, NumeroDosis = \"Dosis 2\").FechaReal\r\n                    }\r\n                ),\r\n\r\n                // \U0001F447 AQUÍ AGREGAMOS LAS NUEVAS LISTAS PARA LOS CUADROS DINÁMICOS\r\n                EmpleadoMes: colEmpleadoMes,\r\n                BuenasPracticas: colBuenasPracticas,\r\n                Competencias: colCertificado\r\n            }\r\n        },\r\n        JSONFormat.IgnoreUnsupportedTypes\r\n    )\r\n});\r\n\r\n// ====================================================================\r\n// \U0001F680 5. DISPARAMOS EL FLUJO DE AUTOMATE (GENERAR PASAPORTE)\r\n// ====================================================================\r\nArchivosPerfilUsuario.Run(\r\n    Ekon.Text,\r\n    jsonParaServidorPDF, \r\n    User().Email, \r\n    {name: \"dummy.txt\", contentBytes: \"x\"}, \r\n    \"PASAPORTE\"\r\n);\r\n\r\n// ====================================================================\r\n// \U0001F680 6. FINALIZAR PROCESO\r\n// ====================================================================\r\nNotify(\"¡Perfil guardado y Pasaporte solicitado con éxito!\", NotificationType.Success);\r\nSet(generandoPDF, false);\r\nNavigate(ControlPerfiles);"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =15
                        Text: ="PDF"
                        Visible: =locPasoActual = 9
                        Width: =120
