                                                                  Categoria: Hijo.Categoria, 
                                                                  Nombre: Hijo.Nombre, 
                                                                  Precio: Hijo.Precio, 
                                                                  Padre: Hijo.Padre
                                                              }
                                                          )
                                                      )
                                                  )
                                                OnUncheck: |-
                                                  =// 1. Quitar el elemento actual
                                                  RemoveIf(colExamenesSeleccionados, Nombre = ThisItem.Nombre);

                                                  // 2. Quitar a todos sus hijos
                                                  RemoveIf(colExamenesSeleccionados, Padre = ThisItem.Nombre)
