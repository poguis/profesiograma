                                                  )
                                          - Toggle1:
                                              Control: Toggle@1.1.5
                                              Properties:
                                                Checked: =!IsBlank(LookUp(colExamenesSeleccionados, Nombre = ThisItem.Nombre))
                                                DisplayMode: |-
                                                  =If(
                                                      IsBlank(ThisItem.Padre),
                                                      DisplayMode.Edit,     // Si es Padre: Se puede interactuar libremente
                                                      DisplayMode.Disabled  // Si es Hijo: Está bloqueado (solo el padre lo controla)
                                                  )
                                                FillPortions: =1
                                                Label: |-
                                                  =//If(!IsBlank(LookUp(colExamenesSeleccionados;Nombre=ThisItem.Nombre));"✅ Seleccionado"&If(ThisItem.Precio>0;" ($"&Text(ThisItem.Precio;"#;##0.00")&")";"");"")

                                                  With(
                                                      { locExamenGuardado: LookUp(colExamenesSeleccionados, Nombre = ThisItem.Nombre) },
                                                      If(
                                                          !IsBlank(locExamenGuardado.Nombre),
                                                          "✅ Seleccionado" & If(
                                                              locExamenGuardado.Precio > 0, 
                                                              " ($" & Text(locExamenGuardado.Precio, "#;##0.00") & ")", 
                                                              ""
                                                          ),
                                                          ""
                                                      )
                                                  )
                                                LabelPosition: ='Toggle.LabelPosition'.After
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =0
                                                OnCheck: |-
                                                  =// 1. Agrega el elemento actual
                                                  If(
                                                      IsBlank(LookUp(colExamenesSeleccionados, Nombre = ThisItem.Nombre)),
                                                      Collect(
                                                          colExamenesSeleccionados, 
                                                          {
                                                              Categoria: ThisItem.Categoria, 
                                                              Nombre: ThisItem.Nombre, 
                                                              Precio: ThisItem.Precio, 
                                                              Padre: ThisItem.Padre
                                                          }
                                                      )
                                                  );

                                                  // 2. Si es Padre, agrega a TODOS sus hijos automáticamente
                                                  ForAll(
                                                      Filter(colExamenesDisponibles, Padre = ThisItem.Nombre) As Hijo,
                                                      If(
                                                          IsBlank(LookUp(colExamenesSeleccionados, Nombre = Hijo.Nombre)),
                                                          Collect(
