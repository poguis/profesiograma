                                                - MarcaVacuna:
                                                    Control: ModernCombobox@1.1.2
                                                    Properties:
                                                      DefaultSelectedItems: =If(IsBlank(ThisItem.MarcaCovid), Blank(), [ThisItem.MarcaCovid])
                                                      FillPortions: =0.5
