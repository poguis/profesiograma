                                                        =If(
                                                            NombreVacuna.Selected.Value = "COVID",
                                                            true,
                                                            false
                                                        )
                                                - FechaTentativa:
                                                    Control: ModernDatePicker@1.0.2
                                                    Properties:
                                                      DefaultDate: =ThisItem.FechaTentativa
                                                      DisplayMode: =DisplayMode.View
                                                      FillPortions: =0.5
                                                      Font: =Font.'Open Sans Condensed'
                                                      Format: =DatePickerFormat.Short
                                                      Height: =Parent.Height * 0.8
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnChange: |-
                                                        =Patch(
                                                            colDosisVacunas, 
                                                            LookUp(colDosisVacunas, ID = ThisItem.ID), 
                                                            {FechaTentativa: Self.SelectedDate}
                                                        )
                                                      Placeholder: ="Select a date"
                                                      RadiusBottomLeft: =20
                                                      RadiusBottomRight: =20
                                                      RadiusTopLeft: =20
                                                      RadiusTopRight: =20
                                                      Size: =15
                                                      Visible: |-
                                                        =If(
                                                            NombreVacuna.Selected.Value = "COVID" || NombreVacuna.Selected.Value = "INFLUENZA",
                                                            false,
                                                            true
                                                        )
                                                      X: =40
                                                      Y: =40
                                                - FechaReal:
                                                    Control: ModernDatePicker@1.0.2
                                                    Properties:
                                                      DefaultDate: =ThisItem.FechaReal
                                                      FillPortions: =0.5
                                                      Font: =Font.'Open Sans Condensed'
                                                      Format: =DatePickerFormat.Short
                                                      Height: =Parent.Height * 0.8
                                                      IsEditable: =true
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnChange: "=/*\nPatch(\n    colDosisVacunas; \n    LookUp(colDosisVacunas; ID = ThisItem.ID); \n    {FechaReal: Self.SelectedDate}\n)\n*/\n\n\n/*\n// 1. Guardar la fecha real aplicada en la hija actual\nPatch(colDosisVacunas; LookUp(colDosisVacunas; ID = ThisItem.ID); {FechaReal: Self.SelectedDate});;\n\nWith(\n    { \n        VacPadre: LookUp(colVacunas; ID = ThisItem.VacunaID);\n        DosisActual: ThisItem.NumeroDosis\n    };\n    \n    With(\n        {\n            // ⚙️ MOTOR DE REGLAS: ¿Qué dosis sigue y cuánto tiempo suma desde HOY (Fecha Real)?\n            SiguienteDosis: Switch(DosisActual; \"Dosis 2\"; \"Dosis 3\"; \"Dosis 3\"; \"Dosis 4\"; \"Dosis 4\"; \"Dosis 5\"; \"\");\n            \n            MesesASumar: Switch(\n                VacPadre.NombreVacuna;\n                \n                \"HEPATITIS A\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                \"HEPATITIS B\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                \"HEPATITIS A Y B (COMBINADA)\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                \n                \"DIFTERIA Y TETANOS\"; Switch(\n                    DosisActual;\n                    \"Dosis 2\"; 6;  // Dosis 3 a los 4 meses de la 2\n                    \"Dosis 3\"; 12; // Dosis 4 al año (12 meses) de la 3\n                    \"Dosis 4\"; 12; // Dosis 5 al año (12 meses) de la 4\n                    0\n                );\n                 \"TETANOS\"; Switch(\n                    DosisActual;\n                    \"Dosis 2\"; 6;  // Dosis 3 a los 4 meses de la 2\n                    \"Dosis 3\"; 12; // Dosis 4 al año (12 meses) de la 3\n                    \"Dosis 4\"; 12; // Dosis 5 al año (12 meses) de la 4\n                    0\n                );\n                \n                //\"COVID\"; Switch(DosisActual; \"Dosis 2\"; 5; 0);\n                0\n            )\n        };\n        \n        // 3. Crear la siguiente dosis solo si la regla dicta que hay meses que sumar\n        If(\n            MesesASumar > 0 And (VacPadre.TipoVacuna = \"5 DOSIS\" Or SiguienteDosis = \"Dosis 3\");\n            \n            If(\n                IsEmpty(Filter(colDosisVacunas; VacunaID = VacPadre.ID And NumeroDosis = SiguienteDosis));\n                Collect(\n                    colDosisVacunas;\n                    {\n                        ID: Max(colDosisVacunas; ID) + 1;\n                        VacunaID: VacPadre.ID;\n                        NumeroDosis: SiguienteDosis;\n                        FechaTentativa: DateAdd(Self.SelectedDate; MesesASumar; TimeUnit.Months);\n                        FechaReal: Blank();\n                        Observacion: \"\";\n                        MarcaCovid: \"\"\n                    }\n                )\n            )\n        )\n    )\n)\n*/\n\n\n\n\n\n\n/*\n// 1. Guardar la fecha real aplicada en la hija actual de forma directa\nPatch(colDosisVacunas; ThisItem; {FechaReal: Self.SelectedDate});;\n\n// 2. Motor de reglas para calcular la siguiente dosis\nWith(\n    { \n        // Aseguramos la búsqueda correcta del registro padre en colVacunas\n        VacPadre: LookUp(colVacunas; ID = ThisItem.VacunaID);\n        DosisActual: ThisItem.NumeroDosis\n    };\n    \n    With(\n        {\n            SiguienteDosis: Switch(\n                DosisActual; \n                \"Dosis 2\"; \"Dosis 3\"; \n                \"Dosis 3\"; \"Dosis 4\"; \n                \"Dosis 4\"; \"Dosis 5\"; \n                \"\"\n            );\n            \n            MesesASumar: Switch(\n                VacPadre.NombreVacuna;\n                \n                \"HEPATITIS A\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                \"HEPATITIS B\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                \"HEPATITIS A Y B (COMBINADA)\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                \n                \"DIFTERIA Y TETANOS\"; Switch(\n                    DosisActual;\n                    \"Dosis 2\"; 6; \n                    \"Dosis 3\"; 12; \n                    \"Dosis 4\"; 12; \n                    0\n                );\n                \"TETANOS\"; Switch(\n                    DosisActual;\n                    \"Dosis 2\"; 6; \n                    \"Dosis 3\"; 12; \n                    \"Dosis 4\"; 12; \n                    0\n                );\n                \n                0\n            )\n        };\n        \n        // 3. Crear la siguiente dosis validando correctamente el tipo de esquema del padre\n        If(\n            MesesASumar > 0 And (Text(VacPadre.TipoVacuna) = \"5 DOSIS\" Or SiguienteDosis = \"Dosis 3\");\n            If(\n                IsEmpty(Filter(colDosisVacunas; VacunaID = VacPadre.ID And NumeroDosis = SiguienteDosis));\n                Collect(\n                    colDosisVacunas;\n                    {\n                        ID: If(IsEmpty(colDosisVacunas); 1; Max(colDosisVacunas; ID) + 1);\n                        VacunaID: VacPadre.ID;\n                        NumeroDosis: SiguienteDosis;\n                        FechaTentativa: DateAdd(Self.SelectedDate; MesesASumar; TimeUnit.Months);\n                        FechaReal: Blank();\n                        Observacion: \"\";\n                        MarcaCovid: \"\"\n                    }\n                )\n            )\n        )\n    )\n)\n*/\n\n\n\n// 1. Guardar la fecha real aplicada en la hija actual de forma directa\nPatch(colDosisVacunas, ThisItem, {FechaReal: Self.SelectedDate});\n\n// 2. Motor de reglas para calcular la siguiente dosis\nWith(\n    { \n        // Aseguramos la búsqueda correcta del registro padre en colVacunas\n        VacPadre: LookUp(colVacunas, ID = ThisItem.VacunaID),\n        DosisActual: ThisItem.NumeroDosis\n    },\n    \n    With(\n        {\n            SiguienteDosis: Switch(\n                DosisActual, \n                \"Dosis 2\", \"Dosis 3\", \n                \"Dosis 3\", \"Dosis 4\", \n                \"Dosis 4\", \"Dosis 5\", \n                \"\"\n            ),\n            \n            MesesASumar: Switch(\n                VacPadre.NombreVacuna,\n                \"HEPATITIS A\", Switch(\n                    DosisActual,\n                    \"Dosis 2\", 6, \n                    \"Dosis 3\", 6, \n                    0\n                ), \n                \"HEPATITIS B\", Switch(\n                    DosisActual,\n                    \"Dosis 2\", 6, \n                    \"Dosis 3\", 6, \n                    0\n                ), \n                \"HEPATITIS A Y B (COMBINADA)\", Switch(\n                    DosisActual,\n                    \"Dosis 2\", 6, \n                    \"Dosis 3\", 6, \n                    0\n                ), \n                //\"HEPATITIS B\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                //\"HEPATITIS A Y B (COMBINADA)\"; Switch(DosisActual; \"Dosis 2\"; 6; 0); \n                \"DIFTERIA Y TETANOS\", Switch(\n                    DosisActual,\n                    \"Dosis 2\", 6, \n                    \"Dosis 3\", 12, \n                    \"Dosis 4\", 12, \n                    0\n                ),\n                \"TETANOS\", Switch(\n                    DosisActual,\n                    \"Dosis 2\", 6, \n                    \"Dosis 3\", 12, \n                    \"Dosis 4\", 12, \n                    0\n                ),\n                0\n            )\n        },\n        \n        // 3. Crear o ACTUALIZAR la siguiente dosis\n        If(\n            MesesASumar > 0 And (Text(VacPadre.TipoVacuna) = \"5 DOSIS\" Or SiguienteDosis = \"Dosis 3\"),\n            \n            If(\n                // Si la siguiente dosis NO existe; la creamos (Tu código original)\n                IsEmpty(Filter(colDosisVacunas, VacunaID = VacPadre.ID And NumeroDosis = SiguienteDosis)),\n                Collect(\n                    colDosisVacunas,\n                    {\n                        ID: If(IsEmpty(colDosisVacunas), 1, Max(colDosisVacunas, ID) + 1),\n                        VacunaID: VacPadre.ID,\n                        NumeroDosis: SiguienteDosis,\n                        FechaTentativa: DateAdd(Self.SelectedDate, MesesASumar, TimeUnit.Months),\n                        FechaReal: Blank(),\n                        Observacion: \"\",\n                        MarcaCovid: \"\",\n                        Establecimiento: \"\",\n                        Lote: \"\",\n                        ResponsableVacuna: \"\"\n\n                    }\n                ),\n                \n                // \U0001F525 LA MAGIA: Si YA existe (porque el usuario corrigió una fecha mal ingresada); recalculamos su fecha tentativa\n                Patch(\n                    colDosisVacunas,\n                    LookUp(colDosisVacunas, VacunaID = VacPadre.ID And NumeroDosis = SiguienteDosis),\n                    { FechaTentativa: DateAdd(Self.SelectedDate, MesesASumar, TimeUnit.Months) }\n                )\n            )\n        )\n    )\n)"
                                                      Placeholder: ="Select a date"
                                                      RadiusBottomLeft: =20
                                                      RadiusBottomRight: =20
                                                      RadiusTopLeft: =20
                                                      RadiusTopRight: =20
                                                      Size: =15
                                                      StartDate: "=/*\r\nIf(\r\n    // 1. Si NO hay fecha tentativa (Ejemplo: COVID; que es libre)\r\n    IsBlank(ThisItem.FechaTentativa);\r\n    Date(1900; 1; 1); // Dejamos el calendario totalmente abierto hacia el pasado\r\n    \r\n    // 2. Si SÍ hay fecha tentativa (Ej: 1 mes después para Tétanos)\r\n    ThisItem.FechaTentativa // Bloquea estrictamente cualquier día antes de esta fecha\r\n)\r\n*/\r\n\r\n/*\r\nIf(\r\n    // 1. Si NO hay fecha tentativa (Ejemplo: COVID; que es libre)\r\n    IsBlank(ThisItem.FechaTentativa);\r\n    Date(1900; 1; 1); // Dejamos el calendario totalmente abierto hacia el pasado\r\n    \r\n    // 2. Si SÍ hay fecha tentativa, habilitamos desde 1 mes antes\r\n    DateAdd(ThisItem.FechaTentativa; -1; TimeUnit.Months)\r\n)\r\n*/"
                                                      X: =40
                                                      Y: =40
                                                - numeroLote:
                                                    Control: ModernTextInput@1.1.2
                                                    Properties:
                                                      Default: =ThisItem.Lote
                                                      FillPortions: =0.6
                                                      Font: =Font.'Open Sans Condensed'
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnChange: |-
                                                        =Patch(
                                                            colDosisVacunas, 
                                                            LookUp(colDosisVacunas, ID = ThisItem.ID), 
                                                            {Lote: Self.Text}
                                                        )
