                                      segundo_nombre: textSegundoNombre.Text,
                                      sexo: locSeccionA.Sexo,
                                      cargo: locSeccionA.Cargo
                                  },
                                  vacunas: ForAll(
                                      colVacunas As Vac,
                                      {
                                          NombreVacuna: Vac.NombreVacuna,
                                          TipoVacuna: Vac.TipoVacuna,
                                          FechaPrimeraDosis: If(IsBlank(Vac.FechaPrimeraDosis), "", Text(Vac.FechaPrimeraDosis, "yyyy-mm-dd")),
                                          lote1: Vac.lote1,
                                          Responsable1: Vac.Responsable1,
                                          Establecimiento1: Vac.Establecimiento1,
                                          Observacion1: Vac.Observacion1,
                                          ListaActividades: ForAll(
                                              Filter(colDosisVacunas, VacunaID = Vac.ID),
