                                    DisabledBorderColor: =RGBA(161, 159, 157, 1)
                                    FillPortions: =1
                                    Font: =Font.'Open Sans Condensed'
                                    Height: =Parent.Height
                                    HtmlText: "=\"<div style='\r\n    font-family: Segoe UI, sans-serif;\r\n    background: #ffffff;\r\n    border: 1px solid #e2e8f0;\r\n    border-radius: 6px;\r\n    padding: 6px 10px;\r\n    display: flex;\r\n    flex-direction: row;\r\n    gap: 10px;\r\n    align-items: stretch;\r\n    height: 100%;\r\n    box-sizing: border-box;\r\n    font-size: 10px;\r\n    color: #334155;\r\n    line-height: 1.2;\r\n'>\r\n\r\n    <!-- COLUMNA 1: CATEGORÍA Y DATOS PRINCIPALES -->\r\n    <div style='flex: 1.1; min-width: 140px; border-right: 1px solid #f1f5f9; padding-right: 8px; display: flex; flex-direction: column; justify-content: center;'>\r\n        <div>\r\n            <span style='\r\n                background: #be123c;\r\n                color: #ffffff;\r\n                padding: 1px 5px;\r\n                border-radius: 8px;\r\n                font-size: 8.5px;\r\n                font-weight: 700;\r\n                text-transform: uppercase;\r\n                display: inline-block;\r\n                margin-bottom: 2px;\r\n            '>\" & ThisItem.Categoria & \"</span>\r\n        </div>\r\n        \r\n        <!-- CÓDIGO DESTACADO CON ESTILO DE ARTÍCULO -->\r\n        <div style='font-size: 12px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'>Cód: \" & ThisItem.Codigo & \"</div>\r\n        \r\n        <div style='font-size: 9.5px; color: #475569; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'>\r\n            <b>Detalle:</b> \" & ThisItem.Detalle & \"\r\n        </div>\r\n        <div style='font-size: 9.5px; color: #475569;'>\r\n            <b>Talla:</b> \" & ThisItem.Talla & \"\r\n        </div>\r\n    </div>\r\n\r\n    <!-- COLUMNA 2: DETALLES Y LOGÍSTICA -->\r\n    <div style='flex: 1.3; min-width: 170px; border-right: 1px solid #f1f5f9; padding-right: 8px; display: flex; flex-direction: column; justify-content: center; gap: 2px;'>\r\n        <div style='white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'><b>Área:</b> \" & ThisItem.Area & \"</div>\r\n        <div style='white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'><b>Procesos:</b> \" & ThisItem.Procesos & \"</div>\r\n        <div style='white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'><b>Cargo:</b> \" & ThisItem.Cargo & \"</div>\r\n        \r\n        <div style='display: flex; gap: 4px; margin-top: 2px;'>\r\n            <span style='background: #f1f5f9; color: #334155; padding: 1px 4px; border-radius: 3px; font-size: 8.5px; font-weight: 600;'>\r\n                Inicio: \" & ThisItem.FechaInicio & \"\r\n            </span>\r\n            <span style='background: #e0f2fe; color: #0369a1; padding: 1px 4px; border-radius: 3px; font-size: 8.5px; font-weight: 600;'>\r\n                Vida: \" & ThisItem.VidaUtil & \"\r\n            </span>\r\n            <span style='background: #fef3c7; color: #b45309; padding: 1px 4px; border-radius: 3px; font-size: 8.5px; font-weight: 600;'>\r\n                Cad: \" & ThisItem.Caducidad & \"\r\n            </span>\r\n        </div>\r\n    </div>\r\n\r\n    <!-- COLUMNA 3: CRITERIOS Y ESPECIFICACIONES -->\r\n    <div style='flex: 1.3; min-width: 170px; border-right: 1px solid #f1f5f9; padding-right: 8px; display: flex; flex-direction: column; justify-content: center; gap: 4px;'>\r\n        <div style='background: #f8fafc; border-left: 2px solid #3b82f6; padding: 2px 5px; border-radius: 0 3px 3px 0;'>\r\n            <div style='font-size: 8.5px; font-weight: 700; color: #1e40af;'>CRITERIOS DE CAMBIO</div>\r\n            <div style='font-size: 9px; color: #475569; max-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;'>\" & ThisItem.CriteriosCarga & \"</div>\r\n        </div>\r\n\r\n        <div style='background: #f8fafc; border-left: 2px solid #06b6d4; padding: 2px 5px; border-radius: 0 3px 3px 0;'>\r\n            <div style='font-size: 8.5px; font-weight: 700; color: #0e7490;'>ESPECIFICACIONES</div>\r\n            <div style='font-size: 9px; color: #475569; max-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;'>\" & ThisItem.Especificaciones & \"</div>\r\n        </div>\r\n    </div>\r\n\r\n    <!-- COLUMNA 4: MANTENIMIENTO -->\r\n    <div style='flex: 1.2; min-width: 150px; display: flex; flex-direction: column; justify-content: center;'>\r\n        <div style='background: #f8fafc; border-left: 2px solid #10b981; padding: 3px 6px; border-radius: 0 3px 3px 0; height: 100%; box-sizing: border-box;'>\r\n            <div style='font-size: 8.5px; font-weight: 700; color: #047857; margin-bottom: 2px;'>MANTENIMIENTO</div>\r\n            <div style='font-size: 9px; color: #475569; max-height: 45px; overflow-y: auto; line-height: 1.15;'>\" & ThisItem.Mantenimiento & \"</div>\r\n        </div>\r\n    </div>\r\n\r\n</div>\""
