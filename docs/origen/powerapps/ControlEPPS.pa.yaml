                        Items: "=Sort(\r\n    Filter(\r\n        colEPPs,\r\n        // Filtro por Criterio de Categoría (Selección múltiple)\r\n        (IsBlank(cmbFiltroCategoria.SelectedItems) || IsEmpty(cmbFiltroCategoria.SelectedItems) || \r\n            Categoria in cmbFiltroCategoria.SelectedItems.Value || \r\n            Categoria in cmbFiltroCategoria.Selected.Value) &&\r\n        \r\n        // Filtro por Criterio de Detalle (Selección múltiple)\r\n        (IsBlank(cmbFiltroDetalle.SelectedItems) || IsEmpty(cmbFiltroDetalle.SelectedItems) || \r\n            Detalle in cmbFiltroDetalle.SelectedItems.Value || \r\n            Detalle in cmbFiltroDetalle.Selected.Value)\r\n    ),\r\n    ID_Registro,\r\n    SortOrder.Descending\r\n)"
