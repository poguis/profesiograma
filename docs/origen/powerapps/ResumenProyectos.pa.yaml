                        FillPortions: =0
                        Height: =540
                        Items: "=/*\r\nWith(\r\n    {\r\n        estadoSel: Coalesce(filtroListas.Selected.Nombre; \"Todos\");\r\n        fIni: fechaInicio.SelectedDate;\r\n        fFin: fechaFin.SelectedDate\r\n    };\r\n    SortByColumns(\r\n        Filter(\r\n            'SIG PROYECTOS';\r\n\r\n            // 0) OCULTAR REGISTROS VACÍOS / BASURA\r\n            Título <> \"666\";\r\n            \r\n            // 1) FILTRO ESTADO\r\n            If(\r\n                estadoSel = \"Todos\";\r\n                true;\r\n                ESTADO.Value = estadoSel\r\n            );\r\n            \r\n            // 2) FILTRO FECHA INICIO (si está en blanco no filtra)\r\n            If(\r\n                IsBlank(fIni);\r\n                true;\r\n                Creado >= DateValue(fIni)\r\n            );\r\n            \r\n            // 3) FILTRO FECHA FIN (si está en blanco no filtra)\r\n            If(\r\n                IsBlank(fFin);\r\n                true;\r\n                Creado < DateAdd(DateValue(fFin); 1; TimeUnit.Days)\r\n            );\r\n\r\n            // 4) FILTRO DE SEGURIDAD: SI ES ADMIN VE TODO, SI NO, SOLO SUS REGISTROS\r\n            If(\r\n                varEsSuperAdmin;\r\n                true;\r\n                Text(ParseJSON(INF_GENERAL).InfoRegistro.Correo) = varUsuarioActual.Email\r\n            )\r\n        );\r\n        \"Created\";\r\n        SortOrder.Descending\r\n    )\r\n)\r\n*/\r\n\r\n\r\nWith(\r\n    {\r\n        estadoSel: Coalesce(filtroListas.Selected.Nombre, \"Todos\"),\r\n        fIni: fechaInicio.SelectedDate,\r\n        fFin: fechaFin.SelectedDate,\r\n        correoActual: Lower(Trim(varUsuarioActual.Email))\r\n    },\r\n    SortByColumns(\r\n        If(\r\n            varEsSuperAdmin,\r\n            Filter(\r\n                'SIG PROYECTOS',\r\n                StartsWith(Título, \"PRY-\"),\r\n                If(estadoSel = \"Todos\", true, ESTADO.Value = estadoSel),\r\n                If(IsBlank(fIni), true, Creado >= fIni),\r\n                If(IsBlank(fFin), true, Creado < DateAdd(fFin, 1, TimeUnit.Days))\r\n            ),\r\n            Filter(\r\n                'SIG PROYECTOS',\r\n                StartsWith(Título, \"PRY-\"),\r\n                CORREO_CREADOR = correoActual,\r\n                If(estadoSel = \"Todos\", true, ESTADO.Value = estadoSel),\r\n                If(IsBlank(fIni), true, Creado >= fIni),\r\n                If(IsBlank(fFin), true, Creado < DateAdd(fFin, 1, TimeUnit.Days))\r\n            )\r\n        ),\r\n        \"Created\",\r\n        SortOrder.Descending\r\n    )\r\n)"
