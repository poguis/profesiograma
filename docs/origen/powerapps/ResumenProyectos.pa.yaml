                                      Set(gblHorasHorario; Text(varInfoProyectoJson.InfoProyecto.Horario.Horas));;
                                      Set(gblHorasTrabHorario; Text(varInfoProyectoJson.InfoProyecto.Horario.HorasTrabajadas));;
                                      Set(gblTipoHorario; Text(varInfoProyectoJson.InfoProyecto.Horario.Tipo));;
                                      Set(gblSalidaAlmuerzo; Text(varInfoProyectoJson.InfoProyecto.Horario.SalidaAlmuerzo));;
                                      Set(gblRegresoAlmuerzo; Text(varInfoProyectoJson.InfoProyecto.Horario.RegresoAlmuezo));;


                                      //Agregado
                                      Set(varActividadCambiadaVista; false);;

                                      Set(gblFechaInicioProyecto; DateValue(Left(Text(varInfoProyectoJson.Planificacion.FechaInicio); 10)));;
                                      Set(gblFechaFinProyecto; DateValue(Left(Text(varInfoProyectoJson.Planificacion.FechaFin); 10)));;

                                      Set(gblEstadoProyecto; Text(ThisItem.ESTADO.Value));;


                                      //Control de estados del proyecto
                                      Set(varEstadoOriginalProyecto; gblEstadoProyecto);;
                                      Set(varEstadoNuevoProyecto; gblEstadoProyecto);;
                                      Set(varEstadoCambiado; false);;
                                      Set(varTipoMovimientoEstado; "SIN_CAMBIO");;
                                      Set(varFechaMovimientoEstado; Blank());;
                                      Set(varEstadoRegenerado; false);;



                                      // ---------------------------
                                      // PRINCIPALES
                                      Clear(colPrincipalesHistoricos);;
                                      Clear(colPrincipalesProyecto);;

                                      ForAll(
                                          Table(varInfoProyectoJson.Responsables.Principales) As p;
                                          Collect(
                                              colPrincipalesHistoricos;
                                              {
                                                  PrincipalId: Value(p.Value.PrincipalId);
                                                  EsPrincipalInicial: Boolean(p.Value.EsPrincipalInicial);
                                                  EsNuevo: false;
                                                  Nombre: Text(p.Value.Nombre);
                                                  Cedula: Text(p.Value.Cedula);
                                                  Ekon: Text(p.Value.Ekon);
                                                  Correo: Lower(Trim(Text(p.Value.Correo)));
                                                  Cargo: Text(p.Value.Cargo);
                                                  FechaInicio: DateValue(Left(Text(p.Value.FechaInicio); 10));
                                                  FechaFin: DateValue(Left(Text(p.Value.FechaFin); 10));
                                                  JornadaCodigo: Text(p.Value.JornadaCodigo);
                                                  JornadaDescripcion: Text(p.Value.JornadaDescripcion);
                                                  DiasTrabajo: Value(p.Value.DiasTrabajo);
                                                  DiasDescanso: Value(p.Value.DiasDescanso)
                                              }
                                          )
                                      );;

                                      ClearCollect(
                                          colPrincipalesProyecto;
                                          Filter(
                                              colPrincipalesHistoricos;
                                              FechaFin >= varFechaCorteEdicion
                                          )
                                      );;

                                      // ---------------------------
                                      // BACKS
                                      // ---------------------------
                                      Clear(colBacksHistoricos);;
                                      Clear(colBacksProyecto);;

                                      ForAll(
                                          Table(varInfoProyectoJson.Responsables.Backs) As b;
                                          Collect(
                                              colBacksHistoricos;
                                              {
                                                  BackId: Value(b.Value.BackId);
                                                  EsNuevo: false;
                                                  PrincipalIdRelacionado: If(
                                                      IsBlank(Text(b.Value.PrincipalIdRelacionado));
                                                      Blank();
                                                      Value(b.Value.PrincipalIdRelacionado)
                                                  );
                                                  Nombre: Text(b.Value.Nombre);
                                                  Cedula: Text(b.Value.Cedula);
                                                  Ekon: Text(b.Value.Ekon);
                                                  Correo: Lower(Trim(Text(b.Value.Correo)));
                                                  Cargo: Text(b.Value.Cargo);
                                                  FechaInicio: DateValue(Left(Text(b.Value.FechaInicio); 10));
                                                  FechaFin: DateValue(Left(Text(b.Value.FechaFin); 10));
                                                  Observacion: Text(b.Value.Observacion);

                                                  // AGREGAR ESTO PARA RECUPERAR LOS DATOS DEL JSON:
                                                  TipoRegistro: Coalesce(Text(b.Value.TipoRegistro); "Jornada");
                                                  DiasDescanso: Coalesce(Value(b.Value.DiasDescanso); 0)
                                              }
                                          )
                                      );;

                                      ClearCollect(
                                          colBacksProyecto;
                                          Filter(
                                              colBacksHistoricos;
                                              //FechaFin >= varFechaCorteEdicion

                                              DateAdd(FechaFin; DiasDescanso; TimeUnit.Days) >= varFechaCorteEdicion
                                          )
                                      );;

                                      // ---------------------------
                                      // ASIGNACIONES / BLOQUES
                                      // ---------------------------
                                      Clear(colAsignacionesPreview);;
                                      Clear(colAsignacionesDiario);;

                                      ForAll(
                                          Table(varAsigProyectoJson.Bloques) As b;
                                          Collect(
                                              colAsignacionesPreview;
                                              {
                                                  Bloque: Value(b.Value.Bloque);
                                                  Rol: Text(b.Value.Rol);
                                                  TipoAsignacion: Text(b.Value.TipoAsignacion);

                                                  PrincipalId: If(
                                                      IsBlank(Text(b.Value.PrincipalId));
                                                      Blank();
                                                      Value(b.Value.PrincipalId)
                                                  );

                                                  BackId: If(
                                                      IsBlank(Text(b.Value.BackId));
                                                      Blank();
                                                      Value(b.Value.BackId)
                                                  );

                                                  ResponsableNombre: Text(b.Value.ResponsableNombre);
                                                  ResponsableCedula: Text(b.Value.ResponsableCedula);
                                                  ResponsableEkon: Text(b.Value.ResponsableEkon);
                                                  ResponsableCorreo: Lower(Trim(Text(b.Value.ResponsableCorreo)));
                                                  ResponsableCargo: Text(b.Value.ResponsableCargo);

                                                  FechaInicio: DateValue(Left(Text(b.Value.FechaInicio); 10));
                                                  FechaFin: DateValue(Left(Text(b.Value.FechaFin); 10));

                                                  DiasAsignados: Value(b.Value.DiasAsignados)
                                              }
                                          )
                                      );;

                                      ForAll(
                                          Table(varAsigProyectoJson.DetalleDiario) As d;
                                          Collect(
                                              colAsignacionesDiario;
                                              {
                                                  Fecha: DateValue(Left(Text(d.Value.Fecha); 10));
                                                  FechaClave: Text(d.Value.FechaClave);

                                                  Bloque: Value(d.Value.Bloque);
                                                  Rol: Text(d.Value.Rol);
                                                  TipoAsignacion: Text(d.Value.TipoAsignacion);

                                                  PrincipalId: If(
                                                      IsBlank(Text(d.Value.PrincipalId));
                                                      Blank();
                                                      Value(d.Value.PrincipalId)
                                                  );

                                                  BackId: If(
                                                      IsBlank(Text(d.Value.BackId));
                                                      Blank();
                                                      Value(d.Value.BackId)
                                                  );

                                                  ResponsableNombre: Text(d.Value.ResponsableNombre);
                                                  ResponsableCedula: Text(d.Value.ResponsableCedula);
                                                  ResponsableEkon: Text(d.Value.ResponsableEkon);
                                                  ResponsableCorreo: Lower(Trim(Text(d.Value.ResponsableCorreo)));
                                                  ResponsableCargo: Text(d.Value.ResponsableCargo)
                                              }
                                          )
                                      );;




                                      // ---------------------------
                                      // ETAPAS HISTÓRICAS
                                      // ---------------------------
                                      Clear(colEtapasHistoricas);;

                                      If(
                                          !IsBlank(varAsigProyectoJson.Etapas);
                                          ForAll(
                                              Table(varAsigProyectoJson.Etapas) As e;
                                              Collect(
                                                  colEtapasHistoricas;
                                                  {
                                                      EtapaId: Text(e.Value.EtapaId);
                                                      Version: Value(e.Value.Version);
                                                      TipoMovimiento: Text(e.Value.TipoMovimiento);
                                                      EstadoProyecto: Text(e.Value.EstadoProyecto);
                                                      FechaRegistro: Text(e.Value.FechaRegistro);
                                                      UsuarioRegistro: Text(e.Value.UsuarioRegistro);
                                                      CorreoRegistro: Text(e.Value.CorreoRegistro);

                                                      FechaInicio: DateValue(Left(Text(e.Value.FechaInicio); 10));
                                                      FechaFin: DateValue(Left(Text(e.Value.FechaFin); 10));

                                                      ModeloAsignacion: Text(e.Value.ModeloAsignacion);

                                                      PrincipalesJson: Coalesce(Text(e.Value.PrincipalesJson); "[]");
                                                      BacksJson: Coalesce(Text(e.Value.BacksJson); "[]");
                                                      BloquesEtapaJson: Coalesce(Text(e.Value.BloquesEtapaJson); "[]");
                                                      DetalleDiarioEtapaJson: Coalesce(Text(e.Value.DetalleDiarioEtapaJson); "[]");

                                                      ActivityId: Coalesce(Text(e.Value.ActivityId); "");
                                                      ActivityDescription: Coalesce(Text(e.Value.ActivityDescription); "");
                                                      ActivityType: Coalesce(Text(e.Value.ActivityType); "")
                                                  }
                                              )
                                          )
                                      );;

                                      // ---------------------------
                                      // HISTORIAL DE ACTIVIDADES
                                      // Si aún no existe, sembramos una actividad base
                                      // ---------------------------
                                      Clear(colHistorialActividades);;

                                      If(
                                          !IsBlank(varAsigProyectoJson.HistorialActividades);
                                          ForAll(
                                              Table(varAsigProyectoJson.HistorialActividades) As a;
                                              Collect(
                                                  colHistorialActividades;
                                                  {
                                                      MovimientoId: Text(a.Value.MovimientoId);
                                                      Version: Value(a.Value.Version);
                                                      TipoMovimiento: Text(a.Value.TipoMovimiento);
                                                      FechaRegistro: Text(a.Value.FechaRegistro);
                                                      UsuarioRegistro: Text(a.Value.UsuarioRegistro);
                                                      CorreoRegistro: Text(a.Value.CorreoRegistro);
                                                      FechaInicio: DateValue(Left(Text(a.Value.FechaInicio); 10));
                                                      FechaFin: DateValue(Left(Text(a.Value.FechaFin); 10));
                                                      ActivityId: Text(a.Value.ActivityId);
                                                      ActivityDescription: Text(a.Value.ActivityDescription);
                                                      ActivityType: Text(a.Value.ActivityType)
                                                  }
                                              )
                                          )
                                      );;

                                      If(
                                          CountRows(colHistorialActividades) = 0;
                                          Collect(
                                              colHistorialActividades;
                                              {
                                                  MovimientoId: GUID();
                                                  Version: 1;
                                                  TipoMovimiento: "CREACION";
                                                  FechaRegistro: Text(Now(); "yyyy-mm-dd hh:mm:ss");
                                                  UsuarioRegistro: UsuariosdeOffice365.MyProfileV2().displayName;
                                                  CorreoRegistro: UsuariosdeOffice365.MyProfileV2().userPrincipalName;
                                                  FechaInicio: gblFechaInicioProyecto;
                                                  FechaFin: gblFechaFinProyecto;
                                                  ActivityId: gblActivityIdProyecto;
                                                  ActivityDescription: gblActividadProyecto;
                                                  ActivityType: gblActivityTypeProyecto
                                              }
                                          )
                                      );;

                                      // ---------------------------
                                      // CARGAR ACTIVIDADES API PARA CAMBIO DE ACTIVIDAD
                                      // ---------------------------
                                      Clear(colActividadesApiEdit);;

                                      If(
                                          !IsBlank(gblCompanyIdProyecto) && !IsBlank(gblProjectIdProyecto);
                                          IfError(
                                              Set(
                                                  varRespuestaActividadesEdit;
                                                  ConsultarProyecto.Run(
                                                      Text(gblCompanyIdProyecto);
                                                      Text(gblProjectIdProyecto);
                                                      "ACTIVIDADES"
                                                  ).respuestajson
                                              );;

                                              If(
                                                  IsBlank(varRespuestaActividadesEdit) ||
                                                  varRespuestaActividadesEdit = "[]" ||
                                                  varRespuestaActividadesEdit = "null";
                                                  Clear(colActividadesApiEdit);
                                                  ClearCollect(
                                                      colActividadesApiEdit;
                                                      Table(ParseJSON(varRespuestaActividadesEdit))
                                                  )
                                              );

                                              Clear(colActividadesApiEdit)
                                          )
                                      );;

                                      If(
                                          !IsBlank(gblActivityIdProyecto) &&
                                          IsBlank(
                                              LookUp(
                                                  colActividadesApiEdit;
                                                  Text(Value.activityId) = gblActivityIdProyecto
                                              )
                                          );
                                          Collect(
                                              colActividadesApiEdit;
                                              {
                                                  Value: ParseJSON(
                                                      JSON(
                                                          {
                                                              projectId: gblProjectIdProyecto;
                                                              activityId: gblActivityIdProyecto;
                                                              description: gblActividadProyecto;
                                                              activityType: gblActivityTypeProyecto
                                                          };
                                                          JSONFormat.Compact
                                                      )
                                                  )
                                              }
                                          )
                                      );;

                                      ClearCollect(
                                          colAsignacionesPreviewOriginal;
                                          colAsignacionesPreview
                                      );;

                                      ClearCollect(
                                          colAsignacionesDiarioOriginal;
                                          colAsignacionesDiario
                                      );;

                                      Set(varRequiereRegenerar; false);;
                                      Set(varAsignacionRegenerada; false);;


                                      Navigate(
                                          ConfigurarProyecto;
                                          ScreenTransition.Fade
                                      );;
                                      */


                                      // ---------------------------
                                      // PROYECTO SELECCIONADO (registro completo solo de este proyecto)
                                      // ---------------------------
                                      Set(varProyectoSeleccionado, LookUp('SIG PROYECTOS', ID = ThisItem.ID));
                                      Set(varUidProyectoEdit, varProyectoSeleccionado.PROYECTO_UID);
                                      Set(varModoProyecto, "EDITAR");

                                      Set(varFechaCorteEdicion, Today());
                                      Set(varRequiereRegenerar, false);

                                      Set(varInfoProyectoJson, ParseJSON(varProyectoSeleccionado.INF_GENERAL));

                                      // ---------------------------
                                      // DATOS GENERALES (columnas de la cabecera)
                                      // ---------------------------
                                      Set(gblCompaniaProyecto, varProyectoSeleccionado.COMPANIA_NOMBRE);
                                      Set(gblCompanyIdProyecto, varProyectoSeleccionado.COMPANY_ID);
                                      Set(gblCompaniaRucProyecto, varProyectoSeleccionado.COMPANIA_RUC);
                                      Set(gblGrupoProyecto, varProyectoSeleccionado.GRUPO);

                                      Set(gblNombreProyecto, Text(varInfoProyectoJson.InfoProyecto.Proyecto.Nombre));
                                      Set(gblNombreVisualProyecto, varProyectoSeleccionado.NOMBRE_PROYECTO);
                                      Set(gblProjectIdProyecto, varProyectoSeleccionado.PROJECT_ID_EKON);
                                      Set(gblEstadoApiProyecto, Text(varInfoProyectoJson.InfoProyecto.Proyecto.Estado));

                                      Set(gblDimensionProyecto, varProyectoSeleccionado.DIMENSION_DESC);
                                      Set(gblUegpIdProyecto, Text(varInfoProyectoJson.InfoProyecto.Dimension.UegpId));

                                      Set(gblActividadProyecto, varProyectoSeleccionado.ACTIVITY_DESC);
                                      Set(gblActivityIdProyecto, varProyectoSeleccionado.ACTIVITY_ID);
                                      Set(gblActivityTypeProyecto, varProyectoSeleccionado.ACTIVITY_TYPE);

                                      Set(varActivityIdEdit, gblActivityIdProyecto);
                                      Set(varActivityNameEdit, gblActividadProyecto);
                                      Set(varActivityTypeEdit, gblActivityTypeProyecto);

                                      Set(gblCodigoHorario, varProyectoSeleccionado.HORARIO_CODIGO);
                                      Set(gblDescripcionHorario, varProyectoSeleccionado.HORARIO_DESC);
                                      Set(gblEntradaHorario, varProyectoSeleccionado.HORA_ENTRADA);
                                      Set(gblSalidaHorario, varProyectoSeleccionado.HORA_SALIDA);
                                      Set(gblHorasHorario, varProyectoSeleccionado.HORAS);
                                      Set(gblHorasTrabHorario, varProyectoSeleccionado.HORAS_TRABAJADAS);
                                      Set(gblTipoHorario, varProyectoSeleccionado.TIPO_HORARIO);
                                      Set(gblSalidaAlmuerzo, varProyectoSeleccionado.SALIDA_ALMUERZO);
                                      Set(gblRegresoAlmuerzo, varProyectoSeleccionado.REGRESO_ALMUERZO);

                                      // Creador original (se conserva al guardar)
                                      Set(gblUsuarioCreadorProyecto, varProyectoSeleccionado.USUARIO_CREADOR);
                                      Set(gblCorreoCreadorProyecto, varProyectoSeleccionado.CORREO_CREADOR);
                                      Set(
                                          varUegpsCalculadas,
                                          ForAll(Table(varInfoProyectoJson.InfoRegistro.Uegp) As u, Text(u.Value.Categoria))
                                      );

                                      Set(varActividadCambiadaVista, false);

                                      Set(gblFechaInicioProyecto, varProyectoSeleccionado.FECHA_INICIO);
                                      Set(gblFechaFinProyecto, varProyectoSeleccionado.FECHA_FIN);

                                      Set(gblEstadoProyecto, varProyectoSeleccionado.ESTADO.Value);

                                      // Control de estados del proyecto
                                      Set(varEstadoOriginalProyecto, gblEstadoProyecto);
                                      Set(varEstadoNuevoProyecto, gblEstadoProyecto);
                                      Set(varEstadoCambiado, false);
                                      Set(varTipoMovimientoEstado, "SIN_CAMBIO");
                                      Set(varFechaMovimientoEstado, Blank());
                                      Set(varEstadoRegenerado, false);

                                      // ---------------------------
                                      // PRINCIPALES (SIG_ASIGNACIONES_PERSONAL)
                                      // ---------------------------
                                      ClearCollect(
                                          colPrincipalesHistoricos,
                                          ForAll(
                                              Filter(SIG_ASIGNACIONES_PERSONAL, PROYECTO_UID = varUidProyectoEdit && ROL = "PRINCIPAL") As p,
                                              {
                                                  PrincipalId: p.PERSONA_ID,
                                                  EsPrincipalInicial: p.ES_PRINCIPAL_INICIAL,
                                                  EsNuevo: false,
                                                  Nombre: p.NOMBRE,
                                                  Cedula: p.CEDULA,
                                                  Ekon: Text(p.EKON),
                                                  Correo: Lower(Trim(p.CORREO)),
                                                  Cargo: p.CARGO,
                                                  FechaInicio: p.FECHA_INICIO,
                                                  FechaFin: p.FECHA_FIN,
                                                  JornadaCodigo: p.JORNADA_CODIGO,
                                                  JornadaDescripcion: p.JORNADA_DESCRIPCION,
                                                  DiasTrabajo: Coalesce(p.DIAS_TRABAJO, 0),
                                                  DiasDescanso: Coalesce(p.DIAS_DESCANSO, 0)
                                              }
                                          )
                                      );

                                      ClearCollect(
                                          colPrincipalesProyecto,
                                          Filter(colPrincipalesHistoricos, FechaFin >= varFechaCorteEdicion)
                                      );

                                      // ---------------------------
                                      // BACKS (SIG_ASIGNACIONES_PERSONAL)
                                      // ---------------------------
                                      ClearCollect(
                                          colBacksHistoricos,
                                          ForAll(
                                              Filter(SIG_ASIGNACIONES_PERSONAL, PROYECTO_UID = varUidProyectoEdit && ROL = "BACK") As b,
                                              {
                                                  BackId: b.PERSONA_ID,
                                                  EsNuevo: false,
                                                  PrincipalIdRelacionado: b.PRINCIPAL_ID_RELACIONADO,
                                                  Nombre: b.NOMBRE,
                                                  Cedula: b.CEDULA,
                                                  Ekon: Text(b.EKON),
                                                  Correo: Lower(Trim(b.CORREO)),
                                                  Cargo: b.CARGO,
                                                  FechaInicio: b.FECHA_INICIO,
                                                  FechaFin: b.FECHA_FIN,
                                                  Observacion: Coalesce(b.OBSERVACION, ""),
                                                  TipoRegistro: Coalesce(b.TIPO_REGISTRO, "Jornada"),
                                                  DiasDescanso: Coalesce(b.DIAS_DESCANSO, 0)
                                              }
                                          )
                                      );

                                      ClearCollect(
                                          colBacksProyecto,
                                          Filter(colBacksHistoricos, DateAdd(FechaFin, DiasDescanso, TimeUnit.Days) >= varFechaCorteEdicion)
                                      );

                                      // ---------------------------
                                      // DETALLE DIARIO (SIG_ASIGNACIONES_DETALLE)
                                      // Se excluyen los descansos automáticos de principales: se recalculan al guardar
                                      // ---------------------------
                                      ClearCollect(
                                          colAsignacionesDiario,
                                          ForAll(
                                              Filter(SIG_ASIGNACIONES_DETALLE, PROYECTO_UID = varUidProyectoEdit) As d,
                                              {
                                                  Fecha: d.FECHA,
                                                  FechaClave: Text(d.FECHA, "[$-en-US]yyyy-mm-dd"),
                                                  Bloque: d.BLOQUE,
                                                  Rol: d.ROL,
                                                  TipoAsignacion: d.TIPO_ASIGNACION,
                                                  PrincipalId: d.PRINCIPAL_ID,
                                                  BackId: d.BACK_ID,
                                                  ResponsableNombre: d.NOMBRE_RESPONSABLE,
                                                  ResponsableCedula: d.CEDULA,
                                                  ResponsableEkon: Text(d.EKON),
                                                  ResponsableCorreo: Lower(Trim(d.CORREO_RESPONSABLE)),
                                                  ResponsableCargo: d.CARGO
                                              }
                                          )
                                      );

                                      RemoveIf(
                                          colAsignacionesDiario,
                                          Rol = "DESCANSO" && !IsBlank(PrincipalId) && IsBlank(BackId)
                                      );

                                      // ---------------------------
                                      // BLOQUES (se derivan del detalle)
                                      // ---------------------------
                                      ClearCollect(
                                          colAsignacionesPreview,
                                          ForAll(
                                              GroupBy(
                                                  colAsignacionesDiario,
                                                  Bloque, Rol, TipoAsignacion, PrincipalId, BackId,
                                                  ResponsableNombre, ResponsableCedula, ResponsableEkon, ResponsableCorreo, ResponsableCargo,
                                                  Registros
                                              ) As g,
                                              {
                                                  Bloque: g.Bloque,
                                                  Rol: g.Rol,
                                                  TipoAsignacion: g.TipoAsignacion,
                                                  PrincipalId: g.PrincipalId,
                                                  BackId: g.BackId,
                                                  ResponsableNombre: g.ResponsableNombre,
                                                  ResponsableCedula: g.ResponsableCedula,
                                                  ResponsableEkon: g.ResponsableEkon,
                                                  ResponsableCorreo: g.ResponsableCorreo,
                                                  ResponsableCargo: g.ResponsableCargo,
                                                  FechaInicio: Min(g.Registros, Fecha),
                                                  FechaFin: Max(g.Registros, Fecha),
                                                  DiasAsignados: CountRows(g.Registros)
                                              }
                                          )
                                      );

                                      // ---------------------------
                                      // ETAPAS HISTÓRICAS (SIG_HISTORIAL, solo metadatos)
                                      // ---------------------------
                                      ClearCollect(
                                          colEtapasHistoricas,
                                          ForAll(
                                              SortByColumns(Filter(SIG_HISTORIAL, PROYECTO_UID = varUidProyectoEdit), "VERSION", SortOrder.Ascending) As e,
                                              {
                                                  EtapaId: e.ETAPA_ID,
                                                  Version: e.VERSION,
                                                  TipoMovimiento: e.Título,
                                                  EstadoProyecto: e.ESTADO_PROYECTO,
                                                  FechaRegistro: Text(e.FECHA_REGISTRO, "[$-en-US]yyyy-mm-dd hh:mm:ss"),
                                                  UsuarioRegistro: e.USUARIO_REGISTRO,
                                                  CorreoRegistro: e.CORREO_REGISTRO,
                                                  FechaInicio: e.FECHA_INICIO,
                                                  FechaFin: e.FECHA_FIN,
                                                  ModeloAsignacion: "MULTIPLES_PRINCIPALES_BACK_MANUAL",
                                                  PrincipalesJson: "[]",
                                                  BacksJson: "[]",
                                                  BloquesEtapaJson: "[]",
                                                  DetalleDiarioEtapaJson: "[]",
                                                  ActivityId: Coalesce(e.ACTIVITY_ID, ""),
                                                  ActivityDescription: "",
                                                  ActivityType: ""
                                              }
                                          )
                                      );

                                      // ---------------------------
                                      // HISTORIAL DE ACTIVIDADES (SIG_HISTORIAL_ACTIVIDADES)
                                      // ---------------------------
                                      ClearCollect(
                                          colHistorialActividades,
                                          ForAll(
                                              SortByColumns(Filter(SIG_HISTORIAL_ACTIVIDADES, PROYECTO_UID = varUidProyectoEdit), "FECHA_INICIO", SortOrder.Ascending) As a,
                                              {
                                                  MovimientoId: a.Título,
                                                  Version: a.VERSION,
                                                  TipoMovimiento: a.TIPO_MOVIMIENTO,
                                                  FechaRegistro: Text(a.FECHA_REGISTRO, "[$-en-US]yyyy-mm-dd hh:mm:ss"),
                                                  UsuarioRegistro: a.USUARIO_REGISTRO,
                                                  CorreoRegistro: a.CORREO_REGISTRO,
                                                  FechaInicio: a.FECHA_INICIO,
                                                  FechaFin: a.FECHA_FIN,
                                                  ActivityId: a.ACTIVITY_ID,
                                                  ActivityDescription: a.ACTIVITY_DESCRIPTION,
                                                  ActivityType: a.ACTIVITY_TYPE
                                              }
                                          )
                                      );

                                      If(
                                          CountRows(colHistorialActividades) = 0 && !IsBlank(gblActivityIdProyecto),
                                          Collect(
                                              colHistorialActividades,
                                              {
                                                  MovimientoId: Text(GUID()),
                                                  Version: 1,
                                                  TipoMovimiento: "CREACION",
                                                  FechaRegistro: Text(Now(), "[$-en-US]yyyy-mm-dd hh:mm:ss"),
                                                  UsuarioRegistro: gblUsuarioCreadorProyecto,
                                                  CorreoRegistro: gblCorreoCreadorProyecto,
                                                  FechaInicio: gblFechaInicioProyecto,
                                                  FechaFin: gblFechaFinProyecto,
                                                  ActivityId: gblActivityIdProyecto,
                                                  ActivityDescription: gblActividadProyecto,
                                                  ActivityType: gblActivityTypeProyecto
                                              }
                                          )
                                      );

                                      // ---------------------------
                                      // ACTIVIDADES API PARA CAMBIO DE ACTIVIDAD (igual que antes)
                                      // ---------------------------
                                      Clear(colActividadesApiEdit);

                                      If(
                                          !IsBlank(gblCompanyIdProyecto) && !IsBlank(gblProjectIdProyecto),
                                          IfError(
                                              Set(
                                                  varRespuestaActividadesEdit,
                                                  ConsultarProyecto.Run(
                                                      Text(gblCompanyIdProyecto),
                                                      Text(gblProjectIdProyecto),
                                                      "ACTIVIDADES"
                                                  ).respuestajson
                                              );
                                              If(
                                                  IsBlank(varRespuestaActividadesEdit) ||
                                                  varRespuestaActividadesEdit = "[]" ||
                                                  varRespuestaActividadesEdit = "null",
                                                  Clear(colActividadesApiEdit),
                                                  ClearCollect(colActividadesApiEdit, Table(ParseJSON(varRespuestaActividadesEdit)))
                                              ),
                                              Clear(colActividadesApiEdit)
                                          )
                                      );

                                      If(
                                          !IsBlank(gblActivityIdProyecto) &&
                                          IsBlank(LookUp(colActividadesApiEdit, Text(Value.activityId) = gblActivityIdProyecto)),
                                          Collect(
                                              colActividadesApiEdit,
                                              {
                                                  Value: ParseJSON(
                                                      JSON(
                                                          {
                                                              projectId: gblProjectIdProyecto,
                                                              activityId: gblActivityIdProyecto,
                                                              description: gblActividadProyecto,
                                                              activityType: gblActivityTypeProyecto
                                                          },
                                                          JSONFormat.Compact
                                                      )
                                                  )
                                              }
                                          )
                                      );

                                      // ---------------------------
                                      // COPIAS ORIGINALES
                                      // ---------------------------
                                      ClearCollect(colAsignacionesPreviewOriginal, colAsignacionesPreview);
                                      ClearCollect(colAsignacionesDiarioOriginal, colAsignacionesDiario);

                                      Set(varRequiereRegenerar, false);
                                      Set(varAsignacionRegenerada, false);

                                      Navigate(ConfigurarProyecto_1, ScreenTransition.Fade)
                                    PaddingBottom: =10
                                    PaddingLeft: =13
                                    PaddingRight: =13
                                    PaddingTop: =10
                                    Tooltip: ="Configurar Proyecto"
                                    Visible: |
                                      =true
                                    Width: =40
                              - confPRY_1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(0, 18, 107, 1)
                                    Height: =50
                                    Icon: =Icon.OpenInNewWindow
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =/*
                                      With(
                                          { datos: ParseJSON(ThisItem.INF_GENERAL) };
                                          Set(
                                              gblProyectoSeleccionado;
                                              {
                                                  Registro: ThisItem;
                                                  FechaInicio: IfError(DateValue(Left(Text(datos.Planificacion.FechaInicio); 10)); Blank());
                                                  FechaFin: IfError(DateValue(Left(Text(datos.Planificacion.FechaFin); 10)); Blank())
                                              }
                                          )
                                      );;

                                      Refresh('SIG PROYECTOS');;

                                      Navigate(
                                          AsignarPersonal;
                                          ScreenTransition.Fade;
                                          {
                                              ctxRegistroSeleccionado: ThisItem
                                          }
                                      )
                                      */



                                      With(
                                          {
                                              regCompleto: LookUp('SIG PROYECTOS', ID = ThisItem.ID)
                                          },
                                          Set(
                                              gblProyectoSeleccionado,
                                              {
                                                  Registro: regCompleto,
                                                  FechaInicio: ThisItem.FECHA_INICIO,
                                                  FechaFin: ThisItem.FECHA_FIN
                                              }
                                          );
                                          Navigate(
                                              AsignarPersonal,
                                              ScreenTransition.Fade,
                                              {
                                                  ctxRegistroSeleccionado: regCompleto
                                              }
                                          )
                                      )
                                    PaddingBottom: =10
                                    PaddingLeft: =13
                                    PaddingRight: =13
                                    PaddingTop: =10
                                    Tooltip: ="Generar for seri 11"
                                    Visible: =varEsSuperAdmin
