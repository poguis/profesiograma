Screens:
  RegistrarNovedadAsistencia:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Refresh('NOVEDADES ASISTENCIA');
        Refresh('SIG PROYECTOS');

        Clear(colAsignacionesGlobales);

        ForAll(
            Filter(
                'SIG PROYECTOS',
                !IsBlank(ASIGNACIONES) &&
                (
                    ESTADO.Value = "ACTIVO" ||
                    ESTADO.Value = "SUSPENDIDO"
                )
            ),
            With(
                {
                    info: ParseJSON(INF_GENERAL),
                    asig: ParseJSON(ASIGNACIONES)
                },
                ForAll(
                    Table(asig.DetalleDiario) As d,
                    Collect(
                        colAsignacionesGlobales,
                        {
                            ProjectUID: Text(PROJECT_UID),
                            ProyectoCodigo: Text(Título),
                            ProyectoNombre: Text(info.InfoProyecto.Proyecto.Nombre),
                            EstadoProyecto: Text(ESTADO.Value),
                            Fecha: DateValue(Left(Text(d.Value.Fecha), 10)),
                            FechaClave: Text(
                                DateValue(Left(Text(d.Value.Fecha), 10)),
                                "[$-en-US]yyyy-mm-dd"
                            ),
                            ResponsableCorreo: Lower(Trim(Text(d.Value.ResponsableCorreo))),
                            ResponsableNombre: Text(d.Value.ResponsableNombre),
                            ResponsableCargo: Text(d.Value.ResponsableCargo),
                            Rol: Text(d.Value.Rol)
                        }
                    )
                )
            )
        );

        Clear(colNovedadPreview);

        Set(varTipoAplicacionNov, Blank());
        Set(varCorreoPersonaNov, Blank());
        Set(varProjectUIDNov, Blank());
        //Set(varNombrePersonaNov; Blank());;
        Set(varNombrePersonaNov, "");
        Set(varCompanyIdNov, Blank());
        Set(varPuedeRegistrarNovedad, false);


        Clear(colPersonaSeleccionadaNov);
        Clear(colProyectoSeleccionadoNov);

        Set(varProyectoNombreNov, Blank());
        Set(varTipoNovedadSeleccionadaNov, Blank());
