                  - cmbTipoNovedadNov:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        Font: =Font.'Open Sans Condensed'
                        InputTextPlaceholder: ="Seleccionar"
                        ItemDisplayText: =ThisItem.TipoNovedad
                        Items: |-
                          =If(
                              varTipoAplicacionNov = "PROYECTO" ||
                              varTipoAplicacionNov = "GENERAL",

                              Filter(
                                  colCatalogoNovedades,
                                  TipoNovedad = "FERIADO"
                              ),

                              Filter(
                                  colCatalogoNovedades,
                                  TipoNovedad <> "DESCANSO" &&
                                  TipoNovedad <> "FERIADO"
                              )
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                          =Set(
                              varTipoNovedadSeleccionadaNov,
                              cmbTipoNovedadNov.Selected.TipoNovedad
                          );

                          Set(
                              varPuedeRegistrarNovedad,
                              false
                          );

                          Clear(colNovedadPreview);
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
