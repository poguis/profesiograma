                  - btnVistaPreviaNov:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Outline
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        BorderRadius: =20
                        DisplayMode: |
                          =DisplayMode.Edit
                        Font: =Font.'Open Sans Condensed'
                        FontSize: =16
                        Icon: ="CheckmarkCircle"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =Clear(colNovedadPreview);

                          Set(varPuedeRegistrarNovedad, true);

                          If(
                              IsBlank(varTipoAplicacionNov),
                              Notify(
                                  "Selecciona el tipo de aplicación",
                                  NotificationType.Warning
                              );
                              Set(varPuedeRegistrarNovedad, false)
                          );

                          If(
                              varPuedeRegistrarNovedad &&
                              varTipoAplicacionNov = "PERSONA" &&
                              IsBlank(varNombrePersonaNov),
                              Notify(
                                  "Selecciona la persona",
                                  NotificationType.Warning
                              );
                              Set(varPuedeRegistrarNovedad, false)
                          );

                          If(
                              varPuedeRegistrarNovedad &&
                              varTipoAplicacionNov = "PROYECTO" &&
                              IsBlank(varProjectUIDNov),
                              Notify(
                                  "Selecciona el proyecto",
                                  NotificationType.Warning
                              );
                              Set(varPuedeRegistrarNovedad, false)
                          );

                          If(
                              varPuedeRegistrarNovedad &&
                              IsBlank(cmbTipoNovedadNov.Selected.TipoNovedad),
                              Notify(
                                  "Selecciona el tipo de novedad",
                                  NotificationType.Warning
                              );
                              Set(varPuedeRegistrarNovedad, false)
                          );

                          If(
                              varPuedeRegistrarNovedad &&
                              (
                                  IsBlank(fechaInicioNov.SelectedDate) ||
                                  IsBlank(fechaFinNov.SelectedDate)
                              ),
                              Notify(
                                  "Selecciona fecha inicio y fecha fin",
                                  NotificationType.Warning
                              );
                              Set(varPuedeRegistrarNovedad, false)
                          );

                          If(
                              varPuedeRegistrarNovedad &&
                              fechaFinNov.SelectedDate < fechaInicioNov.SelectedDate,
                              Notify(
                                  "La fecha fin debe ser mayor o igual a la fecha inicio",
                                  NotificationType.Error
                              );
                              Set(varPuedeRegistrarNovedad, false)
                          );

                          If(
                              varPuedeRegistrarNovedad,
                              ForAll(
                                  Sequence(
                                      DateDiff(
                                          fechaInicioNov.SelectedDate,
                                          fechaFinNov.SelectedDate,
                                          TimeUnit.Days
                                      ) + 1
                                  ) As d,
                                  With(
                                      {
                                          fechaDiaNov: DateAdd(
                                              fechaInicioNov.SelectedDate,
                                              d.Value - 1,
                                              TimeUnit.Days
                                          )
                                      },
                                      Collect(
                                          colNovedadPreview,
                                          {
                                              Fecha: fechaDiaNov,
                                              FechaClave: Text(
                                                  fechaDiaNov,
                                                  "[$-en-US]yyyy-mm-dd"
                                              ),
                                              TipoAplicacion: varTipoAplicacionNov,
                                              TipoNovedad: cmbTipoNovedadNov.Selected.TipoNovedad,
                                              CategoriaId: cmbTipoNovedadNov.Selected.CategoriaId,
                                              CategoriaDescripcion: cmbTipoNovedadNov.Selected.CategoriaDescripcion,
                                              EstadoExcel: cmbTipoNovedadNov.Selected.EstadoExcel,
                                              ObservacionExcel: cmbTipoNovedadNov.Selected.ObservacionExcel,
                                              Sigla: cmbTipoNovedadNov.Selected.Sigla,
                                              CorreoPersona: varCorreoPersonaNov,
                                              NombrePersona: varNombrePersonaNov,
                                              ProjectUID: varProjectUIDNov,
                                              CompanyId: varCompanyIdNov,
                                              NombreProyecto: varProyectoNombreNov,
                                              NombreMostrar: If(
                                                  varTipoAplicacionNov = "PERSONA",
                                                  varNombrePersonaNov,
                                                  If(
                                                      varTipoAplicacionNov = "PROYECTO",
                                                      varProyectoNombreNov,
                                                      "GENERAL"
                                                  )
                                              )
                                          }
                                      )
                                  )
                              );

                              Notify(
                                  "Vista previa generada correctamente",
                                  NotificationType.Success
                              )
                          );
                        Text: ="Ver"
                  - btnRegistrarNovedadNov:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Outline
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        BorderRadius: =20
                        DisplayMode: |-
                          =If(
                              CountRows(colNovedadPreview) = 0,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Font: =Font.'Open Sans Condensed'
                        FontSize: =16
                        Icon: ="CheckmarkCircle"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =Set(varNovedadUID, GUID());

                          Set(
                              varCodigoNovedad,
                              "NOV-" & Text(Today(), "yyyymmdd") & "-" & Right(Substitute(varNovedadUID, "-", ""), 6)
                          );

                          Set(
                              varDetalleNovedadJson,
                              JSON(
                                  {
                                      NovedadUID: varNovedadUID,
                                      TipoAplicacion: varTipoAplicacionNov,
                                      TipoNovedad: cmbTipoNovedadNov.Selected.TipoNovedad,
                                      CategoriaId: cmbTipoNovedadNov.Selected.CategoriaId,
                                      CategoriaDescripcion: cmbTipoNovedadNov.Selected.CategoriaDescripcion,
                                      EstadoExcel: cmbTipoNovedadNov.Selected.EstadoExcel,
                                      ObservacionExcel: cmbTipoNovedadNov.Selected.ObservacionExcel,
                                      Sigla: cmbTipoNovedadNov.Selected.Sigla,

                                      Persona: {
                                          Correo: varCorreoPersonaNov,
                                          Nombre: varNombrePersonaNov,
                                          Ekon: varEkonPersonaNov
                                      },

                                      OrigenPermiso: "aplicacionProyectos",
                                      Origen: "",

                                      Proyecto: {
                                          ProjectUID: varProjectUIDNov,
                                          CompanyId: varCompanyIdNov,
                                          NombreProyecto: varProyectoNombreNov
                                      },

                                      Fechas: {
                                          FechaInicio: Text(fechaInicioNov.SelectedDate, "yyyy-mm-dd"),
                                          FechaFin: Text(fechaFinNov.SelectedDate, "yyyy-mm-dd")
                                      },

                                      Dias: ForAll(
                                          colNovedadPreview,
                                          {
                                              Fecha: Text(Fecha, "yyyy-mm-dd"),
                                              FechaClave: FechaClave,
                                              EstadoExcel: EstadoExcel,
                                              ObservacionExcel: ObservacionExcel
                                          }
                                      ),

                                      Registro: {
                                          FechaRegistro: Text(Now(), "yyyy-mm-dd hh:mm:ss"),
                                          UsuarioRegistro: UsuariosdeOffice365.MyProfileV2().displayName,
                                          CorreoRegistro: UsuariosdeOffice365.MyProfileV2().userPrincipalName
                                      }
                                  },
                                  JSONFormat.Compact
                              )
                          );

                          Patch(
                              'NOVEDADES ASISTENCIA',
                              Defaults('NOVEDADES ASISTENCIA'),
                              {
                                  Título: varCodigoNovedad,
                                  NOVEDAD_UID: Text(varNovedadUID),
                                  TIPO_APLICACION: varTipoAplicacionNov,
                                  FECHA_INICIO: fechaInicioNov.SelectedDate,
                                  FECHA_FIN: fechaFinNov.SelectedDate,
                                  CORREO_PERSONA: varCorreoPersonaNov,
                                  PROJECT_UID: varProjectUIDNov,
                                  COMPANY_ID: varCompanyIdNov,
                                  ESTADO_NOVEDAD: "ACTIVA",
                                  DETALLE_JSON: varDetalleNovedadJson
                              }
                          );

                          Notify(
                              "Novedad registrada correctamente",
                              NotificationType.Success
                          );

                          Clear(colNovedadPreview);
                          Reset(cmbTipoAplicacionNov);
                          Reset(cmbPersonaNov);
                          Reset(cmbProyectoNov);
                          Reset(cmbTipoNovedadNov);
                          Reset(fechaInicioNov);
                          Reset(fechaFinNov);
                        Text: ="Registrar"
                        Width: =120
