                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =15
                  PaddingTop: =8
                Children:
                  - Button5_7:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        DisplayMode: |-
                          =If(
                              DateValue(Text(varRegistroAsistenciaSeleccionado.FechaAsistencia)) >= Today(),
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Font: =Font.'Open Sans Condensed'
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =If(
                              IsBlank(Trim(txtHoraSalida.Text)),

                              // Campo vacío
                              Notify("Por favor, ingresa la hora de salida.", NotificationType.Warning);
                              Set(cargarInfo, false),

                              !IsMatch(Trim(txtHoraSalida.Text), "^([01][0-9]|2[0-3]):[0-5][0-9]$"),

                              // Formato inválido
                              Notify("Formato de hora inválido. Usa formato 24H (Ej: 08:30 o 14:15).", NotificationType.Error);
                              Reset(txtHoraSalida),
                              Set(cargarInfo, false),

                              // Todo correcto -> guardamos
                              Patch(
                                  'SIG ASISTENCIAS',
                                  LookUp(
                                      'SIG ASISTENCIAS',
                                      ID = varRegistroAsistenciaSeleccionado.ID
                                  ),
                                  {
                                      HoraSalida: Trim(txtHoraSalida.Text)
                                  }
                              );

                              Notify("Hora de salida guardada.", NotificationType.Success);
                              Set(cargarInfo, true)
                          )
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =15
                        Text: ="REGISTRAR"
                        Width: =120
