            - btnEvidencia_12:
                Control: Button@0.0.45
                Properties:
                  AccessibleLabel: ="Seleccionar el registro"
                  BasePaletteColor: =RGBA(234, 10, 41, 1)
                  BorderRadius: =5
                  Font: =Font.'Open Sans Condensed'
                  FontColor: =RGBA(255, 255, 255, 1)
                  FontSize: =16
                  FontWeight: =FontWeight.Bold
                  Height: =35
                  Icon: ="CheckmarkCircle"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  OnSelect: |-
                    =/*
                    // 1. Preparamos el JSON con las 6 colecciones
                    UapdateContext({
                        varJSONEnvio: JSON(
                            {
                                'DEPARTAMENTO DE INFRAESTRUCTURA': colInfraestructuraIntegral;
                                'DEPARTAMENTO SEDEMI TELECOM': colTelecomunicaciones;
                                'DEPARTAMENTO SEDEMI PETROLEO Y GAS': colPetroleoGas;
                                'DEPARTAMENTO SEDEMI ENERGIA': colEnergia;
                                'DEPARTAMENTO DE INFRAESTRUCTURA METALICA': colInfraestructura;
                                'DEPARTAMENTO SEDEMI MINERIA': colMineria
                            };
                            JSONFormat.Compact
                        )
                    });;

                    // 2. Hacemos el Patch sobre el registro correcto (Tupla 666)
                    Patch(
                        'SIG PROYECTOS';
                        LookUp('SIG PROYECTOS'; Title = "666"); // <-- EL CAMBIO ESTÁ AQUÍ
                        {
                            PermisosGenerales: varJSONEnvio
                        }
                    );;

                    // 3. Actualizamos la variable global para que la app lea los nuevos datos de inmediato
                    Set(varRegistroPermisos; LookUp('SIG PROYECTOS'; Title = "666"));;

                    Notify("¡Configuración de permisos actualizada!"; NotificationType.Success);;
                    UpdateContext({varMostrarPopUp: false});;
                    */



                    // ===================================================================
                    // 1. RECOLECTAR A LOS NUEVOS Y AGRUPARLOS
                    // ===================================================================
                    Clear(colNuevosAvisos);

                    // Filtramos cada colección buscando solo los que tienen Notificado en false
                    ForAll(Filter(colInfraestructuraIntegral, !Notificado), Collect(colNuevosAvisos, {Email: Usuario, Nombre: Nombre, Depto: "Infraestructura Integral"}));
                    ForAll(Filter(colTelecomunicaciones, !Notificado), Collect(colNuevosAvisos, {Email: Usuario, Nombre: Nombre, Depto: "Telecomunicaciones"}));
                    ForAll(Filter(colPetroleoGas, !Notificado), Collect(colNuevosAvisos, {Email: Usuario, Nombre: Nombre, Depto: "Petróleo y Gas"}));
                    ForAll(Filter(colEnergia, !Notificado), Collect(colNuevosAvisos, {Email: Usuario, Nombre: Nombre, Depto: "Energía"}));
                    ForAll(Filter(colInfraestructura, !Notificado), Collect(colNuevosAvisos, {Email: Usuario, Nombre: Nombre, Depto: "Infraestructura Metálica"}));
                    ForAll(Filter(colMineria, !Notificado), Collect(colNuevosAvisos, {Email: Usuario, Nombre: Nombre, Depto: "Minería"}));
                    ForAll(Filter(colSig, !Notificado), Collect(colNuevosAvisos, {Email: Usuario, Nombre: Nombre, Depto: "Sistema Integrado de Gestión"}));

                    // Extraemos los correos únicos
                    ClearCollect(colUsuariosUnicosNuevos, Distinct(colNuevosAvisos, Email));

                    // ===================================================================
                    // 2. ARMAR EL PAQUETE PARA POWER AUTOMATE Y EJECUTAR EL FLUJO
                    // ===================================================================
                    Clear(colDataParaFlujo);

                    ForAll(
                        colUsuariosUnicosNuevos As Destinatario,
                        With(
                            {
                                // Buscamos el nombre de la persona
                                varNombrePersona: LookUp(colNuevosAvisos, Email = Destinatario.Value).Nombre,
                                // Concatenamos todos los departamentos (las etiquetas) en los que fue ingresado
                                varDepartamentosNuevos: Concat(Filter(colNuevosAvisos, Email = Destinatario.Value), Depto, ", ")
                            },
                            Collect(
                                colDataParaFlujo,
                                {
                                    Correo: Destinatario.Value,
                                    Nombre: varNombrePersona,
                                    Departamentos: varDepartamentosNuevos
                                }
                            )
                        )
                    );


                    // Si encontramos personas nuevas, enviamos el JSON al flujo
                    If(
                        CountRows(colDataParaFlujo) > 0,
                        ReporteProyectosSIG.Run(
                            JSON(colDataParaFlujo, JSONFormat.IgnoreUnsupportedTypes),
                            "NOTIFICAR",
                            ""
                        ) // Cambia 'FlujoNotificarSIGProyectos' por el nombre real de tu flujo
                    );


                    // ===================================================================
                    // 3. ACTUALIZAR LAS COLECCIONES AL NUEVO ESTADO (Marcarlos como notificados)
                    // ===================================================================
                    UpdateIf(colInfraestructuraIntegral, !Notificado, {Notificado: true});
                    UpdateIf(colTelecomunicaciones, !Notificado, {Notificado: true});
                    UpdateIf(colPetroleoGas, !Notificado, {Notificado: true});
                    UpdateIf(colEnergia, !Notificado, {Notificado: true});
                    UpdateIf(colInfraestructura, !Notificado, {Notificado: true});
                    UpdateIf(colMineria, !Notificado, {Notificado: true});
                    UpdateIf(colSig, !Notificado, {Notificado: true});

                    // ===================================================================
                    // 4. GUARDAR EN LA BASE DE DATOS
                    // ===================================================================
                    UpdateContext({
                        varJSONEnvio: JSON(
                            {
                                'DEPARTAMENTO DE INFRAESTRUCTURA': colInfraestructuraIntegral,
                                'DEPARTAMENTO SEDEMI TELECOM': colTelecomunicaciones,
                                'DEPARTAMENTO SEDEMI PETROLEO Y GAS': colPetroleoGas,
                                'DEPARTAMENTO SEDEMI ENERGIA': colEnergia,
                                'DEPARTAMENTO DE INFRAESTRUCTURA METALICA': colInfraestructura,
                                'DEPARTAMENTO SEDEMI MINERIA': colMineria,
                                'UNIDAD SISTEMA INTEGRADO DE GESTION': colSig
                            },
                            JSONFormat.Compact
                        )
                    });

                    Patch(
                        'SIG PROYECTOS',
                        LookUp('SIG PROYECTOS', Título = "666"),
                        {
                            PermisosGenerales: varJSONEnvio
                        }
                    );

                    Set(varRegistroPermisos, LookUp('SIG PROYECTOS', Título = "666"));

                    Notify("¡Configuración guardada! Se enviaron las notificaciones a los nuevos usuarios.", NotificationType.Success);
                    UpdateContext({varMostrarPopUp: false});
                  Text: ="GUARDAR"
                  Width: =200
                  X: =40
                  Y: =40
