    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =
        /*
        ClearCollect(colInfraestructuraIntegral; {Nombre: ""; Departamento: ""; Usuario: ""});; 
        Clear(colInfraestructuraIntegral);;

        ClearCollect(colTelecomunicaciones; {Nombre: ""; Departamento: ""; Usuario: ""});;
        Clear(colTelecomunicaciones);;

        ClearCollect(colPetroleoGas; {Nombre: ""; Departamento: ""; Usuario: ""});;
        Clear(colPetroleoGas);;

        ClearCollect(colEnergia; {Nombre: ""; Departamento: ""; Usuario: ""});;
        Clear(colEnergia);;

        ClearCollect(colInfraestructura; {Nombre: ""; Departamento: ""; Usuario: ""});;
        Clear(colInfraestructura);;

        ClearCollect(colMineria; {Nombre: ""; Departamento: ""; Usuario: ""});; 
        Clear(colMineria);;
        */




        With(
            { _jsonParseado: ParseJSON(varRegistroPermisos.PermisosGenerales) },

            // 1. Llenamos Infraestructura Integral
            ClearCollect(
                colInfraestructuraIntegral,
                IfError(
                    ForAll(
                        Table(_jsonParseado.'DEPARTAMENTO DE INFRAESTRUCTURA'),
                        { Nombre: Text(Value.Nombre), Correo: Text(Value.Correo), Usuario: Text(Value.Usuario) }
                    ),
                    []
                )
            );

            // 2. Llenamos Infraestructura Metálica
            ClearCollect(
                colInfraestructura,
                IfError(
                    ForAll(
                        Table(_jsonParseado.'DEPARTAMENTO DE INFRAESTRUCTURA METALICA'),
                        { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario) }
                    ),
                    []
                )
            );

            // 3. Llenamos Telecomunicaciones
            ClearCollect(
                colTelecomunicaciones,
                IfError(
                    ForAll(
                        Table(_jsonParseado.'DEPARTAMENTO SEDEMI TELECOM'),
                        { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario) }
                    ),
                    []
                )
            );

            // 4. Llenamos Petróleo y Gas
            ClearCollect(
                colPetroleoGas,
                IfError(
                    ForAll(
                        Table(_jsonParseado.'DEPARTAMENTO SEDEMI PETROLEO Y GAS'),
                        { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario) }
                    ),
                    []
                )
            );

            // 5. Llenamos Energía
            ClearCollect(
                colEnergia,
                IfError(
                    ForAll(
                        Table(_jsonParseado.'DEPARTAMENTO SEDEMI ENERGIA'),
                        { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario) }
                    ),
                    []
                )
            );

            // 6. Llenamos Minería
            ClearCollect(
                colMineria,
                IfError(
                    ForAll(
                        Table(_jsonParseado.'DEPARTAMENTO SEDEMI MINERIA'),
                        { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario) }
                    ),
                    []
                )
            );
        )
