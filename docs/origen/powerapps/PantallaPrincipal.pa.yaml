rio: Text(Value.Usuario)\n            }\n        )\n    );;\n    ClearCollect(\n        colInfraestructura;\n        ForAll(\n            Table(varDatosGuardados.Infraestructura);\n            {\n                Nombre: Text(Value.Nombre);\n                Departamento: Text(Value.Departamento);\n                Usuario: Text(Value.Usuario)\n            }\n        )\n    );;\n    ClearCollect(\n        colMineria;\n        ForAll(\n            Table(varDatosGuardados.Mineria);\n            {\n                Nombre: Text(Value.Nombre);\n                Departamento: Text(Value.Departamento);\n                Usuario: Text(Value.Usuario)\n            }\n        )\n    ) // <-- Separador del argumento Falso del If()\n)\n*/\n\n// 1. Buscamos el registro específico y lo guardamos en una variable\nUpdateContext({varRegistroActual: LookUp('SIG PROYECTOS', Título = \"666\")});\n\n// 2. Evaluamos los permisos usando If() y tu variable global del OnStart\nIf(\n    // Condición: El correo está en el JSON de PermisosGenerales OR es un Super Admin\n    //User().Email in varRegistroActual.PermisosGenerales Or varEsSuperAdmin;\n    varEsSuperAdmin,\n    \n    // --- ACCIONES SI EL USUARIO SÍ TIENE PERMISOS ---\n    \n    // Abrimos el PopUp\n    UpdateContext({varMostrarPopUp: true});\n    \n    // \"Parseamos\" el JSON que está en la columna PermisosGenerales\n    UpdateContext({varDatosGuardados: ParseJSON(varRegistroActual.PermisosGenerales)});\n    \n    // Llenamos las 6 colecciones con los nombres CORRECTOS\n    ClearCollect(\n        colInfraestructuraIntegral,\n        IfError(\n            ForAll(\n                Table(varDatosGuardados.'DEPARTAMENTO DE INFRAESTRUCTURA'),\n                { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario), Notificado: IfError(Boolean(Value.Notificado), true) }\n            ),\n            []\n        )\n    );\n    ClearCollect(\n        colTelecomunicaciones,\n        IfError(\n            ForAll(\n                Table(varDatosGuardados.'DEPARTAMENTO SEDEMI TELECOM'),\n                { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario), Notificado: IfError(Boolean(Value.Notificado), true) }\n            ),\n            []\n        )\n    );\n    ClearCollect(\n        colPetroleoGas,\n        IfError(\n            ForAll(\n                Table(varDatosGuardados.'DEPARTAMENTO SEDEMI PETROLEO Y GAS'),\n                { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario), Notificado: IfError(Boolean(Value.Notificado), true) }\n            ),\n            []\n        )\n    );\n    ClearCollect(\n        colEnergia,\n        IfError(\n            ForAll(\n                Table(varDatosGuardados.'DEPARTAMENTO SEDEMI ENERGIA'),\n                { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario), Notificado: IfError(Boolean(Value.Notificado), true) }\n            ),\n            []\n        )\n    );\n    ClearCollect(\n        colInfraestructura,\n        IfError(\n            ForAll(\n                Table(varDatosGuardados.'DEPARTAMENTO DE INFRAESTRUCTURA METALICA'),\n                { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario), Notificado: IfError(Boolean(Value.Notificado), true) }\n            ),\n            []\n        )\n    );\n    ClearCollect(\n        colMineria,\n        IfError(\n            ForAll(\n                Table(varDatosGuardados.'DEPARTAMENTO SEDEMI MINERIA'),\n                { Nombre: Text(Value.Nombre), Departamento: Text(Value.Departamento), Usuario: Text(Value.Usuario), Notificado: IfError(Boolean(Value.Notificado), true) }\n            ),\n            []\n        )\n    );\n    ClearCollect(\n        colSig,\n        IfError(\n            ForAll(\n                Table(varDatosGuardados.'UNIDAD SISTEMA INTEGRADO DE GESTION'),\n     