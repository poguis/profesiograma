                  - Contenedor_Botones_7:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingRight: =24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        X: =20
                      Children:
                        - SubmitButton2_9:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(249, 83, 109, 1)
                              BorderRadius: =20
                              DisplayMode: |-
                                =If(
                                    //estadoEdit.Selected.Value = "TERMINADO" ||
                                    IsEmpty(colAsignacionesPreview) ||
                                    CountRows(colConflictosAsignacion) > 0 ||
                                    varRequiereRegenerar,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Font: =Font.'Open Sans Condensed'
                              FontSize: =16
                              Icon: ="CheckmarkCircle"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =Set(varPuedeRegistrarProyecto, true);
                                Set(cargarInfo, true);

                                // ==============================================================================
                                // 1. VALIDACIONES
                                // ==============================================================================
                                If(
                                    varRequiereRegenerar,
                                    Notify("Debes regenerar antes de registrar los cambios", NotificationType.Warning);
                                    Set(varPuedeRegistrarProyecto, false)
                                );

                                If(
                                    CountRows(colConflictosAsignacion) > 0,
                                    Notify("No puedes registrar porque existen conflictos", NotificationType.Error);
                                    Set(varPuedeRegistrarProyecto, false)
                                );

                                If(
                                    IsEmpty(colAsignacionesPreview) || IsEmpty(colAsignacionesDiario),
                                    Notify("No existen asignaciones generadas para registrar", NotificationType.Warning);
                                    Set(varPuedeRegistrarProyecto, false)
                                );

                                Set(
                                    varActividadCambiada,
                                    gblGrupoProyecto = "CAMPO" &&
                                    !IsBlank(varActivityIdEdit) &&
                                    varActivityIdEdit <> gblActivityIdProyecto
                                );

                                If(
                                    varActividadCambiada && IsBlank(fechaActividadDesdeEdit_1.SelectedDate),
                                    Notify("Selecciona desde qué fecha aplica la nueva actividad", NotificationType.Warning);
                                    Set(varPuedeRegistrarProyecto, false)
                                );

                                If(
                                    varActividadCambiada &&
                                    (
                                        fechaActividadDesdeEdit_1.SelectedDate < inicioProyectoEdit_1.SelectedDate ||
                                        fechaActividadDesdeEdit_1.SelectedDate > finProyectoEdit_1.SelectedDate
                                    ),
                                    Notify("La fecha de cambio de actividad debe estar dentro del rango del proyecto", NotificationType.Warning);
                                    Set(varPuedeRegistrarProyecto, false)
                                );

                                If(
                                    varEstadoCambiado && !varEstadoRegenerado,
                                    Notify("Primero debes aplicar o regenerar el cambio de estado antes de registrar", NotificationType.Warning);
                                    Set(varPuedeRegistrarProyecto, false)
                                );

                                If(
                                    varPuedeRegistrarProyecto,

                                    Set(varErrorGuardado, false);
                                    Set(varPerfilUsuario, UsuariosdeOffice365.MyProfileV2());
                                    Set(varNombreUsuario, Text(varPerfilUsuario.displayName));
                                    Set(varCorreoUsuario, Lower(Trim(Text(varPerfilUsuario.userPrincipalName))));

                                    Set(varEsCorteEstado, varTipoMovimientoEstado = "SUSPENSION" || varTipoMovimientoEstado = "CIERRE");
                                    Set(varFechaFinGuardar, If(varEsCorteEstado, fechaMovimientoEstadoEdit_1.SelectedDate, finProyectoEdit_1.SelectedDate));
                                    Set(varCorteGuardar, varFechaCorteEdicion);

                                    // ==============================================================================
                                    // 2. PERSONAL A GUARDAR
                                    // ==============================================================================
                                    If(
                                        varEsCorteEstado,

                                        ClearCollect(colPrincipalesGuardar, colPrincipalesProyecto);
                                        ClearCollect(colBacksGuardar, colBacksProyecto),

                                        ClearCollect(colPrincipalesGuardar, Filter(colPrincipalesHistoricos, FechaFin < varFechaCorteEdicion));
                                        Collect(colPrincipalesGuardar, colPrincipalesProyecto);
                                        ClearCollect(colBacksGuardar, Filter(colBacksHistoricos, DateAdd(FechaFin, DiasDescanso, TimeUnit.Days) < varFechaCorteEdicion));
                                        Collect(colBacksGuardar, colBacksProyecto)
                                    );

                                    // ==============================================================================
                                    // 3. HISTORIAL DE ACTIVIDADES
                                    // ==============================================================================
                                    If(
                                        varActividadCambiada,

                                        Set(varFechaCambioActividad, fechaActividadDesdeEdit_1.SelectedDate);

                                        ClearCollect(colHistorialActividadesTmp, Filter(colHistorialActividades, FechaInicio < varFechaCambioActividad));

                                        Set(varActividadAnterior, Last(SortByColumns(colHistorialActividadesTmp, "FechaInicio", SortOrder.Ascending)));

                                        If(
                                            !IsBlank(varActividadAnterior.MovimientoId) && varActividadAnterior.FechaFin >= varFechaCambioActividad,
                                            Patch(
                                                colHistorialActividadesTmp,
                                                LookUp(colHistorialActividadesTmp, MovimientoId = varActividadAnterior.MovimientoId),
                                                {FechaFin: DateAdd(varFechaCambioActividad, -1, TimeUnit.Days)}
                                            )
                                        );

                                        Collect(
                                            colHistorialActividadesTmp,
                                            {
                                                MovimientoId: Text(GUID()),
                                                Version: CountRows(colHistorialActividades) + 1,
                                                TipoMovimiento: "CAMBIO_ACTIVIDAD",
                                                FechaRegistro: Text(Now(), "[$-en-US]yyyy-mm-dd hh:mm:ss"),
                                                UsuarioRegistro: varNombreUsuario,
                                                CorreoRegistro: varCorreoUsuario,
                                                FechaInicio: varFechaCambioActividad,
                                                FechaFin: finProyectoEdit_1.SelectedDate,
                                                ActivityId: varActivityIdEdit,
                                                ActivityDescription: varActivityNameEdit,
                                                ActivityType: varActivityTypeEdit
                                            }
                                        );

                                        ClearCollect(colHistorialActividades, SortByColumns(colHistorialActividadesTmp, "FechaInicio", SortOrder.Ascending));

                                        Set(gblActivityIdProyecto, varActivityIdEdit);
                                        Set(gblActividadProyecto, varActivityNameEdit);
                                        Set(gblActivityTypeProyecto, varActivityTypeEdit);
                                        Set(varActividadCambiadaVista, false)
                                    );

                                    // ==============================================================================
                                    // 4. DESCANSOS DE PRINCIPALES (solo dentro del tramo del principal)
                                    // ==============================================================================
                                    Clear(colDescansosPrincipalTmp);

                                    ForAll(
                                        Filter(colAsignacionesPreview, Rol = "PRINCIPAL") As blq,
                                        With(
                                            {
                                                principalBloque: First(
                                                    SortByColumns(
                                                        Filter(
                                                            colPrincipalesGuardar,
                                                            PrincipalId = blq.PrincipalId &&
                                                            Text(Ekon) = Text(blq.ResponsableEkon) &&
                                                            FechaInicio <= blq.FechaFin
                                                        ),
                                                        "FechaInicio",
                                                        SortOrder.Descending
                                                    )
                                                )
                                            },
                                            With(
                                                {
                                                    diasDesc: Coalesce(Value(principalBloque.DiasDescanso), 0),
                                                    finPrincipal: principalBloque.FechaFin,
                                                    fechaSig: DateAdd(blq.FechaFin, 1, TimeUnit.Days)
                                                },
                                                If(
                                                    diasDesc > 0 &&
                                                    !IsBlank(finPrincipal) &&
                                                    fechaSig <= finPrincipal &&
                                                    IsBlank(LookUp(colAsignacionesDiario, Text(ResponsableEkon) = Text(blq.ResponsableEkon) && Fecha = fechaSig)),
                                                    ForAll(
                                                        Filter(Sequence(diasDesc), DateAdd(blq.FechaFin, Value, TimeUnit.Days) <= finPrincipal) As s,
                                                        Collect(
                                                            colDescansosPrincipalTmp,
                                                            {
                                                                Fecha: DateAdd(blq.FechaFin, s.Value, TimeUnit.Days),
                                                                Bloque: blq.Bloque,
                                                                Rol: "DESCANSO",
                                                                TipoAsignacion: "AUTO",
                                                                PrincipalId: blq.PrincipalId,
                                                                BackId: Blank(),
                                                                ResponsableNombre: blq.ResponsableNombre,
                                                                ResponsableCedula: blq.ResponsableCedula,
                                                                ResponsableEkon: Text(blq.ResponsableEkon),
                                                                ResponsableCorreo: blq.ResponsableCorreo,
                                                                ResponsableCargo: blq.ResponsableCargo
                                                            }
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    );

                                    // ==============================================================================
                                    // 5. FILAS DE DETALLE A INSERTAR (solo desde la fecha de corte)
                                    // ==============================================================================
                                    ClearCollect(
                                        colDetalleGuardarTmp,
                                        ForAll(
                                            Filter(colAsignacionesDiario, Fecha >= varCorteGuardar) As d,
                                            {
                                                CLAVE: varUidProyectoEdit & "|" & Text(d.ResponsableEkon) & "|" & Text(d.Fecha, "[$-en-US]yyyy-mm-dd") & "|" & Text(d.Rol),
                                                FECHA: d.Fecha,
                                                EKON: Value(Text(d.ResponsableEkon)),
                                                ROL: Text(d.Rol),
                                                TIPO_ASIGNACION: Text(d.TipoAsignacion),
                                                BLOQUE: Value(Text(d.Bloque)),
                                                PRINCIPAL_ID: Value(Text(d.PrincipalId)),
                                                BACK_ID: Value(Text(d.BackId)),
                                                NOMBRE_RESPONSABLE: Upper(Trim(Text(d.ResponsableNombre))),
                                                CEDULA: Text(d.ResponsableCedula),
                                                CORREO_RESPONSABLE: Lower(Trim(Text(d.ResponsableCorreo))),
                                                CARGO: Text(d.ResponsableCargo)
                                            }
                                        )
                                    );

                                    Collect(
                                        colDetalleGuardarTmp,
                                        ForAll(
                                            Filter(colDescansosPrincipalTmp, Fecha >= varCorteGuardar) As d,
                                            {
                                                CLAVE: varUidProyectoEdit & "|" & Text(d.ResponsableEkon) & "|" & Text(d.Fecha, "[$-en-US]yyyy-mm-dd") & "|" & Text(d.Rol),
                                                FECHA: d.Fecha,
                                                EKON: Value(Text(d.ResponsableEkon)),
                                                ROL: Text(d.Rol),
                                                TIPO_ASIGNACION: Text(d.TipoAsignacion),
                                                BLOQUE: Value(Text(d.Bloque)),
                                                PRINCIPAL_ID: Value(Text(d.PrincipalId)),
                                                BACK_ID: Value(Text(d.BackId)),
                                                NOMBRE_RESPONSABLE: Upper(Trim(Text(d.ResponsableNombre))),
                                                CEDULA: Text(d.ResponsableCedula),
                                                CORREO_RESPONSABLE: Lower(Trim(Text(d.ResponsableCorreo))),
                                                CARGO: Text(d.ResponsableCargo)
                                            }
                                        )
                                    );

                                    ClearCollect(
                                        colDetalleGuardar,
                                        ForAll(
                                            Distinct(colDetalleGuardarTmp, CLAVE) As k,
                                            LookUp(colDetalleGuardarTmp, CLAVE = k.Value)
                                        )
                                    );

                                    // ==============================================================================
                                    // 6. SIG_ASIGNACIONES_DETALLE: borrar desde el corte e insertar
                                    // ==============================================================================
                                    IfError(
                                        Remove(
                                            SIG_ASIGNACIONES_DETALLE,
                                            Filter(SIG_ASIGNACIONES_DETALLE, PROYECTO_UID = varUidProyectoEdit && FECHA >= varCorteGuardar)
                                        ),
                                        Set(varErrorGuardado, true);
                                        Notify("Error al limpiar el detalle desde la fecha de corte", NotificationType.Error);
                                        Blank()
                                    );

                                    If(
                                        !varErrorGuardado && CountRows(colDetalleGuardar) > 0,
                                        IfError(
                                            Collect(
                                                SIG_ASIGNACIONES_DETALLE,
                                                ForAll(
                                                    colDetalleGuardar As r,
                                                    {
                                                        Título: r.CLAVE,
                                                        PROYECTO_UID: varUidProyectoEdit,
                                                        CODIGO_PROYECTO: varProyectoSeleccionado.Título,
                                                        NOMBRE_PROYECTO: gblNombreVisualProyecto,
                                                        CORREO_CREADOR: gblCorreoCreadorProyecto,
                                                        FECHA: r.FECHA,
                                                        EKON: r.EKON,
                                                        ROL: r.ROL,
                                                        TIPO_ASIGNACION: r.TIPO_ASIGNACION,
                                                        BLOQUE: r.BLOQUE,
                                                        PRINCIPAL_ID: r.PRINCIPAL_ID,
                                                        BACK_ID: r.BACK_ID,
                                                        NOMBRE_RESPONSABLE: r.NOMBRE_RESPONSABLE,
                                                        CEDULA: r.CEDULA,
                                                        CORREO_RESPONSABLE: r.CORREO_RESPONSABLE,
                                                        CARGO: r.CARGO
                                                    }
                                                )
                                            ),
                                            Set(varErrorGuardado, true);
                                            Notify("Error al guardar el detalle diario", NotificationType.Error);
                                            Blank()
                                        )
                                    );

                                    // ==============================================================================
                                    // 7. SIG_ASIGNACIONES_PERSONAL: reemplazar el personal del proyecto
                                    // ==============================================================================
                                    If(
                                        !varErrorGuardado,
                                        IfError(
                                            Remove(
                                                SIG_ASIGNACIONES_PERSONAL,
                                                Filter(SIG_ASIGNACIONES_PERSONAL, PROYECTO_UID = varUidProyectoEdit)
                                            ),
                                            Set(varErrorGuardado, true);
                                            Notify("Error al limpiar el personal del proyecto", NotificationType.Error);
                                            Blank()
                                        )
                                    );

                                    If(
                                        !varErrorGuardado && CountRows(colPrincipalesGuardar) > 0,
                                        IfError(
                                            Collect(
                                                SIG_ASIGNACIONES_PERSONAL,
                                                ForAll(
                                                    colPrincipalesGuardar As p,
                                                    {
                                                        Título: varProyectoSeleccionado.Título & "|PRINCIPAL|" & Text(p.PrincipalId),
                                                        PROYECTO_UID: varUidProyectoEdit,
                                                        ROL: "PRINCIPAL",
                                                        PERSONA_ID: Value(Text(p.PrincipalId)),
                                                        PRINCIPAL_ID_RELACIONADO: Blank(),
                                                        EKON: Value(Text(p.Ekon)),
                                                        NOMBRE: Upper(Trim(Text(p.Nombre))),
                                                        CEDULA: Text(p.Cedula),
                                                        CORREO: Lower(Trim(Text(p.Correo))),
                                                        CARGO: Text(p.Cargo),
                                                        FECHA_INICIO: p.FechaInicio,
                                                        FECHA_FIN: p.FechaFin,
                                                        DIAS_TRABAJO: Value(Text(p.DiasTrabajo)),
                                                        DIAS_DESCANSO: Value(Text(p.DiasDescanso)),
                                                        JORNADA_CODIGO: Text(p.JornadaCodigo),
                                                        JORNADA_DESCRIPCION: Text(p.JornadaDescripcion),
                                                        ES_PRINCIPAL_INICIAL: Coalesce(p.EsPrincipalInicial, false),
                                                        TIPO_REGISTRO: "Jornada",
                                                        OBSERVACION: ""
                                                    }
                                                )
                                            ),
                                            Set(varErrorGuardado, true);
                                            Notify("Error al guardar los principales", NotificationType.Error);
                                            Blank()
                                        )
                                    );

                                    If(
                                        !varErrorGuardado && CountRows(colBacksGuardar) > 0,
                                        IfError(
                                            Collect(
                                                SIG_ASIGNACIONES_PERSONAL,
                                                ForAll(
                                                    colBacksGuardar As bk,
                                                    {
                                                        Título: varProyectoSeleccionado.Título & "|BACK|" & Text(bk.BackId),
                                                        PROYECTO_UID: varUidProyectoEdit,
                                                        ROL: "BACK",
                                                        PERSONA_ID: Value(Text(bk.BackId)),
                                                        PRINCIPAL_ID_RELACIONADO: Value(Text(bk.PrincipalIdRelacionado)),
                                                        EKON: Value(Text(bk.Ekon)),
                                                        NOMBRE: Upper(Trim(Text(bk.Nombre))),
                                                        CEDULA: Text(bk.Cedula),
                                                        CORREO: Lower(Trim(Text(bk.Correo))),
                                                        CARGO: Text(bk.Cargo),
                                                        FECHA_INICIO: bk.FechaInicio,
                                                        FECHA_FIN: bk.FechaFin,
                                                        DIAS_TRABAJO: Blank(),
                                                        DIAS_DESCANSO: Value(Coalesce(Text(bk.DiasDescanso), "0")),
                                                        JORNADA_CODIGO: "",
                                                        JORNADA_DESCRIPCION: "",
                                                        ES_PRINCIPAL_INICIAL: false,
                                                        TIPO_REGISTRO: Coalesce(Text(bk.TipoRegistro), "Jornada"),
                                                        OBSERVACION: Coalesce(Text(bk.Observacion), "")
                                                    }
                                                )
                                            ),
                                            Set(varErrorGuardado, true);
                                            Notify("Error al guardar los backs", NotificationType.Error);
                                            Blank()
                                        )
                                    );

                                    // ==============================================================================
                                    // 8. SIG_HISTORIAL: nueva etapa (solo metadatos)
                                    // ==============================================================================
                                    Set(
                                        varTipoMovimientoGuardar,
                                        Switch(
                                            varTipoMovimientoEstado,
                                            "SUSPENSION", "SUSPENSION",
                                            "CIERRE", "CIERRE",
                                            "REACTIVACION", "REACTIVACION",
                                            "ACTUALIZACION_PERSONAL"
                                        )
                                    );

                                    If(
                                        !varErrorGuardado && varAsignacionRegenerada,
                                        IfError(
                                            Patch(
                                                SIG_HISTORIAL,
                                                Defaults(SIG_HISTORIAL),
                                                {
                                                    Título: varTipoMovimientoGuardar,
                                                    PROYECTO_UID: varUidProyectoEdit,
                                                    ETAPA_ID: Text(GUID()),
                                                    VERSION: CountRows(colEtapasHistoricas) + 1,
                                                    ESTADO_PROYECTO: estadoEdit_1.Selected.Value,
                                                    FECHA_REGISTRO: Now(),
                                                    USUARIO_REGISTRO: varNombreUsuario,
                                                    CORREO_REGISTRO: varCorreoUsuario,
                                                    FECHA_INICIO: If(varTipoMovimientoEstado = "REACTIVACION", fechaMovimientoEstadoEdit_1.SelectedDate, inicioProyectoEdit_1.SelectedDate),
                                                    FECHA_FIN: varFechaFinGuardar,
                                                    FECHA_CORTE: varCorteGuardar,
                                                    ACTIVITY_ID: gblActivityIdProyecto,
                                                    SNAPSHOT_PERSONAL: JSON(
                                                        {
                                                            Principales: ForAll(
                                                                colPrincipalesGuardar,
                                                                {
                                                                    PrincipalId: PrincipalId,
                                                                    Ekon: Ekon,
                                                                    Nombre: Nombre,
                                                                    FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                                    FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                                    JornadaCodigo: JornadaCodigo,
                                                                    DiasTrabajo: DiasTrabajo,
                                                                    DiasDescanso: DiasDescanso
                                                                }
                                                            ),
                                                            Backs: ForAll(
                                                                colBacksGuardar,
                                                                {
                                                                    BackId: BackId,
                                                                    Ekon: Ekon,
                                                                    Nombre: Nombre,
                                                                    FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                                    FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                                    TipoRegistro: TipoRegistro,
                                                                    DiasDescanso: DiasDescanso
                                                                }
                                                            )
                                                        },
                                                        JSONFormat.Compact
                                                    )
                                                }
                                            ),
                                            Set(varErrorGuardado, true);
                                            Notify("Error al guardar el historial", NotificationType.Error);
                                            Blank()
                                        );

                                        Collect(
                                            colEtapasHistoricas,
                                            {
                                                EtapaId: Text(GUID()),
                                                Version: CountRows(colEtapasHistoricas) + 1,
                                                TipoMovimiento: varTipoMovimientoGuardar,
                                                EstadoProyecto: estadoEdit_1.Selected.Value,
                                                FechaRegistro: Text(Now(), "[$-en-US]yyyy-mm-dd hh:mm:ss"),
                                                UsuarioRegistro: varNombreUsuario,
                                                CorreoRegistro: varCorreoUsuario,
                                                FechaInicio: inicioProyectoEdit_1.SelectedDate,
                                                FechaFin: varFechaFinGuardar,
                                                ModeloAsignacion: "MULTIPLES_PRINCIPALES_BACK_MANUAL",
                                                PrincipalesJson: "[]",
                                                BacksJson: "[]",
                                                BloquesEtapaJson: "[]",
                                                DetalleDiarioEtapaJson: "[]",
                                                ActivityId: gblActivityIdProyecto,
                                                ActivityDescription: gblActividadProyecto,
                                                ActivityType: gblActivityTypeProyecto
                                            }
                                        )
                                    );

                                    // ==============================================================================
                                    // 9. SIG_HISTORIAL_ACTIVIDADES: reemplazar si cambió la actividad
                                    // ==============================================================================
                                    If(
                                        !varErrorGuardado && varActividadCambiada,
                                        IfError(
                                            Remove(
                                                SIG_HISTORIAL_ACTIVIDADES,
                                                Filter(SIG_HISTORIAL_ACTIVIDADES, PROYECTO_UID = varUidProyectoEdit)
                                            ),
                                            Set(varErrorGuardado, true);
                                            Notify("Error al limpiar el historial de actividades", NotificationType.Error);
                                            Blank()
                                        );
                                        If(
                                            !varErrorGuardado,
                                            IfError(
                                                Collect(
                                                    SIG_HISTORIAL_ACTIVIDADES,
                                                    ForAll(
                                                        colHistorialActividades As a,
                                                        {
                                                            Título: Text(a.MovimientoId),
                                                            PROYECTO_UID: varUidProyectoEdit,
                                                            VERSION: a.Version,
                                                            TIPO_MOVIMIENTO: a.TipoMovimiento,
                                                            FECHA_REGISTRO: IfError(DateTimeValue(a.FechaRegistro, "en-US"), Now()),
                                                            USUARIO_REGISTRO: a.UsuarioRegistro,
                                                            CORREO_REGISTRO: a.CorreoRegistro,
                                                            FECHA_INICIO: a.FechaInicio,
                                                            FECHA_FIN: a.FechaFin,
                                                            ACTIVITY_ID: a.ActivityId,
                                                            ACTIVITY_DESCRIPTION: a.ActivityDescription,
                                                            ACTIVITY_TYPE: a.ActivityType
                                                        }
                                                    )
                                                ),
                                                Set(varErrorGuardado, true);
                                                Notify("Error al guardar el historial de actividades", NotificationType.Error);
                                                Blank()
                                            )
                                        )
                                    );

                                    // ==============================================================================
                                    // 10. CABECERA: columnas + JSON liviano (compatibilidad)
                                    // ==============================================================================
                                    If(
                                        !varErrorGuardado,

                                        Set(
                                            varJsonInfGeneralEdit,
                                            JSON(
                                                {
                                                    HoraGeneracion: {FechaCreacion: Now()},
                                                    InfoRegistro: {
                                                        Usuario: gblUsuarioCreadorProyecto,
                                                        Correo: gblCorreoCreadorProyecto,
                                                        Uegp: ForAll(varUegpsCalculadas, {Categoria: Value})
                                                    },
                                                    InfoProyecto: {
                                                        Grupo: gblGrupoProyecto,
                                                        Compania: {CompanyId: gblCompanyIdProyecto, Nombre: gblCompaniaProyecto, Ruc: gblCompaniaRucProyecto},
                                                        Proyecto: {ProjectId: gblProjectIdProyecto, Nombre: gblNombreProyecto, Estado: gblEstadoApiProyecto},
                                                        Dimension: {UegpId: gblUegpIdProyecto, Descripcion: gblDimensionProyecto},
                                                        Actividad: {ActivityId: gblActivityIdProyecto, Descripcion: gblActividadProyecto, Tipo: gblActivityTypeProyecto},
                                                        Horario: {
                                                            Codigo: gblCodigoHorario,
                                                            Descripcion: gblDescripcionHorario,
                                                            Entrada: gblEntradaHorario,
                                                            Salida: gblSalidaHorario,
                                                            Horas: gblHorasHorario,
                                                            HorasTrabajadas: gblHorasTrabHorario,
                                                            Tipo: gblTipoHorario,
                                                            SalidaAlmuerzo: gblSalidaAlmuerzo,
                                                            RegresoAlmuezo: gblRegresoAlmuerzo
                                                        }
                                                    },
                                                    Planificacion: {
                                                        FechaInicio: Text(gblFechaInicioProyecto, "[$-en-US]yyyy-mm-dd"),
                                                        FechaFin: Text(varFechaFinGuardar, "[$-en-US]yyyy-mm-dd")
                                                    },
                                                    Responsables: {
                                                        Principales: ForAll(
                                                            colPrincipalesGuardar,
                                                            {
                                                                PrincipalId: PrincipalId, EsPrincipalInicial: EsPrincipalInicial,
                                                                Nombre: Nombre, Cedula: Cedula, Ekon: Ekon, Correo: Correo, Cargo: Cargo,
                                                                FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                                FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                                JornadaCodigo: JornadaCodigo, JornadaDescripcion: JornadaDescripcion,
                                                                DiasTrabajo: DiasTrabajo, DiasDescanso: DiasDescanso
                                                            }
                                                        ),
                                                        Backs: ForAll(
                                                            colBacksGuardar,
                                                            {
                                                                BackId: BackId, PrincipalIdRelacionado: PrincipalIdRelacionado,
                                                                Nombre: Nombre, Cedula: Cedula, Ekon: Ekon, Correo: Correo, Cargo: Cargo,
                                                                FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                                FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                                Observacion: Observacion, TipoRegistro: TipoRegistro, DiasDescanso: DiasDescanso
                                                            }
                                                        )
                                                    }
                                                },
                                                JSONFormat.Compact
                                            )
                                        );

                                        Set(
                                            varJsonAsignacionesEdit,
                                            JSON(
                                                {
                                                    Configuracion: {
                                                        FechaInicio: Text(gblFechaInicioProyecto, "[$-en-US]yyyy-mm-dd"),
                                                        FechaFin: Text(varFechaFinGuardar, "[$-en-US]yyyy-mm-dd"),
                                                        ModeloAsignacion: "MULTIPLES_PRINCIPALES_BACK_MANUAL",
                                                        Reglas: {MaxPrincipales: 5, MaxBacks: 5, PrincipalConJornada: true, BackManual: true, DiaTraspasoCompartido: true}
                                                    },
                                                    Resumen: {
                                                        Principales: CountRows(colPrincipalesGuardar),
                                                        Backs: CountRows(colBacksGuardar),
                                                        Tramos: CountRows(colAsignacionesPreview),
                                                        Dias: CountRows(colAsignacionesDiario)
                                                    },
                                                    Principales: ForAll(
                                                        colPrincipalesGuardar,
                                                        {
                                                            PrincipalId: PrincipalId, EsPrincipalInicial: EsPrincipalInicial,
                                                            Nombre: Nombre, Cedula: Cedula, Ekon: Ekon, Correo: Correo, Cargo: Cargo,
                                                            FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                            FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                            JornadaCodigo: JornadaCodigo, JornadaDescripcion: JornadaDescripcion,
                                                            DiasTrabajo: DiasTrabajo, DiasDescanso: DiasDescanso
                                                        }
                                                    ),
                                                    Backs: ForAll(
                                                        colBacksGuardar,
                                                        {
                                                            BackId: BackId, PrincipalIdRelacionado: PrincipalIdRelacionado,
                                                            Nombre: Nombre, Cedula: Cedula, Ekon: Ekon, Correo: Correo, Cargo: Cargo,
                                                            FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                            FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                            Observacion: Observacion, TipoRegistro: TipoRegistro, DiasDescanso: DiasDescanso
                                                        }
                                                    ),
                                                    Bloques: ForAll(
                                                        colAsignacionesPreview,
                                                        {
                                                            Bloque: Bloque, Rol: Rol, TipoAsignacion: TipoAsignacion,
                                                            PrincipalId: PrincipalId, BackId: BackId,
                                                            ResponsableNombre: ResponsableNombre, ResponsableCedula: ResponsableCedula,
                                                            ResponsableEkon: ResponsableEkon, ResponsableCorreo: ResponsableCorreo, ResponsableCargo: ResponsableCargo,
                                                            FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                            FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                            DiasAsignados: DiasAsignados
                                                        }
                                                    ),
                                                    DetalleDiario: ForAll(
                                                        colAsignacionesDiario,
                                                        {
                                                            Fecha: Text(Fecha, "[$-en-US]yyyy-mm-dd"), FechaClave: FechaClave,
                                                            Bloque: Bloque, Rol: Rol, TipoAsignacion: TipoAsignacion,
                                                            PrincipalId: PrincipalId, BackId: BackId,
                                                            ResponsableNombre: ResponsableNombre, ResponsableCedula: ResponsableCedula,
                                                            ResponsableEkon: ResponsableEkon, ResponsableCorreo: ResponsableCorreo, ResponsableCargo: ResponsableCargo
                                                        }
                                                    ),
                                                    // Etapas: solo metadatos (ya no se copia el detalle en cada edición)
                                                    Etapas: ForAll(
                                                        colEtapasHistoricas,
                                                        {
                                                            EtapaId: EtapaId, Version: Version, TipoMovimiento: TipoMovimiento, EstadoProyecto: EstadoProyecto,
                                                            FechaRegistro: FechaRegistro, UsuarioRegistro: UsuarioRegistro, CorreoRegistro: CorreoRegistro,
                                                            FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                            FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                            ModeloAsignacion: ModeloAsignacion,
                                                            ActivityId: ActivityId, ActivityDescription: ActivityDescription, ActivityType: ActivityType
                                                        }
                                                    ),
                                                    HistorialActividades: ForAll(
                                                        colHistorialActividades,
                                                        {
                                                            MovimientoId: MovimientoId, Version: Version, TipoMovimiento: TipoMovimiento,
                                                            FechaRegistro: FechaRegistro, UsuarioRegistro: UsuarioRegistro, CorreoRegistro: CorreoRegistro,
                                                            FechaInicio: Text(FechaInicio, "[$-en-US]yyyy-mm-dd"),
                                                            FechaFin: Text(FechaFin, "[$-en-US]yyyy-mm-dd"),
                                                            ActivityId: ActivityId, ActivityDescription: ActivityDescription, ActivityType: ActivityType
                                                        }
                                                    )
                                                },
                                                JSONFormat.Compact
                                            )
                                        );

                                        IfError(
                                            Patch(
                                                'SIG PROYECTOS',
                                                LookUp('SIG PROYECTOS', ID = varProyectoSeleccionado.ID),
                                                {
                                                    INF_GENERAL: varJsonInfGeneralEdit,
                                                    ASIGNACIONES: varJsonAsignacionesEdit,
                                                    ESTADO: {Value: estadoEdit_1.Selected.Value},
                                                    FECHA_FIN: varFechaFinGuardar,
                                                    ACTIVITY_ID: gblActivityIdProyecto,
                                                    ACTIVITY_DESC: gblActividadProyecto,
                                                    ACTIVITY_TYPE: gblActivityTypeProyecto,
                                                    MIGRADO: true
                                                }
                                            ),
                                            Set(varErrorGuardado, true);
                                            Notify("Error al actualizar la cabecera del proyecto", NotificationType.Error);
                                            Blank()
                                        )
                                    );

                                    // ==============================================================================
                                    // 11. RESULTADO
                                    // ==============================================================================
                                    If(
                                        !varErrorGuardado,
                                        Notify("Proyecto actualizado correctamente", NotificationType.Success);
                                        Navigate(ResumenProyectos),
                                        Notify("El guardado quedó incompleto. Revisa el mensaje de error y vuelve a registrar.", NotificationType.Warning)
                                    )
                                );


                                Set(cargarInfo, false);
                              Text: ="Registrar"
      - Spinner1_4:
          Control: Spinner@1.4.6
          Properties:
            BasePaletteColor: =RGBA(249, 83, 109, 1)
            Font: =Font.'Open Sans Condensed'
            FontColor: =RGBA(0, 0, 0, 1)
            FontSize: =35
            Height: =Parent.Height
            Label: ="CARGANDO..."
            Visible: =cargarInfo
            Width: =Parent.Width
