Screens:
  GestionProyecto:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(cargarInfo, true);
        Refresh('SIG PROYECTOS');

        Clear(colAsignacionesGlobales);

        ForAll(
            Filter(
                'SIG PROYECTOS',
                !IsBlank(ASIGNACIONES) &&
                (
                    ESTADO.Value = "ACTIVO" ||
                    ESTADO.Value = "SUSPENDIDO"
                )
            ),
            With(
                {
                    asig: ParseJSON(ASIGNACIONES)
                },
                ForAll(
                    Table(asig.DetalleDiario) As d,
                    Collect(
                        colAsignacionesGlobales,
                        {
                            ProjectUID: Text(PROJECT_UID),
                            ProyectoCodigo: Text(Título),
                            EstadoProyecto: Text(ESTADO.Value),
                            Fecha: DateValue(Left(Text(d.Value.Fecha), 10)),
                            FechaClave: Text(
                                DateValue(Left(Text(d.Value.Fecha), 10)),
                                "[$-en-US]yyyy-mm-dd"
                            ),
                            ResponsableCorreo: Lower(Trim(Text(d.Value.ResponsableCorreo))),
                            ResponsableNombre: Text(d.Value.ResponsableNombre),
                            ResponsableCedula: Text(d.Value.ResponsableCedula),
                            ResponsableEkon: Text(d.Value.ResponsableEkon),
                            ResponsableCargo: Text(d.Value.ResponsableCargo),
                            Rol: Text(d.Value.Rol),
                            Bloque: Value(d.Value.Bloque)
                        }
                    )
                )
            )
        );

        Set(cargarInfo, false);
        Clear(colPrincipalesProyecto);
        Clear(colBacksProyecto);
