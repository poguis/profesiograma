                              Icon: ="CheckmarkCircle"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: "=/*\r\nSet(varPuedeRegistrarProyecto; true);;\r\n\r\nIf(\r\n    IsBlank(inicioProyecto.SelectedDate) ||\r\n    IsBlank(finProyecto.SelectedDate);\r\n    Notify(\r\n        \"Debes seleccionar fecha de inicio y fecha fin del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeRegistrarProyecto; false)\r\n);;\r\n\r\nIf(\r\n    IsBlank(horario.Selected.Value)||\r\n    IsBlank(salidaAlmuerzo.Selected.Value)||\r\n    IsBlank(regresoAlmuerzo.Selected.Value);    \r\n    Notify(\r\n        \"Debes seleccionar un horario de trabajo y almuerzo para el proyecto.\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeRegistrarProyecto; false)\r\n);;\r\n\r\n\r\n\r\n/*\r\n//  DEJAR COMENTADO POR SI ACASO\r\nIf(\r\n    varPuedeRegistrarProyecto &&\r\n    CountRows(colPrincipalesProyecto) = 0;\r\n    Notify(\r\n        \"Debes registrar al menos un principal\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeRegistrarProyecto; false)\r\n);;\r\n*/\r\n\r\n\r\n/*\r\nIf(\r\n    varPuedeRegistrarProyecto &&\r\n    CountRows(colAsignacionesPreview) = 0;\r\n    Notify(\r\n        \"Debes generar la asignación antes de registrar\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeRegistrarProyecto; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeRegistrarProyecto &&\r\n    CountRows(colConflictosAsignacion) > 0;\r\n    Notify(\r\n        \"No puedes registrar porque existen conflictos de asignación\";\r\n        NotificationType.Error\r\n    );;\r\n    Set(varPuedeRegistrarProyecto; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeRegistrarProyecto;\r\n\r\n    Set(varProjectUID; GUID());;\r\n\r\n    Set(\r\n        varCodigoProyectoSIG;\r\n        \"PRY-\" & Text(Today(); \"yyyymmdd\") & \"-\" & Right(Substitute(varProjectUID; \"-\"; \"\"); 6)\r\n    );;\r\n\r\n    Set(\r\n        varJsonInfGeneral;\r\n        JSON(\r\n            {\r\n                HoraGeneracion: {\r\n                    