               FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                        JornadaCodigo: JornadaCodigo,\r\n                        JornadaDescripcion: JornadaDescripcion,\r\n                        DiasTrabajo: DiasTrabajo,\r\n                        DiasDescanso: DiasDescanso\r\n                    }\r\n                ),\r\n                Backs: ForAll(\r\n                    colBacksProyecto,\r\n                    {\r\n                        BackId: BackId,\r\n                        PrincipalIdRelacionado: PrincipalIdRelacionado,\r\n                        Nombre: Nombre,\r\n                        Cedula: Cedula,\r\n                        Ekon: Ekon,\r\n                        Correo: Correo,\r\n                        Cargo: Cargo,\r\n                        FechaInicio: Text(FechaInicio, \"[$-en-US]yyyy-mm-dd\"),\r\n                        FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                        Observacion: Observacion,\r\n                        TipoRegistro: TipoRegistro,\r\n                        DiasDescanso: DiasDescanso\r\n                    }\r\n                ),\r\n                Bloques: ForAll(\r\n                    colAsignacionesPreview,\r\n                    {\r\n                        Bloque: Bloque,\r\n                        Rol: Rol,\r\n                        TipoAsignacion: TipoAsignacion,\r\n                        PrincipalId: PrincipalId,\r\n                        BackId: BackId,\r\n                        ResponsableNombre: ResponsableNombre,\r\n                        ResponsableCedula: ResponsableCedula,\r\n                        ResponsableEkon: ResponsableEkon,\r\n                        ResponsableCorreo: ResponsableCorreo,\r\n                        ResponsableCargo: ResponsableCargo,\r\n                        FechaInicio: Text(FechaInicio, \"[$-en-US]yyyy-mm-dd\"),\r\n                        FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                        DiasAsignados: DiasAsignados\r\n                    }\r\n                ),\r\n                DetalleDiario: ForAll(\r\n                    colAsignacionesDiario,\r\n                    {\r\n                        Fecha: Text(Fecha, \"[$-en-US]yyyy-mm-dd\"),\r\n                        FechaClave: FechaClave,\r\n                        Bloque: Bloque,\r\n                        Rol: Rol,\r\n                        TipoAsignacion: TipoAsignacion,\r\n                        PrincipalId: PrincipalId,\r\n                        BackId: BackId,\r\n                        ResponsableNombre: ResponsableNombre,\r\n                        ResponsableCedula: ResponsableCedula,\r\n                        ResponsableEkon: ResponsableEkon,\r\n                        ResponsableCorreo: ResponsableCorreo,\r\n                        ResponsableCargo: ResponsableCargo\r\n                    }\r\n                ),\r\n                Etapas: Table(\r\n                    {\r\n                        EtapaId: Text(GUID()),\r\n                        Version: 1,\r\n                        TipoMovimiento: \"CREACION\",\r\n                        EstadoProyecto: \"ACTIVO\",\r\n                        FechaRegistro: Text(Now(), \"[$-en-US]yyyy-mm-dd hh:mm:ss\"),\r\n                        UsuarioRegistro: varNombreUsuario,\r\n                        CorreoRegistro: Text(varPerfilUsuario.userPrincipalName),\r\n                        FechaInicio: Text(inicioProyecto.SelectedDate, \"[$-en-US]yyyy-mm-dd\"),\r\n                        FechaFin: Text(finProyecto.SelectedDate, \"[$-en-US]yyyy-mm-dd\"),\r\n                        ModeloAsignacion: \"MULTIPLES_PRINCIPALES_BACK_MANUAL\",\r\n                        PrincipalesJson: JSON(\r\n                            ForAll(\r\n                                colPrincipalesProyecto,\r\n                                {\r\n                                    PrincipalId: PrincipalId,\r\n                                    EsPrincipalInicial: EsPrincipalInicial,\r\n                                    Nombre: Nombre,\r\n                                    Cedula: Cedula,\r\n                                    Ekon: Ekon,\r\n                                    Correo: Correo,\r\n                                    Cargo: Cargo,\r\n                                    FechaInicio: Text(FechaInicio, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    JornadaCodigo: JornadaCodigo,\r\n                                    JornadaDescripcion: JornadaDescripcion,\r\n                                    DiasTrabajo: DiasTrabajo,\r\n                                    DiasDescanso: DiasDescanso\r\n                                }\r\n                            ),\r\n                            JSONFormat.Compact\r\n                        ),\r\n                        BacksJson: JSON(\r\n                            ForAll(\r\n                                colBacksProyecto,\r\n                                {\r\n                                    BackId: BackId,\r\n                                    PrincipalIdRelacionado: PrincipalIdRelacionado,\r\n                                    Nombre: Nombre,\r\n                                    Cedula: Cedula,\r\n                                    Ekon: Ekon,\r\n                                    Correo: Correo,\r\n                                    Cargo: Cargo,\r\n                                    FechaInicio: Text(FechaInicio, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    Observacion: Observacion,\r\n                                    TipoRegistro: TipoRegistro,\r\n                                    DiasDescanso: DiasDescanso\r\n                                }\r\n                            ),\r\n                            JSONFormat.Compact\r\n                        ),\r\n                        BloquesEtapaJson: JSON(\r\n                            ForAll(\r\n                                colAsignacionesPreview,\r\n                                {\r\n                                    Bloque: Bloque,\r\n                                    Rol: Rol,\r\n                                    TipoAsignacion: TipoAsignacion,\r\n                                    PrincipalId: PrincipalId,\r\n                                    BackId: BackId,\r\n                                    ResponsableNombre: ResponsableNombre,\r\n                                    ResponsableCedula: ResponsableCedula,\r\n                                    ResponsableEkon: ResponsableEkon,\r\n                                    ResponsableCorreo: ResponsableCorreo,\r\n                                    ResponsableCargo: ResponsableCargo,\r\n                                    FechaInicio: Text(FechaInicio, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    DiasAsignados: DiasAsignados\r\n                                }\r\n                            ),\r\n                            JSONFormat.Compact\r\n                        ),\r\n                        DetalleDiarioEtapaJson: JSON(\r\n                            ForAll(\r\n                                colAsignacionesDiario,\r\n                                {\r\n                                    Fecha: Text(Fecha, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    FechaClave: FechaClave,\r\n                                    Bloque: Bloque,\r\n                                    Rol: Rol,\r\n                                    TipoAsignacion: TipoAsignacion,\r\n                                    PrincipalId: PrincipalId,\r\n                                    BackId: BackId,\r\n                                    ResponsableNombre: ResponsableNombre,\r\n                                    ResponsableCedula: ResponsableCedula,\r\n                                    ResponsableEkon: ResponsableEkon,\r\n                                    ResponsableCorreo: ResponsableCorreo,\r\n                                    ResponsableCargo: ResponsableCargo\r\n                                }\r\n                            ),\r\n                            JSONFormat.Compact\r\n                        )\r\n                    }\r\n                )\r\n            },\r\n            JSONFormat.Compact\r\n        )\r\n    );\r\n\r\n        // ==============================================================================\r\n    // 4. DESCANSOS DE PRINCIPALES (solo dentro del tramo del principal)\r\n    // ==============================================================================\r\n    Clear(colDescansosPrincipalTmp);\r\n\r\n    ForAll(\r\n        Filter(colAsignacionesPreview, Text(Rol) = \"PRINCIPAL\") As blq,\r\n        With(\r\n            {\r\n                principalBloque: LookUp(colPrincipalesProyecto, PrincipalId = blq.PrincipalId)\r\n            },\r\n            With(\r\n                {\r\n                    diasDescansoPrincipal: Value(Coalesce(Text(principalBloque.DiasDescanso), \"0\")),\r\n                    fechaFinPrincipal: principalBloque.FechaFin,\r\n                    fechaSiguiente: DateAdd(blq.FechaFin, 1, TimeUnit.Days)\r\n                },\r\n                If(\r\n                    diasDescansoPrincipal > 0 &&\r\n                    fechaSiguiente <= fechaFinPrincipal &&\r\n                    IsBlank(\r\n                        LookUp(\r\n                            colAsignacionesDiario,\r\n                            Text(ResponsableEkon) = Text(blq.ResponsableEkon) &&\r\n                            Fecha = fechaSiguiente\r\n                        )\r\n                    ),\r\n                    ForAll(\r\n                        Filter(\r\n                            Sequence(diasDescansoPrincipal),\r\n                            DateAdd(blq.FechaFin, Value, TimeUnit.Days) <= fechaFinPrincipal\r\n                        ) As s,\r\n                        Collect(\r\n                            colDescansosPrincipalTmp,\r\n                            {\r\n                                Fecha: DateAdd(blq.FechaFin, s.Value, TimeUnit.Days),\r\n                                Bloque: Value(Text(blq.Bloque)),\r\n                                Rol: \"DESCANSO\",\r\n                                TipoAsignacion: \"AUTO\",\r\n                                PrincipalId: Value(Text(blq.PrincipalId)),\r\n                                BackId: Blank(),\r\n                                ResponsableNombre: Text(blq.ResponsableNombre),\r\n                                ResponsableCedula: Text(blq.ResponsableCedula),\r\n                                ResponsableEkon: Text(blq.ResponsableEkon),\r\n                                ResponsableCorreo: Text(blq.ResponsableCorreo),\r\n                                ResponsableCargo: Text(blq.ResponsableCargo)\r\n                            }\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 5. ARMAR FILAS PLANAS PARA SIG_ASIGNACIONES_DETALLE\r\n    // ==============================================================================\r\n    ClearCollect(\r\n        colDetalleGuardarTmp,\r\n        ForAll(\r\n            colAsignacionesDiario As d,\r\n            {\r\n                CLAVE: varProjectUID & \"|\" & Text(d.ResponsableEkon) & \"|\" & Text(d.Fecha, \"[$-en-US]yyyy-mm-dd\") & \"|\" & Text(d.Rol),\r\n                PROYECTO_UID: varProjectUID,\r\n                CODIGO_PROYECTO: varCodigoProyectoSIG,\r\n                NOMBRE_PROYECTO: varNombreVisualProyecto,\r\n                CORREO_CREADOR: varCorreoUsuario,\r\n                FECHA: d.Fecha,\r\n                EKON: Value(Text(d.ResponsableEkon)),\r\n                ROL: Text(d.Rol),\r\n                TIPO_ASIGNACION: Text(d.TipoAsignacion),\r\n                BLOQUE: Value(Text(d.Bloque)),\r\n                PRINCIPAL_ID: Value(Text(d.PrincipalId)),\r\n                BACK_ID: Value(Text(d.BackId)),\r\n                NOMBRE_RESPONSABLE: Upper(Trim(Text(d.ResponsableNombre))),\r\n                CEDULA: Text(d.ResponsableCedula),\r\n                CORREO_RESPONSABLE: Lower(Trim(Text(d.ResponsableCorreo))),\r\n                CARGO: Text(d.ResponsableCargo)\r\n            }\r\n        )\r\n    );\r\n\r\n    Collect(\r\n        colDetalleGuardarTmp,\r\n        ForAll(\r\n            colDescansosPrincipalTmp As d,\r\n            {\r\n                CLAVE: varProjectUID & \"|\" & Text(d.ResponsableEkon) & \"|\" & Text(d.Fecha, \"[$-en-US]yyyy-mm-dd\") & \"|\" & Text(d.Rol),\r\n                PROYECTO_UID: varProjectUID,\r\n                CODIGO_PROYECTO: varCodigoProyectoSIG,\r\n                NOMBRE_PROYECTO: varNombreVisualProyecto,\r\n                CORREO_CREADOR: varCorreoUsuario,\r\n                FECHA: d.Fecha,\r\n                EKON: Value(Text(d.ResponsableEkon)),\r\n                ROL: Text(d.Rol),\r\n                TIPO_ASIGNACION: Text(d.TipoAsignacion),\r\n                BLOQUE: Value(Text(d.Bloque)),\r\n                PRINCIPAL_ID: Value(Text(d.PrincipalId)),\r\n                BACK_ID: Value(Text(d.BackId)),\r\n                NOMBRE_RESPONSABLE: Upper(Trim(Text(d.ResponsableNombre))),\r\n                CEDULA: Text(d.ResponsableCedula),\r\n                CORREO_RESPONSABLE: Lower(Trim(Text(d.ResponsableCorreo))),\r\n                CARGO: Text(d.ResponsableCargo)\r\n            }\r\n        )\r\n    );\r\n\r\n    // Quitar duplicados por clave\r\n    ClearCollect(\r\n        colDetalleGuardar,\r\n        ForAll(\r\n            Distinct(colDetalleGuardarTmp, CLAVE) As k,\r\n            LookUp(colDetalleGuardarTmp, CLAVE = k.Value)\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 6. GUARDAR CABECERA EN SIG PROYECTOS\r\n    // ==============================================================================\r\n    Set(\r\n        varRegProyecto,\r\n        IfError(\r\n            Patch(\r\n                'SIG PROYECTOS',\r\n                Defaults('SIG PROYECTOS'),\r\n                {\r\n                    Título: varCodigoProyectoSIG,\r\n                    PROJECT_UID: varProjectUID,\r\n                    INF_GENERAL: varJsonInfGeneral,\r\n                    ASIGNACIONES: varJsonAsignaciones,\r\n                    ESTADO: {Value: \"ACTIVO\"},\r\n\r\n                    PROYECTO_UID: varProjectUID,\r\n                    CORREO_CREADOR: varCorreoUsuario,\r\n                    USUARIO_CREADOR: varNombreUsuario,\r\n                    NOMBRE_PROYECTO: varNombreVisualProyecto,\r\n                    DIMENSION_DESC: Text(varDimensionDescription),\r\n                    GRUPO: Text(grupoPertenece.Selected.Value),\r\n                    COMPANY_ID: Value(Text(varCompanyId)),\r\n                    COMPANIA_NOMBRE: Text(varCompaniaNombre),\r\n                    COMPANIA_RUC: Text(varCompaniaRuc),\r\n                    PROJECT_ID_EKON: Text(varProjectId),\r\n                    ACTIVITY_ID: Text(varActivityId),\r\n                    ACTIVITY_DESC: Text(varActivityName),\r\n                    ACTIVITY_TYPE: Text(varActivityType),\r\n                    HORARIO_CODIGO: Text(varCodHorarioId),\r\n                    HORARIO_DESC: Text(varHorarioDescripcion),\r\n                    HORA_ENTRADA: Text(varHoraEntrada),\r\n                    HORA_SALIDA: Text(varHoraSalida),\r\n                    HORAS: Text(varHoras),\r\n                    HORAS_TRABAJADAS: Text(varHorasTrabajadas),\r\n                    TIPO_HORARIO: Text(varTipoHorario),\r\n                    SALIDA_ALMUERZO: Text(salidaAlmuerzo.Selected.Value),\r\n                    REGRESO_ALMUERZO: Text(regresoAlmuerzo.Selected.Value),\r\n                    FECHA_INICIO: inicioProyecto.SelectedDate,\r\n                    FECHA_FIN: finProyecto.SelectedDate,\r\n                    MIGRADO: false\r\n                }\r\n            ),\r\n            Blank()\r\n        )\r\n    );\r\n\r\n    If(\r\n        IsBlank(varRegProyecto),\r\n        Set(varErrorGuardado, true);\r\n        Notify(\r\n            \"No se pudo registrar el proyecto en SIG PROYECTOS. No se guardó nada.\",\r\n            NotificationType.Error\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 7. GUARDAR PERSONAL (principales y backs)\r\n    // ==============================================================================\r\n    If(\r\n        !varErrorGuardado && CountRows(colPrincipalesProyecto) > 0,\r\n        IfError(\r\n            Collect(\r\n                SIG_ASIGNACIONES_PERSONAL,\r\n                ForAll(\r\n                    colPrincipalesProyecto As p,\r\n                    {\r\n                        Título: varCodigoProyectoSIG & \"|PRINCIPAL|\" & Text(p.PrincipalId),\r\n                        PROYECTO_UID: varProjectUID,\r\n                        ROL: \"PRINCIPAL\",\r\n                        PERSONA_ID: Value(Text(p.PrincipalId)),\r\n                        PRINCIPAL_ID_RELACIONADO: Blank(),\r\n                        EKON: Value(Text(p.Ekon)),\r\n                        NOMBRE: Upper(Trim(Text(p.Nombre))),\r\n                        CEDULA: Text(p.Cedula),\r\n                        CORREO: Lower(Trim(Text(p.Correo))),\r\n                        CARGO: Text(p.Cargo),\r\n                        FECHA_INICIO: p.FechaInicio,\r\n                        FECHA_FIN: p.FechaFin,\r\n                        DIAS_TRABAJO: Value(Text(p.DiasTrabajo)),\r\n                        DIAS_DESCANSO: Value(Text(p.DiasDescanso)),\r\n                        JORNADA_CODIGO: Text(p.JornadaCodigo),\r\n                        JORNADA_DESCRIPCION: Text(p.JornadaDescripcion),\r\n                        ES_PRINCIPAL_INICIAL: Coalesce(p.EsPrincipalInicial, false),\r\n                        TIPO_REGISTRO: \"Jornada\",\r\n                        OBSERVACION: \"\"\r\n                    }\r\n                )\r\n            ),\r\n            Set(varErrorGuardado, true);\r\n            Notify(\"Error al guardar los principales en SIG_ASIGNACIONES_PERSONAL\", NotificationType.Error);\r\n            Blank()\r\n        )\r\n    );\r\n\r\n    If(\r\n        !varErrorGuardado && CountRows(colBacksProyecto) > 0,\r\n        IfError(\r\n            Collect(\r\n                SIG_ASIGNACIONES_PERSONAL,\r\n                ForAll(\r\n                    colBacksProyecto As bk,\r\n                    {\r\n                        Título: varCodigoProyectoSIG & \"|BACK|\" & Text(bk.BackId),\r\n                        PROYECTO_UID: varProjectUID,\r\n                        ROL: \"BACK\",\r\n                        PERSONA_ID: Value(Text(bk.BackId)),\r\n                        PRINCIPAL_ID_RELACIONADO: Value(Text(bk.PrincipalIdRelacionado)),\r\n                        EKON: Value(Text(bk.Ekon)),\r\n                        NOMBRE: Upper(Trim(Text(bk.Nombre))),\r\n                        CEDULA: Text(bk.Cedula),\r\n                        CORREO: Lower(Trim(Text(bk.Correo))),\r\n                        CARGO: Text(bk.Cargo),\r\n                        FECHA_INICIO: bk.FechaInicio,\r\n                        FECHA_FIN: bk.FechaFin,\r\n                        DIAS_TRABAJO: Blank(),\r\n                        DIAS_DESCANSO: Value(Coalesce(Text(bk.DiasDescanso), \"0\")),\r\n                        JORNADA_CODIGO: \"\",\r\n                        JORNADA_DESCRIPCION: \"\",\r\n                        ES_PRINCIPAL_INICIAL: false,\r\n                        TIPO_REGISTRO: Coalesce(Text(bk.TipoRegistro), \"Jornada\"),\r\n                        OBSERVACION: Coalesce(Text(bk.Observacion), \"\")\r\n                    }\r\n                )\r\n            ),\r\n            Set(varErrorGuardado, true);\r\n            Notify(\"Error al guardar los backs en SIG_ASIGNACIONES_PERSONAL\", NotificationType.Error);\r\n            Blank()\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 8. GUARDAR DETALLE DIARIO\r\n    // ==============================================================================\r\n    If(\r\n        !varErrorGuardado && CountRows(colDetalleGuardar) > 0,\r\n        IfError(\r\n            Collect(\r\n                SIG_ASIGNACIONES_DETALLE,\r\n                ForAll(\r\n                    colDetalleGuardar As r,\r\n                    {\r\n                        Título: r.CLAVE,\r\n                        PROYECTO_UID: r.PROYECTO_UID,\r\n                        CODIGO_PROYECTO: r.CODIGO_PROYECTO,\r\n                        NOMBRE_PROYECTO: r.NOMBRE_PROYECTO,\r\n                        CORREO_CREADOR: r.CORREO_CREADOR,\r\n                        FECHA: r.FECHA,\r\n                        EKON: r.EKON,\r\n                        ROL: r.ROL,\r\n                        TIPO_ASIGNACION: r.TIPO_ASIGNACION,\r\n                        BLOQUE: r.BLOQUE,\r\n                        PRINCIPAL_ID: r.PRINCIPAL_ID,\r\n                        BACK_ID: r.BACK_ID,\r\n                        NOMBRE_RESPONSABLE: r.NOMBRE_RESPONSABLE,\r\n                        CEDULA: r.CEDULA,\r\n                        CORREO_RESPONSABLE: r.CORREO_RESPONSABLE,\r\n                        CARGO: r.CARGO\r\n                    }\r\n                )\r\n            ),\r\n            Set(varErrorGuardado, true);\r\n            Notify(\"Error al guardar el detalle diario en SIG_ASIGNACIONES_DETALLE\", NotificationType.Error);\r\n            Blank()\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 9. HISTORIAL\r\n    // ==============================================================================\r\n    If(\r\n        !varErrorGuardado,\r\n        IfError(\r\n            Patch(\r\n                SIG_HISTORIAL,\r\n                Defaults(SIG_HISTORIAL),\r\n                {\r\n                    Título: \"CREACION\",\r\n                    PROYECTO_UID: varProjectUID,\r\n                    ETAPA_ID: Text(GUID()),\r\n                    VERSION: 1,\r\n                    ESTADO_PROYECTO: \"ACTIVO\",\r\n                    FECHA_REGISTRO: Now(),\r\n                    USUARIO_REGISTRO: varNombreUsuario,\r\n                    CORREO_REGISTRO: varCorreoUsuario,\r\n                    FECHA_INICIO: inicioProyecto.SelectedDate,\r\n                    FECHA_FIN: finProyecto.SelectedDate,\r\n                    FECHA_CORTE: inicioProyecto.SelectedDate,\r\n                    ACTIVITY_ID: Text(varActivityId),\r\n                    SNAPSHOT_PERSONAL: JSON(\r\n                        {\r\n                            Principales: ForAll(\r\n                                colPrincipalesProyecto,\r\n                                {\r\n                                    PrincipalId: PrincipalId,\r\n                                    Ekon: Ekon,\r\n                                    Nombre: Nombre,\r\n                                    FechaInicio: Text(FechaInicio, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    JornadaCodigo: JornadaCodigo,\r\n                                    DiasTrabajo: DiasTrabajo,\r\n                                    DiasDescanso: DiasDescanso\r\n                                }\r\n                            ),\r\n                            Backs: ForAll(\r\n                                colBacksProyecto,\r\n                                {\r\n                                    BackId: BackId,\r\n                                    Ekon: Ekon,\r\n                                    Nombre: Nombre,\r\n                                    FechaInicio: Text(FechaInicio, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    FechaFin: Text(FechaFin, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    TipoRegistro: TipoRegistro,\r\n                                    DiasDescanso: DiasDescanso\r\n                                }\r\n                            )\r\n                        },\r\n                        JSONFormat.Compact\r\n                    )\r\n                }\r\n            ),\r\n            Set(varErrorGuardado, true);\r\n            Notify(\"Error al guardar en SIG_HISTORIAL\", NotificationType.Error);\r\n            Blank()\r\n        )\r\n    );\r\n\r\n    If(\r\n        !varErrorGuardado && !IsBlank(Text(varActivityId)),\r\n        IfError(\r\n            Patch(\r\n                SIG_HISTORIAL_ACTIVIDADES,\r\n                Defaults(SIG_HISTORIAL_ACTIVIDADES),\r\n                {\r\n                    Título: Text(GUID()),\r\n                    PROYECTO_UID: varProjectUID,\r\n                    VERSION: 1,\r\n                    TIPO_MOVIMIENTO: \"CREACION\",\r\n                    FECHA_REGISTRO: Now(),\r\n                    USUARIO_REGISTRO: varNombreUsuario,\r\n                    CORREO_REGISTRO: varCorreoUsuario,\r\n                    FECHA_INICIO: inicioProyecto.SelectedDate,\r\n                    FECHA_FIN: finProyecto.SelectedDate,\r\n                    ACTIVITY_ID: Text(varActivityId),\r\n                    ACTIVITY_DESCRIPTION: Text(varActivityName),\r\n                    ACTIVITY_TYPE: Text(varActivityType)\r\n                }\r\n            ),\r\n            Set(varErrorGuardado, true);\r\n            Notify(\"Error al guardar en SIG_HISTORIAL_ACTIVIDADES\", NotificationType.Error);\r\n            Blank()\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 10. CIERRE: marcar MIGRADO solo si todo salió bien\r\n    // ==============================================================================\r\n    If(\r\n        !IsBlank(varRegProyecto),\r\n\r\n        If(\r\n            !varErrorGuardado,\r\n            Set(\r\n                varMigradoOk,\r\n                !IsError(\r\n                    Patch(\r\n                        'SIG PROYECTOS',\r\n                        LookUp('SIG PROYECTOS', PROYECTO_UID = varProjectUID),\r\n                        {MIGRADO: true}\r\n                    )\r\n                )\r\n            );\r\n            If(\r\n                varMigradoOk,\r\n                Notify(\"Proyecto registrado correctamente\", NotificationType.Success),\r\n                Notify(\"Proyecto registrado, pero no se pudo marcar MIGRADO. Revisa la columna en SharePoint.\", NotificationType.Warning)\r\n            ),\r\n            Notify(\r\n                \"El proyecto se registró, pero no se completó el guardado en las listas nuevas. Quedó pendiente de migración.\",\r\n                NotificationType.Warning\r\n            )\r\n        );\r\n\r\n        Reset(compania);\r\n        Reset(grupoPertenece);\r\n        Reset(proyecto);\r\n        Reset(dimension);\r\n        Reset(actividad);\r\n        Reset(inicioProyecto);\r\n        Reset(finProyecto);\r\n        Reset(horario);\r\n        Reset(salidaAlmuerzo);\r\n        Reset(regresoAlmuerzo);\r\n\r\n        Clear(colPrincipalesProyecto);\r\n        Clear(colBacksProyecto);\r\n        Clear(colAsignacionesPreview);\r\n        Clear(colAsignacionesDiario);\r\n        Clear(colAsignacionesPreviewTmp);\r\n        Clear(colAsignacionesDiarioTmp);\r\n        Clear(colConflictosAsignacion);\r\n        Clear(colConflictosBase);\r\n        Clear(colConflictosResumen);\r\n        Clear(colDescansosPrincipalTmp);\r\n        Clear(colDetalleGuardarTmp);\r\n        Clear(colDetalleGuardar);\r\n\r\n        Navigate(ResumenProyectos)\r\n    )\r\n);\r\n\r\nSet(cargarInfo, false);"
                              Text: ="Registrar"
      - Spinner1_1:
          Control: Spinner@1.4.6
          Properties:
            BasePaletteColor: =RGBA(249, 83, 109, 1)
