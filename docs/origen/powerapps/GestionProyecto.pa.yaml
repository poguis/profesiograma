    \"(?<Depto>[^\"\"]+)\"\"\\s*:\\s*\\[(?<Contenido>[^\\]]*)\\]\"\r\n            )\r\n        },\r\n        With(\r\n            {\r\n                _deptosDetectados: Filter(\r\n                    _todosLosDeptos,\r\n                    _correoUsuario in Contenido\r\n                )\r\n            },\r\n            SortByColumns(\r\n                Search(\r\n                    Filter(\r\n                        'ESTRUCTURA GENERAL',\r\n                        Upper(Trim(Estado)) = \"A\" && \r\n                        Grupo = \"ADMINISTRATIVO\" &&\r\n                        (\r\n                            varEsSuperAdmin || \r\n                            ThisItem.MostrarOtros || \r\n                            \r\n                            // 2. Si es un depto normal, busca en 'Departamento' (y se asegura que NO sea una de las unidades)\r\n                            (Departamento in _deptosDetectados.Depto && Not(Departamento in _unidadesEspeciales)) ||\r\n                            \r\n                            // 3. Si SÍ es una de las unidades especiales, busca en la columna 'Unidad Gestión'\r\n                            ('Unidad Gestión' in _deptosDetectados.Depto && 'Unidad Gestión' in _unidadesEspeciales)\r\n                        )\r\n                    ),\r\n                    cmbPrincipalFila.SearchText,\r\n                    'Nombre Apellido'\r\n                ),\r\n                \"field_2\",\r\n                SortOrder.Ascending\r\n            )\r\n        )\r\n    )\r\n)"
