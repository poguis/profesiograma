                                    - CancelButton1_6:
                                        Control: Button@0.0.45
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          BorderRadius: =20
                                          Font: =Font.'Open Sans Condensed'
                                          FontSize: =16
                                          FontWeight: =FontWeight.Normal
                                          Height: =30
                                          Icon: ="ArrowSync"
                                          IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                          OnSelect: "=/*\r\nClear(colAsignacionesPreview);;\r\nClear(colAsignacionesDiario);;\r\nClear(colAsignacionesPreviewTmp);;\r\nClear(colAsignacionesDiarioTmp);;\r\nClear(colConflictosAsignacion);;\r\nClear(colConflictosBase);;\r\nClear(colConflictosResumen);;\r\n\r\nSet(varPuedeGenerarAsignacion; true);;\r\n\r\nIf(\r\n    IsBlank(inicioProyecto.SelectedDate) ||\r\n    IsBlank(finProyecto.SelectedDate);\r\n    Notify(\r\n        \"Debes seleccionar fecha de inicio y fecha fin del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    finProyecto.SelectedDate < inicioProyecto.SelectedDate;\r\n    Notify(\r\n        \"La fecha fin debe ser mayor o igual a la fecha inicio\";\r\n        NotificationType.Error\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(colPrincipalesProyecto) = 0;\r\n    Notify(\r\n        \"Debes registrar al menos un principal\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto;\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin) ||\r\n            DiasTrabajo = 0\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Todos los principales deben tener nombre, fecha inicio, fecha fin y jornada\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n*/\r\n\r\n\r\n/*\r\n// NO BORRAR ###############################################################################\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    LookUp(\r\n        colPrincipalesProyecto;\r\n        PrincipalId = 1;\r\n        FechaInicio\r\n    ) <> inicioProyecto.SelectedDate;\r\n    Notify(\r\n        \"El primer principal debe iniciar el mismo día de inicio del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n// ###############################################################################33\r\n*/\r\n\r\n/*\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto;\r\n            FechaInicio < inicioProyecto.SelectedDate ||\r\n            FechaFin > finProyecto.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Las fechas de los principales deben estar dentro del rango del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto;\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin)\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Todos los backs registrados deben tener Nombre, fecha inicio y fecha fin\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto;\r\n            FechaInicio < inicioProyecto.SelectedDate ||\r\n            FechaFin > finProyecto.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Las fechas de los backs deben estar dentro del rango del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion;\r\n\r\n    ForAll(\r\n        colPrincipalesProyecto As p;\r\n        With(\r\n            {\r\n                totalDiasPrincipal: DateDiff(\r\n                    p.FechaInicio;\r\n                    p.FechaFin;\r\n                    TimeUnit.Days\r\n                ) + 1;\r\n                cicloPrincipal: p.DiasTrabajo + p.DiasDescanso\r\n            };\r\n            ForAll(\r\n                Sequence(\r\n                    RoundUp(\r\n                        totalDiasPrincipal / cicloPrincipal;\r\n                        0\r\n                    )\r\n                ) As b;\r\n                With(\r\n                    {\r\n                        fechaInicioBloque: DateAdd(\r\n                            p.FechaInicio;\r\n                            (b.Value - 1) * cicloPrincipal;\r\n                            TimeUnit.Days\r\n                        );\r\n                        fechaFinBloqueTentativa: DateAdd(\r\n                            p.FechaInicio;\r\n                            ((b.Value - 1) * cicloPrincipal) + p.DiasTrabajo - 1;\r\n                            TimeUnit.Days\r\n                        )\r\n                    };\r\n                    If(\r\n                        fechaInicioBloque <= p.FechaFin;\r\n                        With(\r\n                            {\r\n                                fechaFinBloque: If(\r\n                                    fechaFinBloqueTentativa > p.FechaFin;\r\n                                    p.FechaFin;\r\n                                    fechaFinBloqueTentativa\r\n                                )\r\n                            };\r\n                            Collect(\r\n                                colAsignacionesPreviewTmp;\r\n                                {\r\n                                    Bloque: b.Value;\r\n                                    Rol: \"PRINCIPAL\";\r\n                                    TipoAsignacion: \"AUTO\";\r\n                                    PrincipalId: p.PrincipalId;\r\n                                    BackId: Blank();\r\n                                    ResponsableNombre: p.Nombre;\r\n                                    ResponsableCedula: p.Cedula;\r\n                                    ResponsableEkon: p.Ekon;\r\n                                    ResponsableCorreo: Lower(Trim(p.Correo));\r\n                                    ResponsableCargo: p.Cargo;\r\n                                    FechaInicio: fechaInicioBloque;\r\n                                    FechaFin: fechaFinBloque;\r\n                                    DiasAsignados: DateDiff(\r\n                                        fechaInicioBloque;\r\n                                        fechaFinBloque;\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                }\r\n                            );;\r\n\r\n                            ForAll(\r\n                                Sequence(\r\n                                    DateDiff(\r\n                                        fechaInicioBloque;\r\n                                        fechaFinBloque;\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                ) As d;\r\n                                With(\r\n                                    {\r\n                                        fechaDia: DateAdd(\r\n                                            fechaInicioBloque;\r\n                                            d.Value - 1;\r\n                                            TimeUnit.Days\r\n                                        )\r\n                                    };\r\n                                    Collect(\r\n                                        colAsignacionesDiarioTmp;\r\n                                        {\r\n                                            Fecha: fechaDia;\r\n                                            FechaClave: Text(\r\n                                                fechaDia;\r\n                                                \"[$-en-US]yyyy-mm-dd\"\r\n                                            );\r\n                                            Bloque: b.Value;\r\n                                            Rol: \"PRINCIPAL\";\r\n                                            TipoAsignacion: \"AUTO\";\r\n                                            PrincipalId: p.PrincipalId;\r\n                                            BackId: Blank();\r\n                                            ResponsableNombre: p.Nombre;\r\n                                            ResponsableCedula: p.Cedula;\r\n                                            ResponsableEkon: p.Ekon;\r\n                                            ResponsableCorreo: Lower(Trim(p.Correo));\r\n                                            ResponsableCargo: p.Cargo\r\n                                        }\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );;\r\n\r\n    ForAll(\r\n        colBacksProyecto As bk;\r\n        Collect(\r\n            colAsignacionesPreviewTmp;\r\n            {\r\n                Bloque: bk.BackId;\r\n                Rol: \"BACK\";\r\n                TipoAsignacion: \"MANUAL\";\r\n                PrincipalId: bk.PrincipalIdRelacionado;\r\n                BackId: bk.BackId;\r\n                ResponsableNombre: bk.Nombre;\r\n                ResponsableCedula: bk.Cedula;\r\n                ResponsableEkon: bk.Ekon;\r\n                ResponsableCorreo: Lower(Trim(bk.Correo));\r\n                ResponsableCargo: bk.Cargo;\r\n                FechaInicio: bk.FechaInicio;\r\n                FechaFin: bk.FechaFin;\r\n                DiasAsignados: DateDiff(\r\n                    bk.FechaInicio;\r\n                    bk.FechaFin;\r\n                    TimeUnit.Days\r\n                ) + 1\r\n            }\r\n        );;\r\n\r\n        ForAll(\r\n            Sequence(\r\n                DateDiff(\r\n                    bk.FechaInicio;\r\n                    bk.FechaFin;\r\n                    TimeUnit.Days\r\n                ) + 1\r\n            ) As d;\r\n            With(\r\n                {\r\n                    fechaDiaBack: DateAdd(\r\n                        bk.FechaInicio;\r\n                        d.Value - 1;\r\n                        TimeUnit.Days\r\n                    )\r\n                };\r\n                Collect(\r\n                    colAsignacionesDiarioTmp;\r\n                    {\r\n                        Fecha: fechaDiaBack;\r\n                        FechaClave: Text(\r\n                            fechaDiaBack;\r\n                            \"[$-en-US]yyyy-mm-dd\"\r\n                        );\r\n                        Bloque: bk.BackId;\r\n                        Rol: \"BACK\";\r\n                        TipoAsignacion: \"MANUAL\";\r\n                        PrincipalId: bk.PrincipalIdRelacionado;\r\n                        BackId: bk.BackId;\r\n                        ResponsableNombre: bk.Nombre;\r\n                        ResponsableCedula: bk.Cedula;\r\n                        ResponsableEkon: bk.Ekon;\r\n                        ResponsableCorreo: Lower(Trim(bk.Correo));\r\n                        ResponsableCargo: bk.Cargo\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    );;\r\n\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n;\r\n        If(\r\n            CountRows(\r\n                Filter(\r\n                    colAsignacionesDiarioTmp;\r\n                    ResponsableEkon = n.ResponsableEkon &&\r\n                    FechaClave = n.FechaClave\r\n                )\r\n            ) > 1;\r\n            Collect(\r\n                colConflictosAsignacion;\r\n                {\r\n                    Fecha: n.Fecha;\r\n                    FechaClave: n.FechaClave;\r\n                    ResponsableNombre: n.ResponsableNombre;\r\n                    ResponsableCedula: n.ResponsableCedula;\r\n                    ResponsableEkon: n.ResponsableEkon;\r\n                    ResponsableCorreo: n.ResponsableCorreo;\r\n                    Rol: n.Rol;\r\n                    ProyectoExistente: \"MISMO PROYECTO\";\r\n                    EstadoProyecto: \"CONFLICTO INTERNO\";\r\n                    BloqueExistente: n.Bloque\r\n                }\r\n            )\r\n        )\r\n    );;\r\n    */\r\n\r\n    /*\r\n    NO BORRAR ############################################\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n;\r\n        With(\r\n            {\r\n                conflicto: LookUp(\r\n                    colAsignacionesGlobales;\r\n                    ResponsableEkon = Lower(Trim(n.ResponsableEkon)) &&\r\n                    FechaClave = n.FechaClave &&\r\n                    If(\r\n                        varModoProyecto = \"EDITAR\";\r\n                        ProjectUID <> Text(varProyectoSeleccionado.PROJECT_UID);\r\n                        true\r\n                    )\r\n                )\r\n            };\r\n            If(\r\n                !IsBlank(conflicto.ProyectoCodigo);\r\n                Collect(\r\n                    colConflictosAsignacion;\r\n                    {\r\n                        Fecha: n.Fecha;\r\n                        FechaClave: n.FechaClave;\r\n                        ResponsableNombre: n.ResponsableNombre;\r\n                        ResponsableCedula: n.ResponsableCedula;\r\n                        ResponsableEkon: n.ResponsableEkon;\r\n                        ResponsableCorreo: n.ResponsableCorreo;\r\n                        Rol: n.Rol;\r\n                        ProyectoExistente: conflicto.ProyectoCodigo;\r\n                        EstadoProyecto: conflicto.EstadoProyecto;\r\n                        BloqueExistente: conflicto.Bloque\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    );;\r\n    # FIN  ##################################################\r\n    */\r\n\r\n    /*\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n;\r\n        With(\r\n            {\r\n                conflicto: LookUp(\r\n                    colAsignacionesGlobales;\r\n                    ResponsableEkon = Lower(Trim(n.ResponsableEkon)) &&\r\n                    FechaClave = n.FechaClave &&\r\n                    If(\r\n                        varModoProyecto = \"EDITAR\";\r\n                        ProjectUID <> Text(varProyectoSeleccionado.PROJECT_UID);\r\n                        true\r\n                    )\r\n                )\r\n            };\r\n            If(\r\n                !IsBlank(conflicto.ProyectoCodigo);\r\n                \r\n                // 1. Buscamos el registro en SIG PROYECTOS para obtener el JSON\r\n                With(\r\n                    {\r\n                        jsonRaw: LookUp('SIG PROYECTOS'; Título = conflicto.ProyectoCodigo).INF_GENERAL\r\n                    };\r\n                    \r\n                    // 2. Parseamos el JSON y extraemos los dos textos posibles\r\n                    With(\r\n                        {\r\n                            datosJSON: ParseJSON(jsonRaw)\r\n                        };\r\n                        With(\r\n                            {\r\n                                nombreProy: Text(datosJSON.InfoProyecto.Proyecto.Nombre);\r\n                                nombreDim: Text(datosJSON.InfoProyecto.Dimension.Descripcion)\r\n                            };\r\n                            \r\n                            // 3. Guardamos el conflicto con la lógica de nombres\r\n                            Collect(\r\n                                colConflictosAsignacion;\r\n                                {\r\n                                    Fecha: n.Fecha;\r\n                                    FechaClave: n.FechaClave;\r\n                                    ResponsableNombre: n.ResponsableNombre;\r\n                                    ResponsableCedula: n.ResponsableCedula;\r\n                                    ResponsableEkon: n.ResponsableEkon;\r\n                                    ResponsableCorreo: n.ResponsableCorreo;\r\n                                    Rol: n.Rol;\r\n                                    \r\n                                    // --- AQUÍ ESTÁ EL CAMBIO ---\r\n                                    ProyectoExistente: If(\r\n                                        !IsBlank(nombreProy); \r\n                                        nombreProy; \r\n                                        If(\r\n                                            !IsBlank(nombreDim); \r\n                                            \"Planta - \" & nombreDim; // Concatenamos el prefijo solo aquí\r\n                                            conflicto.ProyectoCodigo\r\n                                        )\r\n                                    );\r\n                                    \r\n                                    EstadoProyecto: conflicto.EstadoProyecto;\r\n                                    BloqueExistente: conflicto.Bloque\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );;\r\n\r\n    ClearCollect(\r\n        colConflictosBase;\r\n        AddColumns(\r\n            colConflictosAsignacion;\r\n            MesAnio;\r\n            Text(Fecha; \"mmmm yyyy\")\r\n        )\r\n    );;\r\n\r\n    ClearCollect(\r\n        colConflictosResumen;\r\n        AddColumns(\r\n            GroupBy(\r\n                colConflictosBase;\r\n                ResponsableNombre;\r\n                Rol;\r\n                ProyectoExistente;\r\n                MesAnio;\r\n                Registros\r\n            );\r\n            DiasTexto;\r\n            With(\r\n                {\r\n                    textoDias: Concat(\r\n                        SortByColumns(\r\n                            Registros;\r\n                            \"Fecha\";\r\n                            SortOrder.Ascending\r\n                        );\r\n                        Text(Day(Fecha)) & \", \"\r\n                    )\r\n                };\r\n                If(\r\n                    Len(textoDias) > 2;\r\n                    Left(textoDias; Len(textoDias) - 2);\r\n                    textoDias\r\n                )\r\n            )\r\n        )\r\n    );;\r\n\r\n    ClearCollect(\r\n        colAsignacionesPreview;\r\n        SortByColumns(\r\n            colAsignacionesPreviewTmp;\r\n            \"FechaInicio\";\r\n            SortOrder.Ascending\r\n        )\r\n    );;\r\n\r\n    ClearCollect(\r\n        colAsignacionesDiario;\r\n        SortByColumns(\r\n            colAsignacionesDiarioTmp;\r\n            \"Fecha\";\r\n            SortOrder.Ascending\r\n        )\r\n    );;\r\n\r\n    If(\r\n        CountRows(colConflictosAsignacion) > 0;\r\n        Notify(\r\n            \"Se detectaron cruces de asignación. Revisa los conflictos antes de registrar.\";\r\n            NotificationType.Error\r\n        );\r\n        Notify(\r\n            \"Asignación generada correctamente sin cruces.\";\r\n            NotificationType.Success\r\n        )\r\n    )\r\n);;\r\n*/\r\n\r\n\r\n\r\nClear(colAsignacionesPreview);\r\nClear(colAsignacionesDiario);\r\nClear(colAsignacionesPreviewTmp);\r\nClear(colAsignacionesDiarioTmp);\r\nClear(colConflictosAsignacion);\r\nClear(colConflictosBase);\r\nClear(colConflictosResumen);\r\n\r\nSet(varPuedeGenerarAsignacion, true);\r\n\r\nIf(\r\n    IsBlank(inicioProyecto.SelectedDate) ||\r\n    IsBlank(finProyecto.SelectedDate),\r\n    Notify(\r\n        \"Debes seleccionar fecha de inicio y fecha fin del proyecto\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    finProyecto.SelectedDate < inicioProyecto.SelectedDate,\r\n    Notify(\r\n        \"La fecha fin debe ser mayor o igual a la fecha inicio\",\r\n        NotificationType.Error\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\n\r\n\r\n\r\n\r\n/*\r\n// PRINCIPAL\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(colPrincipalesProyecto) = 0;\r\n    Notify(\r\n        \"Debes registrar al menos un principal\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n*/\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto,\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin) ||\r\n            DiasTrabajo = 0\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Todos los principales deben tener nombre, fecha inicio, fecha fin y jornada\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto,\r\n            FechaInicio < inicioProyecto.SelectedDate ||\r\n            FechaFin > finProyecto.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Las fechas de los principales deben estar dentro del rango del proyecto\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto,\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin)\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Todos los backs registrados deben tener Nombre, fecha inicio y fecha fin\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto,\r\n            FechaInicio < inicioProyecto.SelectedDate ||\r\n            FechaFin > finProyecto.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Las fechas de los backs deben estar dentro del rango del proyecto\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion,\r\n\r\n    // ==============================================================================\r\n    // 1. GENERACIÓN DE PRINCIPALES (Tú código original intacto)\r\n    // ==============================================================================\r\n    ForAll(\r\n        colPrincipalesProyecto As p,\r\n        With(\r\n            {\r\n                totalDiasPrincipal: DateDiff(\r\n                    p.FechaInicio,\r\n                    p.FechaFin,\r\n                    TimeUnit.Days\r\n                ) + 1,\r\n                cicloPrincipal: p.DiasTrabajo + p.DiasDescanso\r\n            },\r\n            ForAll(\r\n                Sequence(\r\n                    RoundUp(\r\n                        totalDiasPrincipal / cicloPrincipal,\r\n                        0\r\n                    )\r\n                ) As b,\r\n                With(\r\n                    {\r\n                        fechaInicioBloque: DateAdd(\r\n                            p.FechaInicio,\r\n                            (b.Value - 1) * cicloPrincipal,\r\n                            TimeUnit.Days\r\n                        ),\r\n                        fechaFinBloqueTentativa: DateAdd(\r\n                            p.FechaInicio,\r\n                            ((b.Value - 1) * cicloPrincipal) + p.DiasTrabajo - 1,\r\n                            TimeUnit.Days\r\n                        )\r\n                    },\r\n                    If(\r\n                        fechaInicioBloque <= p.FechaFin,\r\n                        With(\r\n                            {\r\n                                fechaFinBloque: If(\r\n                                    fechaFinBloqueTentativa > p.FechaFin,\r\n                                    p.FechaFin,\r\n                                    fechaFinBloqueTentativa\r\n                                )\r\n                            },\r\n                            Collect(\r\n                                colAsignacionesPreviewTmp,\r\n                                {\r\n                                    Bloque: b.Value,\r\n                                    Rol: \"PRINCIPAL\",\r\n                                    TipoAsignacion: \"AUTO\",\r\n                                    PrincipalId: p.PrincipalId,\r\n                                    BackId: Blank(),\r\n                                    ResponsableNombre: p.Nombre,\r\n                                    ResponsableCedula: p.Cedula,\r\n                                    ResponsableEkon: p.Ekon,\r\n                                    ResponsableCorreo: Lower(Trim(p.Correo)),\r\n                                    ResponsableCargo: p.Cargo,\r\n                                    FechaInicio: fechaInicioBloque,\r\n                                    FechaFin: fechaFinBloque,\r\n                                    DiasAsignados: DateDiff(\r\n                                        fechaInicioBloque,\r\n                                        fechaFinBloque,\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                }\r\n                            );\r\n\r\n                            ForAll(\r\n                                Sequence(\r\n                                    DateDiff(\r\n                                        fechaInicioBloque,\r\n                                        fechaFinBloque,\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                ) As d,\r\n                                With(\r\n                                    {\r\n                                        fechaDia: DateAdd(\r\n                                            fechaInicioBloque,\r\n                                            d.Value - 1,\r\n                                            TimeUnit.Days\r\n                                        )\r\n                                    },\r\n                                    Collect(\r\n                                        colAsignacionesDiarioTmp,\r\n                                        {\r\n                                            Fecha: fechaDia,\r\n                                            FechaClave: Text(\r\n                                                fechaDia,\r\n                                                \"[$-en-US]yyyy-mm-dd\"\r\n                                            ),\r\n                                            Bloque: b.Value,\r\n                                            Rol: \"PRINCIPAL\",\r\n                                            TipoAsignacion: \"AUTO\",\r\n                                            PrincipalId: p.PrincipalId,\r\n                                            BackId: Blank(),\r\n                                            ResponsableNombre: p.Nombre,\r\n                                            ResponsableCedula: p.Cedula,\r\n                                            ResponsableEkon: p.Ekon,\r\n                                            ResponsableCorreo: Lower(Trim(p.Correo)),\r\n                                            ResponsableCargo: p.Cargo\r\n                                        }\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 2. GENERACIÓN DE BACKS (Con la nueva lógica dinámica)\r\n    // ==============================================================================\r\n    ForAll(\r\n        colBacksProyecto As bk,\r\n        With(\r\n            {\r\n                esJornada: Coalesce(bk.TipoRegistro, \"Jornada\") = \"Jornada\",\r\n                rolActual: If(Coalesce(bk.TipoRegistro, \"Jornada\") = \"Descanso\", \"DESCANSO\", \"BACK\"),\r\n                diasVacaciones: Value(Coalesce(bk.DiasDescanso, 0))\r\n            },\r\n            \r\n            // --- BLOQUE INICIAL DEL BACK (Trabajo o Descanso completo) ---\r\n            Collect(\r\n                colAsignacionesPreviewTmp,\r\n                {\r\n                    Bloque: bk.BackId,\r\n                    Rol: rolActual,\r\n                    TipoAsignacion: \"MANUAL\",\r\n                    PrincipalId: bk.PrincipalIdRelacionado,\r\n                    BackId: bk.BackId,\r\n                    ResponsableNombre: bk.Nombre,\r\n                    ResponsableCedula: bk.Cedula,\r\n                    ResponsableEkon: bk.Ekon,\r\n                    ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                    ResponsableCargo: bk.Cargo,\r\n                    FechaInicio: bk.FechaInicio,\r\n                    FechaFin: bk.FechaFin,\r\n                    DiasAsignados: DateDiff(bk.FechaInicio, bk.FechaFin, TimeUnit.Days) + 1\r\n                }\r\n            );\r\n\r\n            ForAll(\r\n                Sequence(DateDiff(bk.FechaInicio, bk.FechaFin, TimeUnit.Days) + 1) As d,\r\n                With(\r\n                    {\r\n                        fechaDiaBack: DateAdd(bk.FechaInicio, d.Value - 1, TimeUnit.Days)\r\n                    },\r\n                    Collect(\r\n                        colAsignacionesDiarioTmp,\r\n                        {\r\n                            Fecha: fechaDiaBack,\r\n                            FechaClave: Text(fechaDiaBack, \"[$-en-US]yyyy-mm-dd\"),\r\n                            Bloque: bk.BackId,\r\n                            Rol: rolActual,\r\n                            TipoAsignacion: \"MANUAL\",\r\n                            PrincipalId: bk.PrincipalIdRelacionado,\r\n                            BackId: bk.BackId,\r\n                            ResponsableNombre: bk.Nombre,\r\n                            ResponsableCedula: bk.Cedula,\r\n                            ResponsableEkon: bk.Ekon,\r\n                            ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                            ResponsableCargo: bk.Cargo\r\n                        }\r\n                    )\r\n                )\r\n            );\r\n            \r\n            // --- BLOQUE ADICIONAL DE VACACIONES/DESCANSO AL FINALIZAR ---\r\n            If(\r\n                esJornada && diasVacaciones > 0,\r\n                With(\r\n                    {\r\n                        fechaInicioVacaciones: DateAdd(bk.FechaFin, 1, TimeUnit.Days),\r\n                        fechaFinVacaciones: DateAdd(bk.FechaFin, diasVacaciones, TimeUnit.Days)\r\n                    },\r\n                    Collect(\r\n                        colAsignacionesPreviewTmp,\r\n                        {\r\n                            Bloque: bk.BackId,\r\n                            Rol: \"DESCANSO\",\r\n                            TipoAsignacion: \"MANUAL\",\r\n                            PrincipalId: bk.PrincipalIdRelacionado,\r\n                            BackId: bk.BackId,\r\n                            ResponsableNombre: bk.Nombre,\r\n                            ResponsableCedula: bk.Cedula,\r\n                            ResponsableEkon: bk.Ekon,\r\n                            ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                            ResponsableCargo: bk.Cargo,\r\n                            FechaInicio: fechaInicioVacaciones,\r\n                            FechaFin: fechaFinVacaciones,\r\n                            DiasAsignados: diasVacaciones\r\n                        }\r\n                    );\r\n                    \r\n                    ForAll(\r\n                        Sequence(diasVacaciones) As dVac,\r\n                        With(\r\n                            {\r\n                                fechaDiaVac: DateAdd(fechaInicioVacaciones, dVac.Value - 1, TimeUnit.Days)\r\n                            },\r\n                            Collect(\r\n                                colAsignacionesDiarioTmp,\r\n                                {\r\n                                    Fecha: fechaDiaVac,\r\n                                    FechaClave: Text(fechaDiaVac, \"[$-en-US]yyyy-mm-dd\"),\r\n                                    Bloque: bk.BackId,\r\n                                    Rol: \"DESCANSO\",\r\n                                    TipoAsignacion: \"MANUAL\", \r\n                                    PrincipalId: bk.PrincipalIdRelacionado,\r\n                                    BackId: bk.BackId,\r\n                                    ResponsableNombre: bk.Nombre,\r\n                                    ResponsableCedula: bk.Cedula,\r\n                                    ResponsableEkon: bk.Ekon,\r\n                                    ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                                    ResponsableCargo: bk.Cargo\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );\r\n\r\n    // ==============================================================================\r\n    // 3. DETECCIÓN DE CONFLICTOS Y LIMPIEZA FINAL\r\n    // ==============================================================================\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n,\r\n        If(\r\n            Upper(Trim(n.Rol)) <> \"DESCANSO\" && // <-- 1. Si el rol actual es descanso, no hay conflicto\r\n            CountRows(\r\n                Filter(\r\n                    colAsignacionesDiarioTmp,\r\n                    ResponsableEkon = n.ResponsableEkon &&\r\n                    FechaClave = n.FechaClave &&\r\n                    Upper(Trim(Rol)) <> \"DESCANSO\" // <-- 2. Ignora descansos en la revisión interna\r\n                )\r\n            ) > 1,\r\n            Collect(\r\n                colConflictosAsignacion,\r\n                {\r\n                    Fecha: n.Fecha,\r\n                    FechaClave: n.FechaClave,\r\n                    ResponsableNombre: n.ResponsableNombre,\r\n                    ResponsableCedula: n.ResponsableCedula,\r\n                    ResponsableEkon: n.ResponsableEkon,\r\n                    ResponsableCorreo: n.ResponsableCorreo,\r\n                    Rol: n.Rol,\r\n                    ProyectoExistente: \"MISMO PROYECTO\",\r\n                    EstadoProyecto: \"CONFLICTO INTERNO\",\r\n                    BloqueExistente: n.Bloque\r\n                }\r\n            )\r\n        )\r\n    );\r\n    \r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n,\r\n        With(\r\n            {\r\n                conflicto: LookUp(\r\n                    colAsignacionesGlobales,\r\n                    ResponsableEkon = Lower(Trim(n.ResponsableEkon)) &&\r\n                    FechaClave = n.FechaClave &&\r\n                    Upper(Trim(Rol)) <> \"DESCANSO\" && // <-- 3. Ignora si en el otro proyecto está en descanso\r\n                    If(\r\n                        varModoProyecto = \"EDITAR\",\r\n                        ProjectUID <> Text(varProyectoSeleccionado.PROJECT_UID),\r\n                        true\r\n                    )\r\n                )\r\n            },\r\n            If(\r\n                Upper(Trim(n.Rol)) <> \"DESCANSO\" && !IsBlank(conflicto.ProyectoCodigo), // <-- 4. Doble validación final\r\n                \r\n                With(\r\n                    {\r\n                        jsonRaw: LookUp('SIG PROYECTOS', Título = conflicto.ProyectoCodigo).INF_GENERAL\r\n                    },\r\n                    \r\n                    With(\r\n                        {\r\n                            datosJSON: ParseJSON(jsonRaw)\r\n                        },\r\n                        With(\r\n                            {\r\n                                nombreProy: Text(datosJSON.InfoProyecto.Proyecto.Nombre),\r\n                                nombreDim: Text(datosJSON.InfoProyecto.Dimension.Descripcion)\r\n                            },\r\n                            \r\n                            Collect(\r\n                                colConflictosAsignacion,\r\n                                {\r\n                                    Fecha: n.Fecha,\r\n                                    FechaClave: n.FechaClave,\r\n                                    ResponsableNombre: n.ResponsableNombre,\r\n                                    ResponsableCedula: n.ResponsableCedula,\r\n                                    ResponsableEkon: n.ResponsableEkon,\r\n                                    ResponsableCorreo: n.ResponsableCorreo,\r\n                                    Rol: n.Rol,\r\n                                    ProyectoExistente: If(\r\n                                        !IsBlank(nombreProy), \r\n                                        nombreProy, \r\n                                        If(\r\n                                            !IsBlank(nombreDim), \r\n                                            \"Planta - \" & nombreDim,\r\n                                            conflicto.ProyectoCodigo\r\n                                        )\r\n                                    ),\r\n                                    EstadoProyecto: conflicto.EstadoProyecto,\r\n                                    BloqueExistente: conflicto.Bloque\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );\r\n\r\n    ClearCollect(\r\n        colConflictosBase,\r\n        AddColumns(\r\n            colConflictosAsignacion,\r\n            MesAnio,\r\n            Text(Fecha, \"mmmm yyyy\")\r\n        )\r\n    );\r\n\r\n    ClearCollect(\r\n        colConflictosResumen,\r\n        AddColumns(\r\n            GroupBy(\r\n                colConflictosBase,\r\n                ResponsableNombre,\r\n                Rol,\r\n                ProyectoExistente,\r\n                MesAnio,\r\n                Registros\r\n            ),\r\n            DiasTexto,\r\n            With(\r\n                {\r\n                    textoDias: Concat(\r\n                        SortByColumns(\r\n                            Registros,\r\n                            \"Fecha\",\r\n                            SortOrder.Ascending\r\n                        ),\r\n                        Text(Day(Fecha)) & \", \"\r\n                    )\r\n                },\r\n                If(\r\n                    Len(textoDias) > 2,\r\n                    Left(textoDias, Len(textoDias) - 2),\r\n                    textoDias\r\n                )\r\n            )\r\n        )\r\n    );\r\n\r\n    ClearCollect(\r\n        colAsignacionesPreview,\r\n        SortByColumns(\r\n            colAsignacionesPreviewTmp,\r\n            \"FechaInicio\",\r\n            SortOrder.Ascending\r\n        )\r\n    );\r\n\r\n    ClearCollect(\r\n        colAsignacionesDiario,\r\n        SortByColumns(\r\n            colAsignacionesDiarioTmp,\r\n            \"Fecha\",\r\n            SortOrder.Ascending\r\n        )\r\n    );\r\n\r\n    If(\r\n        CountRows(colConflictosAsignacion) > 0,\r\n        Notify(\r\n            \"Se detectaron cruces de asignación. Revisa los conflictos antes de registrar.\",\r\n            NotificationType.Error\r\n        ),\r\n        Notify(\r\n            \"Asignación generada correctamente sin cruces.\",\r\n            NotificationType.Success\r\n        )\r\n    )\r\n);"
                                          Text: ="Generar"
