                        Layout: =ButtonLayout.IconAfter
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =With(
                              {
                                  JSONDATOSGENERALES: JSON(
                                      {
                                          Categoria: Coalesce(cmbCategoriaEPP.Selected.Value, cmbCategoriaEPP.Selected.Value, cmbCategoriaEPP.Selected.Value),
                                          Articulo: txtArticulo.Text,
                                          Codigo: txtCodigo.Text,
                                          Talla: txtTalla.Text,
                                          Tipo: txtTipo.Text,
                                          Detalle: Coalesce(cmbDetalle.Selected.Value, cmbDetalle.Selected.Value),
                                          Normativa: txtNormativa.Text,
                                          Marca: txtMarca.Text,
                                          FechaInicio: Text(FechaFabricacion.SelectedDate, "dd/mm/yyyy"),
                                          Caducidad: txtCaducidad.Text,
                                          Precio: txtPrecio.Text,
                                          CriteriosCarga: txtCriteriosCarga.Text,
                                          Area: Coalesce(cmbArea.Selected.Value, cmbArea.Selected.Value),
                                          Procesos: Concat(cmbProcesos.SelectedItems, Coalesce(Value), ", "),
                                          Cargo: Concat(cmbCargo.SelectedItems, Coalesce(Value), ", "),
                                          VidaUtil: cmbVidaUtil.Selected.Value
                                      },
                                      JSONFormat.IndentFour
                                  ),
                                  jsonEspecificaciones: JSON(
                                      {
                                          Categoria: Coalesce(cmbCategoriaEPP.Selected.Value, cmbCategoriaEPP.Selected.Value, cmbCategoriaEPP.Selected.Value),
                                          Articulo: txtArticulo.Text,
                                          Especificaciones: txtEspecificaciones.Text
                                      },
                                      JSONFormat.IndentFour
                                  ),
                                  jsonMantenimiento: JSON(
                                      {
                                          Categoria: Coalesce(cmbCategoriaEPP.Selected.Value, cmbCategoriaEPP.Selected.Value, cmbCategoriaEPP.Selected.Value),
                                          Articulo: txtArticulo.Text,
                                          Mantenimiento: txtMatenimiento.Text
                                      },
                                      JSONFormat.IndentFour
                                  )
                              },
                              Patch(
                                  ADMIN_EPPS,
                                  If(
                                      varModoEdicion,
                                      LookUp(ADMIN_EPPS, ID = varEPPSeleccionado.ID_Registro),
                                      Defaults(ADMIN_EPPS)
                                  ),
                                  {
                                      Título: txtArticulo.Text,
                                      DATOS_GENERALES_EPPS: JSONDATOSGENERALES,
                                      ESPECIFICACIONES: jsonEspecificaciones,
                                      MANTENIMIENTO: jsonMantenimiento,
                                      Fotografia: UploadedImage1_1.Image
                                  }
                              )
                          );

                          // Notificación y reinicio de variables
                          Notify(If(varModoEdicion, "EPP actualizado exitosamente.", "EPP registrado exitosamente."), NotificationType.Success);

