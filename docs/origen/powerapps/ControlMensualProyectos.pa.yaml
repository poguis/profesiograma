                  - Button1:
                      Control: ModernButton@1.0.0
                      Properties:
                        Font: =Font.'Open Sans Condensed'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: "=/*\r\nIf(\r\n    // 1. Validar que seleccionó un proyecto\r\n    IsBlank(cmbFiltroProyecto.Selected.Value);\r\n    Notify(\"Por favor, selecciona un proyecto para generar el reporte.\"; NotificationType.Warning);\r\n\r\n    // 2. Validar que seleccionó una fecha de inicio\r\n    IsBlank(fechaInicioProyecto.SelectedDate);\r\n    Notify(\"Debes seleccionar la fecha de inicio del rango.\"; NotificationType.Warning);\r\n\r\n    // 3. Validar que seleccionó una fecha de fin\r\n    IsBlank(fechaFinProyecto.SelectedDate);\r\n    Notify(\"Debes seleccionar la fecha de fin del rango.\"; NotificationType.Warning);\r\n\r\n    // 4. Validar coherencia de fechas\r\n    fechaInicioProyecto.SelectedDate > fechaFinProyecto.SelectedDate;\r\n    Notify(\"La fecha de inicio no puede ser mayor a la fecha de fin.\"; NotificationType.Error);\r\n\r\n    // 5. SI TODO ESTÁ CORRECTO, EJECUTA EL CÓDIGO PRINCIPAL\r\n    Set(varFechaInicioExport; fechaInicioProyecto.SelectedDate);;\r\n    Set(varFechaFinExport; fechaFinProyecto.SelectedDate);;\r\n\r\n    // Generar un calendario secuencial puro con TODOS los días del rango elegido\r\n    ClearCollect(\r\n        colFechasCorte;\r\n        ForAll(\r\n            Sequence(DateDiff(varFechaInicioExport; varFechaFinExport; TimeUnit.Days) + 1; 0);\r\n            { FechaRango: DateAdd(varFechaInicioExport; Value; TimeUnit.Days) }\r\n        )\r\n    );;\r\n\r\n    // Obtener el listado filtrando por las FECHAS y por el PROYECTO seleccionado\r\n    ClearCollect(\r\n        colCombosUnicosExport;\r\n        ForAll(\r\n            Distinct(\r\n                Filter(\r\n                    colTodasAsignaciones; \r\n                    Fecha >= varFechaInicioExport And \r\n                    Fecha <= varFechaFinExport And\r\n                    NombreVisualProyecto = cmbFiltroProyecto.Selected.Value\r\n                ); \r\n                CorreoResponsable & \"|\" & ProyectoUID\r\n            ) As Combo;\r\n            With(\r\n                {\r\n                    primerRegistro: LookUp(colTodasAsignaciones; CorreoResponsable & \"|\" & ProyectoUID = Combo.Value)\r\n                };\r\n                {\r\n                    Correo: primerRegistro.CorreoResponsable;\r\n                    ProyectoUID: primerRegistro.ProyectoUID;\r\n                    Empresa: primerRegistro.Empresa;\r\n                    ProyectoIDExcel: primerRegistro.ProyectoIDExcel;\r\n                    ActividadExcel: primerRegistro.ActividadExcel;\r\n                    Nombre: primerRegistro.NombreResponsable;\r\n                    Cedula: primerRegistro.Cedula;\r\n                    Ekon: primerRegistro.Ekon;\r\n                    EntradaJornada: primerRegistro.EntradaJornada;\r\n                    SalidaJornada: primerRegistro.SalidaJornada;\r\n                    IngresoAlmuerzo: primerRegistro.IngresoAlmuerzo;\r\n                    SalidaAlmuerzo: primerRegistro.SalidaAlmuerzo;\r\n                    GrupoObservacion: primerRegistro.GrupoObservacion;\r\n                    \r\n                    CargoInforCode: Switch(\r\n                        Upper(Trim(primerRegistro.ResponsableCargo));\r\n                        \"PARAMEDICO\"; \"P0021\";\r\n                        \"DESARROLLADOR DE SOFTWARE\"; \"PPOOPP\"; \r\n                        \"SUPERVISOR SSA\"; \"P00030\";\r\n                        \"\" \r\n                    );\r\n                    \r\n                    FechaMin: Min(Filter(colAsignacionesGlobales; ResponsableCorreo = primerRegistro.CorreoResponsable And ProjectUID = primerRegistro.ProyectoUID); Fecha);\r\n                    \r\n                    /*\r\n                    // --- EXCELENTE LÓGICA REVISADA: Extraemos la FechaFin real del JSON considerando múltiples bloques ---\r\n                    // DEL CODIGO\r\n                    FechaMax: With(\r\n                        {\r\n                            registroProy: LookUp('SIG PROYECTOS'; Text(PROJECT_UID) = Text(primerRegistro.ProyectoUID))\r\n                        };\r\n                        If(\r\n                            IsBlank(registroProy.ASIGNACIONES);\r\n                            // Backup en caso de que no haya JSON\r\n                            Max(Filter(colAsignacionesGlobales; ResponsableCorreo = primerRegistro.CorreoResponsable And ProjectUID = primerRegistro.ProyectoUID); Fecha);\r\n                            \r\n                            With(\r\n                                {\r\n                                    jsonAsig: ParseJSON(registroProy.ASIGNACIONES)\r\n                                };\r\n                                With(\r\n                                    {\r\n                                        // \U0001F6E0️ FIX: Usamos Max + Filter en lugar de LookUp para atrapar la fecha de fin más lejana de TODOS sus bloques\r\n                                        maxFechaPrincipal: Max(\r\n                                            Filter(\r\n                                                Table(jsonAsig.Principales);\r\n                                                Lower(Trim(Text(Value.Correo))) = Lower(Trim(primerRegistro.CorreoResponsable))\r\n                                            );\r\n                                            DateValue(Text(Value.FechaFin))\r\n                                        );\r\n                                        maxFechaBack: Max(\r\n                                            Filter(\r\n                                                Table(jsonAsig.Backs);\r\n                                                Lower(Trim(Text(Value.Correo))) = Lower(Trim(primerRegistro.CorreoResponsable))\r\n                                            );\r\n                                            DateValue(Text(Value.FechaFin))\r\n                                        )\r\n                                    };\r\n                                    // Evaluamos cuál tiene datos válidos y asignamos la fecha tope\r\n                                    If(\r\n                                        !IsBlank(maxFechaPrincipal) And Year(maxFechaPrincipal) > 2000; \r\n                                        maxFechaPrincipal;\r\n                                        If(\r\n                                            !IsBlank(maxFechaBack) And Year(maxFechaBack) > 2000;\r\n                                            maxFechaBack;\r\n                                            // Backup final si el usuario no está en el JSON por alguna razón\r\n                                            Max(Filter(colAsignacionesGlobales; ResponsableCorreo = primerRegistro.CorreoResponsable And ProjectUID = primerRegistro.ProyectoUID); Fecha)\r\n                                        )\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                    */\r\n                    /*\r\n                    FechaMax: With(\r\n                        {\r\n                            registroProy: LookUp('SIG PROYECTOS'; Text(PROJECT_UID) = Text(primerRegistro.ProyectoUID))\r\n                        };\r\n                        If(\r\n                            IsBlank(registroProy.ASIGNACIONES);\r\n                            Max(Filter(colAsignacionesGlobales; ResponsableCorreo = primerRegistro.CorreoResponsable And ProjectUID = primerRegistro.ProyectoUID); Fecha);\r\n                            \r\n                            With(\r\n                                {\r\n                                    jsonAsig: ParseJSON(registroProy.ASIGNACIONES)\r\n                                };\r\n                                With(\r\n                                    {\r\n                                        maxFechaPrincipal: Max(\r\n                                            Filter(\r\n                                                Table(jsonAsig.Principales);\r\n                                                Lower(Trim(Text(Value.Correo))) = Lower(Trim(primerRegistro.CorreoResponsable))\r\n                                            );\r\n                                            DateValue(Text(Value.FechaFin))\r\n                                        );\r\n                                        maxFechaBack: Max(\r\n                                            Filter(\r\n                                                Table(jsonAsig.Backs);\r\n                                                Lower(Trim(Text(Value.Correo))) = Lower(Trim(primerRegistro.CorreoResponsable))\r\n                                            );\r\n                                            DateValue(Text(Value.FechaFin))\r\n                                        );\r\n                                        maxFechaColeccion: Max(\r\n                                            Filter(colAsignacionesGlobales; ResponsableCorreo = primerRegistro.CorreoResponsable And ProjectUID = primerRegistro.ProyectoUID);\r\n                                            Fecha\r\n                                        )\r\n                                    };\r\n                                    // ✨ FIX REAL: tomamos el MAYOR de los tres, no el primero que no esté en blanco\r\n                                    Max(\r\n                                        If(!IsBlank(maxFechaPrincipal) And Year(maxFechaPrincipal) > 2000; maxFechaPrincipal; Date(1900;1;1));\r\n                                        If(!IsBlank(maxFechaBack) And Year(maxFechaBack) > 2000; maxFechaBack; Date(1900;1;1));\r\n                                        If(!IsBlank(maxFechaColeccion) And Year(maxFechaColeccion) > 2000; maxFechaColeccion; Date(1900;1;1))\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                }\r\n            )\r\n        )\r\n    );;\r\n\r\n    // Cruzar el personal con el calendario, aplicando prioridades correctas de sobreposición\r\n    Clear(colExportacionPrevia);;\r\n\r\n    ForAll(\r\n        colCombosUnicosExport As Combo;\r\n        ForAll(\r\n            Filter(colFechasCorte; FechaRango >= Combo.FechaMin And FechaRango <= Combo.FechaMax) As DiaExport;\r\n            \r\n            With(\r\n                {\r\n                    // 1. Obtenemos el registro exacto\r\n                    registroDia: LookUp(\r\n                        colTodasAsignaciones; \r\n                        CorreoResponsable = Combo.Correo And \r\n                        ProyectoUID = Combo.ProyectoUID And \r\n                        Fecha = DiaExport.FechaRango\r\n                    )\r\n                };\r\n                \r\n                // ✨ LA SOLUCIÓN: Solo procesamos si la persona REALMENTE tiene un registro ese día \r\n                // en este proyecto (sea laborable o descanso explícito). Si es Blank, es un hueco y lo saltamos.\r\n                If(\r\n                    !IsBlank(registroDia);\r\n                    \r\n                    With(\r\n                        {\r\n                            novP: LookUp(colTodasNovedades; TipoAplicacion = \"PERSONA\" And CorreoPersona = Combo.Correo And Fecha = DiaExport.FechaRango);\r\n                            novG: LookUp(colTodasNovedades; TipoAplicacion = \"GENERAL\" And Fecha = DiaExport.FechaRango);\r\n                            novProy: LookUp(colTodasNovedades; TipoAplicacion = \"PROYECTO\" And ProyectoUID = Combo.ProyectoUID And Fecha = DiaExport.FechaRango);\r\n                            \r\n                            historialAct: LookUp(\r\n                                colHistorialActividades; \r\n                                ProyectoUID = Combo.ProyectoUID And \r\n                                FechaInicio <= DiaExport.FechaRango And \r\n                                FechaFin >= DiaExport.FechaRango\r\n                            )\r\n                        };\r\n                        With(\r\n                            {\r\n                                hayNovedad: !IsBlank(novP) Or !IsBlank(novG) Or !IsBlank(novProy);\r\n                                textoNovedad: If(!IsBlank(novP); novP.TipoNovedad; !IsBlank(novG); novG.TipoNovedad; !IsBlank(novProy); novProy.TipoNovedad; \"\");\r\n                                actividadFinal: If(!IsBlank(historialAct); historialAct.ActivityId; Combo.ActividadExcel);\r\n                                \r\n                                // ✨ CORRECCIÓN LOGICA: Como ya filtramos los Blanks, solo es descanso \r\n                                // si el Rol dice explícitamente \"DESCANSO\"\r\n                                esDescanso: registroDia.Rol = \"DESCANSO\"\r\n                            };\r\n                            \r\n                            Collect(colExportacionPrevia;\r\n                                {\r\n                                    FiltroEmpresa: Combo.Empresa;\r\n                                    FiltroProyecto: Combo.ProyectoIDExcel;\r\n                                    FiltroNombre: Combo.Nombre;\r\n                                    FiltroFecha: DiaExport.FechaRango;\r\n                                    \r\n                                    EMPRESA: Combo.Empresa;\r\n                                    EKON: Combo.Ekon;\r\n                                    CEDULA: Combo.Cedula;\r\n                                    NOMBRE: Combo.Nombre;\r\n                                    FECHA: Text(DiaExport.FechaRango; \"d/m/yyyy\");\r\n                                    \r\n                                    // CORRECCIÓN DE HORARIOS\r\n                                    'INGRESO DE JORNADA': If(hayNovedad Or esDescanso; \"00:00:00\"; Combo.EntradaJornada);\r\n                                    'INGRESO ALMUERZO': If(hayNovedad Or esDescanso; \"00:00:00\"; Combo.IngresoAlmuerzo);\r\n                                    'SALIDA ALMUERZO': If(hayNovedad Or esDescanso; \"00:00:00\"; Combo.SalidaAlmuerzo);\r\n                                    'SALIDA DE JORNADA': If(hayNovedad Or esDescanso; \"00:00:00\"; Combo.SalidaJornada);\r\n                                    \r\n                                    PROYECTO: Combo.ProyectoIDExcel;\r\n                                    ACTIVIDAD: actividadFinal;\r\n                                    \r\n                                    // CORRECCIÓN DE ESTADO\r\n                                    ESTADO: If(\r\n                                        hayNovedad; \"LIBRE\";\r\n                                        esDescanso; \"LIBRE\";\r\n                                        \"LABORABLE\"\r\n                                    );\r\n                                    \r\n                                    // CORRECCIÓN DE OBSERVACION\r\n                                    OBSERVACION: If(\r\n                                        hayNovedad; Upper(textoNovedad);\r\n                                        esDescanso; \"DESCANSO\";\r\n                                        Combo.GrupoObservacion\r\n                                    );\r\n                                    \r\n                                    'CARGO INFOR': Combo.CargoInforCode\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );;\r\n\r\n    // Agrupar y Ordenar los datos finales\r\n    ClearCollect(\r\n        colExportacionExcel;\r\n        DropColumns(\r\n            SortByColumns(\r\n                colExportacionPrevia;\r\n                \"FiltroEmpresa\"; SortOrder.Ascending;\r\n                \"FiltroProyecto\"; SortOrder.Ascending;\r\n                \"FiltroNombre\"; SortOrder.Ascending;\r\n                \"FiltroFecha\"; SortOrder.Ascending\r\n            );\r