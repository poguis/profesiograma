                                                                              "VACACIONES", "V",
                                                                              "PERMISO", "P",
                                                                              "PERMISO MEDICO", "PM",
                                                                              Left(estado, 1)
                                                                          ),
                                                                          tip: If(estado = "DESCANSO", "Descanso (del proyecto) - " & detalle, estado & ": " & detalle)
                                                                      },
                                                                      "<td title='" & tip & " | " & Text(fDia, "dd/mm/yyyy") & "' style='border-right:1px solid #EAEAEA;border-bottom:1px solid #EAEAEA;background:" & bg & ";color:" & tc & ";text-align:center;font-weight:600;font-size:" & If(estado = "DESCANSO", "8px", "9px") & ";white-space:nowrap;overflow:hidden;'>" & txt & "</td>"
                                                                  )
                                                              )
                                                          )
                                                      )
                                                  ) &
                                                  "</tr>"
                                          }
                                      )
                                  )
                              )
                          );

                          // ------------------------------------------------------------------
                          // 8. CABECERA Y LEYENDA DEL HTML (se arman una sola vez)
                          // ------------------------------------------------------------------
                          Set(
                              varHtmlInicio,
                              "<div style='width:100%;height:100%;overflow:auto;position:relative;border:1px solid #EAEAEA;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.05);font-family:Segoe UI,Open Sans,sans-serif;'>" &
                              "<table style='table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:10px;width:" & (varAnchoColaborador + varTotalDias * varAnchoDia) & "px;background:#FFF;'>" &
                              "<tr>" &
                                  "<th style='position:sticky;top:0;left:0;z-index:3;height:26px;border-bottom:1px solid #D9D9D9;border-right:1px solid #D9D9D9;background:#FAFAFA;width:" & varAnchoColaborador & "px;'></th>" &
                                  "<th colspan='" & varTotalDias & "' style='position:sticky;top:0;z-index:2;height:26px;border-bottom:1px solid #D9D9D9;background:#FAFAFA;color:#333;font-size:13px;padding:6px;text-align:center;font-weight:600;text-transform:uppercase;'>" &
                                      "Cronograma del " & Text(varFechaInicio, "[$-es-ES]dd/mm/yyyy") & " al " & Text(varFechaFin, "[$-es-ES]dd/mm/yyyy") &
                                  "</th>" &
                              "</tr>" &
                              "<tr>" &
                                  "<th style='position:sticky;top:26px;left:0;z-index:3;border-right:1px solid #EAEAEA;border-bottom:2px solid #EAEAEA;background:#FFF;width:" & varAnchoColaborador & "px;text-align:left;padding:4px 6px;color:#555;'>COLABORADOR</th>" &
                                  Concat(
                                      colDiasVista As dh,
                                      With(
                                          {
                                              esFinde: Weekday(dh.FechaReal, StartOfWeek.Monday) > 5,
                                              diaSemana: Upper(Left(Text(dh.FechaReal, "[$-es-ES]ddd"), 1))
                                          },
                                          "<th style='position:sticky;top:26px;z-index:1;border-right:1px solid #EAEAEA;border-bottom:2px solid #EAEAEA;background:" & If(esFinde, "#F3F3F3", "#FFF") & ";width:" & varAnchoDia & "px;text-align:center;padding:2px 0;overflow:hidden;'>" &
                                              "<span style='color:#888;font-size:8px;font-weight:400;'>" & If(diaSemana = "M", Text(dh.FechaReal, "[$-es-ES]ddd"), diaSemana) & "</span><br>" &
                                              "<strong style='font-size:11px;color:" & If(esFinde, "#D13438", "#333") & ";'>" & dh.DiaNumero & "</strong>" &
                                          "</th>"
                                      )
                                  ) &
                              "</tr>"
                          );

                          Set(
                              varHtmlFin,
                              "</table>" &
                              "<div style='width:" & (varAnchoColaborador + varTotalDias * varAnchoDia) & "px;margin-top:10px;padding:10px;border-top:1px solid #EAEAEA;background:#FAFAFA;'>" &
                                  "<strong style='font-size:12px;color:#323130;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;'>Leyenda del Cronograma</strong>" &
                                  "<table style='font-size:10px;color:#555;border-collapse:collapse;'>" &
                                      "<tr>" &
                                          "<td style='padding:3px 10px 3px 0;'><span style='display:inline-block;width:10px;height:10px;background:#D13438;vertical-align:middle;margin-right:5px;border-radius:2px;'></span><strong>F</strong> Feriado</td>" &
                                          "<td style='padding:3px 10px;'><span style='display:inline-block;width:10px;height:10px;background:#0277BD;vertical-align:middle;margin-right:5px;border-radius:2px;'></span><strong>V</strong> Vacaciones</td>" &
                                          "<td style='padding:3px 10px;'><span style='display:inline-block;width:10px;height:10px;background:#FFB900;vertical-align:middle;margin-right:5px;border-radius:2px;'></span><strong>P / PM</strong> Permisos</td>" &
                                      "</tr><tr>" &
                                          "<td style='padding:3px 10px 3px 0;'><span style='display:inline-block;width:10px;height:10px;background:#8E44AD;vertical-align:middle;margin-right:5px;border-radius:2px;'></span><strong>CD</strong> Calamidad Doméstica</td>" &
                                          "<td style='padding:3px 10px;'><span style='display:inline-block;width:10px;height:10px;background:#27AE60;vertical-align:middle;margin-right:5px;border-radius:2px;'></span><strong>PT</strong> Paternidad</td>" &
                                          "<td style='padding:3px 10px;'><span style='display:inline-block;width:10px;height:10px;background:#201F1E;vertical-align:middle;margin-right:5px;border-radius:2px;'></span><strong>C</strong> Choque</td>" &
                                      "</tr><tr>" &
                                          "<td colspan='3' style='padding:3px 10px 3px 0;'><span style='display:inline-block;width:10px;height:10px;background:#607D8B;vertical-align:middle;margin-right:5px;border-radius:2px;'></span><strong>D-</strong> Descanso de Proyecto</td>" &
                                      "</tr>" &
                                  "</table>" &
                                  If(CountRows(colColoresProyectos) > 0, "<hr style='border:0;border-top:1px dashed #D9D9D9;margin:10px 0;'>", "") &
                                  "<div style='display:flex;flex-wrap:wrap;max-width:1190px;row-gap:4px;'>" &
                                      Concat(
                                          colColoresProyectos,
                                          "<div style='flex:0 0 170px;padding:3px 6px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:#555;' title='" & ProyectoCodigo & "'>" &
                                              "<span style='display:inline-block;width:10px;height:10px;background:" & ColorHex & ";vertical-align:middle;margin-right:5px;border-radius:2px;'></span>" &
                                              "<strong style='color:#333;'>" & Left(ProyectoCodigo, 2) & "</strong> - " & ProyectoCodigo &
                                          "</div>"
                                      ) &
                                  "</div>" &
                              "</div>" &
                              "</div>"
                          );

                          Set(cargarInfo, false);

                          Notify(
                              "Cronograma del " & Text(varFechaInicio, "[$-es-ES]dd/mm/yyyy") & " al " & Text(varFechaFin, "[$-es-ES]dd/mm/yyyy") &
                              ": " & CountRows(colAsignacionesRango) & " registros, " & CountRows(colCronogramaFilas) & " personas en " &
                              Text(DateDiff(varT0, Now(), TimeUnit.Seconds)) & " s",
                              NotificationType.Success
                          )
                        Text: ="Ver"
                        Width: =90
