Screens:
  ControlMensualProyectos:
    Properties:
      Fill: '=RGBA(255, 255, 255, 1) '
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: "=/*\r\nSet(cargarInfo; true);;\r\n\r\nRefresh('SIG PROYECTOS');;\r\n\r\n// Limpieza inicial de colecciones\r\nClear(colAsignacionesGlobales);;\r\nClear(colVinculosProyectoPersonal);;\r\nClear(colMesesVista);;\r\nClear(colDiasVista);;\r\nClear(colPersonasVista);;\r\nClear(colCronogramaBase);;\r\nClear(colTodasAsignaciones);;\r\nClear(colTodasNovedades);;\r\nClear(colHistorialActividades);;\r\n\r\n// Carga estática de Meses\r\nClearCollect(\r\n    colMesesVista;\r\n    {Id: 1; Nombre: \"ENERO\"}; {Id: 2; Nombre: \"FEBRERO\"}; {Id: 3; Nombre: \"MARZO\"};\r\n    {Id: 4; Nombre: \"ABRIL\"}; {Id: 5; Nombre: \"MAYO\"}; {Id: 6; Nombre: \"JUNIO\"};\r\n    {Id: 7; Nombre: \"JULIO\"}; {Id: 8; Nombre: \"AGOSTO\"}; {Id: 9; Nombre: \"SEPTIEMBRE\"};\r\n    {Id: 10; Nombre: \"OCTUBRE\"}; {Id: 11; Nombre: \"NOVIEMBRE\"}; {Id: 12; Nombre: \"DICIEMBRE\"}\r\n);;\r\n\r\n// ------------------------------------------------------------------\r\n// 1. LECTURA Y DESERIALIZACIÓN OPTIMIZADA\r\n// ------------------------------------------------------------------\r\nClearCollect(\r\n    colProyectosFiltrados;\r\n    Filter(\r\n        'SIG PROYECTOS';\r\n        !IsBlank(ASIGNACIONES) &&\r\n        (varEsSuperAdmin || Text(ParseJSON(INF_GENERAL).InfoRegistro.Correo) = varUsuarioActual.Email)\r\n    )\r\n);;\r\n\r\nForAll(\r\n    colProyectosFiltrados As Proy;\r\n    With(\r\n        {\r\n            jsonInfo: ParseJSON(Proy.INF_GENERAL);\r\n            jsonAsig: ParseJSON(Proy.ASIGNACIONES)\r\n        };\r\n        With(\r\n            {\r\n                pID: Text(Proy.PROJECT_UID);\r\n                pCode: Text(Proy.Título);\r\n                pEstado: Text(Proy.ESTADO.Value);\r\n                pNombre: Coalesce(Text(jsonInfo.InfoProyecto.Proyecto.Nombre); \"PLANTA - \" & Text(jsonInfo.InfoProyecto.Dimension.Descripcion));\r\n                pCorreoCreador: Lower(Trim(Text(jsonInfo.InfoRegistro.Correo)));\r\n                pEmpresa: Text(jsonInfo.InfoProyecto.Compania.CompanyId);\r\n                pProjectIdExcel: Text(jsonInfo.InfoProyecto.Proyecto.ProjectId);\r\n                pActividadExcel: Text(jsonInfo.InfoProyecto.Actividad.ActivityId);\r\n                fInicio: DateValue(Text(jsonInfo.Planificacion.FechaInicio));\r\n                fFin: DateValue(Text(jsonInfo.Planificacion.FechaFin));\r\n                \r\n                // Precalculo de horarios por proyecto (evita procesarlos n veces por día)\r\n                hEntrada: With({h: Text(jsonInfo.InfoProyecto.Horario.Entrada)}; If(Len(h)=4; Left(h;2)&\":\"&Right(h;2)&\":00\"; h));\r\n                hSalida: With({h: Text(jsonInfo.InfoProyecto.Horario.Salida)}; If(Len(h)=4; Left(h;2)&\":\"&Right(h;2)&\":00\"; h));\r\n                hSalidaAlmuerzo: Text(jsonInfo.InfoProyecto.Horario.SalidaAlmuerzo);\r\n                hIngresoAlmuerzo: Text(jsonInfo.InfoProyecto.Horario.RegresoAlmuezo);\r\n                pGrupoObs: Text(jsonInfo.InfoProyecto.Grupo);\r\n\r\n                tblPrincipales: Table(jsonAsig.Principales);\r\n                tblBacks: Table(jsonAsig.Backs);\r\n                tblHistorial: Table(jsonAsig.HistorialActividades);\r\n                \r\n                tblDetalleEfectivo: If(\r\n                    CountRows(Table(jsonAsig.DetalleDiario)) > 0;\r\n                    Table(jsonAsig.DetalleDiario);\r\n                    If(\r\n                        CountRows(Table(jsonAsig.Etapas)) > 0;\r\n                        Table(ParseJSON(Text(Last(Table(jsonAsig.Etapas)).Value.DetalleDiarioEtapaJson)));\r\n                        Table(jsonAsig.DetalleDiario)\r\n                    )\r\n                )\r\n            };\r\n            \r\n            // A. Historial de Actividades\r\n            ForAll(\r\n                tblHistorial As Hist;\r\n                Collect(\r\n                    colHistorialActividades;\r\n                    {\r\n                        ProyectoUID: pID;\r\n                        ActivityId: Text(Hist.Value.ActivityId);\r\n                        FechaInicio: DateValue(Text(Hist.Value.FechaInicio));\r\n                        FechaFin: DateValue(Text(Hist.Value.FechaFin))\r\n                    }\r\n                )\r\n            );;\r\n\r\n            // B. Vínculos Históricos (Principales y Backs)\r\n            ForAll(\r\n                Table(jsonInfo.Responsables.Principales) As p;\r\n                Collect(\r\n                    colVinculosProyectoPersonal;\r\n                    {\r\n                        ProjectUID: pID; ProyectoCodigo: pCode; ProyectoNombre: pNombre;\r\n                        EstadoProyecto: pEstado; FechaInicioProyecto: fInicio; FechaFinProyecto: fFin;\r\n                        ResponsableCorreo: Lower(Trim(Text(p.Value.Correo))); ResponsableNombre: Upper(Trim(Text(p.Value.Nombre)));\r\n                        ResponsableCargo: Text(p.Value.Cargo); Cedula: Text(p.Value.Cedula); Ekon: Text(p.Value.Ekon); TipoVinculo: \"PRINCIPAL\"\r\n                    }\r\n                )\r\n            );;\r\n\r\n            ForAll(\r\n                Table(jsonInfo.Responsables.Backs) As b;\r\n                Collect(\r\n                    colVinculosProyectoPersonal;\r\n                    {\r\n                        ProjectUID: pID; ProyectoCodigo: pCode; ProyectoNombre: pNombre;\r\n                        EstadoProyecto: pEstado; FechaInicioProyecto: fInicio; FechaFinProyecto: fFin;\r\n                        ResponsableCorreo: Lower(Trim(Text(b.Value.Correo))); ResponsableNombre: Upper(Trim(Text(b.Value.Nombre)));\r\n                        ResponsableCargo: Text(b.Value.Cargo); Cedula: Text(b.Value.Cedula); Ekon: Text(b.Value.Ekon); TipoVinculo: \"BACK\"\r\n                    }\r\n                )\r\n            );;\r\n\r\n            // C. Detalle Diario (Lectura 100% Lineal - Sin LookUps internamente)\r\n            ForAll(\r\n                tblDetalleEfectivo As Det;\r\n                Collect(\r\n                    colTodasAsignaciones;\r\n                    {\r\n                        ProyectoUID: pID; TituloProyecto: pCode; NombreVisualProyecto: pNombre;\r\n                        Fecha: DateValue(Text(Det.Value.Fecha)); Rol: Text(Det.Value.Rol); Ekon: Text(Det.Value.ResponsableEkon);\r\n                        CorreoResponsable: Lower(Trim(Text(Det.Value.ResponsableCorreo)));\r\n                        NombreResponsable: Upper(Trim(Text(Det.Value.ResponsableNombre)));\r\n                        ResponsableCargo: Text(Det.Value.ResponsableCargo);\r\n                        Cedula: Text(Det.Value.ResponsableCedula);\r\n                        CorreoCreador: pCorreoCreador; Empresa: pEmpresa;\r\n                        ProyectoIDExcel: pProjectIdExcel; ActividadExcel: pActividadExcel;\r\n                        EntradaJornada: hEntrada;\r\n                        SalidaJornada: hSalida;\r\n                        SalidaAlmuerzo: hSalidaAlmuerzo;\r\n                        IngresoAlmuerzo: hIngresoAlmuerzo;\r\n                        GrupoObservacion: pGrupoObs\r\n                    }\r\n                )\r\n            );;\r\n\r\n            // D. Generación Directa de Descansos (Desde Principales)\r\n            ForAll(\r\n                tblPrincipales As P;\r\n                With(\r\n                    {\r\n                        numDiasDescanso: Value(P.Value.DiasDescanso);\r\n                        fFinJornada: DateValue(Text(P.Value.FechaFin));\r\n                        ekonP: Text(P.Value.Ekon);\r\n                        correoP: Lower(Trim(Text(P.Value.Correo)));\r\n                        nombreP: Upper(Trim(Text(P.Value.Nombre)));\r\n                        cargoP: Text(P.Value.Cargo);\r\n                        cedulaP: Text(P.Value.Cedula)\r\n                    };\r\n                    If(\r\n                        numDiasDescanso > 0 && !IsBlank(fFinJornada);\r\n                        ForAll(\r\n                            Sequence(numDiasDescanso) As Seq;\r\n                            Collect(\r\n                                colTodasAsignaciones;\r\n                                {\r\n                                    ProyectoUID: pID; TituloProyecto: pCode; NombreVisualProyecto: pNombre;\r\n                                    Fecha: DateAdd(fFinJornada; Seq.Value; TimeUnit.Days); Rol: \"DESCANSO\"; Ekon: ekonP;\r\n                                    CorreoResponsable: correoP;\r\n                                    NombreResponsable: nombreP;\r\n                                    ResponsableCargo: cargoP;\r\n                                    Cedula: cedulaP;\r\n                                    CorreoCreador: pCorreoCreador; Empresa: pEmpresa;\r\n                                    ProyectoIDExcel: pProjectIdExcel; ActividadExcel: pActividadExcel;\r\n                                    EntradaJornada: hEntrada;\r\n                                    SalidaJornada: hSalida;\r\n                                    SalidaAlmuerzo: hSalidaAlmuerzo;\r\n                                    IngresoAlmuerzo: hIngresoAlmuerzo;\r\n                                    GrupoObservacion: pGrupoObs\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    )\r\n);;\r\n\r\nClearCollect(colAsignacionesGlobales; colTodasAsignaciones);;\r\n\r\n// ------------------------------------------------------------------\r\n// 2. EXTRAER NOVEDADES\r\n// ------------------------------------------------------------------\r\nForAll(\r\n    'NOVEDADES ASISTENCIA' As Nov;\r\n    With({jsonDetalle: ParseJSON(Nov.DETALLE_JSON)};\r\n        ForAll(\r\n            Table(jsonDetalle.Dias) As DiaNovedad;\r\n            Collect(\r\n                colTodasNovedades;\r\n                {\r\n                    TipoAplicacion: Text(jsonDetalle.TipoAplicacion);\r\n                    ProyectoUID: Text(jsonDetalle.Proyecto.ProjectUID);\r\n                    CorreoPersona: Lower(Trim(Text(jsonDetalle.Persona.Correo)));\r\n                    EkonPersona: Coalesce(Text(jsonDetalle.Persona.Ekon); Text(jsonDetalle.Fechas.Ekon));\r\n                    Fecha: DateValue(Text(DiaNovedad.Value.Fecha));\r\n                    EstadoExcel: Text(DiaNovedad.Value.EstadoExcel);\r\n                    Observacion: Text(DiaNovedad.Value.ObservacionExcel);\r\n                    TipoNovedad: Text(jsonDetalle.TipoNovedad)\r\n                }\r\n            )\r\n        )\r\n    )\r\n);;\r\n\r\n// ------------------------------------------------------------------\r\n// 3. GENERAR LISTA ÚNICA DE PERSONAS (OPTIMIZADO CON GROUPBY)\r\n// ------------------------------------------------------------------\r\nClearCollect(\r\n    colPersonasVista;\r\n    DropColumns(\r\n        AddColumns(\r\n            GroupBy(colTodasAsignaciones; Ekon; GrupoAsig);\r\n            Nombre; First(GrupoAsig).NombreResponsable;\r\n            CedulaPersona; First(GrupoAsig).Cedula;\r\n            Correo; First(GrupoAsig).CorreoResponsable\r\n        );\r\n        GrupoAsig\r\n    )\r\n);;\r\n\r\nSet(varAnioVista; Year(Today()));;\r\nSet(varMesVista; Month(Today()));;\r\nClearCollect(colDiasVista; Sequence(Day(DateAdd(Date(varAnioVista; varMesVista + 1; 1); -1; TimeUnit.Days))));;\r\n\r\nSet(varAnchoBaseCronograma; 150 + CountRows(colDiasVista) * 34);;\r\nSet(varEscalaCronograma; Min(1; (App.Width - 80) / varAnchoBaseCronograma));;\r\nSet(varEscalaCronogramaTxt; Substitute(Text(varEscalaCronograma; \"0,00\"); \",\"; \".\"));;\r\n\r\nSet(cargarInfo; false);;\r\n*/\r\n\r\n\r\n\r\nSet(cargarInfo, true);\r\nSet(varCorreoUsuarioActual, Lower(Trim(varUsuarioActual.Email)));\r\n\r\n// ------------------------------------------------------------------\r\n// LIMPIEZA\r\n// ------------------------------------------------------------------\r\nClear(colAsignacionesRango);\r\nClear(colDetalleRango);\r\nClear(colPersonasVista);\r\n//Clear(colCronogramaBase);;\r\nClear(colColoresProyectos);\r\nClear(colDiasVista);\r\nClear(colTodasNovedades);\r\nClear(colCronogramaFilas);\r\nSet(varHtmlInicio, \"\");\r\nSet(varHtmlFin, \"\");\r\n\r\nClearCollect(\r\n    colMesesVista,\r\n    {Id: 1, Nombre: \"ENERO\"}, {Id: 2, Nombre: \"FEBRERO\"}, {Id: 3, Nombre: \"MARZO\"},\r\n    {Id: 4, Nombre: \"ABRIL\"}, {Id: 5, Nombre: \"MAYO\"}, {Id: 6, Nombre: \"JUNIO\"},\r\n    {Id: 7, Nombre: \"JULIO\"}, {Id: 8, Nombre: \"AGOSTO\"}, {Id: 9, Nombre: \"SEPTIEMBRE\"},\r\n    {Id: 10, Nombre: \"OCTUBRE\"}, {Id: 11, Nombre: \"NOVIEMBRE\"}, {Id: 12, Nombre: \"DICIEMBRE\"}\r\n);\r\n\r\n/*\r\n// ------------------------------------------------------------------\r\n// 1. CABECERA LIVIANA DE PROYECTOS (sin JSON; excluye la fila 666)\r\n// ------------------------------------------------------------------\r\nClearCollect(\r\n    colProyectosCab;\r\n    ForAll(\r\n        If(\r\n            varEsSuperAdmin;\r\n            Filter('SIG PROYECTOS'; StartsWith(Título; \"PRY-\"));\r\n            Filter('SIG PROYECTOS'; StartsWith(Título; \"PRY-\") && CORREO_CREADOR = varCorreoUsuarioActual)\r\n        ) As px;\r\n        {\r\n            ProyectoUID: px.PROYECTO_UID;\r\n            Codigo: px.Título;\r\n            NombreProyecto: px.NOMBRE_PROYECTO;\r\n            CorreoCreador: px.CORREO_CREADOR;\r\n            Estado: px.ESTADO.Value;\r\n            Empresa: Text(px.COMPANY_ID);\r\n            ProyectoIDExcel: px.PROJECT_ID_EKON;\r\n            ActividadExcel: px.ACTIVITY_ID;\r\n            GrupoObservacion: px.GRUPO;\r\n            EntradaJornada: If(Len(px.HORA_ENTRADA) = 4; Left(px.HORA_ENTRADA; 2) & \":\" & Right(px.HORA_ENTRADA; 2) & \":00\"; px.HORA_ENTRADA);\r\n            SalidaJornada: If(Len(px.HORA_SALIDA) = 4; Left(px.HORA_SALIDA; 2) & \":\" & Right(px.HORA_SALIDA; 2) & \":00\"; px.HORA_SALIDA);\r\n            SalidaAlmuerzo: px.SALIDA_ALMUERZO;\r\n            IngresoAlmuerzo: px.REGRESO_ALMUERZO\r\n        }\r\n    )\r\n);;\r\n*/\r\n\r\n// ------------------------------------------------------------------\r\n// 1. CABECERA LIVIANA DE PROYECTOS (columnas forzadas con ShowColumns)\r\n// ------------------------------------------------------------------\r\nClearCollect(\r\n    colProyectosCab,\r\n    ForAll(\r\n        ShowColumns(\r\n            If(\r\n                varEsSuperAdmin,\r\n                Filter('SIG PROYECTOS', StartsWith(Título, \"PRY-\")),\r\n                Filter('SIG PROYECTOS', StartsWith(Título, \"PRY-\") && CORREO_CREADOR = varCorreoUsuarioActual)\r\n            ),\r\n            Título, PROYECTO_UID, NOMBRE_PROYECTO, CORREO_CREADOR, ESTADO,\r\n            COMPANY_ID, PROJECT_ID_EKON, ACTIVITY_ID, GRUPO,\r\n            HORA_ENTRADA, HORA_SALIDA, SALIDA_ALMUERZO, REGRESO_ALMUERZO\r\n        ) As px,\r\n        {\r\n            ProyectoUID: px.PROYECTO_UID,\r\n            Codigo: px.Title,\r\n            NombreProyecto: px.NOMBRE_PROYECTO,\r\n            CorreoCreador: px.CORREO_CREADOR,\r\n            Estado: px.ESTADO.Value,\r\n            Empresa: Text(px.COMPANY_ID),\r\n            ProyectoIDExcel: px.PROJECT_ID_EKON,\r\n            ActividadExcel: px.ACTIVITY_ID,\r\n            GrupoObservacion: px.GRUPO,\r\n            EntradaJornada: If(Len(px.HORA_ENTRADA) = 4, Left(px.HORA_ENTRADA, 2) & \":\" & Right(px.HORA_ENTRADA, 2) & \":00\", px.HORA_ENTRADA),\r\n            SalidaJornada: If(Len(px.HORA_SALIDA) = 4, Left(px.HORA_SALIDA, 2) & \":\" & Right(px.HORA_SALIDA, 2) & \":00\", px.HORA_SALIDA),\r\n            SalidaAlmuerzo: px.SALIDA_ALMUERZO,\r\n            IngresoAlmuerzo: px.REGRESO_ALMUERZO\r\n        }\r\n    )\r\n);\r\n\r\n// ------------------------------------------------------------------\r\n// 2. NOVEDADES (igual que antes)\r\n// ------------------------------------------------------------------\r\nForAll(\r\n    'NOVEDADES ASISTENCIA' As Nov,\r\n    With(\r\n        {jsonDetalle: ParseJSON(Nov.DETALLE_JSON)},\r\n        ForAll(\r\n            Table(jsonDetalle.Dias) As DiaNovedad,\r\n            Collect(\r\n                colTodasNovedades,\r\n                {\r\n                    TipoAplicacion: Text(jsonDetalle.TipoAplicacion),\r\n                    ProyectoUID: Text(jsonDetalle.Proyecto.ProjectUID),\r\n                    CorreoPersona: Lower(Trim(Text(jsonDetalle.Persona.Correo))),\r\n                    EkonPersona: Coalesce(Text(jsonDetalle.Persona.Ekon), Text(jsonDetalle.Fechas.Ekon)),\r\n                    Fecha: DateValue(Text(DiaNovedad.Value.Fecha)),\r\n                    EstadoExcel: Text(DiaNovedad.Value.EstadoExcel),\r\n                    Observacion: Text(DiaNovedad.Value.ObservacionExcel),\r\n                    TipoNovedad: Text(jsonDetalle.TipoNovedad)\r\n                }\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\nSet(cargarInfo, false);\r\n\r\n// ------------------------------------------------------------------\r\n// 3. CARGA AUTOMÁTICA DEL MES ACTUAL\r\n// ------------------------------------------------------------------\r\nSelect(btnCargarVista)"
