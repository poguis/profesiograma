                   novP: LookUp(\r\n                                colTodasNovedades,\r\n                                TipoAplicacion = \"PERSONA\" && Fecha = fechaDia &&\r\n                                (EkonPersona = ekonTxt || CorreoPersona = correoResp)\r\n                            ),\r\n                            novG: LookUp(colTodasNovedades, TipoAplicacion = \"GENERAL\" && Fecha = fechaDia),\r\n                            novProy: LookUp(colTodasNovedades, TipoAplicacion = \"PROYECTO\" && ProyectoUID = reg.PROYECTO_UID && Fecha = fechaDia),\r\n                            histAct: First(\r\n                                SortByColumns(\r\n                                    Filter(\r\n                                        colExpActividades,\r\n                                        PROYECTO_UID = reg.PROYECTO_UID &&\r\n                                        FECHA_INICIO <= fechaDia &&\r\n                                        FECHA_FIN >= fechaDia\r\n                                    ),\r\n                                    \"VERSION\",\r\n                                    SortOrder.Descending\r\n                                )\r\n                            )\r\n                        },\r\n                        With(\r\n                            {\r\n                                hayNovedad: !IsBlank(novP) Or !IsBlank(novG) Or !IsBlank(novProy),\r\n                                textoNovedad: If(!IsBlank(novP), novP.TipoNovedad, !IsBlank(novG), novG.TipoNovedad, !IsBlank(novProy), novProy.TipoNovedad, \"\"),\r\n                                actividadFinal: If(!IsBlank(histAct), histAct.ACTIVITY_ID, proy.ActividadExcel),\r\n                                esDescanso: reg.ROL = \"DESCANSO\"\r\n                            },\r\n                            Collect(\r\n                                colExportacionPrevia,\r\n                                {\r\n                                    FiltroEmpresa: proy.Empresa,\r\n                                    FiltroProyecto: proy.ProyectoIDExcel,\r\n                                    FiltroNombre: reg.NOMBRE_RESPONSABLE,\r\n                                    FiltroFecha: fechaDia,\r\n\r\n                                    EMPRESA: proy.Empresa,\r\n                                    EKON: ekonTxt,\r\n                                    CEDULA: reg.CEDULA,\r\n                                    NOMBRE: reg.NOMBRE_RESPONSABLE,\r\n                                    FECHA: Text(fechaDia, \"d/m/yyyy\"),\r\n\r\n                                    'INGRESO DE JORNADA': If(hayNovedad Or esDescanso, \"00:00:00\", proy.EntradaJornada),\r\n                                    'INGRESO ALMUERZO': If(hayNovedad Or esDescanso, \"00:00:00\", proy.IngresoAlmuerzo),\r\n                                    'SALIDA ALMUERZO': If(hayNovedad Or esDescanso, \"00:00:00\", proy.SalidaAlmuerzo),\r\n                                    'SALIDA DE JORNADA': If(hayNovedad Or esDescanso, \"00:00:00\", proy.SalidaJornada),\r\n\r\n                                    PROYECTO: proy.ProyectoIDExcel,\r\n                                    ACTIVIDAD: actividadFinal,\r\n\r\n                                    ESTADO: If(hayNovedad, \"LIBRE\", esDescanso, \"LIBRE\", \"LABORABLE\"),\r\n\r\n                                    OBSERVACION: If(\r\n                                        hayNovedad, Upper(textoNovedad),\r\n                                        esDescanso, \"DESCANSO\",\r\n                                        proy.GrupoObservacion\r\n                                    ),\r\n\r\n                                    'CARGO INFOR': Switch(\r\n                                        Upper(Trim(reg.CARGO)),\r\n                                        \"PARAMEDICO\", \"P0021\",\r\n                                        \"DESARROLLADOR DE SOFTWARE\", \"PPOOPP\",\r\n                                        \"SUPERVISOR SSA\", \"P00030\",\r\n                          