                          // ------------------------------------------------------------------
                          Clear(colDetalleRango);

                          ForAll(
                              Sequence(RoundUp(varTotalDias / 30, 0)) As bloque,
                              With(
                                  {
                                      iniBloque: DateAdd(varFechaInicio, (bloque.Value - 1) * 30, TimeUnit.Days),
                                      finBloque: If(
                                          DateAdd(varFechaInicio, bloque.Value * 30 - 1, TimeUnit.Days) > varFechaFin,
                                          varFechaFin,
                                          DateAdd(varFechaInicio, bloque.Value * 30 - 1, TimeUnit.Days)
                                      )
                                  },
                                  If(
                                      varEsSuperAdmin,
                                      Collect(colDetalleRango, Filter(SIG_ASIGNACIONES_DETALLE, FECHA >= iniBloque && FECHA <= finBloque)),
                                      Collect(colDetalleRango, Filter(SIG_ASIGNACIONES_DETALLE, FECHA >= iniBloque && FECHA <= finBloque && CORREO_CREADOR = varCorreoUsuarioActual))
                                  )
                              )
                          );

                          // ------------------------------------------------------------------
                          // 3. NORMALIZAR (una sola escritura)
                          // ------------------------------------------------------------------
                          ClearCollect(
                              colAsignacionesRango,
                              ForAll(
                                  colDetalleRango As r,
                                  {
                                      ProyectoUID: r.PROYECTO_UID,
                                      NombreVisualProyecto: r.NOMBRE_PROYECTO,
                                      Fecha: r.FECHA,
                                      Rol: r.ROL,
                                      Ekon: Text(r.EKON),
                                      CorreoResponsable: Lower(Trim(r.CORREO_RESPONSABLE)),
                                      NombreResponsable: r.NOMBRE_RESPONSABLE,
