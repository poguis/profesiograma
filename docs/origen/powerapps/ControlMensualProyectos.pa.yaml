                          ClearCollect(colNovProyecto, Filter(colNovRango, TipoAplicacion = "PROYECTO"));
                          ClearCollect(colNovPersona, Filter(colNovRango, TipoAplicacion = "PERSONA"));

                          // ------------------------------------------------------------------
                          // 5. COLORES POR PROYECTO (antes de armar la matriz)
                          // ------------------------------------------------------------------
                          ClearCollect(colNombresProyectosRango, Sort(Distinct(colAsignacionesRango, NombreVisualProyecto), Value, SortOrder.Ascending));

                          ClearCollect(
