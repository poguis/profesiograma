yNovedad; \"LIBRE\";\r\n                                        esDescanso; \"LIBRE\";\r\n                                        \"LABORABLE\"\r\n                                    );\r\n\r\n                                    OBSERVACION: If(\r\n                                        hayNovedad; Upper(textoNovedad);\r\n                                        esDescanso; \"DESCANSO\";\r\n                                        proy.GrupoObservacion\r\n                                    );\r\n\r\n                                    'CARGO INFOR': Switch(\r\n                                        Upper(Trim(reg.CARGO));\r\n                                        \"PARAMEDICO\"; \"P0021\";\r\n                                        \"DESARROLLADOR DE SOFTWARE\"; \"PPOOPP\";\r\n                                        \"SUPERVISOR SSA\"; \"P00030\";\r\n                                        \"\"\r\n                                    )\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );;\r\n\r\n    // Ordenar y quitar columnas auxiliares (igual que antes)\r\n    ClearCollect(\r\n        colExportacionExcel;\r\n        DropColumns(\r\n            SortByColumns(\r\n                colExportacionPrevia;\r\n                \"FiltroEmpresa\"; SortOrder.Ascending;\r\n                \"FiltroProyecto\"; SortOrder.Ascending;\r\n                \"FiltroNombre\"; SortOrder.Ascending;\r\n                \"FiltroFecha\"; SortOrder.Ascending\r\n            );\r\n            FiltroEmpresa; FiltroProyecto; FiltroNombre; FiltroFecha\r\n        )\r\n    );;\r\n\r\n    If(\r\n        CountRows(colExportacionExcel) = 0;\r\n        Notify(\"No hay registros del proyecto en el rango seleccionado.\"; NotificationType.Warning);\r\n\r\n        ReporteProyectosSIG.Run(\r\n            JSON(colExportacionExcel; JSONFormat.IncludeBinaryData);\r\n            cmbFiltroProyecto.Selected.Value;\r\n            User().Email\r\n        );;\r\n        Notify(\r\n            \"Datos del proyecto \" & cmbFiltroProyecto.Selected.Value & \" enviados correctamente al flujo (\" & CountRows(colExportacionExcel) & \" filas).\";\r\n            NotificationType.Success\r\n        )\r\n    );;\r\n\r\n    Set(cargarInfo; false)\r\n)\r\n*/\r\n\r\n\r\n\r\n\r\n\r\nIf(\r\n    IsBlank(cmbFiltroProyecto.Selected.Value),\r\n    Notify(\"Por favor, selecciona un proyecto para generar el reporte.\", NotificationType.Warning),\r\n\r\n    IsBlank(fechaInicioProyecto.SelectedDate),\r\n    Notify(\"Debes seleccionar la fecha de inicio del rango.\", NotificationType.Warning),\r\n\r\n    IsBlank(fechaFinProyecto.SelectedDate),\r\n    Notify(\"Debes seleccionar la fecha de fin del rango.\", NotificationType.Warning),\r\n\r\n    fechaInicioProyecto.SelectedDate > fechaFinProyecto.SelectedDate,\r\n    Notify(\"La fecha de inicio no puede ser mayor a la fecha de fin.\", NotificationType.Error),\r\n\r\n    Set(cargarInfo, true);\r\n    Set(varFechaInicioExport, fechaInicioProyecto.SelectedDate);\r\n    Set(varFechaFinExport, fechaFinProyecto.SelectedDate);\r\n\r\n    ClearCollect(\r\n        colProyectosExport,\r\n        Filter(colProyectosCab, NombreProyecto = cmbFiltroProyecto.Selected.Value)\r\n    );\r\n\r\n    Clear(colExpDetalle);\r\n    Clear(colExpActividades);\r\n\r\n    // ShowColumns obliga a traer estas columnas en la app publicada\r\n    ForAll(\r\n        colProyectosExport As px,\r\n        Collect(\r\n            colExpDetalle,\r\n            ShowColumns(\r\n                Filter(\r\n                    SIG_ASIGNACIONES_DETALLE,\r\n                    PROYECTO_UID = px.ProyectoUID &&\r\n                    FECHA >= varFechaInicioExport &&\r\n                    FECHA <= varFechaFinExport\r\n                ),\r\n                PROYECTO_UID, FECHA, ROL, EKON, CEDULA, CARGO,\r\n                NOMBRE_RESPONSABLE, CORREO_RESPONSABLE\r\n          