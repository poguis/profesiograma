                                                      "<strong style='color:#323130;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;' title='" & p.Nombre & "'>" & p.Nombre & "</strong>" &
                                                      "<span style='font-size:9px;color:#A19F9D;white-space:nowrap;'>EKON: " & p.Ekon & " | CI: " & p.CedulaPersona & "</span>" &
                                                  "</td>" &
                                                  Concat(
