                          Set(varFechaInicio, Coalesce(fechaInicioProyecto.SelectedDate, Date(Year(Today()), Month(Today()), 1)));
                          Set(varFechaFin, Coalesce(fechaFinProyecto.SelectedDate, DateAdd(Date(Year(Today()), Month(Today()) + 1, 1), -1, TimeUnit.Days)));

                          If(varFechaInicio > varFechaFin, Set(varFechaFin, varFechaInicio));

                          Set(varMaxDias, 90);

                          If(
                              DateDiff(varFechaInicio, varFechaFin, TimeUnit.Days) >= varMaxDias,
                              Set(varFechaFin, DateAdd(varFechaInicio, varMaxDias - 1, TimeUnit.Days));
                              Notify("El rango excede " & varMaxDias & " días. Se mostrarán los primeros " & varMaxDias & " días.", NotificationType.Warning)
                          );

                          Set(varTotalDias, DateDiff(varFechaInicio, varFechaFin, TimeUnit.Days) + 1);
                          Set(varAnchoColaborador, 240);
                          Set(varAnchoDia, 40);

