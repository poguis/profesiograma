Screens:
  AsignarPersonal:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: "=// 1. Parseamos el JSON principal una sola vez\r\nSet(\r\n    varPryDirecto, \r\n    ParseJSON(ctxRegistroSeleccionado.INF_GENERAL)\r\n);\r\n\r\n// 2. Creamos variables tipadas para los textos fijos (evita errores de visualización)\r\nSet(varDsNombreProyecto, Text(varPryDirecto.InfoProyecto.Proyecto.Nombre));\r\nSet(varDsCodigoProyecto, Text(varPryDirecto.InfoProyecto.Proyecto.ProjectId));\r\nSet(varDsActividad, Text(varPryDirecto.InfoProyecto.Actividad.Descripcion));\r\nSet(varDsActividadId, Text(varPryDirecto.InfoProyecto.Actividad.ActivityId));\r\nSet(varDsGrupo, Text(varPryDirecto.InfoProyecto.Grupo));\r\nSet(varDsHorario, Text(varPryDirecto.InfoProyecto.Horario.Descripcion));\r\nSet(varDsEmpresa, Text(varPryDirecto.InfoProyecto.Compania.Nombre));\r\nSet(varDsEmpresaRuc, Text(varPryDirecto.InfoProyecto.Compania.Ruc));\r\nSet(varDsDimension, Text(varPryDirecto.InfoProyecto.Dimension.Descripcion));\r\nSet(varDsDimensionUegp, Text(varPryDirecto.InfoProyecto.Dimension.UegpId));\r\n\r\n// 3. Convertimos las fechas de texto a tipo Fecha real\r\nSet(varDsFechaInicio, DateValue(Text(varPryDirecto.Planificacion.FechaInicio)));\r\nSet(varDsFechaFin, DateValue(Text(varPryDirecto.Planificacion.FechaFin)));\r\n\r\n// 4. Creamos colecciones temporales para los Principales y Backs (Maneja N cantidad)\r\n// Usamos Table() para convertir el nodo JSON en una tabla leíble por la galería\r\nClearCollect(colDsPrincipales, Table(varPryDirecto.Responsables.Principales));\r\nClearCollect(colDsBacks, Table(varPryDirecto.Responsables.Backs));\r\n\r\n\r\n\r\n/*\r\n// 2. Cargamos el personal general y marcamos los checks si ya están en la lista final\r\nClearCollect(\r\n    colPersonalCheck;\r\n    ForAll(\r\n        Filter('ESTRUCTURA GENERAL'; Estado = \"A\");\r\n        {\r\n            Nombre: 'Nombre Apellido';\r\n            Departamento: Departamento;\r\n            Area: 'Area Gestión';\r\n            Seccion: Sección;\r\n            \r\n            // MAGIA: Busca si este nombre ya existe en la colección final. \r\n            // Si existe, nace en 'true' (marcado), si no, nace en 'false' (desmarcado).\r\n            Check: !IsBlank(LookUp(colPersonalFinal; Nombre = 'Nombre Apellido'))\r\n        }\r\n    )\r\n);;\r\n\r\n// 1. Cargamos el personal previamente asignado desde el JSON\r\nIf(\r\n    !IsBlank(ctxRegistroSeleccionado.ASIGNAR_PERSONAL);\r\n    \r\n    // Si hay datos, leemos el JSON y reconstruimos la colección\r\n    ClearCollect(\r\n        colPersonalFinal;\r\n        ForAll(\r\n            Table(ParseJSON(ctxRegistroSeleccionado.ASIGNAR_PERSONAL)) As personalGuardado;\r\n            {\r\n                Nombre: Text(personalGuardado.Value.Nombre);\r\n                // Convertimos el texto de regreso a una Fecha real para la galería\r\n                FechaActual: DateValue(Text(personalGuardado.Value.FechaAsignacion)) \r\n            }\r\n        )\r\n    );\r\n    \r\n    // Si la columna está vacía (proyecto nuevo), nos aseguramos de vaciar la colección\r\n    Clear(colPersonalFinal)\r\n);;\r\n*/\r\n\r\n// 1. Limpieza total inmediata para no arrastrar basura de otras tuplas\r\nClear(colPersonalFinal);\r\nClear(colPersonalCheck);\r\n\r\n// 1. Limpieza total inmediata para no arrastrar basura de otras tuplas\r\nClear(colPersonalFinal);\r\nClear(colPersonalCheck);\r\n\r\n// 2. Cargamos el catálogo base incluyendo Código Ekon, Cargo y Cédula\r\nClearCollect(\r\n    colPersonalCheck,\r\n    ForAll(\r\n        Filter('ESTRUCTURA GENERAL', Estado = \"A\"),\r\n        {\r\n            Nombre: 'Nombre Apellido',\r\n            CodigoEkon: 'Código Ekon',       // Asegúrate de colocar el nombre interno real de tu columna\r\n            Cargo: Cargo,                 // Asegúrate de colocar el nombre interno real de tu columna\r\n            Cedula: Cédula,               // Asegúrate de colocar el nombre interno real de tu columna\r\n            Departamento: Departamento,\r\n            Area: 'Area Gestión',\r\n            Seccion: Sección,\r\n            Check: false\r\n        }\r\n    )\r\n);\r\n\r\n// 3. Reconstruimos los asignados enriqueciéndolos mediante el CODIGO EKON\r\nIf(\r\n    !IsBlank(ctxRegistroSeleccionado.ASIGNAR_PERSONAL),\r\n    ClearCollect(\r\n        colPersonalFinal,\r\n        ForAll(\r\n            Table(ParseJSON(ctxRegistroSeleccionado.ASIGNAR_PERSONAL)) As personalGuardado,\r\n            With(\r\n                {\r\n                    // Almacenamos el código guardado en el JSON\r\n                    varEkon: Text(personalGuardado.Value.CodigoEkon),\r\n                    varFecha: DateValue(Text(personalGuardado.Value.FechaAsignacion))\r\n                },\r\n                With(\r\n                    {\r\n                        // Buscamos toda la fila correspondiente en nuestro catálogo local\r\n                        varInfoBase: LookUp(colPersonalCheck, CodigoEkon = varEkon)\r\n                    },\r\n                    {\r\n                        CodigoEkon: varEkon,\r\n                        Nombre: varInfoBase.Nombre,\r\n                        FechaActual: varFecha,\r\n                        Departamento: varInfoBase.Departamento,\r\n                        Area: varInfoBase.Area,\r\n                        Seccion: varInfoBase.Seccion,\r\n                        Cargo: varInfoBase.Cargo,\r\n                        Cedula: varInfoBase.Cedula\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n// 4. Sincronizamos los checks basándonos en el Código Ekon\r\nUpdateIf(\r\n    colPersonalCheck,\r\n    CodigoEkon in colPersonalFinal.CodigoEkon,\r\n    {Check: true}\r\n);"
