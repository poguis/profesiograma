            - Container25_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0.2
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =15
                  PaddingTop: =8
                Children:
                  - Button5_5:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        Font: =Font.'Open Sans Condensed'
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: "=// ====================================================================\r\n// 1. VALIDACIÓN DE CAMPOS OBLIGATORIOS Y CHECK DE COLABORADORES\r\n// ====================================================================\r\nIf(\r\n    IsBlank(Trim(LugarProyecto.Text)) || \r\n    IsBlank(Trim(temaProyecto.Text)) || \r\n    IsBlank(Trim(horaProyecto.Text)) || \r\n    IsBlank(Trim(duracionProyecto.Text)) || \r\n    IsBlank(formacionProyecto.Selected.Value),\r\n    \r\n    Notify(\"Por favor, complete todos los campos (Lugar, Tema, Hora, Duración y Formación).\", NotificationType.Warning);\r\n    Set(cargarInfo, false), \r\n\r\n    CountRows(Filter(colAsistenciaDiaria, CheckAsistencia = true)) = 0,\r\n    Notify(\"Debes seleccionar al menos un colaborador con el check antes de generar el PDF.\", NotificationType.Warning);\r\n    Set(cargarInfo, false)\r\n);\r\n\r\n// ====================================================================\r\n// 2. SI TODO ESTÁ CORRECTO, SE EJECUTA EL PROCESO PRINCIPAL\r\n// ====================================================================\r\nIf(\r\n    !IsBlank(Trim(LugarProyecto.Text)) && \r\n    !IsBlank(Trim(temaProyecto.Text)) && \r\n    !IsBlank(Trim(horaProyecto.Text)) && \r\n    !IsBlank(Trim(duracionProyecto.Text)) && \r\n    !IsBlank(formacionProyecto.Selected.Value) &&\r\n    CountRows(Filter(colAsistenciaDiaria, CheckAsistencia = true)) > 0,\r\n\r\n    // ----------------------------------------------------------------\r\n    // GUARDAMOS LOS DATOS EN VARIABLES GLOBALES PARA OTRA SCREEN\r\n    // ----------------------------------------------------------------\r\n    Set(gblTemaProyecto, temaProyecto.Text);\r\n    Set(gblHoraProyecto, horaProyecto.Text);\r\n    Set(gblDuracionProyecto, duracionProyecto.Text);\r\n    Set(gblTipoFormacionProyecto, formacionProyecto.Selected);\r\n\r\n    // ----------------------------------------------------------------\r\n    // CREACIÓN DE LA COLECCIÓN GLOBAL DE ASISTENTES SELECCIONADOS\r\n    // ----------------------------------------------------------------\r\n    ClearCollect(\r\n        colAsistentesSeleccionados, \r\n        Filter(colAsistenciaDiaria, CheckAsistencia = true)\r\n    );\r\n\r\n    With(\r\n        {\r\n            colFiltrada: colAsistentesSeleccionados,\r\n            registroUsuarioActivo: LookUp(\r\n                'ESTRUCTURA GENERAL', \r\n                Usuario = User().Email\r\n            )\r\n        },\r\n        \r\n        // 3. Preparamos los JSON tanto para SharePoint como para el Flujo\r\n        With(\r\n            {\r\n                jsonDatosClase: JSON(\r\n                    {\r\n                        hora: horaProyecto.Text,\r\n                        duracion: duracionProyecto.Text,\r\n                        tipoFormacion: formacionProyecto.Selected.Value\r\n                    },\r\n                    JSONFormat.Compact\r\n                ),\r\n\r\n                jsonAsistentes: JSON(\r\n                    ForAll(\r\n                        colFiltrada As asistente,\r\n                        {\r\n                            Nombre: asistente.Nombre,\r\n                            CodigoEkon: asistente.CodigoEkon\r\n                        }\r\n                    ),\r\n                    JSONFormat.Compact\r\n                ),\r\n\r\n                payloadJsonAsistencia: JSON(\r\n                    {\r\n                        nombreProyecto: nombreProyecto.Text,\r\n                        numeroContrato: numeroProyecto.Text,\r\n                        lugar: LugarProyecto.Text,\r\n                        empresaC: empresaProyecto.Text,\r\n                        tema: temaProyecto.Text,\r\n                        fechaRegistro: Text(DateValue(fechaProyecto.SelectedDate), \"yyyy/mm/dd\"),\r\n                        hora: horaProyecto.Text,\r\n                        duracion: duracionProyecto.Text,\r\n                        tipoFormacion: formacionProyecto.Selected.Value,\r\n                        checkCapacitacion: If(\r\n                            formacionProyecto.Selected.Value = \"Capacitación\",\r\n                            \"X\",\r\n                            \"\"\r\n                        ),\r\n                        checkDialogo: If(\r\n                            formacionProyecto.Selected.Value = \"Diálogo\",\r\n                            \"X\",\r\n                            \"\"\r\n                        ),\r\n                        checkSocializacion: If(\r\n                            formacionProyecto.Selected.Value = \"Socialización\",\r\n                            \"X\",\r\n                            \"\"\r\n                        ),\r\n                        total: Text(CountRows(colFiltrada)),\r\n                        observacion: obs.Text,\r\n                        \r\n                        nombreInstructor: User().FullName, \r\n                        correoUsuario: User().Email, \r\n                        \r\n                        cedulaInstructor: Coalesce(\r\n                            Text(registroUsuarioActivo.Cédula), \r\n                            \"\"\r\n                        ),\r\n                        \r\n                        cargoInstructor: Coalesce(\r\n                            Text(registroUsuarioActivo.Cargo),\r\n                            \"Instructor\"\r\n                        ),\r\n                        \r\n                        personal: \r\n                            ForAll(\r\n                                Sequence(CountRows(colFiltrada)) As Fila,\r\n                                With(\r\n                                    {\r\n                                        a: Last(FirstN(colFiltrada, Fila.Value))\r\n                                    },\r\n                                    {\r\n                                        secuencial: Text(Fila.Value), \r\n                                        nombre: a.Nombre,\r\n                                        area: a.Area,\r\n                                        cargo: a.Cargo,\r\n                                        cedula: a.Cedula\r\n                                    }\r\n                                )\r\n                            )\r\n                    },\r\n                    JSONFormat.Compact\r\n                )\r\n            },\r\n\r\n            // 4. GUARDADO O ACTUALIZACIÓN EN SHAREPOINT (Mismo Proyecto y Día)\r\n            Patch(\r\n                'SIG ASISTENCIAS',\r\n                Coalesce(\r\n                    LookUp(\r\n                        'SIG ASISTENCIAS',\r\n                        Título = Text(ctxProyectoAsistencia.Título) && \r\n                        FechaAsistencia = DateValue(fechaProyecto.SelectedDate)\r\n                    ),\r\n                    Defaults('SIG ASISTENCIAS')\r\n                ),\r\n                {\r\n                    Título: Text(ctxProyectoAsistencia.Título), \r\n                    ProyectoID: varDsCodigoProyecto,\r\n                    FechaAsistencia: DateValue(fechaProyecto.SelectedDate),\r\n                    DatosClaseJSON: jsonDatosClase,\r\n                    AsistentesJSON: jsonAsistentes\r\n                }\r\n            );\r\n\r\n            // 5. EJECUTAMOS EL FLUJO\r\n            Set(\r\n                resultadoPdf,\r\n                ReporteAST.Run(\r\n                    \"FORSEI11\", \r\n                    payloadJsonAsistencia\r\n                )\r\n            );\r\n\r\n            // 6. Notificación de éxito y navegación de regreso\r\n            Notify(\"Registro guardado con éxito y reporte enviado a tu correo electrónico.\", NotificationType.Success);\r\n            Navigate(ResumenProyectos)\r\n        )\r\n    )\r\n)"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =15
                        Text: ="GENERAR"
                        Width: =120
