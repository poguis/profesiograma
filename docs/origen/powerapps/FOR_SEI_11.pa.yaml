                              OnChange: "=// 1. Validamos solo si el usuario escribió algo\r\nIf(\r\n    !IsBlank(Self.Text),\r\n    \r\n    // 2. Usamos IsMatch para obligar a que sean solo dígitos (sin letras, ni signos menos) \r\n    // y además validamos que el número convertido sea mayor a 0\r\n    If(\r\n        !IsMatch(Self.Text, \"^[0-9]+$\") Or Value(Self.Text) <= 0,\r\n        \r\n        // 3. Si incumple alguna de las dos, lanzamos la alerta y limpiamos\r\n        Notify(\"La duración debe ser un número entero mayor a 0 (minutos).\", NotificationType.Error);\r\n        Reset(duracionProyecto)\r\n    )\r\n)"
