                              OnChange: "=// 1. Solo validamos si el campo no está vacío (para que no salte error al borrar todo)\r\nIf(\r\n    !IsBlank(Self.Text),\r\n    \r\n    // 2. Comparamos lo escrito contra el patrón de 24 horas (HH:mm)\r\n    If(\r\n        !IsMatch(Self.Text, \"^([01][0-9]|2[0-3]):[0-5][0-9]$\"),\r\n        \r\n        // 3. Si no coincide, mandamos la alerta y borramos el campo\r\n        Notify(\"Formato de hora inválido. Usa formato 24H (Ej: 08:30 o 14:15).\", NotificationType.Error);\r\n        Reset(horaProyecto)\r\n    )\r\n)"
