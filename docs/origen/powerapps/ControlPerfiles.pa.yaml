                  - Button3_5:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =// 1. Reconstruimos la estructura jerárquica cruzando con los costos modificados de colOpcionesEquiposPlana
                          UpdateContext({
                              varObjetoEquiposActualizado: {
                                  Version: "1.0",
                                  DescripcionCatalogo: "Catálogo completo de equipos, niveles permitidos y estructura de costos por categoría",
                                  Categorias: ForAll(
                                      colCatalogoCompleto As Cat,
                                      {
                                          OrdenCategoria: Cat.OrdenCategoria,
                                          Categoria: Cat.Categoria,
                                          Equipos: ForAll(
                                              Cat.Equipos As Eq,
                                              {
                                                  OrdenEquipo: Eq.OrdenEquipo,
                                                  Equipo: Eq.Equipo,
                                                  NivelesPermitidos: ForAll(
                                                      Eq.OpcionesNivel As OpcNivel,
                                                      OpcNivel.Nivel
                                                  ),
                                                  OpcionesNivel: ForAll(
                                                      Eq.OpcionesNivel As Opc,
                                                      With(
                                                          {
                                                              itemModificado: LookUp(
                                                                  colOpcionesEquiposPlana, 
                                                                  ID = Opc.ID
                                                              )
                                                          },
                                                          {
                                                              ID: Opc.ID,
                                                              Nivel: Opc.Nivel,
                                                              Descripcion: Opc.Descripcion,
                                                              Costo: If(
                                                                  !IsBlank(itemModificado.Costo),
                                                                  itemModificado.Costo,
                                                                  Opc.Costo
                                                              )
                                                          }
                                                      )
                                                  )
                                              }
                                          )
                                      }
                                  )
                              }
                          });

                          // 2. Serializamos el objeto resultante a formato JSON
                          UpdateContext({
                              varJSONTextoCatalogoActualizado: JSON(
                                  varObjetoEquiposActualizado, 
                                  JSONFormat.IgnoreUnsupportedTypes
                              )
                          });

                          // 3. Guardamos en el registro de la tabla PERFIL_USUARIO
                          Patch(
                              PERFIL_USUARIO,
                              LookUp(PERFIL_USUARIO, EKON = "DATOS"),
                              { 
                                  DATOS_EQUIPOS_TECNOLOGICOS: varJSONTextoCatalogoActualizado 
                              }
                          );

                          // 4. Cerramos el modo edición y notificamos
                          UpdateContext({
                              varEditarEquipos: false,
                              varFilaSeleccionada: Blank()
                          });

                          Notify("Catálogo de equipos tecnológicos actualizado con éxito", NotificationType.Success)
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Text: ="Guardar Cambios"
                        Width: =150
