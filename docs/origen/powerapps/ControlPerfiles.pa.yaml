                  - Button3_3:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =// 1. Reconstruimos TODO el tarifario
                          //    Solo reemplazamos el bloque del PROVEEDOR + ZONA que se está editando

                          ClearCollect(
                              colTarifarioActualizado,
                              ForAll(
                                  colTarifarioExamenes As Prov,

                                  If(
                                      Text(Prov.Value.datosGenerales.proveedor) = Text(cmbProveedor_3.Selected.Value)
                                      &&
                                      Text(Prov.Value.datosGenerales.areaDeTrabajo) = Text(cmbZona_1.Selected.Value),

                                      // =====================================================
                                      // PROVEEDOR + ZONA ACTUAL
                                      // Reemplazamos únicamente sus exámenes
                                      // =====================================================
                                      {
                                          datosGenerales: {
                                              proveedor: Text(Prov.Value.datosGenerales.proveedor),
                                              areaDeTrabajo: Text(Prov.Value.datosGenerales.areaDeTrabajo)
                                          },

                                          examenes: colExamenesDisponibles
                                      },

                                      // =====================================================
                                      // RESTO DE PROVEEDORES / ZONAS
                                      // Los dejamos exactamente como estaban
                                      // =====================================================
                                      {
                                          datosGenerales: {
                                              proveedor: Text(Prov.Value.datosGenerales.proveedor),

                                              areaDeTrabajo:
                                                  If(
                                                      IsBlank(Prov.Value.datosGenerales.areaDeTrabajo),
                                                      Blank(),
                                                      Text(Prov.Value.datosGenerales.areaDeTrabajo)
                                                  )
                                          },

                                          examenes:
                                              ForAll(
                                                  Table(Prov.Value.examenes) As Ex,
                                                  {
                                                      Categoria: Text(Ex.Value.Categoria),

                                                      Nombre: Text(Ex.Value.Nombre),

                                                      Precio:
                                                          If(
                                                              IsBlank(Ex.Value.Precio),
                                                              Blank(),
                                                              Value(Text(Ex.Value.Precio))
                                                          ),

                                                      Padre:
                                                          If(
                                                              IsBlank(Ex.Value.Padre),
                                                              Blank(),
                                                              Text(Ex.Value.Padre)
                                                          )
                                                  }
                                              )
                                      }
                                  )
                              )
                          );


                          // 2. Convertimos nuevamente toda la colección a JSON

                          UpdateContext(
                              {
                                  varJSONFinal:
                                      JSON(
                                          colTarifarioActualizado,
                                          JSONFormat.IgnoreUnsupportedTypes
                                      )
                              }
                          );


                          // 3. Guardamos el JSON completo en el registro DATOS

                          Patch(
                              PERFIL_USUARIO,
                              LookUp(
                                  PERFIL_USUARIO,
                                  EKON = "DATOS"
                              ),
                              {
                                  DATOS_EXAMENES_MEDICOS: varJSONFinal
                              }
                          );


                          // 4. Actualizamos la fuente

                          Refresh(PERFIL_USUARIO);


                          // 5. Mensaje de confirmación

                          Notify(
                              "Tarifario actualizado con éxito",
                              NotificationType.Success
                          );


                          // 6. Cerramos el popup y limpiamos la selección

                          UpdateContext(
                              {
                                  varMostrarPopUp: false,
                                  varSelectedRecord: Blank()
                              }
                          );

                          Select(Button1_9);
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Text: ="Guardar Cambios"
                        Width: =175
