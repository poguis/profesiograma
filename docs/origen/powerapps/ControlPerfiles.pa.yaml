                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Laptop
                        LayoutMinHeight: =16
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =// 1. Buscamos el registro en la lista PERFIL_USUARIO donde EKON = "DATOS"
                          UpdateContext({
                              varRegistroPerfil: LookUp(
                                  PERFIL_USUARIO,
                                  EKON = "DATOS"
                              )
                          });

                          // 2. Extraemos el texto del JSON guardado en DATOS_EQUIPOS_TECNOLOGICOS
                          UpdateContext({
                              varJSONTextoCatalogo: varRegistroPerfil.DATOS_EQUIPOS_TECNOLOGICOS
                          });

                          // 3. Parseamos el JSON y armamos la colección jerárquica colCatalogoCompleto
                          If(
                              !IsBlank(varJSONTextoCatalogo),
                              With(
                                  { ParsedJSON: ParseJSON(varJSONTextoCatalogo) },
                                  ClearCollect(
                                      colCatalogoCompleto,
                                      ForAll(
                                          Table(ParsedJSON.Categorias),
                                          {
                                              OrdenCategoria: Value(ThisRecord.Value.OrdenCategoria),
                                              Categoria: Text(ThisRecord.Value.Categoria),
                                              Equipos: ForAll(
                                                  Table(ThisRecord.Value.Equipos),
                                                  {
                                                      OrdenEquipo: Value(ThisRecord.Value.OrdenEquipo),
                                                      Equipo: Text(ThisRecord.Value.Equipo),
                                                      OpcionesNivel: ForAll(
                                                          Table(ThisRecord.Value.OpcionesNivel),
                                                          {
                                                              ID: Value(ThisRecord.Value.ID),
                                                              Nivel: Text(ThisRecord.Value.Nivel),
                                                              Descripcion: Text(ThisRecord.Value.Descripcion),
                                                              Costo: Value(ThisRecord.Value.Costo)
                                                          }
                                                      )
                                                  }
                                              )
                                          }
                                      )
                                  );

                                  // 4. Aplanamos en colOpcionesEquiposPlana para un fácil manejo en Galerías y Dropdowns
                                  ClearCollect(
                                      colOpcionesEquiposPlana,
                                      Ungroup(
                                          ForAll(
                                              colCatalogoCompleto As Cat,
                                              Ungroup(
                                                  ForAll(
                                                      Cat.Equipos As Eq,
                                                      ForAll(
                                                          Eq.OpcionesNivel As Opc,
                                                          {
                                                              OrdenCategoria: Cat.OrdenCategoria,
                                                              Categoria: Cat.Categoria,
                                                              OrdenEquipo: Eq.OrdenEquipo,
                                                              Equipo: Eq.Equipo,
                                                              ID: Opc.ID,
                                                              Nivel: Opc.Nivel,
                                                              Descripcion: Opc.Descripcion,
                                                              Costo: Opc.Costo
                                                          }
                                                      )
                                                  ),
                                                  Value
                                              )
                                          ),
                                          Value
                                      )
                                  )
                              )
                          );

                          UpdateContext({varEditarEquipos: true});
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
