                                    OnChange: "=/*\nPatch(\n    colExamenesDisponibles;\n    LookUp(colExamenesDisponibles; ID = ThisItem.ID);\n    { \n        Precio: If(\n            IsBlank(TextInput6_1.Text); \n            Blank(); \n            Value(Substitute(Trim(TextInput6_1.Text); \",\"; \".\"); \"en-US\")\n        ) \n    }\n);;\nUpdateContext({varFilaEditandoID: \"\"})\n*/\n\n// 1. Calculamos el nuevo precio ingresado\nWith(\n    {\n        nuevoPrecio: If(\n            IsBlank(Self.Text),\n            0,\n            Value(Substitute(Trim(Self.Text), \",\", \".\"), \"en-US\")\n        )\n    },\n    \n    // 2. Actualizamos el registro actual (el hijo que acabas de editar)\n    Patch(\n        colExamenesDisponibles,\n        LookUp(colExamenesDisponibles, ID = ThisItem.ID),\n        { Precio: nuevoPrecio }\n    );\n\n    // 3. Si este registro es un hijo (tiene Padre), disparamos la actualización al Padre\n    If(\n        !IsBlank(ThisItem.Padre),\n        With(\n            {\n                // Sumamos los precios actualizados de todos los hermanos\n                sumaHijos: Sum(\n                    Filter(colExamenesDisponibles, Padre = ThisItem.Padre), \n                    Precio\n                )\n            },\n            // Parcheamos al Padre con la nueva sumatoria\n            Patch(\n                colExamenesDisponibles,\n                LookUp(colExamenesDisponibles, Nombre = ThisItem.Padre),\n                { Precio: sumaHijos }\n            )\n        )\n    )\n);\n\n// 4. Salimos del modo edición\nUpdateContext({varFilaEditandoID: \"\"});"
