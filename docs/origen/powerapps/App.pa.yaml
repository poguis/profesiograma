    OnStart: "=ClearCollect(\r\n    colEtapasHistoricas,\r\n    {\r\n        EtapaId: \"\",\r\n        Version: 0,\r\n        TipoMovimiento: \"\",\r\n        EstadoProyecto: \"\",\r\n        FechaRegistro: \"\",\r\n        UsuarioRegistro: \"\",\r\n        CorreoRegistro: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        ModeloAsignacion: \"\",\r\n        PrincipalesJson: \"[]\",\r\n        BacksJson: \"[]\",\r\n        BloquesEtapaJson: \"[]\",\r\n        DetalleDiarioEtapaJson: \"[]\",\r\n        ActivityId: \"\",\r\n        ActivityDescription: \"\",\r\n        ActivityType: \"\"\r\n    }\r\n);\r\nRemoveIf(colEtapasHistoricas, true);\r\n\r\n\r\n//Pruebas de aplicación\r\n\r\nClearCollect(\r\n    colPrincipalesProyecto,\r\n    {\r\n        PrincipalId: 0,\r\n        EsPrincipalInicial: false,\r\n        Nombre: \"\",\r\n        Cedula: \"\",\r\n        Ekon: \"\",\r\n        Correo: \"\",\r\n        Cargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        JornadaCodigo: \"\",\r\n        JornadaDescripcion: \"\",\r\n        DiasTrabajo: 0,\r\n        DiasDescanso: 0\r\n    }\r\n);\r\n\r\nRemoveIf(colPrincipalesProyecto, true);\r\n\r\nClearCollect(\r\n    colBacksProyecto,\r\n    {\r\n        BackId: 0,\r\n        PrincipalIdRelacionado: 0,\r\n        Nombre: \"\",\r\n        Cedula: \"\",\r\n        Ekon: \"\",\r\n        Correo: \"\",\r\n        Cargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        Observacion: \"\"\r\n    }\r\n);\r\n\r\nRemoveIf(colBacksProyecto, true);\r\n\r\nClearCollect(\r\n    colAsignacionesDiarioTmp,\r\n    {\r\n        Fecha: Today(),\r\n        FechaClave: \"\",\r\n        Rol: \"\",\r\n        TipoAsignacion: \"\",\r\n        ResponsableNombre: \"\",\r\n        ResponsableCedula: \"\",\r\n        ResponsableEkon: \"\",\r\n        ResponsableCorreo: \"\",\r\n        ResponsableCargo: \"\",\r\n        PrincipalId: 0,\r\n        BackId: 0,\r\n        Bloque: 0\r\n    }\r\n);\r\n\r\nRemoveIf(colAsignacionesDiarioTmp, true);\r\n\r\n/////////////////7\r\nClearCollect(\r\n    colAsignacionesPreviewOriginal,\r\n    {\r\n        Bloque: 0,\r\n        Rol: \"\",\r\n        TipoAsignacion: \"\",\r\n        PrincipalId: Blank(),\r\n        BackId: Blank(),\r\n        ResponsableNombre: \"\",\r\n        ResponsableCedula: \"\",\r\n        ResponsableEkon: \"\",\r\n        ResponsableCorreo: \"\",\r\n        ResponsableCargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        DiasAsignados: 0\r\n    }\r\n);\r\nRemoveIf(colAsignacionesPreviewOriginal, true);\r\n\r\nClearCollect(\r\n    colAsignacionesDiarioOriginal,\r\n    {\r\n        Fecha: Today(),\r\n        FechaClave: \"\",\r\n        Bloque: 0,\r\n        Rol: \"\",\r\n        TipoAsignacion: \"\",\r\n        PrincipalId: Blank(),\r\n        BackId: Blank(),\r\n        ResponsableNombre: \"\",\r\n        ResponsableCedula: \"\",\r\n        ResponsableEkon: \"\",\r\n        ResponsableCorreo: \"\",\r\n        ResponsableCargo: \"\"\r\n    }\r\n);\r\nRemoveIf(colAsignacionesDiarioOriginal, true);\r\n\r\nClearCollect(\r\n    colAsignacionesDiarioBase,\r\n    {\r\n        Fecha: Today(),\r\n        FechaClave: \"\",\r\n        Bloque: 0,\r\n        Rol: \"\",\r\n        TipoAsignacion: \"\",\r\n        PrincipalId: Blank(),\r\n        BackId: Blank(),\r\n        ResponsableNombre: \"\",\r\n        ResponsableCedula: \"\",\r\n        ResponsableEkon: \"\",\r\n        ResponsableCorreo: \"\",\r\n        ResponsableCargo: \"\"\r\n    }\r\n);\r\nRemoveIf(colAsignacionesDiarioBase, true);\r\n\r\nClearCollect(\r\n    colPrincipalesGuardar,\r\n    {\r\n        PrincipalId: 0,\r\n        EsPrincipalInicial: false,\r\n        EsNuevo: false,\r\n        Nombre: \"\",\r\n        Cedula: \"\",\r\n        Ekon: \"\",\r\n        Correo: \"\",\r\n        Cargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        JornadaCodigo: \"\",\r\n        JornadaDescripcion: \"\",\r\n        DiasTrabajo: 0,\r\n        DiasDescanso: 0\r\n    }\r\n);\r\nRemoveIf(colPrincipalesGuardar, true);\r\n\r\nClearCollect(\r\n    colBacksGuardar,\r\n    {\r\n        BackId: 0,\r\n        EsNuevo: false,\r\n        PrincipalIdRelacionado: Blank(),\r\n        Nombre: \"\",\r\n        Cedula: \"\",\r\n        Ekon: \"\",\r\n        Correo: \"\",\r\n        Cargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        Observacion: \"\"\r\n    }\r\n);\r\nRemoveIf(colBacksGuardar, true);\r\n\r\nClearCollect(\r\n    colHistorialActividadesTmp,\r\n    {\r\n        MovimientoId: \"\",\r\n        Version: 0,\r\n        TipoMovimiento: \"\",\r\n        FechaRegistro: \"\",\r\n        UsuarioRegistro: \"\",\r\n        CorreoRegistro: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        ActivityId: \"\",\r\n        ActivityDescription: \"\",\r\n        ActivityType: \"\"\r\n    }\r\n);\r\nRemoveIf(colHistorialActividadesTmp, true);\r\n\r\nClearCollect(\r\n    colPrincipalesHistoricos,\r\n    {\r\n        PrincipalId: 0,\r\n        EsPrincipalInicial: false,\r\n        EsNuevo: false,\r\n        Nombre: \"\",\r\n        Cedula: \"\",\r\n        Ekon: \"\",\r\n        Correo: \"\",\r\n        Cargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        JornadaCodigo: \"\",\r\n        JornadaDescripcion: \"\",\r\n        DiasTrabajo: 0,\r\n        DiasDescanso: 0\r\n    }\r\n);\r\nRemoveIf(colPrincipalesHistoricos, true);\r\n\r\nClearCollect(\r\n    colBacksHistoricos,\r\n    {\r\n        BackId: 0,\r\n        EsNuevo: false,\r\n        PrincipalIdRelacionado: Blank(),\r\n        Nombre: \"\",\r\n        Cedula: \"\",\r\n        Ekon: \"\",\r\n        Correo: \"\",\r\n        Cargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        Observacion: \"\"\r\n    }\r\n);\r\nRemoveIf(colBacksHistoricos, true);\r\n\r\nClearCollect(\r\n    colAsignacionesPreviewBase,\r\n    {\r\n        Bloque: 0,\r\n        Rol: \"\",\r\n        TipoAsignacion: \"\",\r\n        PrincipalId: Blank(),\r\n        BackId: Blank(),\r\n        ResponsableNombre: \"\",\r\n        ResponsableCedula: \"\",\r\n        ResponsableEkon: \"\",\r\n        ResponsableCorreo: \"\",\r\n        ResponsableCargo: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        DiasAsignados: 0\r\n    }\r\n);\r\nRemoveIf(colAsignacionesPreviewBase, true);\r\n\r\nClearCollect(\r\n    colHistorialActividades,\r\n    {\r\n        MovimientoId: \"\",\r\n        Version: 0,\r\n        TipoMovimiento: \"\",\r\n        FechaRegistro: \"\",\r\n        UsuarioRegistro: \"\",\r\n        CorreoRegistro: \"\",\r\n        FechaInicio: Today(),\r\n        FechaFin: Today(),\r\n        ActivityId: \"\",\r\n        ActivityDescription: \"\",\r\n        ActivityType: \"\"\r\n    }\r\n);\r\nRemoveIf(colHistorialActividades, true);\r\n\r\n\r\n//Catalogo de novedades\r\n\r\nClearCollect(\r\n    colCatalogoNovedades,\r\n    {\r\n        TipoNovedad: \"CALAMIDAD DOMESTICA\",\r\n        CategoriaId: 5,\r\n        CategoriaDescripcion: \"Asistencia Libre\",\r\n        EstadoExcel: \"LIBRE\",\r\n        ObservacionExcel: \"CALAMIDAD DOMESTICA\",\r\n        Sigla: \"CD\"\r\n    },\r\n    {\r\n        TipoNovedad: \"DESCANSO\",\r\n        CategoriaId: 5,\r\n        CategoriaDescripcion: \"Asistencia Libre\",\r\n        EstadoExcel: \"LIBRE\",\r\n        ObservacionExcel: \"DESCANSO\",\r\n        Sigla: \"D\"\r\n    },\r\n    {\r\n        TipoNovedad: \"FERIADO\",\r\n        CategoriaId: 5,\r\n        CategoriaDescripcion: \"Asistencia Libre\",\r\n        EstadoExcel: \"LIBRE\",\r\n        ObservacionExcel: \"FERIADO\",\r\n        Sigla: \"FER\"\r\n    },\r\n    {\r\n        TipoNovedad: \"PATERNIDAD\",\r\n        CategoriaId: 5,\r\n        CategoriaDescripcion: \"Asistencia Libre\",\r\n        EstadoExcel: \"LIBRE\",\r\n        ObservacionExcel: \"PATERNIDAD\",\r\n        Sigla: \"PTNDAD\"\r\n    },\r\n    {\r\n        TipoNovedad: \"PERMISO\",\r\n        CategoriaId: 5,\r\n        CategoriaDescripcion: \"Asistencia Libre\",\r\n        EstadoExcel: \"LIBRE\",\r\n        ObservacionExcel: \"PERMISO\",\r\n        Sigla: \"P\"\r\n    },\r\n    {\r\n        TipoNovedad: \"VACACIONES\",\r\n        CategoriaId: 5,\r\n        CategoriaDescripcion: \"Asistencia Libre\",\r\n        EstadoExcel: \"LIBRE\",\r\n        ObservacionExcel: \"VACACIONES\",\r\n        Sigla: \"V\"\r\n    }\r\n);\r\n\r\n// 1. Guardamos la información del usuario actual (siempre es útil tenerla a mano)\r\nSet(varUsuarioActual, User());\r\n\r\n// 2. Validamos si el usuario actual es un administrador del sistema\r\nSet(\r\nvarEsSuperAdmin,\r\nvarUsuarioActual.Email in [\r\n    \"sig4@sedemi.com\", \r\n    \"asistente.auditoria1@sedemi.com\", \r\n    \"analista.auditoria@sedemi.com\",\r\n    \"desarrollo1.tics@sedemi.com\", // David proaño\r\n    \"sig8@sedemi.com\" // Angie Jacho\r\n]\r\n);\r\n\r\n\r\n\r\n// Cambiamos UpdateContext por Set para que sea global\r\n//Set(varRegistroPermisos; First('SIG PROYECTOS'));;\r\nSet(varRegistroPermisos, LookUp('SIG PROYECTOS', Título = \"666\"));\r\n\r\n// También cambiamos esta para que sea global y use la nueva sintaxis\r\nSet(varUsuarioAutorizadoEnJSON, varUsuarioActual.Email in varRegistroPermisos.PermisosGenerales);\r\n\r\n// 1. DETERMINAMOS TODAS LAS UEGPs A LAS QUE PERTENECE (1 o N)\r\nSet(\r\n    varUegpsCalculadas,\r\n    With(\r\n        { jsonPermisos: ParseJSON(varRegistroPermisos.PermisosGenerales) },\r\n        If(\r\n            varEsSuperAdmin,\r\n            // Si es admin, creamos una lista con un solo elemento\r\n            [\"ADMINISTRADOR\"],\r\n            \r\n            /*\r\n            // Si no, evaluamos todas y armamos una lista omitiendo los vacíos\r\n            Filter(\r\n                [\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.Energia); Text(Value.Usuario); \",\"); Energia; Blank());\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.Infraestructura); Text(Value.Usuario); \",\"); \"DEPARTAMENTO DE INFRAESTRUCTURA METALICA\"; Blank());\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.InfraestructuraIntegral); Text(Value.Usuario); \",\"); \"DEPARTAMENTO DE INFRAESTRUCTURA\"; Blank());\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.Mineria); Text(Value.Usuario); \",\"); \"DEPARTAMENTO SEDEMI MINERIA\"; Blank());\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.PetroleoGas); Text(Value.Usuario); \",\"); \"DEPARTAMENTO SEDEMI PETROLEO Y GAS\"; Blank());\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.Telecomunicaciones); Text(Value.Usuario); \",\"); \"DEPARTAMENTO SEDEMI TELECOM\"; Blank())\r\n                ];\r\n                !IsBlank(Value) // Solo nos quedamos con los que dieron positivo\r\n            )\r\n            */\r\n            \r\n            // Si no, evaluamos todas y armamos una lista omitiendo los vacíos\r\n            Filter(\r\n                [\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.'DEPARTAMENTO SEDEMI ENERGIA'), Text(Value.Usuario), \",\"), \"DEPARTAMENTO SEDEMI ENERGIA\", Blank()),\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.'DEPARTAMENTO DE INFRAESTRUCTURA METALICA'), Text(Value.Usuario), \",\"), \"DEPARTAMENTO DE INFRAESTRUCTURA METALICA\", Blank()),\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.'DEPARTAMENTO DE INFRAESTRUCTURA'), Text(Value.Usuario), \",\"), \"DEPARTAMENTO DE INFRAESTRUCTURA\", Blank()),\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.'DEPARTAMENTO SEDEMI MINERIA'), Text(Value.Usuario), \",\"), \"DEPARTAMENTO SEDEMI MINERIA\", Blank()),\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.'DEPARTAMENTO SEDEMI PETROLEO Y GAS'), Text(Value.Usuario), \",\"), \"DEPARTAMENTO SEDEMI PETROLEO Y GAS\", Blank()),\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.'DEPARTAMENTO SEDEMI TELECOM'), Text(Value.Usuario), \",\"), \"DEPARTAMENTO SEDEMI TELECOM\", Blank()),\r\n                    If(varUsuarioActual.Email in Concat(Table(jsonPermisos.'UNIDAD SISTEMA INTEGRADO DE GESTION'), Text(Value.Usuario), \",\"), \"UNIDAD SISTEMA INTEGRADO DE GESTION\", Blank())\r\n                ],\r\n                !IsBlank(Value)\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n\r\n"
    Theme: =PowerAppsTheme
