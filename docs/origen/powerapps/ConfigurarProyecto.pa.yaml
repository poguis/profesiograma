                                    LayoutMaxWidth: =
                                    OnSelect: "=/*\r\nClear(colAsignacionesPreviewTmp);;\r\nClear(colAsignacionesDiarioTmp);;\r\nClear(colConflictosAsignacion);;\r\nClear(colConflictosBase);;\r\nClear(colConflictosResumen);;\r\n\r\nSet(\r\n    varFechaCorteEdicion;\r\n    If(\r\n        varTipoMovimientoEstado = \"REACTIVACION\" &&\r\n        !IsBlank(fechaMovimientoEstadoEdit.SelectedDate);\r\n        fechaMovimientoEstadoEdit.SelectedDate;\r\n        Today()\r\n    )\r\n);;\r\n\r\n\r\nSet(varPuedeGenerarAsignacion; true);;\r\n\r\n// Base histórica: todo lo anterior a hoy queda intacto\r\n\r\n//Agregado\r\nClearCollect(\r\n    colAsignacionesDiarioBase;\r\n    Filter(\r\n        colAsignacionesDiarioOriginal;\r\n        Fecha < varFechaCorteEdicion\r\n    )\r\n);;\r\n\r\n\r\nClearCollect(\r\n    colAsignacionesPreviewBase;\r\n    Filter(\r\n        colAsignacionesPreviewOriginal;\r\n        FechaFin < varFechaCorteEdicion\r\n    )\r\n);;\r\n\r\n\r\n\r\n// Validaciones generales\r\nIf(\r\n    IsBlank(inicioProyectoEdit.SelectedDate) ||\r\n    IsBlank(finProyectoEdit.SelectedDate);\r\n    Notify(\r\n        \"Debes seleccionar fecha de inicio y fecha fin del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    finProyectoEdit.SelectedDate < inicioProyectoEdit.SelectedDate;\r\n    Notify(\r\n        \"La fecha fin debe ser mayor o igual a la fecha inicio\";\r\n        NotificationType.Error\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\n// Validar principales vigentes/futuros\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(colPrincipalesProyecto) = 0;\r\n    Notify(\r\n        \"El proyecto debe tener al menos un principal vigente o futuro\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto;\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin) ||\r\n            DiasTrabajo = 0\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Todos los principales vigentes/futuros deben tener usuario, fecha inicio, fecha fin y jornada\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto;\r\n            FechaInicio < inicioProyectoEdit.SelectedDate ||\r\n            FechaFin > finProyectoEdit.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Las fechas de los principales deben estar dentro del rango del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\n// Validar backs vigentes/futuros\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto;\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin)\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Todos los backs vigentes/futuros deben tener usuario, fecha inicio y fecha fin\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto;\r\n            FechaInicio < inicioProyectoEdit.SelectedDate ||\r\n            FechaFin > finProyectoEdit.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0;\r\n    Notify(\r\n        \"Las fechas de los backs deben estar dentro del rango del proyecto\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n\r\n// Generar asignaciones futuras de principales\r\nIf(\r\n    varPuedeGenerarAsignacion;\r\n\r\n    ForAll(\r\n        colPrincipalesProyecto As p;\r\n        With(\r\n            {\r\n                totalDiasPrincipal: DateDiff(\r\n                    p.FechaInicio;\r\n                    p.FechaFin;\r\n                    TimeUnit.Days\r\n                ) + 1;\r\n                cicloPrincipal: p.DiasTrabajo + p.DiasDescanso;\r\n\r\n                // 1. LO MOVEMOS AQUÍ: Lo declaramos al inicio del Principal\r\n                esPrincipalNuevo: Coalesce(p.EsNuevo; false)\r\n            };\r\n            ForAll(\r\n                Sequence(\r\n                    RoundUp(\r\n                        totalDiasPrincipal / cicloPrincipal;\r\n                        0\r\n                    )\r\n                ) As b;\r\n                With(\r\n                    {\r\n                        fechaInicioBloque: DateAdd(\r\n                            p.FechaInicio;\r\n                            (b.Value - 1) * cicloPrincipal;\r\n                            TimeUnit.Days\r\n                        );\r\n                        fechaFinBloqueTentativa: DateAdd(\r\n                            p.FechaInicio;\r\n                            ((b.Value - 1) * cicloPrincipal) + p.DiasTrabajo - 1;\r\n                            TimeUnit.Days\r\n                        )\r\n                    };\r\n                    */\r\n\r\n\r\n\r\n\r\n                    /*\r\n                    // No borrar\r\n                    With(\r\n                        {\r\n                            fechaInicioBloqueFinal: If(\r\n                                fechaInicioBloque < varFechaCorteEdicion;\r\n                                varFechaCorteEdicion;\r\n                                fechaInicioBloque\r\n                            );\r\n                            fechaFinBloqueFinal: If(\r\n                                fechaFinBloqueTentativa > p.FechaFin;\r\n                                p.FechaFin;\r\n                                fechaFinBloqueTentativa\r\n                            )\r\n                        };\r\n                        If(\r\n                            fechaInicioBloqueFinal <= fechaFinBloqueFinal &&\r\n                            fechaFinBloqueFinal >= varFechaCorteEdicion;\r\n\r\n                            Collect(\r\n                                colAsignacionesPreviewTmp;\r\n                                {\r\n                                    Bloque: b.Value;\r\n                                    Rol: \"PRINCIPAL\";\r\n                                    TipoAsignacion: \"AUTO\";\r\n                                    PrincipalId: p.PrincipalId;\r\n                                    BackId: Blank();\r\n                                    ResponsableNombre: p.Nombre;\r\n                                    ResponsableCedula: p.Cedula;\r\n                                    ResponsableEkon: p.Ekon;\r\n                                    ResponsableCorreo: Lower(Trim(p.Correo));\r\n                                    ResponsableCargo: p.Cargo;\r\n                                    FechaInicio: fechaInicioBloqueFinal;\r\n                                    FechaFin: fechaFinBloqueFinal;\r\n                                    DiasAsignados: DateDiff(\r\n                                        fechaInicioBloqueFinal;\r\n                                        fechaFinBloqueFinal;\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                }\r\n                            );;\r\n\r\n                            ForAll(\r\n                                Sequence(\r\n                                    DateDiff(\r\n                                        fechaInicioBloqueFinal;\r\n                                        fechaFinBloqueFinal;\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                ) As d;\r\n                                With(\r\n                                    {\r\n                                        fechaDia: DateAdd(\r\n                                            fechaInicioBloqueFinal;\r\n                                            d.Value - 1;\r\n                                            TimeUnit.Days\r\n                                        )\r\n                                    };\r\n                                    Collect(\r\n                                        colAsignacionesDiarioTmp;\r\n                                        {\r\n                                            Fecha: fechaDia;\r\n                                            FechaClave: Text(\r\n                                                fechaDia;\r\n                                                \"[$-en-US]yyyy-mm-dd\"\r\n                                            );\r\n                                            Bloque: b.Value;\r\n                                            Rol: \"PRINCIPAL\";\r\n                                            TipoAsignacion: \"AUTO\";\r\n                                            PrincipalId: p.PrincipalId;\r\n                                            BackId: Blank();\r\n                                            ResponsableNombre: p.Nombre;\r\n                                            ResponsableCedula: p.Cedula;\r\n                                            ResponsableEkon: p.Ekon;\r\n                                            ResponsableCorreo: Lower(Trim(p.Correo));\r\n                                            ResponsableCargo: p.Cargo\r\n                                        }\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                    */\r\n\r\n\r\n\r\n\r\n                    /*\r\n                    With(\r\n						{\r\n							// 1. Identificamos si el principal es un registro nuevo\r\n							//esPrincipalNuevo: Coalesce(p.EsNuevo; false);\r\n\r\n							// 2. Si es nuevo, respetamos su inicio. Si es viejo, lo cortamos hoy.\r\n							fechaInicioBloqueFinal: If(\r\n								esPrincipalNuevo;\r\n								fechaInicioBloque;\r\n								If(\r\n									fechaInicioBloque < varFechaCorteEdicion;\r\n									varFechaCorteEdicion;\r\n									fechaInicioBloque\r\n								)\r\n							);\r\n							fechaFinBloqueFinal: If(\r\n								fechaFinBloqueTentativa > p.FechaFin;\r\n								p.FechaFin;\r\n								fechaFinBloqueTentativa\r\n							)\r\n						};\r\n						\r\n						// 3. Agregamos \"esPrincipalNuevo ||\" a la condición para que los bloques pasados no se oculten\r\n						If(\r\n							fechaInicioBloqueFinal <= fechaFinBloqueFinal &&\r\n							(esPrincipalNuevo || fechaFinBloqueFinal >= varFechaCorteEdicion);\r\n\r\n							Collect(\r\n								colAsignacionesPreviewTmp;\r\n								{\r\n									Bloque: b.Value;\r\n									Rol: \"PRINCIPAL\";\r\n									TipoAsignacion: \"AUTO\";\r\n									PrincipalId: p.PrincipalId;\r\n			                        // ... (Aquí continúa el resto de tu código normal, ResponsableNombre, etc.)\r\n                                    BackId: Blank();\r\n                                    ResponsableNombre: p.Nombre;\r\n                                    ResponsableCedula: p.Cedula;\r\n                                    ResponsableEkon: p.Ekon;\r\n                                    ResponsableCorreo: Lower(Trim(p.Correo));\r\n                                    ResponsableCargo: p.Cargo;\r\n                                    FechaInicio: fechaInicioBloqueFinal;\r\n                                    FechaFin: fechaFinBloqueFinal;\r\n                                    DiasAsignados: DateDiff(\r\n                                        fechaInicioBloqueFinal;\r\n                                        fechaFinBloqueFinal;\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                }\r\n                            );;\r\n\r\n                            ForAll(\r\n                                Sequence(\r\n                                    DateDiff(\r\n                                        fechaInicioBloqueFinal;\r\n                                        fechaFinBloqueFinal;\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                ) As d;\r\n                                With(\r\n                                    {\r\n                                        fechaDia: DateAdd(\r\n                                            fechaInicioBloqueFinal;\r\n                                            d.Value - 1;\r\n                                            TimeUnit.Days\r\n                                        )\r\n                                    };\r\n                                    Collect(\r\n                                        colAsignacionesDiarioTmp;\r\n                                        {\r\n                                            Fecha: fechaDia;\r\n                                            FechaClave: Text(\r\n                                                fechaDia;\r\n                                                \"[$-en-US]yyyy-mm-dd\"\r\n                                            );\r\n                                            Bloque: b.Value;\r\n                                            Rol: \"PRINCIPAL\";\r\n                                            TipoAsignacion: \"AUTO\";\r\n                                            PrincipalId: p.PrincipalId;\r\n                                            BackId: Blank();\r\n                                            ResponsableNombre: p.Nombre;\r\n                                            ResponsableCedula: p.Cedula;\r\n                                            ResponsableEkon: p.Ekon;\r\n                                            ResponsableCorreo: Lower(Trim(p.Correo));\r\n                                            ResponsableCargo: p.Cargo\r\n                                        }\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    );;\r\n    */\r\n\r\n\r\n\r\n\r\n    /*\r\n    // No borrar\r\n    // Generar asignaciones futuras de backs\r\n    ForAll(\r\n        colBacksProyecto As bk;\r\n        With(\r\n            {  \r\n                fechaInicioBackFinal: If(\r\n                    Coalesce(bk.EsNuevo; false);\r\n                    bk.FechaInicio;\r\n                    If(\r\n                        bk.FechaInicio < varFechaCorteEdicion;\r\n                        varFechaCorteEdicion;\r\n                        bk.FechaInicio\r\n                    )\r\n                );\r\n                fechaFinBackFinal: bk.FechaFin\r\n            };\r\n            If(\r\n                fechaInicioBackFinal <= fechaFinBackFinal &&\r\n                fechaFinBackFinal >= varFechaCorteEdicion;\r\n\r\n                Collect(\r\n                    colAsignacionesPreviewTmp;\r\n                    {\r\n                        Bloque: bk.BackId;\r\n                        Rol: \"BACK\";\r\n                        TipoAsignacion: \"MANUAL\";\r\n                        PrincipalId: bk.PrincipalIdRelacionado;\r\n                        BackId: bk.BackId;\r\n                        ResponsableNombre: bk.Nombre;\r\n                        ResponsableCedula: bk.Cedula;\r\n                        ResponsableEkon: bk.Ekon;\r\n                        ResponsableCorreo: Lower(Trim(bk.Correo));\r\n                        ResponsableCargo: bk.Cargo;\r\n                        FechaInicio: fechaInicioBackFinal;\r\n                        FechaFin: fechaFinBackFinal;\r\n                        DiasAsignados: DateDiff(\r\n                            fechaInicioBackFinal;\r\n                            fechaFinBackFinal;\r\n                            TimeUnit.Days\r\n                        ) + 1\r\n                    }\r\n                );;\r\n\r\n                ForAll(\r\n                    Sequence(\r\n                        DateDiff(\r\n                            fechaInicioBackFinal;\r\n                            fechaFinBackFinal;\r\n                            TimeUnit.Days\r\n                        ) + 1\r\n                    ) As d;\r\n                    With(\r\n                        {\r\n                            fechaDiaBack: DateAdd(\r\n                                fechaInicioBackFinal;\r\n                                d.Value - 1;\r\n                                TimeUnit.Days\r\n                            )\r\n                        };\r\n                        Collect(\r\n                            colAsignacionesDiarioTmp;\r\n                            {\r\n                                Fecha: fechaDiaBack;\r\n                                FechaClave: Text(\r\n                                    fechaDiaBack;\r\n                                    \"[$-en-US]yyyy-mm-dd\"\r\n                                );\r\n                                Bloque: bk.BackId;\r\n                                Rol: \"BACK\";\r\n                                TipoAsignacion: \"MANUAL\";\r\n                                PrincipalId: bk.PrincipalIdRelacionado;\r\n                                BackId: bk.BackId;\r\n                                ResponsableNombre: bk.Nombre;\r\n                                ResponsableCedula: bk.Cedula;\r\n                                ResponsableEkon: bk.Ekon;\r\n                                ResponsableCorreo: Lower(Trim(bk.Correo));\r\n                                ResponsableCargo: bk.Cargo\r\n                            }\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    )\r\n    */\r\n\r\n\r\n\r\n\r\n    /*\r\n    // Generar asignaciones futuras de backs\r\n    ForAll(\r\n        colBacksProyecto As bk;\r\n        With(\r\n            {  \r\n                // 1. PRIMER WITH: Calculamos únicamente si es nuevo\r\n                esBackNuevo: Coalesce(bk.EsNuevo; false)\r\n            };\r\n            With(\r\n                {\r\n                    // 2. SEGUNDO WITH: Ahora sí reconoce esBackNuevo para las fechas\r\n                    fechaInicioBackFinal: If(\r\n                        esBackNuevo;\r\n                        bk.FechaInicio;\r\n                        If(\r\n                            bk.FechaInicio < varFechaCorteEdicion;\r\n                            varFechaCorteEdicion;\r\n                            bk.FechaInicio\r\n                        )\r\n                    );\r\n                    fechaFinBackFinal: bk.FechaFin\r\n                };\r\n                \r\n                // 3. Condición de creación del bloque\r\n                If(\r\n                    fechaInicioBackFinal <= fechaFinBackFinal &&\r\n                    (esBackNuevo || fechaFinBackFinal >= varFechaCorteEdicion);\r\n\r\n                    Collect(\r\n                        colAsignacionesPreviewTmp;\r\n                        {\r\n                            Bloque: bk.BackId;\r\n                            Rol: \"BACK\";\r\n                            TipoAsignacion: \"MANUAL\";\r\n                            PrincipalId: bk.PrincipalIdRelacionado;\r\n                            BackId: bk.BackId;\r\n                            ResponsableNombre: bk.Nombre;\r\n                            ResponsableCedula: bk.Cedula;\r\n                            ResponsableEkon: bk.Ekon;\r\n                            ResponsableCorreo: Lower(Trim(bk.Correo));\r\n                            ResponsableCargo: bk.Cargo;\r\n                            FechaInicio: fechaInicioBackFinal;\r\n                            FechaFin: fechaFinBackFinal;\r\n                            DiasAsignados: DateDiff(\r\n                                fechaInicioBackFinal;\r\n                                fechaFinBackFinal;\r\n                                TimeUnit.Days\r\n                            ) + 1\r\n                        }\r\n                    );;\r\n\r\n                    ForAll(\r\n                        Sequence(\r\n                            DateDiff(\r\n                                fechaInicioBackFinal;\r\n                                fechaFinBackFinal;\r\n                                TimeUnit.Days\r\n                            ) + 1\r\n                        ) As d;\r\n                        With(\r\n                            {\r\n                                fechaDiaBack: DateAdd(\r\n                                    fechaInicioBackFinal;\r\n                                    d.Value - 1;\r\n                                    TimeUnit.Days\r\n                                )\r\n                            };\r\n                            Collect(\r\n                                colAsignacionesDiarioTmp;\r\n                                {\r\n                                    Fecha: fechaDiaBack;\r\n                                    FechaClave: Text(\r\n                                        fechaDiaBack;\r\n                                        \"[$-en-US]yyyy-mm-dd\"\r\n                                    );\r\n                                    Bloque: bk.BackId;\r\n                                    Rol: \"BACK\";\r\n                                    TipoAsignacion: \"MANUAL\";\r\n                                    PrincipalId: bk.PrincipalIdRelacionado;\r\n                                    BackId: bk.BackId;\r\n                                    ResponsableNombre: bk.Nombre;\r\n                                    ResponsableCedula: bk.Cedula;\r\n                                    ResponsableEkon: bk.Ekon;\r\n                                    ResponsableCorreo: Lower(Trim(bk.Correo));\r\n                                    ResponsableCargo: bk.Cargo\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    )\r\n);;\r\n\r\n\r\n\r\n// Validar conflictos internos futuros\r\nIf(\r\n    varPuedeGenerarAsignacion;\r\n\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n;\r\n        If(\r\n            CountRows(\r\n                Filter(\r\n                    colAsignacionesDiarioTmp;\r\n                    ResponsableEkon = n.ResponsableEkon &&\r\n                    FechaClave = n.FechaClave\r\n                )\r\n            ) > 1;\r\n            Collect(\r\n                colConflictosAsignacion;\r\n                {\r\n                    Fecha: n.Fecha;\r\n                    FechaClave: n.FechaClave;\r\n                    ResponsableNombre: n.ResponsableNombre;\r\n                    ResponsableCedula: n.ResponsableCedula;\r\n                    ResponsableEkon: n.ResponsableEkon;\r\n                    ResponsableCorreo: n.ResponsableCorreo;\r\n                    Rol: n.Rol;\r\n                    ProyectoExistente: \"MISMO PROYECTO\";\r\n                    EstadoProyecto: \"CONFLICTO INTERNO\";\r\n                    BloqueExistente: n.Bloque\r\n                }\r\n            )\r\n        )\r\n    );;\r\n\r\n    //Agregado\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n;\r\n        If(\r\n            CountRows(\r\n                Filter(\r\n                    colAsignacionesDiarioBase;\r\n                    ResponsableEkon = n.ResponsableEkon &&\r\n                    FechaClave = n.FechaClave\r\n                )\r\n            ) > 0;\r\n            Collect(\r\n                colConflictosAsignacion;\r\n                {\r\n                    Fecha: n.Fecha;\r\n                    FechaClave: n.FechaClave;\r\n                    ResponsableNombre: n.ResponsableNombre;\r\n                    ResponsableCedula: n.ResponsableCedula;\r\n                    ResponsableEkon: n.ResponsableEkon;\r\n                    ResponsableCorreo: n.ResponsableCorreo;\r\n                    Rol: n.Rol;\r\n                    ProyectoExistente: \"MISMO PROYECTO\";\r\n                    EstadoProyecto: \"YA EXISTE EN HISTÓRICO\";\r\n                    BloqueExistente: n.Bloque\r\n                }\r\n            )\r\n        )\r\n    );;\r\n\r\n\r\n    // Validar conflictos con otros proyectos\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n;\r\n        With(\r\n            {\r\n                conflicto: LookUp(\r\n                    colAsignacionesGlobales;\r\n                    ResponsableEkon = Lower(Trim(n.ResponsableEkon)) &&\r\n                    FechaClave = n.FechaClave &&\r\n                    ProjectUID <> Text(varProyectoSeleccionado.PROJECT_UID)\r\n                )\r\n            };\r\n            If(\r\n                !IsBlank(conflicto.ProyectoCodigo);\r\n                Collect(\r\n                    colConflictosAsignacion;\r\n                    {\r\n                        Fecha: n.Fecha;\r\n                        FechaClave: n.FechaClave;\r\n                        ResponsableNombre: n.ResponsableNombre;\r\n                        ResponsableCedula: n.ResponsableCedula;\r\n                        ResponsableEkon: n.ResponsableEkon;\r\n                        ResponsableCorreo: n.ResponsableCorreo;\r\n                        Rol: n.Rol;\r\n                        ProyectoExistente: conflicto.ProyectoCodigo;\r\n                        EstadoProyecto: conflicto.EstadoProyecto;\r\n                        BloqueExistente: conflicto.Bloque\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    )\r\n);;\r\n\r\n// Resumen de conflictos\r\nClearCollect(\r\n    colConflictosBase;\r\n    AddColumns(\r\n        colConflictosAsignacion;\r\n        MesAnio;\r\n        Text(Fecha; \"mmmm yyyy\")\r\n    )\r\n);;\r\n\r\nClearCollect(\r\n    colConflictosResumen;\r\n    AddColumns(\r\n        GroupBy(\r\n            colConflictosBase;\r\n            ResponsableNombre;\r\n            Rol;\r\n            ProyectoExistente;\r\n            MesAnio;\r\n            Registros\r\n        );\r\n        DiasTexto;\r\n        With(\r\n            {\r\n                textoDias: Concat(\r\n                    SortByColumns(\r\n                        Registros;\r\n                        \"Fecha\";\r\n                        SortOrder.Ascending\r\n                    );\r\n                    Text(Day(Fecha)) & \", \"\r\n                )\r\n            };\r\n            If(\r\n                Len(textoDias) > 2;\r\n                Left(textoDias; Len(textoDias) - 2);\r\n                textoDias\r\n            )\r\n        )\r\n    )\r\n);;\r\n\r\n// Si no hay conflictos, unir histórico intacto + futuro regenerado\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(colConflictosAsignacion) = 0;\r\n\r\n    Clear(colAsignacionesDiario);;\r\n\r\n    Collect(\r\n        colAsignacionesDiario;\r\n        colAsignacionesDiarioBase\r\n    );;\r\n\r\n    Collect(\r\n        colAsignacionesDiario;\r\n        colAsignacionesDiarioTmp\r\n    );;\r\n\r\n    Clear(colAsignacionesPreview);;\r\n\r\n    ForAll(\r\n        GroupBy(\r\n            colAsignacionesDiario;\r\n            Bloque;\r\n            Rol;\r\n            TipoAsignacion;\r\n            PrincipalId;\r\n            BackId;\r\n            ResponsableNombre;\r\n            ResponsableCedula;\r\n            ResponsableEkon;\r\n            ResponsableCorreo;\r\n            ResponsableCargo;\r\n            Registros\r\n        ) As g;\r\n        Collect(\r\n            colAsignacionesPreview;\r\n            {\r\n                Bloque: Value(g.Bloque);\r\n                Rol: Text(g.Rol);\r\n                TipoAsignacion: Text(g.TipoAsignacion);\r\n                PrincipalId: If(\r\n                    IsBlank(Text(g.PrincipalId));\r\n                    Blank();\r\n                    Value(g.PrincipalId)\r\n                );\r\n                BackId: If(\r\n                    IsBlank(Text(g.BackId));\r\n                    Blank();\r\n                    Value(g.BackId)\r\n                );\r\n                ResponsableNombre: Text(g.ResponsableNombre);\r\n                ResponsableCedula: Text(g.ResponsableCedula);\r\n                ResponsableEkon: Text(g.ResponsableEkon);\r\n                ResponsableCorreo: Lower(Trim(Text(g.ResponsableCorreo)));\r\n                ResponsableCargo: Text(g.ResponsableCargo);\r\n                FechaInicio: Min(g.Registros; Fecha);\r\n                FechaFin: Max(g.Registros; Fecha);\r\n                DiasAsignados: CountRows(g.Registros)\r\n            }\r\n        )\r\n    );;\r\n\r\n    Set(varRequiereRegenerar; false);;\r\n    Set(varAsignacionRegenerada; true);;\r\n    Set(\r\n        varEstadoRegenerado;\r\n        varTipoMovimientoEstado <> \"SIN_CAMBIO\"\r\n    );;\r\n\r\n    Notify(\r\n        \"Asignación regenerada correctamente. Se mantuvo intacto el histórico anterior a hoy.\";\r\n        NotificationType.Success\r\n    );\r\n\r\n    If(\r\n        CountRows(colConflictosAsignacion) > 0;\r\n        Notify(\r\n            \"Se detectaron cruces de asignación. Revisa los conflictos antes de guardar.\";\r\n            NotificationType.Error\r\n        )\r\n    )\r\n);;\r\n*/\r\n\r\n\r\n\r\n\r\n\r\nClear(colAsignacionesPreviewTmp);\r\nClear(colAsignacionesDiarioTmp);\r\nClear(colConflictosAsignacion);\r\nClear(colConflictosBase);\r\nClear(colConflictosResumen);\r\n\r\nSet(\r\n    varFechaCorteEdicion,\r\n    If(\r\n        varTipoMovimientoEstado = \"REACTIVACION\" &&\r\n        !IsBlank(fechaMovimientoEstadoEdit.SelectedDate),\r\n        fechaMovimientoEstadoEdit.SelectedDate,\r\n        Today()\r\n    )\r\n);\r\n\r\n\r\nSet(varPuedeGenerarAsignacion, true);\r\n\r\n// Base histórica: todo lo anterior a hoy queda intacto\r\n\r\nClearCollect(\r\n    colAsignacionesDiarioBase,\r\n    Filter(\r\n        colAsignacionesDiarioOriginal,\r\n        Fecha < varFechaCorteEdicion\r\n    )\r\n);\r\n\r\n\r\nClearCollect(\r\n    colAsignacionesPreviewBase,\r\n    Filter(\r\n        colAsignacionesPreviewOriginal,\r\n        FechaFin < varFechaCorteEdicion\r\n    )\r\n);\r\n\r\n\r\n\r\n// Validaciones generales\r\nIf(\r\n    IsBlank(inicioProyectoEdit.SelectedDate) ||\r\n    IsBlank(finProyectoEdit.SelectedDate),\r\n    Notify(\r\n        \"Debes seleccionar fecha de inicio y fecha fin del proyecto\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    finProyectoEdit.SelectedDate < inicioProyectoEdit.SelectedDate,\r\n    Notify(\r\n        \"La fecha fin debe ser mayor o igual a la fecha inicio\",\r\n        NotificationType.Error\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\n\r\n/*\r\n// PRINCIPAL DEBE EXISTIR\r\n// Validar principales vigentes/futuros\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(colPrincipalesProyecto) = 0;\r\n    Notify(\r\n        \"El proyecto debe tener al menos un principal vigente o futuro\";\r\n        NotificationType.Warning\r\n    );;\r\n    Set(varPuedeGenerarAsignacion; false)\r\n);;\r\n*/\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto,\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin) ||\r\n            DiasTrabajo = 0\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Todos los principales vigentes/futuros deben tener usuario, fecha inicio, fecha fin y jornada\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colPrincipalesProyecto,\r\n            FechaInicio < inicioProyectoEdit.SelectedDate ||\r\n            FechaFin > finProyectoEdit.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Las fechas de los principales deben estar dentro del rango del proyecto\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\n// Validar backs vigentes/futuros\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto,\r\n            IsBlank(Correo) ||\r\n            IsBlank(FechaInicio) ||\r\n            IsBlank(FechaFin)\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Todos los backs vigentes/futuros deben tener usuario, fecha inicio y fecha fin\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(\r\n        Filter(\r\n            colBacksProyecto,\r\n            FechaInicio < inicioProyectoEdit.SelectedDate ||\r\n            FechaFin > finProyectoEdit.SelectedDate ||\r\n            FechaFin < FechaInicio\r\n        )\r\n    ) > 0,\r\n    Notify(\r\n        \"Las fechas de los backs deben estar dentro del rango del proyecto\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeGenerarAsignacion, false)\r\n);\r\n\r\n// Generar asignaciones futuras de principales\r\nIf(\r\n    varPuedeGenerarAsignacion,\r\n\r\n    ForAll(\r\n        colPrincipalesProyecto As p,\r\n        With(\r\n            {\r\n                totalDiasPrincipal: DateDiff(\r\n                    p.FechaInicio,\r\n                    p.FechaFin,\r\n                    TimeUnit.Days\r\n                ) + 1,\r\n                cicloPrincipal: p.DiasTrabajo + p.DiasDescanso,\r\n\r\n                // 1. LO MOVEMOS AQUÍ: Lo declaramos al inicio del Principal\r\n                esPrincipalNuevo: Coalesce(p.EsNuevo, false)\r\n            },\r\n            ForAll(\r\n                Sequence(\r\n                    RoundUp(\r\n                        totalDiasPrincipal / cicloPrincipal,\r\n                        0\r\n                    )\r\n                ) As b,\r\n                With(\r\n                    {\r\n                        fechaInicioBloque: DateAdd(\r\n                            p.FechaInicio,\r\n                            (b.Value - 1) * cicloPrincipal,\r\n                            TimeUnit.Days\r\n                        ),\r\n                        fechaFinBloqueTentativa: DateAdd(\r\n                            p.FechaInicio,\r\n                            ((b.Value - 1) * cicloPrincipal) + p.DiasTrabajo - 1,\r\n                            TimeUnit.Days\r\n                        )\r\n                    },\r\n                    With(\r\n						{\r\n							// 2. Si es nuevo, respetamos su inicio. Si es viejo, lo cortamos hoy.\r\n							fechaInicioBloqueFinal: If(\r\n								esPrincipalNuevo,\r\n								fechaInicioBloque,\r\n								If(\r\n									fechaInicioBloque < varFechaCorteEdicion,\r\n									varFechaCorteEdicion,\r\n									fechaInicioBloque\r\n								)\r\n							),\r\n							fechaFinBloqueFinal: If(\r\n								fechaFinBloqueTentativa > p.FechaFin,\r\n								p.FechaFin,\r\n								fechaFinBloqueTentativa\r\n							)\r\n						},\r\n						\r\n						// 3. Agregamos \"esPrincipalNuevo ||\" a la condición para que los bloques pasados no se oculten\r\n						If(\r\n							fechaInicioBloqueFinal <= fechaFinBloqueFinal &&\r\n							(esPrincipalNuevo || fechaFinBloqueFinal >= varFechaCorteEdicion),\r\n\r\n							Collect(\r\n								colAsignacionesPreviewTmp,\r\n								{\r\n									Bloque: b.Value,\r\n									Rol: \"PRINCIPAL\",\r\n									TipoAsignacion: \"AUTO\",\r\n									PrincipalId: p.PrincipalId,\r\n                                    BackId: Blank(),\r\n                                    ResponsableNombre: p.Nombre,\r\n                                    ResponsableCedula: p.Cedula,\r\n                                    ResponsableEkon: p.Ekon,\r\n                                    ResponsableCorreo: Lower(Trim(p.Correo)),\r\n                                    ResponsableCargo: p.Cargo,\r\n                                    FechaInicio: fechaInicioBloqueFinal,\r\n                                    FechaFin: fechaFinBloqueFinal,\r\n                                    DiasAsignados: DateDiff(\r\n                                        fechaInicioBloqueFinal,\r\n                                        fechaFinBloqueFinal,\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                }\r\n                            );\r\n\r\n                            ForAll(\r\n                                Sequence(\r\n                                    DateDiff(\r\n                                        fechaInicioBloqueFinal,\r\n                                        fechaFinBloqueFinal,\r\n                                        TimeUnit.Days\r\n                                    ) + 1\r\n                                ) As d,\r\n                                With(\r\n                                    {\r\n                                        fechaDia: DateAdd(\r\n                                            fechaInicioBloqueFinal,\r\n                                            d.Value - 1,\r\n                                            TimeUnit.Days\r\n                                        )\r\n                                    },\r\n                                    Collect(\r\n                                        colAsignacionesDiarioTmp,\r\n                                        {\r\n                                            Fecha: fechaDia,\r\n                                            FechaClave: Text(\r\n                                                fechaDia,\r\n                                                \"[$-en-US]yyyy-mm-dd\"\r\n                                            ),\r\n                                            Bloque: b.Value,\r\n                                            Rol: \"PRINCIPAL\",\r\n                                            TipoAsignacion: \"AUTO\",\r\n                                            PrincipalId: p.PrincipalId,\r\n                                            BackId: Blank(),\r\n                                            ResponsableNombre: p.Nombre,\r\n                                            ResponsableCedula: p.Cedula,\r\n                                            ResponsableEkon: p.Ekon,\r\n                                            ResponsableCorreo: Lower(Trim(p.Correo)),\r\n                                            ResponsableCargo: p.Cargo\r\n                                        }\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n\r\nIf(\r\n    varPuedeGenerarAsignacion,\r\n    // ==============================================================================\r\n    // GENERACIÓN DE BACKS (Con lógica dinámica y protección histórica)\r\n    // ==============================================================================\r\n    ForAll(\r\n        colBacksProyecto As bk,\r\n        With(\r\n            {  \r\n                esBackNuevo: Coalesce(bk.EsNuevo, false),\r\n                esJornada: Coalesce(bk.TipoRegistro, \"Jornada\") = \"Jornada\",\r\n                rolActual: If(Coalesce(bk.TipoRegistro, \"Jornada\") = \"Descanso\", \"DESCANSO\", \"BACK\"),\r\n                diasVacaciones: Value(Coalesce(bk.DiasDescanso, 0))\r\n            },\r\n            With(\r\n                {\r\n                    fechaInicioBackFinal: If(\r\n                        esBackNuevo,\r\n                        bk.FechaInicio,\r\n                        If(\r\n                            bk.FechaInicio < varFechaCorteEdicion,\r\n                            varFechaCorteEdicion,\r\n                            bk.FechaInicio\r\n                        )\r\n                    ),\r\n                    fechaFinBackFinal: bk.FechaFin\r\n                },\r\n                \r\n                // --- 1. BLOQUE INICIAL DEL BACK (Trabajo o Descanso completo) ---\r\n                If(\r\n                    fechaInicioBackFinal <= fechaFinBackFinal &&\r\n                    (esBackNuevo || fechaFinBackFinal >= varFechaCorteEdicion),\r\n\r\n                    Collect(\r\n                        colAsignacionesPreviewTmp,\r\n                        {\r\n                            Bloque: bk.BackId,\r\n                            Rol: rolActual,\r\n                            TipoAsignacion: \"MANUAL\",\r\n                            PrincipalId: bk.PrincipalIdRelacionado,\r\n                            BackId: bk.BackId,\r\n                            ResponsableNombre: bk.Nombre,\r\n                            ResponsableCedula: bk.Cedula,\r\n                            ResponsableEkon: bk.Ekon,\r\n                            ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                            ResponsableCargo: bk.Cargo,\r\n                            FechaInicio: fechaInicioBackFinal,\r\n                            FechaFin: fechaFinBackFinal,\r\n                            DiasAsignados: DateDiff(\r\n                                fechaInicioBackFinal,\r\n                                fechaFinBackFinal,\r\n                                TimeUnit.Days\r\n                            ) + 1\r\n                        }\r\n                    );\r\n\r\n                    ForAll(\r\n                        Sequence(\r\n                            DateDiff(\r\n                                fechaInicioBackFinal,\r\n                                fechaFinBackFinal,\r\n                                TimeUnit.Days\r\n                            ) + 1\r\n                        ) As d,\r\n                        With(\r\n                            {\r\n                                fechaDiaBack: DateAdd(\r\n                                    fechaInicioBackFinal,\r\n                                    d.Value - 1,\r\n                                    TimeUnit.Days\r\n                                )\r\n                            },\r\n                            Collect(\r\n                                colAsignacionesDiarioTmp,\r\n                                {\r\n                                    Fecha: fechaDiaBack,\r\n                                    FechaClave: Text(\r\n                                        fechaDiaBack,\r\n                                        \"[$-en-US]yyyy-mm-dd\"\r\n                                    ),\r\n                                    Bloque: bk.BackId,\r\n                                    Rol: rolActual,\r\n                                    TipoAsignacion: \"MANUAL\",\r\n                                    PrincipalId: bk.PrincipalIdRelacionado,\r\n                                    BackId: bk.BackId,\r\n                                    ResponsableNombre: bk.Nombre,\r\n                                    ResponsableCedula: bk.Cedula,\r\n                                    ResponsableEkon: bk.Ekon,\r\n                                    ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                                    ResponsableCargo: bk.Cargo\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                );\r\n                \r\n                // --- 2. BLOQUE ADICIONAL DE VACACIONES/DESCANSO AL FINALIZAR ---\r\n                If(\r\n                    esJornada && diasVacaciones > 0,\r\n                    With(\r\n                        {\r\n                            fechaInicioVac: DateAdd(bk.FechaFin, 1, TimeUnit.Days),\r\n                            fechaFinVac: DateAdd(bk.FechaFin, diasVacaciones, TimeUnit.Days)\r\n                        },\r\n                        With(\r\n                            {\r\n                                fechaInicioVacFinal: If(\r\n                                    esBackNuevo,\r\n                                    fechaInicioVac,\r\n                                    If(\r\n                                        fechaInicioVac < varFechaCorteEdicion,\r\n                                        varFechaCorteEdicion,\r\n                                        fechaInicioVac\r\n                                    )\r\n                                )\r\n                            },\r\n                            If(\r\n                                fechaInicioVacFinal <= fechaFinVac &&\r\n                                (esBackNuevo || fechaFinVac >= varFechaCorteEdicion),\r\n                                \r\n                                Collect(\r\n                                    colAsignacionesPreviewTmp,\r\n                                    {\r\n                                        Bloque: bk.BackId,\r\n                                        Rol: \"DESCANSO\",\r\n                                        TipoAsignacion: \"MANUAL\",\r\n                                        PrincipalId: bk.PrincipalIdRelacionado,\r\n                                        BackId: bk.BackId,\r\n                                        ResponsableNombre: bk.Nombre,\r\n                                        ResponsableCedula: bk.Cedula,\r\n                                        ResponsableEkon: bk.Ekon,\r\n                                        ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                                        ResponsableCargo: bk.Cargo,\r\n                                        FechaInicio: fechaInicioVacFinal,\r\n                                        FechaFin: fechaFinVac,\r\n                                        DiasAsignados: DateDiff(fechaInicioVacFinal, fechaFinVac, TimeUnit.Days) + 1\r\n                                    }\r\n                                );\r\n                                \r\n                                ForAll(\r\n                                    Sequence(DateDiff(fechaInicioVacFinal, fechaFinVac, TimeUnit.Days) + 1) As dVac,\r\n                                    With(\r\n                                        {\r\n                                            fechaDiaVac: DateAdd(fechaInicioVacFinal, dVac.Value - 1, TimeUnit.Days)\r\n                                        },\r\n                                        Collect(\r\n                                            colAsignacionesDiarioTmp,\r\n                                            {\r\n                                                Fecha: fechaDiaVac,\r\n                                                FechaClave: Text(fechaDiaVac, \"[$-en-US]yyyy-mm-dd\"),\r\n                                                Bloque: bk.BackId,\r\n                                                Rol: \"DESCANSO\",\r\n                                                TipoAsignacion: \"MANUAL\", \r\n                                                PrincipalId: bk.PrincipalIdRelacionado,\r\n                                                BackId: bk.BackId,\r\n                                                ResponsableNombre: bk.Nombre,\r\n                                                ResponsableCedula: bk.Cedula,\r\n                                                ResponsableEkon: bk.Ekon,\r\n                                                ResponsableCorreo: Lower(Trim(bk.Correo)),\r\n                                                ResponsableCargo: bk.Cargo\r\n                                            }\r\n                                        )\r\n                                    )\r\n                                )\r\n                            )\r\n                        )\r\n                    )\r\n                )\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n\r\n\r\n// Validar conflictos internos futuros\r\nIf(\r\n    varPuedeGenerarAsignacion,\r\n\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n,\r\n        If(\r\n            Upper(Trim(n.Rol)) <> \"DESCANSO\" &&\r\n            CountRows(\r\n                Filter(\r\n                    colAsignacionesDiarioTmp,\r\n                    ResponsableEkon = n.ResponsableEkon &&\r\n                    FechaClave = n.FechaClave &&\r\n                    Upper(Trim(Rol)) <> \"DESCANSO\"\r\n                )\r\n            ) > 1,\r\n            Collect(\r\n                colConflictosAsignacion,\r\n                {\r\n                    Fecha: n.Fecha,\r\n                    FechaClave: n.FechaClave,\r\n                    ResponsableNombre: n.ResponsableNombre,\r\n                    ResponsableCedula: n.ResponsableCedula,\r\n                    ResponsableEkon: n.ResponsableEkon,\r\n                    ResponsableCorreo: n.ResponsableCorreo,\r\n                    Rol: n.Rol,\r\n                    ProyectoExistente: \"MISMO PROYECTO\",\r\n                    EstadoProyecto: \"CONFLICTO INTERNO\",\r\n                    BloqueExistente: n.Bloque\r\n                }\r\n            )\r\n        )\r\n    );\r\n\r\n    // Conflicto con Histórico\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n,\r\n        If(\r\n            Upper(Trim(n.Rol)) <> \"DESCANSO\" &&\r\n            CountRows(\r\n                Filter(\r\n                    colAsignacionesDiarioBase,\r\n                    ResponsableEkon = n.ResponsableEkon &&\r\n                    FechaClave = n.FechaClave &&\r\n                    Upper(Trim(Rol)) <> \"DESCANSO\"\r\n                )\r\n            ) > 0,\r\n            Collect(\r\n                colConflictosAsignacion,\r\n                {\r\n                    Fecha: n.Fecha,\r\n                    FechaClave: n.FechaClave,\r\n                    ResponsableNombre: n.ResponsableNombre,\r\n                    ResponsableCedula: n.ResponsableCedula,\r\n                    ResponsableEkon: n.ResponsableEkon,\r\n                    ResponsableCorreo: n.ResponsableCorreo,\r\n                    Rol: n.Rol,\r\n                    ProyectoExistente: \"MISMO PROYECTO\",\r\n                    EstadoProyecto: \"YA EXISTE EN HISTÓRICO\",\r\n                    BloqueExistente: n.Bloque\r\n                }\r\n            )\r\n        )\r\n    );\r\n\r\n\r\n    // Validar conflictos con otros proyectos\r\n    ForAll(\r\n        colAsignacionesDiarioTmp As n,\r\n        With(\r\n            {\r\n                conflicto: LookUp(\r\n                    colAsignacionesGlobales,\r\n                    ResponsableEkon = Lower(Trim(n.ResponsableEkon)) &&\r\n                    FechaClave = n.FechaClave &&\r\n                    Upper(Trim(Rol)) <> \"DESCANSO\" &&\r\n                    ProjectUID <> Text(varProyectoSeleccionado.PROJECT_UID)\r\n                )\r\n            },\r\n            If(\r\n                Upper(Trim(n.Rol)) <> \"DESCANSO\" && !IsBlank(conflicto.ProyectoCodigo),\r\n                Collect(\r\n                    colConflictosAsignacion,\r\n                    {\r\n                        Fecha: n.Fecha,\r\n                        FechaClave: n.FechaClave,\r\n                        ResponsableNombre: n.ResponsableNombre,\r\n                        ResponsableCedula: n.ResponsableCedula,\r\n                        ResponsableEkon: n.ResponsableEkon,\r\n                        ResponsableCorreo: n.ResponsableCorreo,\r\n                        Rol: n.Rol,\r\n                        ProyectoExistente: conflicto.ProyectoCodigo,\r\n                        EstadoProyecto: conflicto.EstadoProyecto,\r\n                        BloqueExistente: conflicto.Bloque\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n// Resumen de conflictos\r\nClearCollect(\r\n    colConflictosBase,\r\n    AddColumns(\r\n        colConflictosAsignacion,\r\n        MesAnio,\r\n        Text(Fecha, \"mmmm yyyy\")\r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colConflictosResumen,\r\n    AddColumns(\r\n        GroupBy(\r\n            colConflictosBase,\r\n            ResponsableNombre,\r\n            Rol,\r\n            ProyectoExistente,\r\n            MesAnio,\r\n            Registros\r\n        ),\r\n        DiasTexto,\r\n        With(\r\n            {\r\n                textoDias: Concat(\r\n                    SortByColumns(\r\n                        Registros,\r\n                        \"Fecha\",\r\n                        SortOrder.Ascending\r\n                    ),\r\n                    Text(Day(Fecha)) & \", \"\r\n                )\r\n            },\r\n            If(\r\n                Len(textoDias) > 2,\r\n                Left(textoDias, Len(textoDias) - 2),\r\n                textoDias\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n// Si no hay conflictos, unir histórico intacto + futuro regenerado\r\nIf(\r\n    varPuedeGenerarAsignacion &&\r\n    CountRows(colConflictosAsignacion) = 0,\r\n\r\n    Clear(colAsignacionesDiario);\r\n\r\n    Collect(\r\n        colAsignacionesDiario,\r\n        colAsignacionesDiarioBase\r\n    );\r\n\r\n    Collect(\r\n        colAsignacionesDiario,\r\n        colAsignacionesDiarioTmp\r\n    );\r\n\r\n    Clear(colAsignacionesPreview);\r\n\r\n    ForAll(\r\n        GroupBy(\r\n            colAsignacionesDiario,\r\n            Bloque,\r\n            Rol,\r\n            TipoAsignacion,\r\n            PrincipalId,\r\n            BackId,\r\n            ResponsableNombre,\r\n            ResponsableCedula,\r\n            ResponsableEkon,\r\n            ResponsableCorreo,\r\n            ResponsableCargo,\r\n            Registros\r\n        ) As g,\r\n        Collect(\r\n            colAsignacionesPreview,\r\n            {\r\n                Bloque: Value(g.Bloque),\r\n                Rol: Text(g.Rol),\r\n                TipoAsignacion: Text(g.TipoAsignacion),\r\n                PrincipalId: If(\r\n                    IsBlank(Text(g.PrincipalId)),\r\n                    Blank(),\r\n                    Value(g.PrincipalId)\r\n                ),\r\n                BackId: If(\r\n                    IsBlank(Text(g.BackId)),\r\n                    Blank(),\r\n                    Value(g.BackId)\r\n                ),\r\n                ResponsableNombre: Text(g.ResponsableNombre),\r\n                ResponsableCedula: Text(g.ResponsableCedula),\r\n                ResponsableEkon: Text(g.ResponsableEkon),\r\n                ResponsableCorreo: Lower(Trim(Text(g.ResponsableCorreo))),\r\n                ResponsableCargo: Text(g.ResponsableCargo),\r\n                FechaInicio: Min(g.Registros, Fecha),\r\n                FechaFin: Max(g.Registros, Fecha),\r\n                DiasAsignados: CountRows(g.Registros)\r\n            }\r\n        )\r\n    );\r\n\r\n    Set(varRequiereRegenerar, false);\r\n    Set(varAsignacionRegenerada, true);\r\n    Set(\r\n        varEstadoRegenerado,\r\n        varTipoMovimientoEstado <> \"SIN_CAMBIO\"\r\n    );\r\n\r\n    Notify(\r\n        \"Asignación regenerada correctamente. Se mantuvo intacto el histórico anterior a hoy.\",\r\n        NotificationType.Success\r\n    );\r\n\r\n    If(\r\n        CountRows(colConflictosAsignacion) > 0,\r\n        Notify(\r\n            \"Se detectaron cruces de asignación. Revisa los conflictos antes de guardar.\",\r\n            NotificationType.Error\r\n        )\r\n    )\r\n);"
