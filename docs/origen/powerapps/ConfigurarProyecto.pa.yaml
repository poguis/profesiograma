                              OnSelect: "=Set(cargarInfo, true);\r\n\r\nSet(varPuedeRegistrarProyecto, true);\r\n\r\nIf(\r\n    varRequiereRegenerar,\r\n    Notify(\r\n        \"Debes regenerar antes de registrar los cambios\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeRegistrarProyecto, false)\r\n);\r\n\r\nIf(\r\n    CountRows(colConflictosAsignacion) > 0,\r\n    Notify(\r\n        \"No puedes registrar porque existen conflictos\",\r\n        NotificationType.Error\r\n    );\r\n    Set(varPuedeRegistrarProyecto, false)\r\n);\r\n\r\nIf(\r\n    IsEmpty(colAsignacionesPreview) || IsEmpty(colAsignacionesDiario),\r\n    Notify(\r\n        \"No existen asignaciones generadas para registrar\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeRegistrarProyecto, false)\r\n);\r\n\r\nSet(\r\n    varActividadCambiada,\r\n    gblGrupoProyecto = \"CAMPO\" &&\r\n    !IsBlank(varActivityIdEdit) &&\r\n    varActivityIdEdit <> gblActivityIdProyecto\r\n);\r\n\r\nIf(\r\n    varActividadCambiada &&\r\n    IsBlank(fechaActividadDesdeEdit.SelectedDate),\r\n    Notify(\r\n        \"Selecciona desde qué fecha aplica la nueva actividad\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeRegistrarProyecto, false)\r\n);\r\n\r\nIf(\r\n    varActividadCambiada &&\r\n    (\r\n        fechaActividadDesdeEdit.SelectedDate < inicioProyectoEdit.SelectedDate ||\r\n        fechaActividadDesdeEdit.SelectedDate > finProyectoEdit.SelectedDate\r\n    ),\r\n    Notify(\r\n        \"La fecha de cambio de actividad debe estar dentro del rango del proyecto\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeRegistrarProyecto, false)\r\n);\r\n\r\nIf(\r\n    varEstadoCambiado &&\r\n    !varEstadoRegenerado,\r\n    Notify(\r\n        \"Primero debes aplicar o regenerar el cambio de estado antes de registrar\",\r\n        NotificationType.Warning\r\n    );\r\n    Set(varPuedeRegistrarProyecto, false)\r\n);\r\n\r\n\r\nIf(\r\n    varPuedeRegistrarProyecto,\r\n\r\n    If( \r\n        varTipoMovimientoEstado = \"SUSPENSION\" ||\r\n        varTipoMovimientoEstado = \"CIERRE\",\r\n\r\n        ClearCollect(\r\n            colPrincipalesGuardar,\r\n            colPrincipalesProyecto\r\n        );\r\n\r\n        ClearCollect(\r\n            colBacksGuardar,\r\n            colBacksProyecto\r\n        ),\r\n\r\n        ClearCollect(\r\n            colPrincipalesGuardar,\r\n            Filter(\r\n                colPrincipalesHistoricos,\r\n                FechaFin < varFechaCorteEdicion\r\n            )\r\n        );\r\n\r\n        Collect(\r\n            colPrincipalesGuardar,\r\n            colPrincipalesProyecto\r\n        );\r\n\r\n        ClearCollect(\r\n            colBacksGuardar,\r\n            Filter(\r\n                colBacksHistoricos,\r\n                //FechaFin < varFechaCorteEdicion\r\n\r\n                DateAdd(FechaFin, DiasDescanso, TimeUnit.Days) < varFechaCorteEdicion\r\n            )\r\n        );\r\n\r\n        Collect(\r\n            colBacksGuardar,\r\n            colBacksProyecto\r\n        )\r\n    );\r\n\r\n\r\n\r\n    If(\r\n        varActividadCambiada,\r\n\r\n        Set(\r\n            varFechaCambioActividad,\r\n            fechaActividadDesdeEdit.SelectedDate\r\n        );\r\n\r\n        ClearCollect(\r\n            colHistorialActividadesTmp,\r\n            Filter(\r\n                colHistorialActividades,\r\n                FechaInicio < varFechaCambioActividad\r\n            )\r\n        );\r\n\r\n        Set(\r\n            varActividadAnterior,\r\n            Last(\r\n                SortByColumns(\r\n                    colHistorialActividadesTmp,\r\n                    \"FechaInicio\",\r\n                    SortOrder.Ascending\r\n                )\r\n            )\r\n        );\r\n\r\n        If(\r\n            !IsBlank(varActividadAnterior.MovimientoId) &&\r\n            varActividadAnterior.FechaFin >= varFechaCambioActividad,\r\n            Patch(\r\n                colHistorialActividadesTmp,\r\n                LookUp(\r\n                    colHistorialActividadesTmp,\r\n                    MovimientoId = varActividadAnterior.MovimientoId\r\n                ),\r\n                {\r\n                    FechaFin: DateAdd(\r\n                        varFechaCambioActividad,\r\n                        -1,\r\n                        TimeUnit.Days\r\n                    )\r\n                }\r\n            )\r\n        );\r\n\r\n        Collect(\r\n            colHistorialActividadesTmp,\r\n            {\r\n                MovimientoId: GUID(),\r\n                Version: CountRows(colHistorialActividades) + 1,\r\n                TipoMovimiento: \"CAMBIO_ACTIVIDAD\",\r\n                FechaRegistro: Text(Now(), \"yyyy-mm-dd hh:mm:ss\"),\r\n                UsuarioRegistro: UsuariosdeOffice365.MyProfileV2().displayName,\r\n                CorreoRegistro: UsuariosdeOffice365.MyProfileV2().userPrincipalName,\r\n                FechaInicio: varFechaCambioActividad,\r\n                FechaFin: finProyectoEdit.SelectedDate,\r\n                ActivityId: varActivityIdEdit,\r\n                ActivityDescription: varActivityNameEdit,\r\n                ActivityType: varActivityTypeEdit\r\n            }\r\n        );\r\n\r\n        ClearCollect(\r\n            colHistorialActividades,\r\n            SortByColumns(\r\n                colHistorialActividadesTmp,\r\n                \"FechaInicio\",\r\n                SortOrder.Ascending\r\n            )\r\n        );\r\n\r\n        Set(gblActivityIdProyecto, varActivityIdEdit);\r\n        Set(gblActividadProyecto, varActivityNameEdit);\r\n        Set(gblActivityTypeProyecto, varActivityTypeEdit);\r\n\r\n        Set(varActividadCambiadaVista, false);\r\n    );\r\n\r\n    If(\r\n        varAsignacionRegenerada,\r\n        Collect(\r\n            colEtapasHistoricas,\r\n            {\r\n                EtapaId: GUID(),\r\n                Version: CountRows(colEtapasHistoricas) + 1,\r\n                TipoMovimiento: Switch(\r\n                    varTipoMovimientoEstado,\r\n                    \"SUSPENSION\", \"SUSPENSION\",\r\n                    \"CIERRE\", \"CIERRE\",\r\n                    \"REACTIVACION\", \"REACTIVACION\",\r\n                    \"ACTUALIZACION_PERSONAL\"\r\n                ),\r\n                EstadoProyecto: estadoEdit.Selected.Value,\r\n                FechaRegistro: Text(Now(), \"yyyy-mm-dd hh:mm:ss\"),\r\n                UsuarioRegistro: UsuariosdeOffice365.MyProfileV2().displayName,\r\n                CorreoRegistro: UsuariosdeOffice365.MyProfileV2().userPrincipalName,\r\n                FechaInicio: If(\r\n                    varTipoMovimientoEstado = \"REACTIVACION\",\r\n                    fechaMovimientoEstadoEdit.SelectedDate,\r\n                    inicioProyectoEdit.SelectedDate\r\n                ),\r\n                FechaFin: If(\r\n                    varTipoMovimientoEstado = \"SUSPENSION\" ||\r\n                    varTipoMovimientoEstado = \"CIERRE\",\r\n                    fechaMovimientoEstadoEdit.SelectedDate,\r\n                    finProyectoEdit.SelectedDate\r\n                ),\r\n                ModeloAsignacion: \"MULTIPLES_PRINCIPALES_BACK_MANUAL\",\r\n                PrincipalesJson: JSON(\r\n                    ForAll(\r\n                        colPrincipalesGuardar,\r\n                        {\r\n                            PrincipalId: PrincipalId,\r\n                            EsPrincipalInicial: EsPrincipalInicial,\r\n                            Nombre: Nombre,\r\n                            Cedula: Cedula,\r\n                            Ekon: Ekon,\r\n                            Correo: Correo,\r\n                            Cargo: Cargo,\r\n                            FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                            FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                            JornadaCodigo: JornadaCodigo,\r\n                            JornadaDescripcion: JornadaDescripcion,\r\n                            DiasTrabajo: DiasTrabajo,\r\n                            DiasDescanso: DiasDescanso\r\n                        }\r\n                    ),\r\n                    JSONFormat.Compact\r\n                ),\r\n                BacksJson: JSON(\r\n                    ForAll(\r\n                        colBacksGuardar,\r\n                        {\r\n                            BackId: BackId,\r\n                            PrincipalIdRelacionado: PrincipalIdRelacionado,\r\n                            Nombre: Nombre,\r\n                            Cedula: Cedula,\r\n                            Ekon: Ekon,\r\n                            Correo: Correo,\r\n                            Cargo: Cargo,\r\n                            FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                            FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                            Observacion: Observacion,\r\n            \r\n                            // --- NUEVOS CAMPOS ---\r\n                            TipoRegistro: TipoRegistro,\r\n                            DiasDescanso: DiasDescanso\r\n                        }\r\n                    ),\r\n                    JSONFormat.Compact\r\n                ),\r\n                BloquesEtapaJson: JSON(\r\n                    ForAll(\r\n                        colAsignacionesPreview,\r\n                        {\r\n                            Bloque: Bloque,\r\n                            Rol: Rol,\r\n                            TipoAsignacion: TipoAsignacion,\r\n                            PrincipalId: PrincipalId,\r\n                            BackId: BackId,\r\n                            ResponsableNombre: ResponsableNombre,\r\n                            ResponsableCedula: ResponsableCedula,\r\n                            ResponsableEkon: ResponsableEkon,\r\n                            ResponsableCorreo: ResponsableCorreo,\r\n                            ResponsableCargo: ResponsableCargo,\r\n                            FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                            FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                            DiasAsignados: DiasAsignados\r\n                        }\r\n                    ),\r\n                    JSONFormat.Compact\r\n                ),\r\n                DetalleDiarioEtapaJson: JSON(\r\n                    ForAll(\r\n                        colAsignacionesDiario,\r\n                        {\r\n                            Fecha: Text(Fecha, \"yyyy-mm-dd\"),\r\n                            FechaClave: FechaClave,\r\n                            Bloque: Bloque,\r\n                            Rol: Rol,\r\n                            TipoAsignacion: TipoAsignacion,\r\n                            PrincipalId: PrincipalId,\r\n                            BackId: BackId,\r\n                            ResponsableNombre: ResponsableNombre,\r\n                            ResponsableCedula: ResponsableCedula,\r\n                            ResponsableEkon: ResponsableEkon,\r\n                            ResponsableCorreo: ResponsableCorreo,\r\n                            ResponsableCargo: ResponsableCargo\r\n                        }\r\n                    ),\r\n                    JSONFormat.Compact\r\n                ),\r\n                ActivityId: gblActivityIdProyecto,\r\n                ActivityDescription: gblActividadProyecto,\r\n                ActivityType: gblActivityTypeProyecto\r\n            }\r\n        )\r\n    );\r\n\r\n    Set(\r\n        varJsonInfGeneralEdit,\r\n        JSON(\r\n            {\r\n                HoraGeneracion: {\r\n                    FechaCreacion: Now()\r\n                },\r\n                InfoRegistro: {\r\n                    Usuario: UsuariosdeOffice365.MyProfileV2().displayName,\r\n                    Correo: UsuariosdeOffice365.MyProfileV2().userPrincipalName,\r\n                    Uegp: ForAll(varUegpsCalculadas, { Categoria: Value })\r\n                },\r\n                InfoProyecto: {\r\n                    Grupo: gblGrupoProyecto,\r\n                    Compania: {\r\n                        CompanyId: gblCompanyIdProyecto,\r\n                        Nombre: gblCompaniaProyecto,\r\n                        Ruc: gblCompaniaRucProyecto\r\n                    },\r\n                    Proyecto: {\r\n                        ProjectId: gblProjectIdProyecto,\r\n                        Nombre: gblNombreProyecto,\r\n                        Estado: gblEstadoApiProyecto\r\n                    },\r\n                    Dimension: {\r\n                        UegpId: gblUegpIdProyecto,\r\n                        Descripcion: gblDimensionProyecto\r\n                    },\r\n                    Actividad: {\r\n                        ActivityId: gblActivityIdProyecto,\r\n                        Descripcion: gblActividadProyecto,\r\n                        Tipo: gblActivityTypeProyecto\r\n                    },\r\n\r\n                    Horario: {\r\n                        Codigo: gblCodigoHorario,\r\n                        Descripcion: gblDescripcionHorario,\r\n                        Entrada: gblEntradaHorario,\r\n                        Salida: gblSalidaHorario,\r\n                        Horas: gblHorasHorario,\r\n                        HorasTrabajadas: gblHorasTrabHorario,\r\n                        Tipo: gblTipoHorario,\r\n                        SalidaAlmuerzo: gblSalidaAlmuerzo,\r\n                        RegresoAlmuezo: gblRegresoAlmuerzo\r\n                    }\r\n\r\n                },\r\n\r\n                Planificacion: {\r\n                    FechaInicio: Text(gblFechaInicioProyecto, \"yyyy-mm-dd\"),\r\n                    FechaFin: Text(\r\n                        If(\r\n                            varTipoMovimientoEstado = \"SUSPENSION\" ||\r\n                            varTipoMovimientoEstado = \"CIERRE\",\r\n                            fechaMovimientoEstadoEdit.SelectedDate,\r\n                            finProyectoEdit.SelectedDate\r\n                        ),\r\n                        \"yyyy-mm-dd\"\r\n                    )\r\n                },\r\n                Responsables: {\r\n                    Principales: ForAll(\r\n                        colPrincipalesGuardar,\r\n                        {\r\n                            PrincipalId: PrincipalId,\r\n                            EsPrincipalInicial: EsPrincipalInicial,\r\n                            Nombre: Nombre,\r\n                            Cedula: Cedula,\r\n                            Ekon: Ekon,\r\n                            Correo: Correo,\r\n                            Cargo: Cargo,\r\n                            FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                            FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                            JornadaCodigo: JornadaCodigo,\r\n                            JornadaDescripcion: JornadaDescripcion,\r\n                            DiasTrabajo: DiasTrabajo,\r\n                            DiasDescanso: DiasDescanso\r\n                        }\r\n                    ),\r\n                    Backs: ForAll(\r\n                        colBacksGuardar,\r\n                        {\r\n                            BackId: BackId,\r\n                            PrincipalIdRelacionado: PrincipalIdRelacionado,\r\n                            Nombre: Nombre,\r\n                            Cedula: Cedula,\r\n                            Ekon: Ekon,\r\n                            Correo: Correo,\r\n                            Cargo: Cargo,\r\n                            FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                            FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                            Observacion: Observacion,\r\n            \r\n                            // --- ¡AGREGA ESTO! ---\r\n                            TipoRegistro: TipoRegistro, \r\n                            DiasDescanso: DiasDescanso\r\n                        }\r\n                    )\r\n                }\r\n            },\r\n            JSONFormat.Compact\r\n        )\r\n    );\r\n\r\n    Set(\r\n        varJsonAsignacionesEdit,\r\n        JSON(\r\n            {\r\n                Configuracion: {\r\n                    //FechaInicio: Text(inicioProyectoEdit.SelectedDate; \"yyyy-mm-dd\");\r\n                    //FechaFin: Text(finProyectoEdit.SelectedDate; \"yyyy-mm-dd\");\r\n                    FechaInicio: Text(gblFechaInicioProyecto, \"yyyy-mm-dd\"),\r\n                    FechaFin: Text(\r\n                        If(\r\n                            varTipoMovimientoEstado = \"SUSPENSION\" ||\r\n                            varTipoMovimientoEstado = \"CIERRE\",\r\n                            fechaMovimientoEstadoEdit.SelectedDate,\r\n                            finProyectoEdit.SelectedDate\r\n                        ),\r\n                        \"yyyy-mm-dd\"\r\n                    ),    \r\n                    ModeloAsignacion: \"MULTIPLES_PRINCIPALES_BACK_MANUAL\",\r\n                    Reglas: {\r\n                        MaxPrincipales: 5,\r\n                        MaxBacks: 5,\r\n                        PrincipalConJornada: true,\r\n                        BackManual: true,\r\n                        DiaTraspasoCompartido: true\r\n                    }\r\n                },\r\n                Resumen: {\r\n                    Principales: CountRows(colPrincipalesGuardar),\r\n                    Backs: CountRows(colBacksGuardar),\r\n                    Tramos: CountRows(colAsignacionesPreview),\r\n                    Dias: CountRows(colAsignacionesDiario)\r\n                },\r\n                Principales: ForAll(\r\n                    colPrincipalesGuardar,\r\n                    {\r\n                        PrincipalId: PrincipalId,\r\n                        EsPrincipalInicial: EsPrincipalInicial,\r\n                        Nombre: Nombre,\r\n                        Cedula: Cedula,\r\n                        Ekon: Ekon,\r\n                        Correo: Correo,\r\n                        Cargo: Cargo,\r\n                        FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                        FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                        JornadaCodigo: JornadaCodigo,\r\n                        JornadaDescripcion: JornadaDescripcion,\r\n                        DiasTrabajo: DiasTrabajo,\r\n                        DiasDescanso: DiasDescanso\r\n                    }\r\n                ),\r\n                Backs: ForAll(\r\n                    colBacksGuardar,\r\n                    {\r\n                        BackId: BackId,\r\n                        PrincipalIdRelacionado: PrincipalIdRelacionado,\r\n                        Nombre: Nombre,\r\n                        Cedula: Cedula,\r\n                        Ekon: Ekon,\r\n                        Correo: Correo,\r\n                        Cargo: Cargo,\r\n                        FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                        FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                        Observacion: Observacion,\r\n\r\n                        // --- ¡AGREGA ESTO TAMBIÉN AQUÍ! ---\r\n                        TipoRegistro: TipoRegistro,\r\n                        DiasDescanso: DiasDescanso\r\n                    }\r\n                ),\r\n                Bloques: ForAll(\r\n                    colAsignacionesPreview,\r\n                    {\r\n                        Bloque: Bloque,\r\n                        Rol: Rol,\r\n                        TipoAsignacion: TipoAsignacion,\r\n                        PrincipalId: PrincipalId,\r\n                        BackId: BackId,\r\n                        ResponsableNombre: ResponsableNombre,\r\n                        ResponsableCedula: ResponsableCedula,\r\n                        ResponsableEkon: ResponsableEkon,\r\n                        ResponsableCorreo: ResponsableCorreo,\r\n                        ResponsableCargo: ResponsableCargo,\r\n                        FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                        FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                        DiasAsignados: DiasAsignados\r\n                    }\r\n                ),\r\n                DetalleDiario: ForAll(\r\n                    colAsignacionesDiario,\r\n                    {\r\n                        Fecha: Text(Fecha, \"yyyy-mm-dd\"),\r\n                        FechaClave: FechaClave,\r\n                        Bloque: Bloque,\r\n                        Rol: Rol,\r\n                        TipoAsignacion: TipoAsignacion,\r\n                        PrincipalId: PrincipalId,\r\n                        BackId: BackId,\r\n                        ResponsableNombre: ResponsableNombre,\r\n                        ResponsableCedula: ResponsableCedula,\r\n                        ResponsableEkon: ResponsableEkon,\r\n                        ResponsableCorreo: ResponsableCorreo,\r\n                        ResponsableCargo: ResponsableCargo\r\n                    }\r\n                ),\r\n                Etapas: colEtapasHistoricas,\r\n                HistorialActividades: ForAll(\r\n                    colHistorialActividades,\r\n                    {\r\n                        MovimientoId: MovimientoId,\r\n                        Version: Version,\r\n                        TipoMovimiento: TipoMovimiento,\r\n                        FechaRegistro: FechaRegistro,\r\n                        UsuarioRegistro: UsuarioRegistro,\r\n                        CorreoRegistro: CorreoRegistro,\r\n                        FechaInicio: Text(FechaInicio, \"yyyy-mm-dd\"),\r\n                        FechaFin: Text(FechaFin, \"yyyy-mm-dd\"),\r\n                        ActivityId: ActivityId,\r\n                        ActivityDescription: ActivityDescription,\r\n                        ActivityType: ActivityType\r\n                    }\r\n                )\r\n            },\r\n            JSONFormat.Compact\r\n        )\r\n    );\r\n\r\n    Patch(\r\n        'SIG PROYECTOS',\r\n        varProyectoSeleccionado,\r\n        {\r\n            INF_GENERAL: varJsonInfGeneralEdit,\r\n            ASIGNACIONES: varJsonAsignacionesEdit,\r\n            ESTADO: {Value: estadoEdit.Selected.Value}\r\n        }\r\n    );\r\n\r\n    Notify(\r\n        \"Proyecto actualizado correctamente\",\r\n        NotificationType.Success\r\n    );\r\n\r\n    Navigate(ResumenProyectos)\r\n);\r\n\r\n\r\nSet(cargarInfo, false);"
                              Text: ="Registrar"
