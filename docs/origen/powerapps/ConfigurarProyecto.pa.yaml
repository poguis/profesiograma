                              - tlt_nombresColaborador_21:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.Center
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =1
                                    Font: =Font.'Open Sans Condensed'
                                    FontColor: =RGBA(9, 33, 98, 1)
                                    Height: =35
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    Text: ="ESTADO"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Weight: ='TextCanvas.Weight'.Semibold
                                    Width: =100
                              - estadoEdit:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =Table(
                                          {Value: gblEstadoProyecto}
                                      )
                                    Font: =Font.'Open Sans Condensed'
                                    ItemDisplayText: =ThisItem.Value
                                    Items: |-
                                      =Table(
                                          {Value: "ACTIVO"},
                                          {Value: "SUSPENDIDO"},
                                          {Value: "INACTIVO"},
                                          {Value: "TERMINADO"}
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =Set(varEstadoNuevoProyecto, estadoEdit.Selected.Value);

                                      Set(
                                          varTipoMovimientoEstado,
                                          Switch(
                                              true,
                                              varEstadoOriginalProyecto = "ACTIVO" && varEstadoNuevoProyecto = "SUSPENDIDO", "SUSPENSION",
                                              varEstadoOriginalProyecto = "ACTIVO" && varEstadoNuevoProyecto = "TERMINADO", "CIERRE",
                                              varEstadoOriginalProyecto = "SUSPENDIDO" && varEstadoNuevoProyecto = "ACTIVO", "REACTIVACION",
                                              varEstadoOriginalProyecto = "SUSPENDIDO" && varEstadoNuevoProyecto = "TERMINADO", "CIERRE",
                                              varEstadoOriginalProyecto = varEstadoNuevoProyecto, "SIN_CAMBIO",
                                              "NO_PERMITIDO"
                                          )
                                      );

                                      If(
                                          varTipoMovimientoEstado = "NO_PERMITIDO",
                                          Notify(
                                              "Este cambio de estado no está permitido desde el estado actual",
                                              NotificationType.Warning
                                          );
                                          Reset(estadoEdit);
                                          Set(varEstadoNuevoProyecto, varEstadoOriginalProyecto);
                                          Set(varTipoMovimientoEstado, "SIN_CAMBIO")
                                      );

                                      Set(varEstadoCambiado, varTipoMovimientoEstado <> "SIN_CAMBIO");
                                      Set(varFechaMovimientoEstado, Blank());
                                      Set(varEstadoRegenerado, false);
                                      Set(varRequiereRegenerar, varEstadoCambiado);
                                      Reset(fechaMovimientoEstadoEdit);
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    SelectMultiple: =false
                                    Width: =150
                              - fechaMovimientoEstadoEdit:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    DefaultDate: =Blank()
                                    Font: =Font.'Open Sans Condensed'
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =Set(varFechaMovimientoEstado, fechaMovimientoEstadoEdit.SelectedDate);
                                      Set(varRequiereRegenerar, varTipoMovimientoEstado <> "SIN_CAMBIO");
                                      Set(varEstadoRegenerado, false);

                                      If(
                                          varTipoMovimientoEstado = "REACTIVACION" &&
                                          !IsBlank(varFechaMovimientoEstado),

                                          Clear(colPrincipalesProyecto);
                                          Clear(colBacksProyecto);

                                          With(
                                              {
                                                  pPrincipalCargo: First(
                                                      SortByColumns(
                                                          Filter(
                                                              colPrincipalesHistoricos,
                                                              EsPrincipalInicial = true
                                                          ),
                                                          "FechaFin",
                                                          SortOrder.Descending
                                                      )
                                                  )
                                              },

                                              If(
                                                  IsBlank(pPrincipalCargo.Ekon),
                                                  Notify(
                                                      "No se encontró un principal a cargo para reactivar el proyecto",
                                                      NotificationType.Error
                                                  ),

                                                  Collect(
                                                      colPrincipalesProyecto,
                                                      {
                                                          PrincipalId: Coalesce(Max(colPrincipalesHistoricos, PrincipalId), 0) + 1,
                                                          EsPrincipalInicial: true,
                                                          EsNuevo: true,
                                                          Nombre: pPrincipalCargo.Nombre,
                                                          Cedula: pPrincipalCargo.Cedula,
                                                          Ekon: pPrincipalCargo.Ekon,
                                                          Correo: pPrincipalCargo.Correo,
                                                          Cargo: pPrincipalCargo.Cargo,
                                                          FechaInicio: varFechaMovimientoEstado,
                                                          FechaFin: finProyectoEdit.SelectedDate,
                                                          JornadaCodigo: pPrincipalCargo.JornadaCodigo,
                                                          JornadaDescripcion: pPrincipalCargo.JornadaDescripcion,
                                                          DiasTrabajo: pPrincipalCargo.DiasTrabajo,
                                                          DiasDescanso: pPrincipalCargo.DiasDescanso
                                                      }
                                                  );

                                                  Notify(
                                                      "Principal a cargo cargado para la reactivación. Ahora presiona Regenerar.",
                                                      NotificationType.Information
                                                  )
                                              )
                                          )
                                      );
                                    Placeholder: |-
                                      =Switch(
                                          varTipoMovimientoEstado,
                                          "SUSPENSION", "Fecha de suspensión",
                                          "CIERRE", "Fecha de cierre",
                                          "REACTIVACION", "Fecha de reactivación",
                                          "Fecha movimiento"
                                      )
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    StartDate: =gblFechaInicioProyecto
                                    Visible: =varTipoMovimientoEstado <> "SIN_CAMBIO"
                                    Width: =150
                              - Aplicar estado:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    BorderRadius: =20
                                    Font: =Font.'Open Sans Condensed'
                                    FontSize: =16
                                    FontWeight: =FontWeight.Normal
                                    Height: =30
                                    Icon: ="CheckmarkCircle"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =Set(varPuedeAplicarEstado, true);

                                      If(
                                          IsBlank(fechaMovimientoEstadoEdit.SelectedDate),
                                          Notify(
                                              "Debes seleccionar la fecha del movimiento de estado",
                                              NotificationType.Warning
                                          );
                                          Set(varPuedeAplicarEstado, false)
                                      );

                                      If(
                                          varPuedeAplicarEstado &&
                                          fechaMovimientoEstadoEdit.SelectedDate < gblFechaInicioProyecto,
                                          Notify(
                                              "La fecha del movimiento no puede ser menor a la fecha de inicio del proyecto",
                                              NotificationType.Warning
                                          );
                                          Set(varPuedeAplicarEstado, false)
                                      );

                                      If(
                                          varPuedeAplicarEstado &&
                                          varTipoMovimientoEstado <> "REACTIVACION" &&
                                          fechaMovimientoEstadoEdit.SelectedDate > finProyectoEdit.SelectedDate,
                                          Notify(
                                              "La fecha del movimiento no puede ser mayor a la fecha fin del proyecto",
                                              NotificationType.Warning
                                          );
                                          Set(varPuedeAplicarEstado, false)
                                      );

                                      If(
                                          varPuedeAplicarEstado,

                                          Set(varFechaMovimientoEstado, fechaMovimientoEstadoEdit.SelectedDate);

                                          If(
                                              varTipoMovimientoEstado = "SUSPENSION" ||
                                              varTipoMovimientoEstado = "CIERRE",

                                              ClearCollect(
                                                  colAsignacionesDiario,
                                                  Filter(
                                                      colAsignacionesDiarioOriginal,
                                                      Fecha <= varFechaMovimientoEstado
                                                  )
                                              );

                                              Clear(colAsignacionesPreview);

                                              ForAll(
                                                  GroupBy(
                                                      colAsignacionesDiario,
                                                      Bloque,
                                                      Rol,
                                                      TipoAsignacion,
                                                      PrincipalId,
                                                      BackId,
                                                      ResponsableNombre,
                                                      ResponsableCedula,
                                                      ResponsableEkon,
                                                      ResponsableCorreo,
                                                      ResponsableCargo,
                                                      Registros
                                                  ) As g,
                                                  Collect(
                                                      colAsignacionesPreview,
                                                      {
                                                          Bloque: Value(g.Bloque),
                                                          Rol: Text(g.Rol),
                                                          TipoAsignacion: Text(g.TipoAsignacion),
                                                          PrincipalId: If(
                                                              IsBlank(Text(g.PrincipalId)),
                                                              Blank(),
                                                              Value(g.PrincipalId)
                                                          ),
                                                          BackId: If(
                                                              IsBlank(Text(g.BackId)),
                                                              Blank(),
                                                              Value(g.BackId)
                                                          ),
                                                          ResponsableNombre: Text(g.ResponsableNombre),
                                                          ResponsableCedula: Text(g.ResponsableCedula),
                                                          ResponsableEkon: Text(g.ResponsableEkon),
                                                          ResponsableCorreo: Lower(Trim(Text(g.ResponsableCorreo))),
                                                          ResponsableCargo: Text(g.ResponsableCargo),
                                                          FechaInicio: Min(g.Registros, Fecha),
                                                          FechaFin: Max(g.Registros, Fecha),
                                                          DiasAsignados: CountRows(g.Registros)
                                                      }
                                                  )
                                              );

                                              ClearCollect(
                                                  colPrincipalesProyecto,
                                                  ForAll(
                                                      Filter(
                                                          colPrincipalesHistoricos,
                                                          FechaInicio <= varFechaMovimientoEstado
                                                      ) As p,
                                                      {
                                                          PrincipalId: p.PrincipalId,
                                                          EsPrincipalInicial: p.EsPrincipalInicial,
                                                          EsNuevo: p.EsNuevo,
                                                          Nombre: p.Nombre,
                                                          Cedula: p.Cedula,
                                                          Ekon: p.Ekon,
                                                          Correo: p.Correo,
                                                          Cargo: p.Cargo,
                                                          FechaInicio: p.FechaInicio,
                                                          FechaFin: If(
                                                              p.FechaFin > varFechaMovimientoEstado,
                                                              varFechaMovimientoEstado,
                                                              p.FechaFin
                                                          ),
                                                          JornadaCodigo: p.JornadaCodigo,
                                                          JornadaDescripcion: p.JornadaDescripcion,
                                                          DiasTrabajo: p.DiasTrabajo,
                                                          DiasDescanso: p.DiasDescanso
                                                      }
                                                  )
                                              );

                                              ClearCollect(
                                                  colBacksProyecto,
                                                  ForAll(
                                                      Filter(
                                                          colBacksHistoricos,
                                                          FechaInicio <= varFechaMovimientoEstado
                                                      ) As b,
                                                      {
                                                          BackId: b.BackId,
                                                          EsNuevo: b.EsNuevo,
                                                          PrincipalIdRelacionado: b.PrincipalIdRelacionado,
                                                          Nombre: b.Nombre,
                                                          Cedula: b.Cedula,
                                                          Ekon: b.Ekon,
                                                          Correo: b.Correo,
                                                          Cargo: b.Cargo,
                                                          FechaInicio: b.FechaInicio,
                                                          FechaFin: If(
                                                              b.FechaFin > varFechaMovimientoEstado,
                                                              varFechaMovimientoEstado,
                                                              b.FechaFin
                                                          ),
                                                          Observacion: b.Observacion,

                                                          // --- ¡AGREGA ESTO PARA NO PERDER LA DATA AL CAMBIAR ESTADOS! ---
                                                          TipoRegistro: b.TipoRegistro,
                                                          DiasDescanso: b.DiasDescanso
                                                      }
                                                  )
                                              );

                                              Set(varFechaCorteEdicion, varFechaMovimientoEstado);
                                              Set(varAsignacionRegenerada, true);
                                              Set(varEstadoRegenerado, true);
                                              Set(varRequiereRegenerar, false);

                                              Notify(
                                                  If(
                                                      varTipoMovimientoEstado = "SUSPENSION",
                                                      "Proyecto suspendido en vista previa. Revisa y registra para guardar.",
                                                      "Proyecto cerrado en vista previa. Revisa y registra para guardar."
                                                  ),
                                                  NotificationType.Success
                                              )
                                          );

                                          If(
                                              varTipoMovimientoEstado = "REACTIVACION",

                                              If(
                                                  CountRows(colPrincipalesProyecto) = 0,
                                                  Notify(
                                                      "No se cargó ningún principal para reactivación",
                                                      NotificationType.Error
                                                  ),

                                                  Set(varFechaCorteEdicion, varFechaMovimientoEstado);
                                                  Set(varRequiereRegenerar, true);
                                                  Set(varEstadoRegenerado, false);

                                                  Notify(
                                                      "Reactivación preparada. Ahora presiona Regenerar para crear la nueva etapa.",
                                                      NotificationType.Information
                                                  )
                                              )
                                          )
                                      );
                                    Text: |-
                                      =Switch(
                                          varTipoMovimientoEstado,
                                          "SUSPENSION", "Aplicar suspensión",
